raus? Brandl warnt davor, aus der Langeweile gleich ein neues Projekt zur Selbstoptimierung zu machen. Von Seminaren, in denen man das „richtige Nichtstun“ trainieren soll, hält er wenig: Wer auch noch die Pause nach Plan gestalte, lasse wieder keine Lücke. Wichtiger sei es, Leerlauf nicht sofort als Problem zu betrachten, das gelöst werden müsse. Arbeitgebern und Schulen rät er, genauer hinzusehen: Wenn sich jemand dauerhaft langweile, liege das häufig nicht an der Person, sondern an den Aufgaben. „Die ersten Minuten fühlen sich leer an“, räumt er ein. „Aber genau dann fängt der Kopf an, von selbst zu arbeiten.“"],"source":"","taskInstruction":"Lösen Sie die Aufgaben 6–10. Entscheiden Sie, welche Lösung (a, b oder c) richtig ist, und tragen Sie Ihre Lösung in den Antwortbogen bei den Aufgaben 6–10 ein.","items":[{"no":"6","stem":"Thomas Brandl meint, dass viele Menschen heute","options":{"a":"ein besonders spannendes Leben führen.","b":"kaum noch Leerlauf zulassen.","c":"Wartezeiten lieber nutzen, um aus dem Fenster zu schauen."},"answer":"b"},{"no":"7","stem":"Das Experiment in Virginia zeigte, dass","options":{"a":"manche lieber Schmerzen ertrugen, als nur nachzudenken.","b":"fast alle den Knopf drückten.","c":"Frauen das Alleinsein schlechter ertrugen als Männer."},"answer":"a"},{"no":"8","stem":"In der britischen Studie","options":{"a":"schrieben alle Gruppen Nummern ab.","b":"machte die eintönige Aufgabe vor allem müde.","c":"hatten die Gelangweilten mehr Ideen."},"answer":"c"},{"no":"9","stem":"Karin Lorenz","options":{"a":"rät, gelangweilte Kinder sofort zu beschäftigen.","b":"hält Langeweile für lehrreich.","c":"fordert mehr feste Freizeitprogramme für Kinder."},"answer":"b"},{"no":"10","stem":"Nach Ansicht von Thomas Brandl","options":{"a":"sollte man bei dauerhafter Langeweile im Beruf etwas ändern.","b":"ist Unterforderung eine Chance zur Selbstfindung.","c":"lernt man das Nichtstun am besten in Seminaren."},"answer":"a"}]},"t3":{"instruction":"Lesen Sie zuerst die zehn Situationen (11–20) und dann die zwölf Info-Texte (a–l). Welcher Info-Text passt zu welcher Situation? Sie können jeden Info-Text nur einmal verwenden. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 11–20. Manchmal gibt es keine Lösung. Markieren Sie dann x.","items":[{"no":"11","text":"Ein erfahrener Läufer möchte mit seinem Hund laufen gehen.","answer":"i"},{"no":"12","text":"Ein unsportlicher Freund möchte mit dem Joggen anfangen.","answer":"e"},{"no":"13","text":"Eine Freundin sucht eine Urlaubsbetreuung für ihre Katze.","answer":"f"},{"no":"14","text":"Ihr Hund hat sich am Sonntagabend die Pfote verletzt.","answer":"b"},{"no":"15","text":"Ihr Kollege hat kein Tier, möchte aber Hunden helfen.","answer":"j"},{"no":"16","text":"Ihr Onkel möchte tanzen lernen, hat aber keine Partnerin.","answer":"c"},{"no":"17","text":"Ihr Schwager möchte sich zum Rettungsschwimmer ausbilden lassen.","answer":"x"},{"no":"18","text":"Ihre Großmutter (78) stürzt oft und will etwas dagegen tun.","answer":"h"},{"no":"19","text":"Ihre Nachbarin kann nicht schwimmen und möchte es lernen.","answer":"k"},{"no":"20","text":"Sie möchten Ihren acht Wochen alten Hund erziehen.","answer":"d"}],"infos":[{"letter":"a","header":"Seepferdchen","tag":"","title":"","subtitle":"Schwimmkurse für Kinder","facts":[],"body":["Ihr Kind soll sicher schwimmen lernen? In unseren Kursen üben Kinder zwischen fünf und acht Jahren in Gruppen von höchstens sechs Kindern im warmen Lehrschwimmbecken der Grundschule am Park. Zehnmal 45 Minuten, immer mittwochs oder freitags am Nachmittag – am Ende steht die Prüfung für das Seepferdchen-Abzeichen. Eltern dürfen in der ersten und in der letzten Stunde zuschauen. Der Kurs kostet 110 Euro. Für Kinder unter fünf Jahren bieten wir leider keine Kurse an."],"footer":"Schwimmschule Delfin · Tel. 0231 / 55 81 20"},{"letter":"b","header":"","tag":"Notdienst","title":"Tierklinik am Kanal – rund um die Uhr","subtitle":"","facts":[],"body":["Ihr Tier hat sich verletzt, frisst plötzlich nicht mehr oder hat etwas Giftiges verschluckt? Die Tierklinik am Kanal ist auch nachts, an Wochenenden und an Feiertagen für Hunde, Katzen und andere Kleintiere da. Bitte rufen Sie vor Ihrem Besuch kurz an, damit wir uns auf Ihr Tier vorbereiten können. Außerhalb der regulären Sprechzeiten fällt eine Notdienstgebühr an. Impfungen, Kontrolluntersuchungen und andere planbare Behandlungen führen wir ausschließlich werktags nach Terminvereinbarung durch."],"footer":"Hafenweg 3 · Tel. 0231 / 77 40 90"},{"letter":"c","header":"","tag":"","title":"LINE DANCE OHNE PARTNER","subtitle":"","facts":[],"body":["Beim Line Dance stehen alle in Reihen nebeneinander und tanzen dieselben Schritte – eine Partnerin oder einen Partner brauchen Sie also nicht. Zu Country, Pop und Rock lernen Sie nach und nach einfache Choreografien. Vorkenntnisse sind nicht nötig, und das Alter spielt keine Rolle: Unsere jüngste Tänzerin ist 19, der älteste Tänzer 81. Wir treffen uns jeden Montag um 19 Uhr im Bürgerhaus West; eine Stunde kostet fünf Euro. Cowboystiefel sind nicht nötig – bequeme Schuhe reichen völlig."],"footer":"BÜRGERHAUS WEST · MÜHLENWEG 8"},{"letter":"d","header":"HUNDESCHULE PFOTENPFAD","tag":"","title":"Welpenkurs","subtitle":"","facts":[],"body":["Die ersten Lebensmonate prägen einen Hund für sein ganzes Leben. In unserem Welpenkurs lernen junge Hunde im Alter von acht bis sechzehn Wochen spielerisch, mit Artgenossen, fremden Menschen und ungewohnten Geräuschen umzugehen. Sie als Halterin oder Halter erfahren, wie Sie Ihren Hund ohne Druck erziehen und seine Körpersprache richtig deuten. Der Kurs umfasst acht Treffen zu je einer Stunde, immer samstags um 10 Uhr auf unserem Übungsplatz am Stadtwald. Bitte bringen Sie zur ersten Stunde den Impfpass mit. Für ältere Hunde bieten wir Einzeltraining an."],"footer":"Anmeldung: www.pfotenpfad.de · 120 € pro Kurs"},{"letter":"e","header":"","tag":"3. MÄRZ","title":"Laufen lernen in zehn Wochen","subtitle":"","facts":["Di, 18.30 Uhr"],"body":["Sie haben lange keinen Sport gemacht und schaffen kaum zehn Minuten am Stück? Genau dafür ist unser Einsteigerkurs gedacht. Im Wechsel von Gehen und Laufen steigern Sie sich langsam, bis Sie nach zehn Wochen eine halbe Stunde ohne Pause durchhalten. Wir treffen uns dienstags und donnerstags am Eingang des Stadtparks, Trainerinnen des Vereins begleiten jede Gruppe. Die Teilnahme ist kostenlos. Hunde müssen leider zu Hause bleiben."],"footer":"LSV Nordstadt · Anmeldung: www.lsv-nordstadt.de"},{"letter":"f","header":"","tag":"","title":"Ihre Katze bleibt zu Hause!","subtitle":"Urlaubsbetreuung in Ihrer Wohnung","facts":[],"body":["Katzen hängen an ihrem Revier – eine Tierpension bedeutet für viele puren Stress. Deshalb komme ich während Ihrer Abwesenheit ein- oder zweimal täglich zu Ihnen, fülle Futter- und Wassernapf, reinige das Katzenklo und nehme mir Zeit zum Spielen. Auf Wunsch gieße ich auch Ihre Blumen und leere den Briefkasten. Ich habe selbst drei Katzen und kann auch Medikamente geben. Pro Besuch berechne ich 14 Euro."],"footer":"Lisa Engel · 0176 / 22 71 08 45"},{"letter":"g","header":"","tag":"","title":"Walzer, Tango, Discofox","subtitle":"","facts":[],"body":["Sie möchten endlich sicher übers Parkett schweben – zur Hochzeit, beim Abiball oder einfach so? In unserem Grundkurs für Paare lernen Sie an zehn Abenden die wichtigsten Gesellschaftstänze, vom Wiener Walzer bis zum Discofox. Der Kurs beginnt am 12. März, jeweils donnerstags von 20 bis 21.30 Uhr; in den Pausen ist unsere Bar geöffnet. Bitte melden Sie sich nur gemeinsam mit Ihrer Tanzpartnerin oder Ihrem Tanzpartner an; Einzelpersonen können wir leider nicht vermitteln."],"footer":"Tanzschule Hartwig · Tel. 0231 / 43 19 60"},{"letter":"h","header":"","tag":"SENIORENTREFF AM MARKT","title":"Sicher auf den Beinen","subtitle":"","facts":[],"body":["Jeder dritte Mensch über 65 stürzt mindestens einmal im Jahr. Viele dieser Stürze ließen sich vermeiden, wenn Kraft und Gleichgewicht regelmäßig trainiert würden. Genau das tun wir in unserem Kurs: Mit einfachen Übungen im Stehen und im Sitzen stärken Sie Beine und Rumpf und bewegen sich bald sicherer, auch auf unebenem Boden. Eine Physiotherapeutin leitet die Gruppen mit höchstens zehn Personen. Die Kosten von 80 Euro für zwölf Termine übernehmen viele Krankenkassen zu einem großen Teil."],"footer":"Anmeldung im Seniorentreff, Marktplatz 5"},{"letter":"i","header":"","tag":"","title":"CANICROSS – LAUFEN MIT HUND","subtitle":"","facts":[],"body":["Beim Canicross laufen Sie gemeinsam mit Ihrem Hund durch den Wald, verbunden durch eine elastische Leine und einen speziellen Brustgurt. Das trainiert die Ausdauer und das Zusammenspiel zwischen Mensch und Tier. Mitmachen können gesunde Hunde ab einem Jahr, die sich mit anderen Hunden vertragen. Sie selbst sollten bereits fünf Kilometer am Stück laufen können – Anfängerkurse bieten wir nicht an. Gurte für das erste Training leihen wir Ihnen gern."],"footer":"Hundesportverein Waldlauf e. V. · Training: sonntags 9 Uhr, Parkplatz Försterweg"},{"letter":"j","header":"TIERSCHUTZVEREIN NORDSTADT E. V.","tag":"","title":"Gassigeher gesucht","subtitle":"","facts":[],"body":["Viele unserer Hunde warten seit Monaten auf ein neues Zuhause. Bis es so weit ist, brauchen sie vor allem Bewegung und Zuwendung. Deshalb suchen wir Menschen ab 18 Jahren, die ehrenamtlich mit unseren Hunden spazieren gehen – ohne feste Verpflichtung, so oft Sie Zeit haben. Einen eigenen Hund brauchen Sie dafür nicht. Vorher besuchen Sie einmal eine kurze Einführung, in der Sie lernen, worauf es im Umgang mit den Tieren ankommt. Über Hilfe bei der Pflege unserer Katzen freuen wir uns ebenfalls."],"footer":"Tierheim Nordstadt · Tel. 0231 / 61 22 30"},{"letter":"k","header":"Wasserzeit","tag":"","title":"","subtitle":"SCHWIMMEN FÜR ERWACHSENE","facts":[],"body":["Schwimmen lernen ist keine Frage des Alters. In Gruppen von höchstens sechs Personen gewöhnen Sie sich zunächst im flachen Wasser an das nasse Element, bevor Sie Schritt für Schritt Brust- und Rückenschwimmen lernen. Unsere Trainerinnen und Trainer arbeiten seit vielen Jahren mit Erwachsenen, die noch nie geschwommen sind, und nehmen sich für jede Frage Zeit. Der Kurs umfasst zehn Abende im Hallenbad Süd; mittwochs gibt es eine Gruppe nur für Frauen. Teilnahme ab 18 Jahren."],"footer":"Kontakt: info@wasserzeit-kurse.de"},{"letter":"l","header":"LANDHAUS BIRKENHOF","tag":"","title":"Ferien für Ihren Hund","subtitle":"","facts":[],"body":["Sie verreisen, und Ihr Hund kann nicht mit? Auf unserem Hof am Waldrand verbringt er seine Ferien in kleinen Gruppen – mit viel Auslauf auf zwei Hektar eingezäunter Wiese und täglichen Spaziergängen. Nachts schläft jeder Gast in einem eigenen, beheizten Zimmer. Wir nehmen ausschließlich gesunde, geimpfte Hunde auf, die sich mit Artgenossen vertragen; bitte vereinbaren Sie vorab einen Kennenlerntag. Katzen und andere Kleintiere können wir leider nicht betreuen. Ein Tag kostet 28 Euro, Futter inklusive."],"footer":"Reservierung unter www.birkenhof-hundepension.de"}]},"sb1":{"instruction":"Lesen Sie den folgenden Text und entscheiden Sie, welches Wort (a, b oder c) in die jeweilige Lücke passt. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 21–30.","paragraphs":["Sehr geehrte Frau Ritter,","seit fünf Jahren wohne ich in der Zweizimmerwohnung im zweiten Stock der Gartenstraße 12 und habe mich dort immer sehr wohlgefühlt. Nun hat mir mein Arbeitgeber angeboten, von Oktober bis März in unserer Niederlassung in Lyon zu arbeiten. {{21}} ich die Wohnung in dieser Zeit nicht aufgeben möchte, bitte ich Sie um Erlaubnis, sie für sechs Monate unterzuvermieten. {{22}} ich sie kündigen, fände ich nach meiner Rückkehr kaum eine vergleichbare Wohnung zu einem ähnlichen Preis.","Als Untermieterin käme Frau Anna Nowak infrage, mit {{23}} ich bereits ausführlich gesprochen habe. Sie ist 29 Jahre alt, arbeitet als Ingenieurin bei den Stadtwerken und hat {{24}} bereit erklärt, auch meine Zimmerpflanzen zu versorgen. Frau Nowak sucht nur eine Übergangslösung, bis ihre eigene Wohnung im Frühjahr fertig ist. Sie raucht nicht und hat keine Haustiere. Eine Kopie ihres Arbeitsvertrags lasse ich Ihnen gern zukommen.","Die Miete würde ich wie bisher {{25}} der ersten drei Werktage des Monats überweisen. Außerdem würde ich mich selbstverständlich {{26}} kümmern, dass Frau Nowak die Hausordnung kennt. Für Sie hätte das Ganze den Vorteil, dass die Wohnung nicht leer steht, sondern regelmäßig gelüftet und geheizt {{27}}.","Ich möchte allerdings niemanden einziehen lassen, {{28}} vorher Ihre schriftliche Zustimmung einzuholen. Je früher ich Ihre Antwort erhalte, {{29}} besser kann ich meinen Umzug nach Lyon planen. Ich {{30}} Ihnen daher sehr dankbar, wenn Sie mir bis Ende August Bescheid geben könnten.","Mit freundlichen Grüßen","Tobias Hartmann"],"items":[{"no":"21","options":{"a":"Damit","b":"Deshalb","c":"Weil"},"answer":"c"},{"no":"22","options":{"a":"Muss","b":"Musste","c":"Müsste"},"answer":"c"},{"no":"23","options":{"a":"der","b":"deren","c":"die"},"answer":"a"},{"no":"24","options":{"a":"ihnen","b":"ihr","c":"sich"},"answer":"c"},{"no":"25","options":{"a":"bis","b":"innerhalb","c":"seit"},"answer":"b"},{"no":"26","options":{"a":"dafür","b":"darauf","c":"darum"},"answer":"c"},{"no":"27","options":{"a":"wird","b":"worden","c":"wurde"},"answer":"a"},{"no":"28","options":{"a":"ohne","b":"statt","c":"um"},"answer":"a"},{"no":"29","options":{"a":"als","b":"desto","c":"so"},"answer":"b"},{"no":"30","options":{"a":"hätte","b":"wäre","c":"würde"},"answer":"b"}]},"sb2":{"instruction":"Lesen Sie den folgenden Text und entscheiden Sie, welches Wort aus dem Kasten (a–o) in die Lücken 31–40 passt. Sie können jedes Wort im Kasten nur einmal verwenden. Nicht alle Wörter passen in den Text. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 31–40.","title":"Wenn die Nacht zu hell wird","paragraphs":["Wer nachts in einer deutschen Großstadt zum Himmel schaut, sieht mit etwas Glück ein paar Dutzend Sterne. Die Milchstraße dagegen ist für die meisten Menschen in Europa längst {{31}} geworden. Schuld daran ist das künstliche Licht: Straßenlaternen, Schaufenster, Werbetafeln und angestrahlte Gebäude tauchen den Himmel in einen orangefarbenen Schein, der noch aus vielen Kilometern Entfernung zu sehen ist. Rund um viele Städte wird es nachts nie mehr richtig dunkel. Fachleute sprechen in diesem {{32}} von Lichtverschmutzung.","Dass das nicht nur Hobbyastronomen stört, belegen zahlreiche Studien. Nachtaktive Insekten werden von Lampen geradezu {{33}} angezogen und umkreisen sie, bis sie vor Erschöpfung sterben. Zugvögel verlieren die Orientierung, und auch beim Menschen kann zu viel Licht in der Nacht den Schlaf {{34}}. {{35}} einer internationalen Auswertung wird der Nachthimmel jedes Jahr um fast zehn Prozent heller. Ein Grund dafür ist ausgerechnet eine sparsame Technik: Seit LED-Lampen verstärkt zum {{36}} kommen, ist Licht so billig geworden, dass Kommunen und Privatleute mehr Lampen aufstellen als früher. Ein Teil der eingesparten Energie geht dadurch wieder {{37}}.","Dabei ließe sich das Problem mit einfachen Mitteln deutlich {{38}}. Leuchten, die ihr Licht nur nach unten abgeben, blenden weniger und machen den Weg trotzdem hell genug. Warmweißes Licht lockt erheblich weniger Insekten an als kaltweißes. Und nicht jede Straße muss die ganze Nacht über hell erleuchtet sein: Bewegungsmelder schalten das Licht nur dann ein, wenn tatsächlich jemand vorbeikommt. Manche Gemeinden schalten ihre Straßenlaternen nach Mitternacht sogar ganz ab.","Einige Städte haben {{39}} bereits reagiert. Fulda erhielt 2019 als erste deutsche Stadt die Auszeichnung „Sternenstadt“ und stellt seitdem Schritt für Schritt seine Straßenbeleuchtung um. In Frankreich sind Geschäfte sogar gesetzlich {{40}}, ihre Schaufensterbeleuchtung in der Nacht auszuschalten. Für die Händler hat das einen angenehmen Nebeneffekt: Sie sparen Strom."],"words":{"a":"AUSDRUCK","b":"BEEINTRÄCHTIGEN","c":"BEHANDELN","d":"BERECHTIGT","e":"DARAUF","f":"EINSATZ","g":"ENTSCHÄRFEN","h":"HEIMLICH","i":"LAUT","j":"MAGISCH","k":"UNSICHTBAR","l":"VERLOREN","m":"VERPFLICHTET","n":"WÄHREND","o":"ZUSAMMENHANG"},"items":[{"no":"31","answer":"k"},{"no":"32","answer":"o"},{"no":"33","answer":"j"},{"no":"34","answer":"b"},{"no":"35","answer":"i"},{"no":"36","answer":"f"},{"no":"37","answer":"l"},{"no":"38","answer":"g"},{"no":"39","answer":"e"},{"no":"40","answer":"m"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun eine Nachrichtensendung. Dazu sollen Sie fünf Aufgaben lösen. Sie hören die Nachrichtensendung nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Laut der Umfrage lesen die meisten Jugendlichen ihre Bücher inzwischen lieber auf dem Bildschirm.","answer":"F"},{"no":"42","text":"Anders als Lastwagen können Pkw die Brücke mit Einschränkungen weiterhin nutzen.","answer":"R"},{"no":"43","text":"Wer den zurückgerufenen Frischkäse zurückbringt, bekommt sein Geld nur gegen Vorlage des Kassenbons.","answer":"F"},{"no":"44","text":"Wegen des archäologischen Fundes werden die Arbeiten an der Tiefgarage vorübergehend unterbrochen.","answer":"R"},{"no":"45","text":"Fachleute empfehlen Allergikern in der Stadt, die Wohnung am besten abends zu lüften.","answer":"F"}]},"t2":{"instruction":"Sie hören ein Rundfunk-Interview. Dazu sollen Sie zehn Aufgaben lösen. Sie hören dieses Interview nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu 60 Sekunden Zeit.","items":[{"no":"46","text":"Frau Neumeier kennt vor der Arbeit meist den ganzen Film.","answer":"F"},{"no":"47","text":"Die Regisseurin beschreibt vor jeder Aufnahme die Lage der Figur.","answer":"R"},{"no":"48","text":"Der deutsche Text weicht manchmal deutlich vom Original ab.","answer":"R"},{"no":"49","text":"Heute sprechen die meisten ihre Rollen gemeinsam ein.","answer":"F"},{"no":"50","text":"Schauspielerisches Können ist wichtiger als eine schöne Stimme.","answer":"R"},{"no":"51","text":"Frau Neumeier bekommt meist pro Film einen festen Betrag.","answer":"F"},{"no":"52","text":"Als Frau Neumeier einmal vertreten wurde, gab es viele Beschwerden.","answer":"R"},{"no":"53","text":"Szenen mit viel Geschrei werden am Tagesende aufgenommen.","answer":"R"},{"no":"54","text":"Frau Neumeier lehnt den Einsatz künstlicher Intelligenz grundsätzlich ab.","answer":"F"},{"no":"55","text":"Die meisten Deutschen sehen Filme lieber mit Untertiteln.","answer":"F"}]},"t3":{"instruction":"Sie hören jetzt fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Ansagen nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 56–60. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"","items":[{"no":"56","text":"Wer eine Theaterkarte rechtzeitig zurückgibt, bekommt den Preis nicht bar, sondern als Gutschein erstattet.","answer":"R"},{"no":"57","text":"Kundinnen und Kunden im ersten Obergeschoss können ihre Einkäufe bis zum Ladenschluss dort noch bezahlen.","answer":"F"},{"no":"58","text":"Den kostenlosen Sehtest gibt es bei Optik Weiland im März nur samstags.","answer":"F"},{"no":"59","text":"Um seinen verlorenen Rucksack im Kundenzentrum abzuholen, muss Herr Okafor einen Ausweis vorlegen.","answer":"R"},{"no":"60","text":"Beim Drachenfest am Deich können Kinder ab sechs Jahren ohne vorherige Anmeldung einen Drachen bauen.","answer":"F"}]}},"schreiben":{"intro":"Wählen Sie zuerst zwischen Aufgabe A und Aufgabe B. Entscheiden Sie schnell, denn die zur Verfügung stehende Zeit ist begrenzt auf 30 Minuten!","tasks":[{"letter":"A","kind":"Bitte um Informationen","lead":"Sie lesen im Internet folgende Anzeige:","ad":{"header":"Umzugsprofi Nord","tag":"UMZUGSSERVICE","title":"Ihr Umzug in guten Händen.","subtitle":"","facts":["Komplettservice: Einpacken, Transport, Auspacken","Ab- und Aufbau von Möbeln und Küchen","Einrichtung von Halteverbotszonen","Einlagerung, falls die neue Wohnung noch nicht frei ist","kostenlose Besichtigung und Angebot zum Festpreis"],"body":["Wir packen an – damit Sie sich ganz auf Ihr neues Zuhause freuen können. Seit 30 Jahren bringen wir Möbel und Kartons sicher an ihr Ziel, in der Region und in ganz Deutschland."],"footer":"Jetzt unverbindlich anfragen! · anfrage@umzugsprofi-nord.de"},"situation":["Sie ziehen in einigen Monaten mit Ihrer Familie in eine andere Stadt und möchten den Umzug nicht allein organisieren. Sie interessieren sich für das Angebot und möchten mehr darüber erfahren. Schreiben Sie eine E-Mail an Umzugsprofi Nord."],"choice":["Behandeln Sie darin entweder","a) drei der folgenden Punkte oder","b) zwei der folgenden Punkte und einen weiteren Aspekt Ihrer Wahl."],"points":["Beschreiben Sie Ihre Umzugspläne.","Erläutern Sie, welche Leistungen Sie brauchen.","Fragen Sie nach den Kosten und der Versicherung.","Erkundigen Sie sich, wie die Besichtigung abläuft."],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss. Schreiben Sie mindestens 150 Wörter.","words":150,"model":{"label":"Beispiel für Variante b): zwei Leitpunkte und ein eigener Aspekt (ca. 170 Wörter).","text":"Betreff: Anfrage zu Ihrem Umzugsservice\n\nSehr geehrte Damen und Herren,\n\nim Internet bin ich auf Ihre Anzeige gestoßen und möchte mich nach einigen Einzelheiten erkundigen.\n\nIm Sommer ziehe ich mit meiner Frau und unseren beiden Kindern von Bremen nach Regensburg, weil ich dort eine neue Stelle antrete. Unsere jetzige Wohnung liegt im dritten Stock eines Altbaus ohne Aufzug; in Regensburg haben wir ein Reihenhaus gemietet. Insgesamt geht es um etwa 80 Kartons und die Möbel für vier Zimmer.\n\nDa wir beide voll berufstätig sind, würden wir gern Ihren Komplettservice in Anspruch nehmen, also auch das Ein- und Auspacken. Besonders wichtig ist uns, dass Sie die Einbauküche ab- und wieder aufbauen. Außerdem besitzen wir ein Klavier. Transportieren Sie auch solche schweren Einzelstücke?\n\nLeider können wir das Haus erst zwei Wochen nach unserem Auszug beziehen. Wäre es möglich, unsere Möbel so lange bei Ihnen einzulagern? Wichtig wäre für uns, dass wir in dieser Zeit an einzelne Kartons herankommen, zum Beispiel an Unterlagen für die Arbeit.\n\nIch freue mich auf Ihre Antwort und auf ein Angebot.\n\nMit freundlichen Grüßen\nDaniel Fischer"}},{"letter":"B","kind":"Beschwerde","lead":"Sie lesen folgende Anzeige:","ad":{"header":"TEXTILREINIGUNG GLANZPUNKT · SEIT 1987 IN DER ALTSTADT","tag":"","title":"Ihre Kleidung in besten Händen","subtitle":"","facts":["Expressservice: fertig in 24 Stunden","kostenlose Abholung und Lieferung im Stadtgebiet","Fleckentfernung ohne Aufpreis","Zufriedenheitsgarantie: Wir reinigen kostenlos nach","persönliche Beratung Mo–Sa 8–19 Uhr"],"body":["Ob Anzug, Abendkleid oder Wintermantel: Wir reinigen Ihre Kleidung schonend und sorgfältig – auch empfindliche Stoffe wie Seide und Wolle."],"footer":"Glanzpunkt · Marktgasse 7 · service@glanzpunkt-reinigung.de"},"situation":["Sie haben einen Wintermantel und ein Seidenkleid mit dem Expressservice reinigen lassen. Leider waren Sie mit dem Ergebnis überhaupt nicht zufrieden. Schreiben Sie eine Beschwerde an die Textilreinigung Glanzpunkt."],"choice":["Behandeln Sie darin entweder","a) drei der folgenden Punkte oder","b) zwei der folgenden Punkte und einen weiteren Aspekt Ihrer Wahl."],"points":["Erklären Sie, warum Sie sich für diese Reinigung entschieden haben.","Beschreiben Sie, was nicht in Ordnung war.","Schildern Sie, wie man im Geschäft auf Ihre Reklamation reagiert hat.","Stellen Sie klar, was Sie nun erwarten."],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss. Schreiben Sie mindestens 150 Wörter.","words":150,"model":{"label":"Beispiel für Variante a): drei der vier Leitpunkte (ca. 170 Wörter).","text":"Betreff: Beschwerde über die Reinigung meines Mantels und Kleides (Auftrag Nr. 4418 vom 12. Oktober)\n\nSehr geehrte Damen und Herren,\n\nam 12. Oktober habe ich Ihnen einen Wintermantel und ein Seidenkleid zur Reinigung gegeben. Leider bin ich mit Ihrer Arbeit überhaupt nicht zufrieden, deshalb möchte ich mich hiermit beschweren.\n\nObwohl ich extra den Expressservice bezahlt hatte, wurden die Sachen nicht nach 24 Stunden, sondern erst nach vier Tagen geliefert – dabei hatte ich ausdrücklich gesagt, dass ich den Mantel für eine Reise brauche. Der Rotweinfleck auf dem Kleid ist immer noch deutlich zu sehen, und am Mantel fehlen seitdem zwei Knöpfe.\n\nAls ich Ihrer Mitarbeiterin die Mängel im Geschäft gezeigt habe, meinte sie nur, bei Seide könne man nichts garantieren. Von der Zufriedenheitsgarantie aus Ihrer Anzeige wollte sie nichts wissen; stattdessen verlangte sie für eine zweite Reinigung noch einmal 18 Euro.\n\nIch erwarte daher, dass Sie mir den Aufpreis für den Expressservice erstatten, das Kleid kostenlos nachreinigen und die fehlenden Knöpfe ersetzen. Sollte ich bis zum 31. Oktober nichts von Ihnen hören, werde ich mich an die Verbraucherzentrale wenden.\n\nMit freundlichen Grüßen\nSevgi Arslan"}}]},"audio":[{"src":"telc%20B2%20Modelltest%202.1.mp3","dur":260.62},{"src":"telc%20B2%20Modelltest%202.2.mp3","dur":445.54},{"src":"telc%20B2%20Modelltest%202.3.mp3","dur":327.97}],"pdf":"telc%20B2%20Modelltest%202.pdf","pages":{"loesung":20,"muster":21,"kommentar":26,"hoertexte":24}},"3":{"id":3,"roman":"III","lesen":{"t1":{"instruction":"Lesen Sie zuerst die zehn Überschriften. Lesen Sie dann die fünf Texte und entscheiden Sie, welche Überschrift (a–j) am besten zu welchem Text (1–5) passt. Tragen Sie Ihre Lösungen in den Antwortbogen bei den Aufgaben 1–5 ein.","headlines":[{"letter":"a","text":"Behördenpost ganz ohne Amtsdeutsch"},{"letter":"b","text":"Einfache Schreiben halten vor Gericht nicht stand"},{"letter":"c","text":"Für die Gondel braucht man einen eigenen Fahrschein"},{"letter":"d","text":"Meister dürfen nur ihr eigenes Fach studieren"},{"letter":"e","text":"Per Kabine übers Wasser – die Bürger entscheiden"},{"letter":"f","text":"Strom und Obst vom selben Grundstück"},{"letter":"g","text":"Über den Beruf an die Hochschule"},{"letter":"h","text":"Unter Solardächern wachsen mehr Äpfel"},{"letter":"i","text":"Unternehmen holen jeden Ehemaligen zurück"},{"letter":"j","text":"Wer einmal gekündigt hat, ist wieder willkommen"}],"texts":[{"no":"1","paragraphs":["In Kaltenbrunn soll schon bald eine Seilbahn zum öffentlichen Nahverkehr gehören. Die geplante Strecke führt vom Hauptbahnhof über den Fluss bis zu einem neuen Wohnviertel am Hang, wo in einigen Jahren rund 6.000 Menschen leben sollen. Eine Straßenbahn wäre dort wegen der Steigung nur mit teuren Tunneln möglich; die Seilbahn würde dagegen nur etwa ein Viertel so viel kosten und ließe sich in zwei Jahren bauen. Alle 30 Sekunden soll eine Kabine abfahren, die Fahrt würde sieben Minuten dauern. Die Kabinen wären barrierefrei, sodass auch Menschen im Rollstuhl, mit Kinderwagen oder mit Fahrrad bequem einsteigen könnten. Einen eigenen Fahrschein bräuchte niemand: Es sollen die üblichen Tickets für Bus und Bahn gelten. Nicht alle sind jedoch begeistert. Viele Bewohner der Altstadt fürchten, dass Fahrgäste künftig von oben in ihre Gärten und Wohnzimmer schauen. Die Stadt verspricht, dass die Fenster der Kabinen über bewohnten Grundstücken automatisch undurchsichtig werden. Kritiker bezweifeln außerdem, dass die Bahn bei Sturm zuverlässig fährt; der Betrieb müsste dann ruhen, und Ersatzbusse würden einspringen. Ob das Projekt tatsächlich verwirklicht wird, entscheiden die Bürgerinnen und Bürger im Herbst per Abstimmung."]},{"no":"2","paragraphs":["Sandra Kuhlmann hat nie Abitur gemacht. Nach der Realschule wurde sie Krankenpflegerin und arbeitete fünfzehn Jahre lang auf einer Intensivstation. Heute studiert die 38-Jährige Pflegewissenschaft an der Hochschule Harzfeld, obwohl sie anfangs fürchtete, dafür zu alt zu sein. Möglich macht das eine Regelung, die erstaunlich wenige kennen: Wer eine Berufsausbildung abgeschlossen und danach einige Jahre im Beruf gearbeitet hat, darf auch ohne Abitur studieren – in der Regel ein Fach, das zum bisherigen Beruf passt. Meisterinnen und Meister sowie staatlich geprüfte Technikerinnen und Techniker dürfen sich sogar für jeden Studiengang bewerben. Je nach Bundesland müssen Interessierte vorher allerdings eine Eignungsprüfung bestehen oder ein Probestudium absolvieren. In Harzfeld ist fast jeder zehnte Studierende ohne Abitur eingeschrieben; im Bundesdurchschnitt sind es deutlich weniger. Die Lehrenden schätzen die Erfahrung der Quereinsteiger. „Sie stellen die besseren Fragen, weil sie wissen, wofür sie lernen“, sagt eine Professorin. Leicht ist der Weg trotzdem nicht. Viele müssen Mathematik oder wissenschaftliches Schreiben nachholen und nebenbei weiterarbeiten, weil sie eine Familie zu versorgen haben. Die Hochschule bietet deshalb Vorbereitungskurse an und legt einen Teil der Veranstaltungen auf den Abend. Kuhlmann arbeitet noch zwei Tage pro Woche im Krankenhaus. „Die ersten Hausarbeiten waren eine Qual“, gibt sie zu. „Aber ich merke jeden Tag, wie sehr mir die Praxis hilft.“ Nach dem Abschluss will sie nicht zurück ans Krankenbett, sondern selbst Pflegekräfte ausbilden."]},{"no":"3","paragraphs":["Als Carolin Stoll vor vier Jahren ihren Arbeitgeber verließ, einen Hersteller von Messgeräten, gab es zum Abschied Blumen und die üblichen guten Wünsche. Dass sie einmal zurückkehren würde, glaubte damals niemand – sie selbst am wenigsten. Heute leitet die Ingenieurin dort eine Abteilung mit zwölf Beschäftigten. Sogenannte Bumerang-Mitarbeiter sind für viele Unternehmen inzwischen eine willkommene Antwort auf den Fachkräftemangel. Sie kennen die Abläufe und die Kollegen, brauchen kaum Einarbeitung und bringen Erfahrungen mit, die sie bei anderen Firmen gesammelt haben. Manche Betriebe halten deshalb gezielt Kontakt zu Ehemaligen, laden sie zum Sommerfest ein oder informieren sie über freie Stellen. Früher galt eine Kündigung dagegen oft als Verrat: Wer ging, brauchte sich nicht mehr blicken zu lassen. „Diese Haltung können wir uns heute schlicht nicht mehr leisten“, sagt die Personalleiterin eines mittelständischen Maschinenbauers. In ihrem Betrieb werde inzwischen etwa jede achte freie Stelle mit einer Rückkehrerin oder einem Rückkehrer besetzt. Allerdings holen die Firmen längst nicht jeden zurück. Wer im Streit gegangen ist oder nur wegen eines höheren Gehalts wiederkommen möchte, hat meist schlechte Karten. Auch die Rückkehrer selbst müssen sich umstellen: Nicht selten haben sich Teams und Zuständigkeiten in der Zwischenzeit so stark verändert, dass der alte Arbeitsplatz kaum wiederzuerkennen ist. Stoll hat das nicht abgeschreckt. „Bei der Konkurrenz habe ich viel gelernt“, sagt sie, „aber hier fühle ich mich einfach zu Hause.“"]},{"no":"4","paragraphs":["Auf den ersten Blick sieht die Obstplantage von Ulrich Seibold am Bodensee aus wie viele andere: lange Reihen von Apfelbäumen, dazwischen gemähtes Gras. Erst beim zweiten Hinsehen fällt auf, dass über den Bäumen keine Hagelnetze hängen, sondern Solarmodule. Auf rund zwei Hektar erzeugt der Landwirt seit drei Jahren Strom für etwa 300 Haushalte – und erntet darunter weiterhin Äpfel. Agri-Photovoltaik nennt man diese Doppelnutzung, bei der auf derselben Fläche gleichzeitig Lebensmittel und Energie gewonnen werden. Für Seibold hat sie mehrere Vorteile. Die Module schützen die Früchte vor Hagel, Starkregen und Sonnenbrand, die in den vergangenen Sommern immer häufiger geworden sind. Unter dem Dach verdunstet außerdem weniger Wasser, sodass er seltener bewässern muss. Die Apfelernte fällt zwar etwas geringer aus als ohne Module, weil die Bäume weniger Licht bekommen; der Verkauf des Stroms gleicht das aber mehr als aus. „Ich bin Obstbauer geblieben“, betont Seibold, „aber ich schlafe ruhiger, seit ein einziges Unwetter nicht mehr die ganze Ernte vernichten kann.“ Begleitet wird das Projekt von einem Forschungsinstitut, das Erträge und Klima unter den Modulen misst. Die Wissenschaftler sehen großes Potenzial: Schon ein kleiner Teil der landwirtschaftlichen Fläche würde genügen, um einen erheblichen Anteil des deutschen Strombedarfs zu decken. Kritiker warnen dagegen vor einer Industrialisierung der Landschaft und befürchten, dass Felder am Ende nur noch Kraftwerke mit etwas Grün darunter sind. Tatsächlich lohnt sich die Technik nicht überall: Für Getreide, das viel Sonne braucht, eignet sie sich kaum. Ein weiteres Hindernis sind die Genehmigungen – Seibold hat fast zwei Jahre auf die Erlaubnis gewartet. Inzwischen melden sich bei ihm Kollegen aus der ganzen Region, die sich die Anlage ansehen wollen."]},{"no":"5","paragraphs":["„Sie werden gebeten, den beigefügten Vordruck binnen einer Frist von vierzehn Tagen ab Zugang dieses Schreibens zurückzusenden.“ Sätze wie dieser haben im Rathaus von Weilstadt ausgedient. Die Idee stammt von einer Mitarbeiterin des Sozialamts, die täglich erlebte, wie Menschen mit einem Brief in der Hand ratlos vor ihrem Schreibtisch standen. Seit einem Jahr formuliert die Verwaltung ihre Briefe so, dass möglichst alle sie beim ersten Lesen verstehen: kurze Sätze, bekannte Wörter, das Wichtigste zuerst. Aus dem Satz oben wurde: „Bitte schicken Sie uns das Formular innerhalb von zwei Wochen zurück.“ Alle 180 Beschäftigten wurden geschult, eine Arbeitsgruppe hat mehr als 400 Musterbriefe überarbeitet. Der Aufwand hat sich gelohnt: Beim Bürgertelefon gehen deutlich weniger Rückfragen ein, und Anträge werden seltener unvollständig eingereicht. Rechtlich angreifbar seien die neuen Schreiben nicht, betont der Bürgermeister – eine Juristin prüft jeden Text, bevor er verschickt wird."]}],"items":[{"no":"1","answer":"e"},{"no":"2","answer":"g"},{"no":"3","answer":"j"},{"no":"4","answer":"f"},{"no":"5","answer":"a"}]},"t2":{"instruction":"Lesen Sie zuerst den Artikel und lösen Sie dann die Aufgaben 6– 10 zu dem Text.","kind":"article","title":"Sterne, denen man nicht trauen sollte","lead":"Ob Hotel, Handwerker oder Heizlüfter: Vor fast jedem Kauf werfen wir heute einen Blick auf die Bewertungen anderer Kunden. Doch die Zahl der Sterne verrät oft weniger, als wir glauben.","paragraphs":["Als Lea Hinrichs ein Hotel für ihren Kurzurlaub in Wien suchte, war die Entscheidung schnell gefallen: 4,8 von 5 Sternen, mehr als 2.000 begeisterte Bewertungen. Vor Ort erwartete sie jedoch ein Zimmer direkt neben einer Baustelle, auf der schon ab sechs Uhr morgens gearbeitet wurde – ein Umstand, der in keiner einzigen Bewertung erwähnt worden war. „Ich habe mich gefragt, ob die anderen Gäste im selben Hotel waren“, sagt die 34-Jährige. Erfahrungen wie ihre sind keine Seltenheit. Bewertungen im Internet gelten als ehrliche Alternative zur Werbung, schließlich stammen sie von Kunden und nicht von Verkäufern. Doch diese Annahme stimmt nur zum Teil.","Ein Grund liegt darin, wer überhaupt eine Bewertung abgibt. Forscher haben festgestellt, dass sich vor allem zwei Gruppen äußern: Menschen, die begeistert sind, und Menschen, die sich sehr geärgert haben. Wer mit einem Produkt einfach zufrieden ist, schweigt dagegen meistens. Das Ergebnis ist eine eigentümliche Verteilung: viele Bewertungen mit fünf Sternen, einige mit einem Stern und dazwischen erstaunlich wenig. Der Durchschnittswert, den die Plattformen anzeigen, bildet deshalb vor allem die Extreme ab. Außerdem bitten viele Shops ihre Kunden schon direkt nach dem Kauf um ein Urteil – also bevor sie das Produkt richtig ausprobieren konnten.","Hinzu kommen gefälschte Bewertungen. Im Netz bieten Agenturen ganze Pakete positiver Kommentare an, und manche Händler belohnen Kunden mit Gutscheinen, wenn sie fünf Sterne vergeben. Beides ist in der EU unzulässig. Seit 2022 müssen Händler zudem angeben, ob und wie sie sicherstellen, dass eine Bewertung tatsächlich von jemandem stammt, der das Produkt gekauft oder genutzt hat. Kontrollieren lässt sich das allerdings nur schwer, zumal viele Fälschungen inzwischen mithilfe künstlicher Intelligenz entstehen und von echten Texten kaum noch zu unterscheiden sind.","Interessanterweise misstrauen viele Verbraucher ohnehin den besten Noten. Eine Untersuchung aus den USA ergab, dass die Kaufbereitschaft nicht bei fünf, sondern bei etwa 4,5 Sternen am höchsten ist. Ein makelloses Ergebnis wirkt offenbar zu schön, um wahr zu sein; Händler mit ausschließlich Bestnoten geraten schnell in den Verdacht, nachgeholfen zu haben. „Erst ein paar kritische Stimmen machen ein Angebot glaubwürdig“, erklärt die Marktpsychologin Ines Walcher. Besonders aufschlussreich sei, wie ein Händler auf Beschwerden reagiere: Wer sachlich antworte und Lösungen anbiete, verrate damit oft mehr über seine Seriosität als jede Lobeshymne.","Walcher empfiehlt, sich nicht vom Durchschnittswert leiten zu lassen, sondern gezielt die mittleren Bewertungen zu lesen. Wer drei Sterne vergibt, begründet seine Kritik meist sachlich und nennt Vor- und Nachteile. Misstrauisch werden sollte man dagegen, wenn viele Bewertungen innerhalb weniger Tage erscheinen, auffallend ähnlich formuliert sind oder kaum Einzelheiten enthalten. Auch ein Blick auf das Profil der Verfasser kann helfen: Wer an einem einzigen Tag zwanzig verschiedene Produkte lobt, hat sie kaum alle ausprobiert.","Ganz auf Bewertungen verzichten möchte Walcher trotzdem nicht. Richtig gelesen, seien sie eine wertvolle Hilfe – allerdings nur als eine Informationsquelle unter mehreren. Auch die Plattformen stünden in der Pflicht, Fälschungen konsequenter zu löschen. Wer ein teures Gerät kaufen wolle, solle zusätzlich unabhängige Warentests zurate ziehen. Und wer zufrieden sei, könne einen kleinen Beitrag leisten, indem er seine Erfahrung ebenfalls aufschreibe – auch wenn sie nicht spektakulär gewesen sei."],"source":"","taskInstruction":"Lösen Sie die Aufgaben 6–10. Entscheiden Sie, welche Lösung (a, b oder c) richtig ist, und tragen Sie Ihre Lösung in den Antwortbogen bei den Aufgaben 6–10 ein.","items":[{"no":"6","stem":"Lea Hinrichs","options":{"a":"hatte vorher von der Baustelle gelesen.","b":"misstraut seitdem jeder Form von Werbung.","c":"erlebte eine Überraschung, die in keiner Bewertung stand."},"answer":"c"},{"no":"7","stem":"Die angezeigten Durchschnittswerte","options":{"a":"beruhen vor allem auf den Urteilen zufriedener Kunden.","b":"spiegeln vor allem Begeisterung und Ärger wider.","c":"ergeben sich vor allem aus mittleren Noten."},"answer":"b"},{"no":"8","stem":"Seit 2022 müssen Händler","options":{"a":"offenlegen, wie sie die Echtheit prüfen.","b":"positive Bewertungen mit Gutscheinen belohnen.","c":"Bewertungen von künstlicher Intelligenz prüfen lassen."},"answer":"a"},{"no":"9","stem":"Nach Ansicht von Ines Walcher","options":{"a":"sollte man Bestnoten grundsätzlich ignorieren.","b":"schaden schon wenige kritische Stimmen dem Ruf eines Angebots.","c":"verrät der Umgang mit Kritik viel über einen Händler."},"answer":"c"},{"no":"10","stem":"Walcher rät,","options":{"a":"nur besonders gute Erfahrungen zu teilen.","b":"Bewertungen nur als eine von mehreren Quellen zu nutzen.","c":"sich bei teuren Geräten allein auf Warentests zu verlassen."},"answer":"b"}]},"t3":{"instruction":"Lesen Sie zuerst die zehn Situationen (11–20) und dann die zwölf Info-Texte (a–l). Welcher Info-Text passt zu welcher Situation? Sie können jeden Info-Text nur einmal verwenden. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 11–20. Manchmal gibt es keine Lösung. Markieren Sie dann x.","items":[{"no":"11","text":"Ein Bekannter will beim Online-Banking nicht auf Betrüger hereinfallen.","answer":"c"},{"no":"12","text":"Ein Kollege möchte seine Tochter (11) fürs Programmieren begeistern.","answer":"k"},{"no":"13","text":"Eine Freundin will mit ihrem Handy bessere Fotos machen.","answer":"h"},{"no":"14","text":"Eine Nachbarin möchte übrig gebliebene Lebensmittel sinnvoll weitergeben.","answer":"a"},{"no":"15","text":"Ihr Großvater (80) kommt mit seinem neuen Smartphone nicht zurecht.","answer":"j"},{"no":"16","text":"Ihr Neffe braucht für die Schule einen günstigen Laptop.","answer":"d"},{"no":"17","text":"Ihr Vater hat Diabetes und will seine Ernährung umstellen.","answer":"i"},{"no":"18","text":"Ihre Schwester möchte lernen, ihr Brot selbst zu backen.","answer":"e"},{"no":"19","text":"Ihre Tochter (9) möchte in den Sommerferien kochen lernen.","answer":"f"},{"no":"20","text":"Sie möchten an einem einzigen Abend lernen, Sushi zu rollen.","answer":"x"}],"infos":[{"letter":"a","header":"LEBENSMITTELRETTER WESTEND E. V.","tag":"","title":"Zu gut für die Tonne","subtitle":"","facts":[],"body":["In deutschen Haushalten landen jedes Jahr Millionen Tonnen genießbarer Lebensmittel im Müll. Das wollen wir ändern. In unseren Fairteiler vor dem Gemeindehaus kann jeder legen, was er selbst nicht mehr braucht – Obst, Gemüse, Brot oder ungeöffnete Packungen. Und jeder darf sich kostenlos bedienen. Nicht erlaubt sind rohes Fleisch, Fisch und Speisen, deren Verbrauchsdatum abgelaufen ist. Wer regelmäßig mithelfen möchte, etwa beim Abholen von Brot aus Bäckereien, ist bei unserem monatlichen Treffen herzlich willkommen."],"footer":"Fairteiler: Kirchplatz 3 · Treffen jeden ersten Montag, 19 Uhr"},{"letter":"b","header":"PFEFFER & SALZ","tag":"","title":"Japanische Küche","subtitle":"","facts":[],"body":["Von der Misosuppe über Tempura bis zum perfekt gerollten Sushi: An sechs Abenden führt Sie unser Koch Kenji Morimoto in die Geheimnisse der japanischen Küche ein. Sie lernen, Reis richtig zu würzen, Fisch fachgerecht zu schneiden und die Zutaten kunstvoll anzurichten. Da die Abende aufeinander aufbauen, kann der Kurs nur vollständig gebucht werden; einzelne Termine bieten wir nicht an. Zutaten, Messer und Schürzen stellen wir. Der Kurs beginnt am 4. März und findet jeweils mittwochs von 18 bis 21 Uhr statt."],"footer":"Kochschule Pfeffer & Salz · 290 € pro Person · www.pfeffer-und-salz.de"},{"letter":"c","header":"","tag":"12. OKTOBER","title":"Sicher bezahlen im Netz","subtitle":"","facts":["Do, 18 Uhr"],"body":["Gefälschte Bank-E-Mails, betrügerische Online-Shops, gestohlene Passwörter: Wer im Internet einkauft oder seine Bankgeschäfte online erledigt, sollte die häufigsten Tricks der Betrüger kennen. In unserem Vortrag zeigt eine Expertin der Verbraucherzentrale, woran man unseriöse Angebote erkennt, wie ein sicheres Passwort aussieht und was zu tun ist, wenn doch einmal Geld verschwunden ist. Im Anschluss beantwortet sie Ihre Fragen. Der Eintritt ist frei, eine Anmeldung ist nicht nötig."],"footer":"Volkshochschule · Saal 2 · Am Stadtgraben 11"},{"letter":"d","header":"","tag":"SCHULE UND TECHNIK","title":"Zweites Leben für Firmenlaptops","subtitle":"","facts":[],"body":["Viele Firmen tauschen ihre Computer nach wenigen Jahren aus, obwohl die Geräte noch einwandfrei funktionieren. Der Verein Digitale Chancen sammelt solche Laptops, löscht alle Daten sicher und spielt neue Software auf. Anschließend gibt er sie für 50 Euro an Schülerinnen und Schüler ab – deutlich günstiger als im Handel. Jedes Gerät hat ein Jahr Garantie. Wer eine Bescheinigung seiner Schule mitbringt, kann sich in der Werkstatt des Vereins ein Gerät aussuchen. Bei Unternehmen, die Laptops spenden möchten, holt der Verein die Geräte kostenlos ab."],"footer":"Werkstatt: Gutenbergstraße 20 · Di und Do 15–18 Uhr"},{"letter":"e","header":"Sauerteig & Co.","tag":"BACKKURS FÜR EINSTEIGER","title":"","subtitle":"","facts":[],"body":["Knusprige Kruste, saftige Krume – und ganz ohne Zusatzstoffe: In unserem Backkurs zeigt Ihnen Bäckermeisterin Gerda Holm, wie Sie einen eigenen Sauerteig ansetzen und daraus kräftige Roggen- und Dinkelbrote backen. Sie kneten, formen und backen selbst und nehmen am Ende zwei Brote und etwas Sauerteig mit nach Hause, damit Sie gleich weitermachen können. Vorkenntnisse sind nicht erforderlich. Der Kurs findet an einem Samstag von 9 bis 15 Uhr statt; ein Mittagessen ist inbegriffen."],"footer":"Backstube Holm · Tel. 0911 / 38 45 17"},{"letter":"f","header":"","tag":"","title":"Kleine Köche","subtitle":"Ferienkochkurs für Kinder","facts":[],"body":["Pizza mit selbst gemachtem Teig, bunte Gemüsespieße und zum Nachtisch Obstsalat: In unserem Ferienkurs bereiten Kinder zwischen acht und zwölf Jahren an fünf Vormittagen einfache Gerichte zu und essen sie anschließend gemeinsam. Nebenbei lernen sie, sicher mit Messer und Herd umzugehen, und erfahren, woher unsere Lebensmittel kommen. Der Kurs findet in der ersten und in der dritten Woche der Sommerferien statt, jeweils von 9 bis 12.30 Uhr. Eltern müssen nicht dabei sein. Bitte eine Schürze mitbringen!"],"footer":"Familienzentrum am Park · Tel. 0911 / 21 76 30"},{"letter":"g","header":"PC-DOKTOR BERISHA","tag":"","title":"Computerhilfe zu Hause","subtitle":"","facts":[],"body":["Der Drucker streikt, das WLAN bricht ständig ab oder der neue Computer soll eingerichtet werden? Wir kommen zu Ihnen nach Hause und lösen das Problem vor Ort – meist noch am selben Tag. Auf Wunsch übertragen wir auch Ihre Fotos und Dokumente vom alten auf das neue Gerät und zeigen Ihnen, wie Sie regelmäßig Sicherungskopien anlegen. Eine Stunde kostet 45 Euro, die Anfahrt innerhalb der Stadt ist kostenlos. Bitte beachten Sie: Smartphones und Tablets gehören nicht zu unserem Angebot."],"footer":"Tel. 0911 / 44 90 12 · Mo–Sa 8–20 Uhr"},{"letter":"h","header":"","tag":"","title":"FOTOS MIT DEM HANDY","subtitle":"","facts":[],"body":["Ihr Smartphone kann mehr, als Sie denken! In unserem Kurs lernen Sie, wie Sie Licht und Perspektive geschickt nutzen, Menschen natürlich in Szene setzen und Ihre Bilder anschließend mit kostenlosen Apps bearbeiten. Nach einer kurzen Einführung im Kursraum geht es hinaus in die Altstadt, wo Sie das Gelernte sofort ausprobieren. Geeignet für alle Altersgruppen und für jedes Handy mit Kamera. Drei Samstage, jeweils von 10 bis 13 Uhr; die Teilnahme kostet 75 Euro."],"footer":"FOTOSCHULE BLENDE 8 · BURGSTRASSE 9"},{"letter":"i","header":"","tag":"","title":"Ernährung, die Ihnen guttut","subtitle":"","facts":[],"body":["Sie haben Diabetes, Bluthochdruck oder zu hohe Cholesterinwerte und möchten Ihre Ernährung umstellen, wissen aber nicht, wo Sie anfangen sollen? In persönlichen Gesprächen entwickeln wir gemeinsam einen Plan, der zu Ihrem Alltag und Ihrem Geschmack passt – ganz ohne strenge Verbote. Sie lernen, Etiketten richtig zu lesen und gesund einzukaufen. Legen Sie eine ärztliche Bescheinigung vor, übernehmen die meisten Krankenkassen einen großen Teil der Kosten."],"footer":"Nadine Friedrichs · Diätassistentin · Tel. 0911 / 56 03 88"},{"letter":"j","header":"","tag":"","title":"Handy-Sprechstunde","subtitle":"für alle ab 65","facts":[],"body":["WhatsApp einrichten, Fotos an die Enkel schicken oder einfach nur die Schrift größer stellen: Schülerinnen und Schüler des Dürer-Gymnasiums helfen Ihnen geduldig bei allen Fragen rund um Smartphone und Tablet. Bringen Sie einfach Ihr Gerät und, falls vorhanden, Ihre Zugangsdaten mit. Wir treffen uns jeden Donnerstag von 15 bis 17 Uhr in der Stadtbibliothek. Kosten entstehen keine – über ein Stück Kuchen freuen sich unsere Helfer aber immer!"],"footer":"Stadtbibliothek, 1. Stock"},{"letter":"k","header":"","tag":"","title":"CODE CLUB – PROGRAMMIEREN FÜR KIDS","subtitle":"","facts":[],"body":["Wie bringt man einen Roboter dazu, einem Hindernis auszuweichen? Im Code Club lernen Kinder und Jugendliche zwischen 10 und 14 Jahren spielerisch, eigene Spiele und kleine Programme zu schreiben. Vorkenntnisse braucht niemand, Laptops und Roboter stellen wir. Die Gruppen sind klein, damit sich unsere Informatikstudierenden um jedes Kind kümmern können. Die Teilnahme ist kostenlos."],"footer":"Jeden zweiten Freitag, 16 Uhr · Informatikgebäude der Universität · Anmeldung: www.codeclub-kids.de"},{"letter":"l","header":"","tag":"Neu im Programm","title":"Vegan um die Welt","subtitle":"","facts":[],"body":["Jeden Freitag kochen wir gemeinsam Gerichte ohne tierische Produkte – und reisen dabei jedes Mal in ein anderes Land: indisches Curry, mexikanische Bohnenpfanne, italienische Pasta mit Linsen-Bolognese oder marokkanischer Couscous. Sie lernen, wie Sie Fleisch, Milch und Eier ersetzen, ohne auf Geschmack zu verzichten. Jeder Abend ist einzeln buchbar und kostet 35 Euro inklusive Zutaten und Getränken. Auch wer nicht vegan lebt, ist herzlich willkommen!"],"footer":"Stadtteilküche Mitte · Anmeldung bis Mittwoch"}]},"sb1":{"instruction":"Lesen Sie den folgenden Text und entscheiden Sie, welches Wort (a, b oder c) in die jeweilige Lücke passt. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 21–30.","paragraphs":["Liebe Katharina,","vielen Dank für deine Einladung zu deinem vierzigsten Geburtstag! Ich habe mich riesig darüber gefreut, {{21}} leider muss ich dir absagen. Ausgerechnet an diesem Wochenende findet in Nürnberg eine Messe statt, für {{22}} Vorbereitung ich seit Monaten verantwortlich bin. Hätte ich das früher gewusst, {{23}} ich mir natürlich freigenommen.","{{24}} ich schon nicht selbst kommen kann, möchte ich wenigstens etwas zum Gelingen deiner Feier beitragen. Du hattest doch erwähnt, dass du noch jemanden suchst, der Fotos macht. Mein Bruder Felix fotografiert leidenschaftlich gern und hat sich sofort {{25}} bereit erklärt. Er würde die Bilder hinterher auch bearbeiten, {{26}} du sie an deine Gäste schicken kannst. Ruf ihn am besten direkt an, dann könnt ihr alles Weitere in Ruhe besprechen.","Ein kleines Geschenk ist übrigens schon unterwegs. Was es ist, verrate ich noch nicht – nur so viel: Es hat mit unserer Reise nach Lissabon zu tun, {{27}} wir uns vor zwanzig Jahren kennengelernt haben. Das Paket ist gestern abgeschickt {{28}} und müsste also rechtzeitig bei dir ankommen.","Wie wäre es, wenn wir uns stattdessen in den Herbstferien treffen? Ich könnte {{29}} zu dir nach Kassel kommen, oder du besuchst mich in Kiel. Ich freue mich schon darauf, endlich wieder einmal einen ganzen Tag mit dir zu verbringen, {{30}} ständig auf die Uhr schauen zu müssen.","Feier schön und lass dich an deinem großen Tag ordentlich verwöhnen!","Deine Svenja"],"items":[{"no":"21","options":{"a":"aber","b":"denn","c":"sondern"},"answer":"a"},{"no":"22","options":{"a":"dem","b":"deren","c":"dessen"},"answer":"b"},{"no":"23","options":{"a":"hätte","b":"wäre","c":"würde"},"answer":"a"},{"no":"24","options":{"a":"Als","b":"Wann","c":"Wenn"},"answer":"c"},{"no":"25","options":{"a":"darauf","b":"davon","c":"dazu"},"answer":"c"},{"no":"26","options":{"a":"damit","b":"dass","c":"um"},"answer":"a"},{"no":"27","options":{"a":"auf dem","b":"auf der","c":"auf die"},"answer":"b"},{"no":"28","options":{"a":"geworden","b":"werden","c":"worden"},"answer":"c"},{"no":"29","options":{"a":"entweder","b":"sowohl","c":"weder"},"answer":"a"},{"no":"30","options":{"a":"damit","b":"ohne","c":"um"},"answer":"b"}]},"sb2":{"instruction":"Lesen Sie den folgenden Text und entscheiden Sie, welches Wort aus dem Kasten (a–o) in die Lücken 31–40 passt. Sie können jedes Wort im Kasten nur einmal verwenden. Nicht alle Wörter passen in den Text. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 31–40.","title":"Knappe Reserven im Sommer","paragraphs":["Jeden Tag werden in Deutschland rund 15.000 Blutspenden benötigt – für Unfallopfer, für Operationen und vor allem für Menschen mit Krebs, die während ihrer Behandlung regelmäßig auf fremdes Blut {{31}} sind. Ersetzen lässt sich Blut bis heute nicht, denn künstlich herstellen kann man es nicht. Doch nur etwa drei Prozent der Bevölkerung spenden regelmäßig, obwohl rund ein Drittel dafür infrage käme.","In den Sommermonaten verschärft sich die Lage {{32}}. Viele Stammspender sind im Urlaub, und bei großer Hitze fühlen sich manche nicht fit genug für eine Spende. Zudem fallen in den Ferien viele Spendetermine in Schulen weg. Gleichzeitig steigt der {{33}}, weil sich in der Ferienzeit mehr Unfälle ereignen. Vorräte für schlechte Zeiten lassen sich kaum anlegen, denn die wichtigsten Blutpräparate sind nur wenige Wochen {{34}}. Die Blutspendedienste starten deshalb jedes Jahr vor den Ferien einen {{35}} an die Bevölkerung.","Spenden kann grundsätzlich jeder, der mindestens 18 Jahre alt ist und mindestens 50 Kilogramm wiegt. Wichtigste {{36}} ist allerdings, dass man sich gesund fühlt; ein Arzt klärt das vor Ort in einem kurzen Gespräch, zuvor werden Blutdruck, Puls und Temperatur gemessen. Die eigentliche Blutabnahme dauert nur fünf bis zehn Minuten, insgesamt sollte man aber mit etwa einer Stunde {{37}}. {{38}} gibt es einen Imbiss, und man sollte sich eine Weile ausruhen. Frauen dürfen viermal, Männer sechsmal im Jahr spenden.","Um mehr junge Menschen zu {{39}}, lassen sich die Spendedienste einiges einfallen: Sie kommen mit mobilen Teams an Hochschulen und zu Festivals, werben in sozialen Netzwerken und bieten Termine am Abend an, damit auch Berufstätige kommen können. In manchen Ländern erhalten Spender sogar eine Nachricht aufs Handy, {{40}} ihr Blut einem Patienten geholfen hat. Die Idee dahinter: Wer sieht, dass seine Spende hilft, spendet eher wieder."],"words":{"a":"ABHÄNGIG","b":"ANGEWIESEN","c":"ANSCHLIESSEND","d":"ANSPRUCH","e":"AUFRUF","f":"BEDARF","g":"GEWINNEN","h":"GÜLTIG","i":"HALTBAR","j":"RECHNEN","k":"SEITDEM","l":"SOBALD","m":"VORAUSSETZUNG","n":"ZÄHLEN","o":"ZUSÄTZLICH"},"items":[{"no":"31","answer":"b"},{"no":"32","answer":"o"},{"no":"33","answer":"f"},{"no":"34","answer":"i"},{"no":"35","answer":"e"},{"no":"36","answer":"m"},{"no":"37","answer":"j"},{"no":"38","answer":"c"},{"no":"39","answer":"g"},{"no":"40","answer":"l"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun eine Nachrichtensendung. Dazu sollen Sie fünf Aufgaben lösen. Sie hören die Nachrichtensendung nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Wer innerhalb Deutschlands umzieht, kann sich den Weg zum Bürgeramt künftig sparen.","answer":"R"},{"no":"42","text":"Die Gewerkschaft sieht in dem neuen Modell ohne Kassen eine Chance, Arbeitsplätze zu sichern.","answer":"F"},{"no":"43","text":"Die Finderin möchte das wiederentdeckte Gemälde seinem früheren Eigentümer kostenlos überlassen.","answer":"R"},{"no":"44","text":"Die Meteorologen erwarten schon in den nächsten Tagen ergiebigen Regen am Rhein.","answer":"F"},{"no":"45","text":"Leihräder soll es künftig nur noch an Stationen in der Innenstadt geben.","answer":"F"}]},"t2":{"instruction":"Sie hören ein Rundfunk-Interview. Dazu sollen Sie zehn Aufgaben lösen. Sie hören dieses Interview nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu 60 Sekunden Zeit.","items":[{"no":"46","text":"Die größte Gruppe der Mitglieder ist noch nicht im Rentenalter.","answer":"R"},{"no":"47","text":"Getauscht wird bei der Zeitbank immer direkt zwischen zwei Personen.","answer":"F"},{"no":"48","text":"Für anspruchsvolle Tätigkeiten bekommt man mehr Stunden gutgeschrieben.","answer":"F"},{"no":"49","text":"Nicht selten suchen Mitglieder einfach jemanden, der ihnen Gesellschaft leistet.","answer":"R"},{"no":"50","text":"Viele Mitglieder helfen lieber, als selbst Hilfe anzunehmen.","answer":"R"},{"no":"51","text":"Neue Mitglieder müssen zuerst Stunden sammeln, bevor sie Hilfe bekommen.","answer":"F"},{"no":"52","text":"Die Zeitbank vermittelt auch größere Renovierungsarbeiten.","answer":"F"},{"no":"53","text":"Wer Kinder betreut, muss nachweisen, dass er nicht vorbestraft ist.","answer":"R"},{"no":"54","text":"Herr Lammers organisiert die Zeitbank bis heute ganz allein.","answer":"F"},{"no":"55","text":"Herr Lammers würde gern mehr Männer für die Zeitbank gewinnen.","answer":"R"}]},"t3":{"instruction":"Sie hören jetzt fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Ansagen nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 56–60. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"","items":[{"no":"56","text":"Ein im Internet reserviertes Wunschkennzeichen wird ein halbes Jahr lang für Sie freigehalten.","answer":"F"},{"no":"57","text":"Nach dem Spiel fährt nur ein einziger Sonderbus, und zwar um 22.15 Uhr.","answer":"F"},{"no":"58","text":"Ein zwölfjähriges Kind darf an dem Schnupperkurs nur gemeinsam mit einem Erwachsenen teilnehmen.","answer":"R"},{"no":"59","text":"Wenn Frau Szabó das Paket erst am Mittwoch abholt, bekommt sie es von einem anderen Nachbarn.","answer":"R"},{"no":"60","text":"Sollte es am Freitagabend regnen, fällt die geplante Filmvorführung im Stadtpark ersatzlos aus.","answer":"F"}]}},"schreiben":{"intro":"Wählen Sie zuerst zwischen Aufgabe A und Aufgabe B. Entscheiden Sie schnell, denn die zur Verfügung stehende Zeit ist begrenzt auf 30 Minuten!","tasks":[{"letter":"A","kind":"Bitte um Informationen","lead":"Sie lesen im Internet folgende Anzeige:","ad":{"header":"Fahrschule Tempo","tag":"FÜHRERSCHEIN KLASSE B","title":"In drei Wochen sicher ans Steuer.","subtitle":"","facts":["Theorieunterricht an zehn Abenden oder kompakt an zwei Wochenenden","Fahrstunden auch frühmorgens und samstags","Fahrzeuge mit Schalt- oder Automatikgetriebe","Lern-App für die Theorieprüfung inklusive","Ratenzahlung möglich"],"body":["Sie brauchen den Führerschein schnell – für den neuen Job, die Ausbildung oder einfach für mehr Freiheit im Alltag? In unserem Intensivkurs lernen Sie Theorie und Praxis in kurzer Zeit, ohne auf Qualität zu verzichten."],"footer":"Jetzt beraten lassen! · info@fahrschule-tempo.de"},"situation":["Sie haben eine neue Stelle in Aussicht, für die Sie einen Führerschein brauchen. Sie interessieren sich für den Intensivkurs und möchten mehr darüber erfahren. Schreiben Sie eine E-Mail an die Fahrschule Tempo."],"choice":["Behandeln Sie darin entweder","a) drei der folgenden Punkte oder","b) zwei der folgenden Punkte und einen weiteren Aspekt Ihrer Wahl."],"points":["Beschreiben Sie Ihre Situation und Ihre Vorkenntnisse.","Fragen Sie nach dem genauen Ablauf des Intensivkurses.","Erkundigen Sie sich nach den Kosten und der Ratenzahlung.","Fragen Sie, ob der Unterricht auch in anderen Sprachen möglich ist."],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss. Schreiben Sie mindestens 150 Wörter.","words":150,"model":{"label":"Beispiel für Variante b): zwei Leitpunkte und ein eigener Aspekt (ca. 170 Wörter)","text":"Betreff: Fragen zu Ihrem Intensivkurs\n\nSehr geehrte Damen und Herren,\n\nauf Ihrer Internetseite habe ich die Anzeige für Ihren Intensivkurs gelesen und hätte dazu einige Fragen.\n\nAb Januar werde ich als Pflegehelferin bei einem ambulanten Pflegedienst arbeiten und muss meine Patientinnen und Patienten dann mit dem Auto besuchen. In meinem Heimatland Kolumbien habe ich zwar schon einige Fahrstunden genommen, aber nie eine Prüfung abgelegt. Theoretische Kenntnisse habe ich daher kaum, und im Straßenverkehr fühle ich mich noch unsicher.\n\nKönnten Sie mir bitte erklären, wie der Intensivkurs genau abläuft? Mich würde vor allem interessieren, wie viele Fahrstunden Ihre Schülerinnen und Schüler in drei Wochen normalerweise brauchen und wann die theoretische und die praktische Prüfung stattfinden.\n\nDa ich bis Ende Dezember noch vormittags in einem Café arbeite, käme für mich nur Unterricht am Nachmittag oder am Wochenende infrage. Wäre es möglich, die Fahrstunden entsprechend zu legen? Außerdem würde ich gern wissen, ob ich vor der Anmeldung eine Probestunde machen kann.\n\nÜber eine baldige Antwort würde ich mich sehr freuen.\n\nMit freundlichen Grüßen\nLucía Herrera"}},{"letter":"B","kind":"Beschwerde","lead":"Sie lesen folgende Anzeige:","ad":{"header":"","tag":"NETZPLUS · GLASFASER FÜR IHR ZUHAUSE","title":"Endlich schnelles Internet","subtitle":"","facts":["Anschluss innerhalb von vier Wochen","Installation durch unsere Techniker – kostenlos und zum Wunschtermin","Service-Hotline rund um die Uhr erreichbar","die ersten sechs Monate nur 19,99 € im Monat","keine Kosten vor der Freischaltung"],"body":["Surfen, streamen und im Homeoffice arbeiten – mit bis zu 1.000 Mbit/s. Wir verlegen die Glasfaser bis in Ihre Wohnung."],"footer":"NetzPlus Kundenservice · service@netzplus-glasfaser.de"},"situation":["Sie haben bei NetzPlus einen Glasfaseranschluss bestellt. Leider lief dabei vieles anders als versprochen. Schreiben Sie eine Beschwerde an NetzPlus."],"choice":["Behandeln Sie darin entweder","a) drei der folgenden Punkte oder","b) zwei der folgenden Punkte und einen weiteren Aspekt Ihrer Wahl."],"points":["Beschreiben Sie, welche Erwartungen die Anzeige bei Ihnen geweckt hat.","Legen Sie dar, was bei der Bestellung und der Installation schiefgelaufen ist.","Berichten Sie, wie Sie versucht haben, den Kundenservice zu erreichen.","Formulieren Sie, welche Lösung Sie nun erwarten."],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss. Schreiben Sie mindestens 150 Wörter.","words":150,"model":{"label":"Beispiel für Variante a): drei der vier Leitpunkte (ca. 180 Wörter)","text":"Betreff: Beschwerde über meinen Glasfaseranschluss (Kundennummer 5821904)\n\nSehr geehrte Damen und Herren,\n\nAnfang Juni habe ich bei Ihnen einen Glasfaseranschluss bestellt. Was ich seitdem erlebt habe, hat mit Ihrer Werbung leider wenig zu tun.\n\nStatt innerhalb von vier Wochen wurde mein Anschluss erst nach drei Monaten freigeschaltet. Für zwei vereinbarte Technikertermine habe ich mir jeweils einen Tag Urlaub genommen, doch beide Male ist niemand erschienen – ohne jede Absage. Trotzdem haben Sie mir bereits ab Juli die Monatsgebühr abgebucht, obwohl Ihre Anzeige verspricht, dass vor der Freischaltung keine Kosten entstehen.\n\nIhre angeblich rund um die Uhr erreichbare Hotline habe ich in dieser Zeit mehr als zehnmal angerufen. Meistens hing ich eine halbe Stunde in der Warteschleife; wenn ich doch einmal durchkam, wurde ich vertröstet oder so lange weiterverbunden, bis die Verbindung abbrach. Auf meine beiden E-Mails habe ich bis heute keine Antwort erhalten.\n\nIch fordere Sie daher auf, mir die zu Unrecht abgebuchten Gebühren von 39,98 Euro umgehend zu erstatten und mich für die beiden versäumten Termine angemessen zu entschädigen. Falls ich bis zum 30. September keine Antwort erhalte, sehe ich mich gezwungen, die Schlichtungsstelle der Bundesnetzagentur einzuschalten.\n\nMit freundlichen Grüßen\nMarek Dvořák"}}]},"audio":[{"src":"telc%20B2%20Modelltest%203.1.mp3","dur":258.01},{"src":"telc%20B2%20Modelltest%203.2.mp3","dur":435.54},{"src":"telc%20B2%20Modelltest%203.3.mp3","dur":325.2}],"pdf":"telc%20B2%20Modelltest%203.pdf","pages":{"loesung":20,"muster":21,"kommentar":26,"hoertexte":24}},"4":{"id":4,"roman":"IV","lesen":{"t1":{"instruction":"Lesen Sie zuerst die zehn Überschriften. Lesen Sie dann die fünf Texte und entscheiden Sie, welche Überschrift (a–j) am besten zu welchem Text (1–5) passt. Tragen Sie Ihre Lösungen in den Antwortbogen bei den Aufgaben 1–5 ein.","headlines":[{"letter":"a","text":"Das Land übernimmt die Mieten der Pop-up-Läden"},{"letter":"b","text":"Die Bürger haben ihre Nachtbürgermeisterin selbst gewählt"},{"letter":"c","text":"Ein Sommer lang Terrasse statt Parkplatz"},{"letter":"d","text":"Eine Ausstellung macht sich über Erfinder lustig"},{"letter":"e","text":"Eine Vermittlerin für ruhigere Nächte"},{"letter":"f","text":"Gemeinde lockt Ärztin mit Startgeld aufs Land"},{"letter":"g","text":"Gescheiterte Produkte als Lehrstück"},{"letter":"h","text":"Jeder darf vor seiner Tür eine Terrasse bauen"},{"letter":"i","text":"Kurze Mietzeiten bringen Leben in die Innenstadt"},{"letter":"j","text":"Prämien beenden den Ärztemangel in der ganzen Region"}],"texts":[{"no":"1","paragraphs":["Als Hanna Wiesner vor zwei Jahren die Hausarztpraxis in Oberwaldach übernahm, war das Dorf seit acht Monaten ohne Arzt. Ältere Menschen mussten für jedes Rezept 30 Kilometer in die Kreisstadt fahren, oft mit dem Taxi. Dass die 36-Jährige heute hier arbeitet, hat mit einem ungewöhnlichen Angebot zu tun: Die Gemeinde zahlte ihr 50.000 Euro Starthilfe und stellt ihr die Praxisräume im alten Rathaus mietfrei zur Verfügung. Im Gegenzug hat sich Wiesner verpflichtet, mindestens fünf Jahre zu bleiben. „Das Geld war nicht der Hauptgrund“, sagt sie. „Aber es hat mir die Entscheidung erleichtert, mich selbstständig zu machen.“ In einer Klinik in der Stadt hätte sie als Angestellte ein sicheres Gehalt gehabt, aber weniger selbst bestimmen können. Inzwischen kennt sie viele ihrer Patientinnen und Patienten beim Vornamen, und nach der Sprechstunde fährt sie zu Hausbesuchen auf die umliegenden Höfe. Unterstützt wird sie von einer Praxisassistentin, die Blutdruck misst und Verbände wechselt, damit mehr Zeit für schwierige Fälle bleibt. Ganz so idyllisch, wie es klingt, ist der Alltag allerdings nicht: Eine Vertretung für den Urlaub zu finden, ist fast unmöglich, und nach Feierabend klingelt manchmal trotzdem das Telefon, weil jemand dringend Hilfe braucht. Mehrere Nachbargemeinden haben das Modell inzwischen übernommen – mit gemischtem Erfolg, denn nicht überall hat sich jemand gemeldet."]},{"no":"2","paragraphs":["Wenn in der Altstadt von Kronstedt nachts die Musik aus den Clubs dringt, ruft heute seltener jemand die Polizei. Das liegt auch an Mira Jovanović. Seit einem Jahr ist die studierte Kulturmanagerin die erste Nachtbürgermeisterin der Stadt. Gewählt wurde sie nicht von der Bevölkerung, sondern von einem Gremium aus Clubbetreibern, Anwohnern und Verwaltung; ihre halbe Stelle bezahlt die Stadt. Ihre Aufgabe: zwischen denen vermitteln, die nachts feiern wollen, und denen, die schlafen müssen. Statt auf Strafen setzt sie auf Gespräche. So hat sie erreicht, dass zwei Clubs ihre Eingänge schalldicht umgebaut haben und die Gäste zum Rauchen in einen Innenhof gehen statt auf den Gehweg. Am Wochenende sind außerdem „Nachtlotsen“ unterwegs, die laute Gruppen freundlich um Ruhe bitten. Für Clubbetreiber ist Jovanović zudem die Ansprechpartnerin im Rathaus, wenn es um Genehmigungen geht. Mit Polizei und Ordnungsamt trifft sie sich einmal im Monat, um Konflikte früh zu erkennen. Seit ihrem Amtsantritt ist die Zahl der Beschwerden um ein Drittel gesunken. Ganz zufrieden sind aber nicht alle: Einige Anwohner fordern eine Sperrstunde um Mitternacht. Davon hält Jovanović wenig. „Eine lebendige Stadt braucht auch ein Nachtleben“, sagt sie."]},{"no":"3","paragraphs":["Wo früher ein Schuhgeschäft war, verkauft heute eine junge Modedesignerin ihre erste Kollektion; zwei Häuser weiter bietet ein kleines Unternehmen Taschen aus alten Segeln an. Beide Läden sind nur auf Zeit geöffnet – und genau das ist die Idee. In Emmerstadt standen vor drei Jahren fast 40 Geschäfte in der Innenstadt leer. Seitdem mietet die Stadt einige dieser Flächen selbst an und gibt sie für drei bis sechs Monate günstig an Gründerinnen und Gründer, Kunsthandwerker oder Vereine weiter. Gefördert werden vor allem Angebote, die es in der Innenstadt bisher nicht gab. Die Miete beträgt nur einen Bruchteil des Üblichen; dafür müssen die Mieter die Räume selbst herrichten und an mindestens fünf Tagen pro Woche öffnen. Die Bilanz nach drei Jahren: 46 Pop-up-Läden wurden eröffnet, elf davon sind geblieben und zahlen inzwischen die normale Miete. Der Leerstand ist um ein Viertel gesunken, und mehrere Gründerinnen beschäftigen sogar schon Angestellte. Auch alteingesessene Geschäfte profitieren. „Wenn ein Schaufenster wieder hell ist, bleiben die Leute stehen – und kommen dann auch zu uns“, sagt der Inhaber eines Buchladens. Nicht jede Idee funktioniert allerdings: Ein Laden für Brettspiele gab schon nach sechs Wochen auf, weil kaum Kunden kamen. Das Risiko bleibt für die Gründer trotzdem überschaubar, denn lange Mietverträge müssen sie nicht unterschreiben. Kritik kommt von manchen Hauseigentümern. Sie befürchten, dass die niedrigen Mieten die Preise in der Innenstadt auf Dauer drücken. Die Stadt hält dagegen, dass leere Läden niemandem Geld bringen und ganze Straßen veröden lassen. Das Programm soll deshalb weiterlaufen; ab dem kommenden Jahr will sich auch das Land an den Kosten beteiligen."]},{"no":"4","paragraphs":["Die Zahnpasta mit Kaffeegeschmack sieht harmlos aus, wie sie da in der Vitrine liegt. Daneben sind ein Kühlschrank mit eingebautem Radio, eine Gabel, die beim Essen die Bissen zählt, und ein Regenschirm zu sehen, der sich per App öffnen lässt – sofern der Akku nicht gerade leer ist. Diese Produkte haben eines gemeinsam: Kaum jemand wollte sie haben. Seit einem halben Jahr zeigt die Ausstellung „Daneben“ in einer ehemaligen Fabrikhalle in Aschenberg rund 120 solcher Fehlschläge. Die Idee stammt vom Wirtschaftshistoriker Veit Pfleiderer, der seit Jahren gescheiterte Erfindungen sammelt. Er will die Besucher nicht zum Lachen bringen – jedenfalls nicht in erster Linie. „In unserer Kultur werden Fehler meist versteckt“, sagt er. „Dabei lernt man aus ihnen oft mehr als aus Erfolgen.“ Zu jedem Objekt erklärt eine kurze Tafel, warum es gescheitert ist: Mal war die Technik noch nicht ausgereift, mal war das Produkt zu teuer, mal kam es schlicht zur falschen Zeit. Ein Telefon mit Bildschirm etwa scheiterte vor vierzig Jahren auch daran, dass es kaum jemanden gab, den man damit anrufen konnte. Manches, was in den Achtzigerjahren niemand kaufen wollte, ist heute übrigens selbstverständlich. Besonders gefragt sind Führungen für Unternehmen: Teams aus Entwicklungsabteilungen kommen, um über eigene Misserfolge zu sprechen, ohne sich dabei zu blamieren. Mit dem Geld aus diesen Führungen wird die Ausstellung finanziert. Auch Schulklassen kommen häufig. Eine Lehrerin erzählt, ihre Schüler hätten danach viel offener über schlechte Noten gesprochen. Ursprünglich sollte die Schau nur drei Monate dauern. Weil bereits mehr als 30.000 Menschen gekommen sind, wurde sie bis Ende nächsten Jahres verlängert. Einige Hersteller haben ihre Flops sogar selbst gespendet – wenn auch anonym."]},{"no":"5","paragraphs":["Zwei Holzbänke, ein Tisch und Blumenkästen – dort, wo in der Gerberstraße sonst ein Auto parkt. Die Anwohner haben den Parkplatz vor ihrem Haus für den Sommer in eine kleine Terrasse verwandelt. Abends sitzen hier Nachbarn zusammen, die sich vorher kaum kannten. Dahinter steckt ein Versuch der Stadt Hallfeld: Wer vor der eigenen Haustür ein solches „Parklet“ einrichten möchte, muss einen Antrag stellen, die Zustimmung der direkten Nachbarn vorlegen und sich verpflichten, die Fläche sauber zu halten. Den Bausatz aus Holz und die Pflanzen bezahlt die Stadt, aufbauen müssen die Anwohner selbst – Werkzeug brauchen sie dafür nicht. Im Oktober wird alles wieder abgebaut. In diesem Jahr machen zwölf Straßen mit. Auch Kinder aus der Nachbarschaft nutzen die Bänke gern, etwa für ihre Hausaufgaben. Der Einzelhandel sieht die Aktion skeptisch, weil er befürchtet, dass Kunden keinen Parkplatz mehr finden. Im Herbst will die Stadt Bilanz ziehen."]}],"items":[{"no":"1","answer":"f"},{"no":"2","answer":"e"},{"no":"3","answer":"i"},{"no":"4","answer":"g"},{"no":"5","answer":"c"}]},"t2":{"instruction":"Lesen Sie zuerst das Interview und lösen Sie dann die Aufgaben 6–10 zu dem Text.","kind":"interview","title":"„Die Hand denkt mit“","lead":"Schulen verteilen Tablets, Studierende tippen ihre Notizen in den Laptop. Die Lernforscherin Johanna Riedl erklärt, warum wir das Schreiben mit der Hand trotzdem nicht aufgeben sollten.","paragraphs":[{"q":true,"text":"Frau Riedl, wann haben Sie zuletzt etwas mit der Hand geschrieben?"},{"text":"Heute Morgen – einen Einkaufszettel. Damit bin ich ziemlich typisch: Die meisten Erwachsenen schreiben kaum noch mit der Hand, höchstens eine Glückwunschkarte oder eine Notiz für den Kühlschrank. Das ist an sich kein Problem. Bedenklich finde ich es erst, wenn Kinder und Jugendliche auch beim Lernen fast nur noch tippen. Bei meinen Studierenden sehe ich kaum noch Hefte."},{"q":true,"text":"Warum? Auf der Tastatur ist man doch viel schneller."},{"text":"Genau darin liegt der Haken, denn die Tastatur verführt dazu, zur reinen Protokollmaschine zu werden. Wer tippt, kann einem Vortrag fast Wort für Wort folgen und schreibt deshalb vieles mit, ohne darüber nachzudenken. Wer mit der Hand schreibt, ist langsamer und muss auswählen: Was ist wichtig, und wie fasse ich es in eigenen Worten zusammen? Gerade dieses Verarbeiten sorgt dafür, dass man sich den Stoff besser merkt. In einem bekannten Experiment aus den USA konnten Studierende, die mit der Hand mitgeschrieben hatten, Verständnisfragen deutlich besser beantworten als ihre tippenden Kommilitonen – obwohl ihre Notizen kürzer waren."},{"q":true,"text":"Spielt auch die Bewegung der Hand selbst eine Rolle?"},{"text":"Vieles spricht dafür. Beim Schreiben formt man jeden Buchstaben mit einer eigenen Bewegung, beim Tippen drückt man immer die gleiche Art von Taste. Das Gehirn muss sich also bei jedem Buchstaben neu orientieren, und das scheint das Behalten zu fördern. Messungen der Hirnaktivität zeigen, dass beim Schreiben mit der Hand deutlich mehr Bereiche des Gehirns zusammenarbeiten. Man sollte davon aber keine Wunder erwarten: Wer einen schlechten Aufsatz mit der Hand schreibt, hat hinterher immer noch einen schlechten Aufsatz."},{"q":true,"text":"Kann man diese Vorteile nicht auch am Computer nutzen?"},{"text":"Zum Teil. Wer sich beim Tippen zwingt, nur Stichworte festzuhalten und alles in eigenen Worten zusammenzufassen, lernt ebenfalls besser. Das gelingt aber nur wenigen, weil die Versuchung, einfach alles mitzuschreiben, zu groß ist."},{"q":true,"text":"Sollten Schulen also auf Tablets verzichten?"},{"text":"Nein, das wäre der falsche Schluss. Für Recherchen, für Präsentationen oder für Kinder mit einer Schreibschwäche sind digitale Geräte ein großer Gewinn. Es kommt darauf an, bewusst zu entscheiden, wann welches Werkzeug sinnvoll ist. Ein Tablet ersetzt nicht das Schreiben mit der Hand, aber es kann den Unterricht gut ergänzen. Schweden hat übrigens vor einigen Jahren begonnen, in den Grundschulen wieder mehr gedruckte Bücher und Hefte einzusetzen – nachdem die Leseleistungen der Kinder zurückgegangen waren."},{"q":true,"text":"In manchen Bundesländern lernen Kinder keine verbundene Schreibschrift mehr, sondern nur noch Druckbuchstaben. Ist das ein Verlust?"},{"text":"Weniger, als viele glauben. Ob die Buchstaben verbunden sind oder nicht, ist zweitrangig; Kinder, die nur Druckschrift lernen, schreiben deshalb nicht automatisch schlechter. Entscheidend ist, dass Kinder flüssig und lesbar schreiben lernen. Wer über jeden einzelnen Buchstaben nachdenken muss, hat keine Kraft mehr für den Inhalt. Und flüssiges Schreiben braucht Übung – also Zeit, die im Stundenplan ohnehin knapp ist."},{"q":true,"text":"Was bedeutet das für Erwachsene, die sich weiterbilden?"},{"text":"Wer etwas wirklich verstehen will, sollte zumindest die Kernpunkte von Hand notieren. Das geht übrigens auch mit einem Stift auf dem Tablet; entscheidend ist das Formulieren, nicht das Papier. Wenn es dagegen auf jedes Wort ankommt, etwa bei einem Protokoll, ist die Tastatur die bessere Wahl. Ich selbst halte es so: Stichworte von Hand, alles Weitere später am Computer."}],"source":"","taskInstruction":"Lösen Sie die Aufgaben 6–10. Entscheiden Sie, welche Lösung (a, b oder c) richtig ist, und tragen Sie Ihre Lösung in den Antwortbogen bei den Aufgaben 6–10 ein.","items":[{"no":"6","stem":"Bedenklich findet Frau Riedl, dass","options":{"a":"Erwachsene im Alltag kaum noch etwas mit der Hand schreiben.","b":"auch Schüler beim Lernen kaum noch einen Stift benutzen.","c":"niemand mehr Glückwunschkarten verschickt."},"answer":"b"},{"no":"7","stem":"Im Experiment aus den USA","options":{"a":"schrieben die Handschreibenden mehr mit.","b":"waren getippte Notizen weniger vollständig als handgeschriebene.","c":"verstanden die Handschreibenden den Stoff besser."},"answer":"c"},{"no":"8","stem":"Messungen der Hirnaktivität","options":{"a":"sprechen für ein stärkeres Zusammenspiel im Gehirn.","b":"belegen, dass handgeschriebene Aufsätze besser sind.","c":"zeigen kaum Unterschiede zwischen Tippen und Schreiben."},"answer":"a"},{"no":"9","stem":"Digitale Geräte","options":{"a":"hält Frau Riedl für grundsätzlich schädlich.","b":"können manchen Kindern das Lernen deutlich erleichtern.","c":"haben in Schweden die Leseleistungen verbessert."},"answer":"b"},{"no":"10","stem":"Erwachsenen rät Frau Riedl,","options":{"a":"beim Lernen ganz auf digitale Geräte zu verzichten.","b":"möglichst jedes Wort mitzuschreiben.","c":"Wichtiges selbst formuliert von Hand festzuhalten."},"answer":"c"}]},"t3":{"instruction":"Lesen Sie zuerst die zehn Situationen (11–20) und dann die zwölf Info-Texte (a–l). Welcher Info-Text passt zu welcher Situation? Sie können jeden Info-Text nur einmal verwenden. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 11–20. Manchmal gibt es keine Lösung. Markieren Sie dann x.","items":[{"no":"11","text":"Ein Freund möchte sich mit einem Café selbstständig machen.","answer":"g"},{"no":"12","text":"Eine Bekannte möchte selbst ein Möbelstück aus Holz bauen.","answer":"b"},{"no":"13","text":"Eine berufstätige Kollegin sucht ein Bewerbungstraining am Abend.","answer":"x"},{"no":"14","text":"Ihr Bruder und seine Verlobte wollen ihre Eheringe selbst machen.","answer":"k"},{"no":"15","text":"Ihr Nachbar (70) möchte mit Gleichaltrigen Aquarell malen.","answer":"d"},{"no":"16","text":"Ihre Cousine will nach der Elternzeit zurück in den Beruf.","answer":"i"},{"no":"17","text":"Ihre Mutter möchte ihre Kleidung selbst ändern können.","answer":"l"},{"no":"18","text":"Ihre Nichte (8) sucht samstags eine kreative Beschäftigung.","answer":"f"},{"no":"19","text":"Sie brauchen für den Job Deutsch auf B2-Niveau.","answer":"a"},{"no":"20","text":"Sie müssen bald vor vielen Leuten sprechen und sind sehr aufgeregt.","answer":"c"}],"infos":[{"letter":"a","header":"","tag":"Neu ab Oktober","title":"Deutsch für den Beruf (B2)","subtitle":"","facts":[],"body":["Sie arbeiten bereits in Deutschland und möchten sich im Job sicherer ausdrücken? In unserem berufsbegleitenden Kurs üben Sie, E-Mails zu formulieren, am Telefon Termine zu vereinbaren und in Besprechungen Ihre Meinung zu vertreten. Am Ende können Sie eine anerkannte B2-Prüfung ablegen. Der Unterricht findet dienstags und donnerstags von 18 bis 21 Uhr statt. Unter bestimmten Voraussetzungen übernimmt das Jobcenter oder Ihr Arbeitgeber die
