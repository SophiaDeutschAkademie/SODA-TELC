})();

:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1f5a9e;--acc-2:#17457a;--acc-w:#e6eef8;--acc-line:#9db9dc;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:980px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.blog .bh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.86em;color:var(--muted);border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:12px}
.blog .bh b{color:var(--ink-2)}
.blog h3,.art h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.blog p,.art p,.doc p{margin:0 0 .75em}
.blog .cl{margin-top:.6em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}
.art .fn{font-size:.85em;color:var(--muted);margin-top:8px}
/* ---------- Anzeigen (Lesen Teil 3): jede Anzeige mit eigenem Layout ---------- */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:20px 18px;align-items:start;
  --ad-sans:var(--font);--ad-serif:var(--font);--ad-hand:var(--font);--ad-cond:var(--font);
  --ad-mono:var(--font)}
.adw{min-width:0}
.adl{display:flex;align-items:flex-end;gap:8px;font-weight:800;font-size:1.05em;line-height:1;margin:0 0 7px;color:var(--ink)}
.adl::after{content:"";flex:1;border-bottom:1px solid #8a9099;margin-bottom:2px}
.ad{position:relative;font-family:var(--ad-sans);font-size:.92em;line-height:1.5;color:#1c1c1c;background:#fff;overflow-wrap:break-word}
.ad p{margin:0 0 .55em}
.ad h4{margin:0 0 .35em;font-size:1.08em;line-height:1.25}
.ad .af{margin:.9em 0 0;font-size:.86em}
.ad .tg{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:#555}
.ad .ti{font-weight:700}
.ad ul.fx{list-style:none;padding:0;margin:.3em 0 .7em}
.ad ul.fx li{font-weight:700}
.ad .ft{width:100%;border-collapse:collapse;margin:.3em 0 .9em;font-size:.95em}
.ad .ft td{padding:.28em 0;border-bottom:1px dotted #8c8c8c;vertical-align:top}
.ad .ft td+td{text-align:right;font-weight:700;padding-left:10px}
.ad svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ad .lead{font-weight:700}
.ad .nw{white-space:nowrap}
/* inst */
.d-inst{border:1px solid #2b2b2b;padding:16px 18px}
.d-inst .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1.5px solid #222;padding-bottom:7px;margin-bottom:14px}
.d-inst .ah b{font-size:1.06em}
.d-inst .af{font-weight:700}
/* serif */
.d-serif{background:#f3f2ee;border:1px solid #b9b6ad;padding:18px 20px 14px;font-family:var(--ad-serif)}
.d-serif h4{text-align:center;font-size:1.42em;font-weight:300;letter-spacing:-.02em}
.d-serif .su{font-weight:600;text-align:center;border-bottom:1px solid #444;padding-bottom:8px;margin:8px 0 14px}
.d-serif .af{font-family:var(--ad-sans);font-size:.8em;color:#3a3a3a}
/* dashed */
.d-dashed{border:1.5px dashed #444;padding:16px 18px 0}
.d-dashed .hd b{display:block;font-size:1.08em}
.d-dashed .hd span{display:block;font-size:.72em;letter-spacing:.13em;text-transform:uppercase;color:#3d3d3d;margin:2px 0 12px}
.d-dashed .strip{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1.5px dashed #444;margin:14px -18px 0;padding:8px 18px;font-size:.86em}
/* barhead */
.d-barhead{border:1.5px solid #1c1c1c}
.d-barhead .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1c1c1c;color:#fff;padding:9px 14px}
.d-barhead .bar b{letter-spacing:.03em}
.d-barhead .bar svg{width:22px;height:22px;flex:none}
.d-barhead .in{padding:14px 16px 12px}
/* rules */
.d-rules{border-top:3px solid #111;border-bottom:3px solid #111;padding:16px 6px 12px;font-family:var(--ad-serif)}
.d-rules h4{font-weight:800;font-size:1.5em;letter-spacing:-.02em;text-align:center;margin:0}
.d-rules .su{text-align:center;font-family:var(--ad-sans);font-size:.72em;letter-spacing:.17em;text-transform:uppercase;margin:6px 0 14px}
.d-rules .af{text-align:center;border-top:1px solid #111;padding-top:8px;margin:14px 18px 0;font-family:var(--ad-sans);font-size:.8em}
/* inverse */
.d-inverse{background:#161c24;color:#eef1f4;padding:18px 18px 16px}
.d-inverse h4{font-size:1.24em;letter-spacing:.07em;text-transform:uppercase;margin:0}
.d-inverse .su{font-size:.72em;letter-spacing:.19em;text-transform:uppercase;color:#b9c2cc;border-bottom:1px solid #6d7782;padding-bottom:9px;margin:5px 0 14px}
.d-inverse .tg{color:#b9c2cc}
.d-inverse .af{font-weight:700}
/* classified */
.d-classified{border-top:2.5px solid #111;border-bottom:1px solid #8a8a8a;padding:9px 2px 10px}
.d-classified .ah{display:flex;justify-content:space-between;gap:10px;font-size:.76em;font-weight:700;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:7px;margin-bottom:12px}
.d-classified .ah span{font-weight:400}
.d-classified p:not(.af){text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.d-classified .lead{font-family:var(--ad-sans)}
.d-classified .af{font-size:.78em}
/* mono */
.d-mono{border:1px solid #333;padding:14px 16px}
.d-mono .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #333;padding-bottom:7px;margin-bottom:11px}
.d-mono .mh b{font-size:1.06em}
.d-mono .mh svg{width:22px;height:22px;flex:none}
.d-mono .ft,.d-mono p.mt{font-variant-numeric:tabular-nums}
.d-mono p.mt{font-size:.94em;line-height:1.6;color:#2a2a2a;letter-spacing:.01em}
.d-mono .af{font-weight:700}
/* tearoff */
.d-tearoff{border:1px solid #333}
.d-tearoff .in{padding:16px 16px 12px}
.d-tearoff .hd{font-weight:700;font-size:.82em;letter-spacing:.06em;margin-bottom:4px}
.d-tearoff h4{font-weight:900;letter-spacing:-.02em;font-size:1.42em;line-height:1.08;text-transform:uppercase;margin-bottom:.5em}
.d-tearoff .af{font-weight:700}
.d-tearoff .tear{display:flex;border-top:1.5px dashed #444}
.d-tearoff .tear i{flex:1;display:flex;align-items:center;justify-content:center;min-height:92px;border-left:1.5px dashed #444;font-style:normal}
.d-tearoff .tear i:first-child{border-left:0}
.d-tearoff .tear span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.66em;font-weight:700;white-space:nowrap;letter-spacing:.02em}
/* chalk */
.d-chalk{background:#6f5d48;padding:9px;border-radius:4px}
.d-chalk .bd{background:#2c3833;color:#f3f3ee;padding:18px 16px 14px;text-align:center;font-weight:300;line-height:1.55;border-radius:2px;box-shadow:inset 0 0 34px rgba(0,0,0,.4)}
.d-chalk .hd{font-size:.86em;opacity:.85;margin-bottom:2px}
.d-chalk h4{font-size:1.5em;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
.d-chalk .su{text-decoration:underline wavy rgba(243,243,238,.75);text-underline-offset:7px;margin:2px 0 16px}
.d-chalk p{line-height:1.55}
.d-chalk .af{opacity:.9}
/* corp */
.d-corp{border:1px solid #333;padding:12px 16px}
.d-corp .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid #333;padding-bottom:7px;margin-bottom:11px}
.d-corp .wm{font-size:1.08em;font-weight:400;letter-spacing:-.01em}
.d-corp .wm b{font-weight:800}
.d-corp .wm small{font-size:.66em}
.d-corp .af{font-weight:700;border-top:1px solid #9a9a9a;padding-top:7px}
/* hotel */
.d-hotel{border:3px double #333;padding:5px}
.d-hotel .fr{border:1px solid #333;padding:14px 16px 12px;text-align:center;font-family:var(--ad-serif)}
.d-hotel .st{letter-spacing:.32em;font-size:.82em;margin-bottom:2px}
.d-hotel .hic{display:block;width:30px;height:30px;margin:0 auto 6px}
.d-hotel h4{font-weight:300;letter-spacing:.16em;text-transform:uppercase;font-size:1.12em;margin:0}
.d-hotel .ti{margin:4px 0 10px}
.d-hotel .fr>p:not(.st):not(.ti):not(.af){margin-top:10px}
.d-hotel .af{font-family:var(--ad-sans);font-size:.78em;letter-spacing:.06em}
/* band */
.d-band{border:1px solid #333}
.d-band .bn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#dcdcdc;border-bottom:1px solid #333;padding:9px 14px}
.d-band .bn b{font-size:1.42em;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.d-band .bn span{font-size:.76em;font-weight:700;text-align:right;line-height:1.25;max-width:46%}
.d-band .in{padding:12px 14px}
/* stamp */
.d-stamp{border:1px solid #333;padding:16px 16px 12px}
.d-stamp .sb{float:right;margin:-4px -4px 8px 12px;width:68px;height:68px;border-radius:50%;background:#1d2a44;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.66em;line-height:1.15;letter-spacing:.03em;text-transform:uppercase;transform:rotate(-12deg);padding:4px}
.d-stamp h4{font-size:1.32em}
.d-stamp .su{font-weight:700}
.d-stamp .bf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;border-top:2px solid #111;margin-top:12px;padding-top:8px}
.d-stamp .bf b{text-transform:uppercase;font-weight:800;font-size:.9em}
.d-stamp .bf span{font-size:.8em;text-align:right}
/* logo */
.d-logo{border:1px solid #333;padding:14px 16px 12px}
.d-logo .lg{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.d-logo .cir{width:44px;height:44px;border:1.5px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:1.35em;flex:none}
.d-logo .cir svg{width:24px;height:24px}
.d-logo .nm b{display:block;font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:1.08em;line-height:1.25}
.d-logo .nm small{display:block;font-size:.66em;letter-spacing:.22em;text-transform:uppercase;color:#555}
.d-logo .af{text-align:right}
/* browser */
.d-browser{border:1px solid #333;border-radius:6px;overflow:hidden}
.d-browser .bb{display:flex;align-items:center;gap:5px;background:#eceff2;border-bottom:1px solid #c5cbd2;padding:6px 10px}
.d-browser .bb i{width:9px;height:9px;border-radius:50%;border:1.3px solid #555;flex:none}
.d-browser .url{flex:1;min-width:0;margin-left:8px;background:#fff;border:1px solid #c5cbd2;border-radius:10px;font-size:.72em;padding:1px 10px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-browser .in{padding:12px 14px}
.d-browser .hd{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:#555;margin-bottom:2px}
.d-browser .cta{text-align:right;margin-top:10px}
.d-browser .cta span{display:inline-block;background:#1b2430;color:#fff;font-weight:700;font-size:.82em;padding:5px 14px;border-radius:4px}
/* stripes */
.d-stripes{border:1px solid #222}
.d-stripes .sx{height:13px;background:repeating-linear-gradient(-45deg,#1d1d1d 0 8px,#fff 8px 16px)}
.d-stripes .in{padding:12px 14px 10px}
.d-stripes .hd{font-weight:700;font-size:.82em;margin-bottom:2px}
.d-stripes h4{font-size:1.24em;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
/* ticket */
.d-ticket{display:grid;grid-template-columns:40px minmax(0,1fr);border:1px solid #333}
.d-ticket::before,.d-ticket::after{content:"";position:absolute;left:31px;width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid #333}
.d-ticket::before{top:-9px}.d-ticket::after{bottom:-9px}
.d-ticket .stub{background:#ececec;border-right:2px dashed #777;display:flex;align-items:center;justify-content:center}
.d-ticket .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.64em;letter-spacing:.22em;font-weight:700;white-space:nowrap}
.d-ticket .in{padding:14px 14px 12px}
.d-ticket h4{font-size:1.38em;letter-spacing:.2em;font-weight:800;margin:0}
.d-ticket .su{font-size:.66em;letter-spacing:.32em;text-transform:uppercase;color:#555;margin:0 0 12px}
.d-ticket .af{font-weight:700}
/* postcard */
.d-postcard{border:1px solid #333;padding:14px}
.d-postcard .pc{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:12px}
.d-postcard h4{font-weight:300;font-size:1.6em;line-height:1.15;letter-spacing:-.02em;margin-bottom:12px}
.d-postcard .side{border-left:1px solid #555;padding-left:12px;display:flex;flex-direction:column;gap:12px}
.d-postcard .stp{border:1.5px dashed #444;text-align:center;padding:8px 4px;font-weight:800;line-height:1.1}
.d-postcard .stp small{display:block;font-size:.6em;letter-spacing:.06em;text-transform:uppercase}
.d-postcard .stp b{display:block;font-size:1.12em;margin:2px 0}
.d-postcard .side i{display:block;border-bottom:1px solid #777;height:16px}
.d-postcard .af{font-weight:700}
/* badge */
.d-badge{border:1px solid #333}
.d-badge .bt{display:flex;justify-content:space-between;align-items:stretch;border-bottom:1px solid #333}
.d-badge .bt>div:first-child{padding:10px 14px;min-width:0}
.d-badge .hd{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:#444;margin-bottom:2px}
.d-badge .bt h4{font-size:1.12em;margin:0}
.d-badge .pbx{background:#151515;color:#fff;text-align:center;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-width:78px;line-height:1.1}
.d-badge .pbx b{font-size:1.22em;margin:2px 0}
.d-badge .pbx small{font-size:.62em}
.d-badge .in{padding:12px 14px}
.d-badge ul.sq{list-style:none;padding:0;margin:12px 0 0}
.d-badge ul.sq li{position:relative;padding-left:16px;font-size:.92em}
.d-badge ul.sq li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;background:#222}
/* timetable */
.d-timetable{border:1px solid #333}
.d-timetable .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1c1c1c;color:#fff;padding:9px 14px}
.d-timetable .bar span{font-size:.74em;letter-spacing:.12em;white-space:nowrap}
.d-timetable .in{padding:12px 14px}
.d-timetable .tt{border-top:1.5px dashed #555;margin-top:12px;padding-top:8px;font-size:.84em;line-height:1.7;color:#2a2a2a;font-variant-numeric:tabular-nums}
.d-timetable .pr{text-align:right;font-weight:800;margin:12px 0 0}
/* bignum */
.d-bignum{border:1px solid #333;padding:14px 16px}
.d-bignum h4{font-weight:300;font-size:1.32em;letter-spacing:-.01em;text-align:right;margin-bottom:12px}
.d-bignum .bn2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.d-bignum .num{text-align:center;padding-right:14px;border-right:1.5px solid #222}
.d-bignum .num b{display:block;font-size:3.2em;line-height:1;font-weight:800;letter-spacing:-.04em}
.d-bignum .num small{display:block;letter-spacing:.2em;font-size:.7em;font-weight:700;margin-top:4px}
.d-bignum .af{font-weight:700}
/* route */
.d-route{border:1px solid #333;padding:14px 16px}
.d-route .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.d-route .ah b{font-size:1.08em}
.d-route .rt{display:flex;justify-content:space-between;position:relative;margin:14px 0 16px}
.d-route .rt::before{content:"";position:absolute;left:6px;right:6px;top:6px;border-top:1.5px solid #222}
.d-route .rt span{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72em;text-align:center;min-width:0}
.d-route .rt span:first-child{align-items:flex-start;text-align:left}
.d-route .rt span:last-child{align-items:flex-end;text-align:right}
.d-route .rt i{width:13px;height:13px;border-radius:50%;border:1.5px solid #222;background:#fff}
.d-route .af{font-weight:700}
/* pinned */
.d-pinned{padding:12px 6px 6px;background:transparent}
.d-pinned .pn{position:relative;background:#fbfaf6;border:1px solid #cfcac0;box-shadow:2px 5px 12px rgba(0,0,0,.18);padding:22px 16px 14px;transform:rotate(-1.2deg)}
.d-pinned .pin{position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#22324d;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.d-pinned h4{text-align:center;font-size:1.06em;margin-bottom:.3em}
.d-pinned .ti{text-align:center;margin-bottom:.8em}
.d-pinned .af{text-align:center}
/* rounded */
.d-rounded{border:3px solid #1d1d1d;border-radius:16px;padding:16px;text-align:center}
.d-rounded .ric{display:block;width:30px;height:30px;margin:0 auto 6px}
.d-rounded h4{font-size:1.3em;letter-spacing:.22em;text-transform:uppercase;font-weight:800;margin:0}
.d-rounded .su{font-size:.7em;letter-spacing:.22em;text-transform:uppercase;margin:3px 0 13px}
.d-rounded .af{font-weight:700}
/* dropcap */
.d-dropcap{border-top:2px solid #111;border-bottom:1px solid #111;padding:9px 2px 10px}
.d-dropcap .ah{display:flex;justify-content:space-between;gap:10px;font-family:var(--ad-sans);font-size:.72em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding-bottom:8px;margin-bottom:12px}
.d-dropcap .ah span{font-weight:400}
.d-dropcap .dc{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.d-dropcap .dc::first-letter{float:left;font-size:3.3em;line-height:.85;font-weight:700;margin:5px 8px 0 0}
.d-dropcap .af{font-family:var(--ad-sans);font-size:.78em;clear:both}
/* coupon */
.d-coupon{border:1.5px dashed #444;padding:16px}
.d-coupon .sc{position:absolute;top:-12px;right:14px;width:22px;height:22px;background:#fff;padding:1px}
.d-coupon .su{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 12px}
.d-coupon .cf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84em;margin-top:12px}
/* greyband */
.d-greyband{border:1px solid #333}
.d-greyband .gb{background:#e1e1e1;border-bottom:1px solid #333;padding:8px 14px;font-size:1.1em}
.d-greyband .in{padding:12px 14px}
.d-greyband .af{font-weight:700}
/* club */
.d-club{border:1.5px solid #2c5e3f}
.d-club .cb{background:#2c5e3f;color:#fff;padding:12px 16px;font-weight:800;letter-spacing:-.01em;font-size:1.2em;border-bottom:5px solid #fff;box-shadow:0 5px 0 #2c5e3f}
.d-club .in{padding:16px 16px 12px}
.d-club h4{color:#1f4a31}
/* speech */
.d-speech{border:1px solid #333;padding:14px 16px}
.d-speech .hd{font-weight:700;font-size:.84em;letter-spacing:.04em;margin-bottom:9px}
.d-speech .bub{position:relative;display:inline-block;background:#e6eef8;border:1.5px solid #2b4f7d;border-radius:16px;padding:8px 14px;font-weight:800;font-size:1.06em;margin-bottom:18px}
.d-speech .bub::after{content:"";position:absolute;left:22px;bottom:-8px;width:13px;height:13px;background:#e6eef8;border-right:1.5px solid #2b4f7d;border-bottom:1.5px solid #2b4f7d;transform:rotate(45deg)}
/* notebook */
.d-notebook{border:1px solid #9fb4c6;padding:12px 14px 12px 38px;line-height:1.65em;background:#fff repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.65em - 1px),#d3e2ef calc(1.65em - 1px),#d3e2ef 1.65em);background-position:0 12px}
.d-notebook::before{content:"";position:absolute;left:26px;top:0;bottom:0;border-left:1.5px solid #9fb4c6}
.d-notebook h4{font-weight:700;font-size:1.2em;line-height:1.375em;margin:0}
.d-notebook p{margin:0 0 1.65em}
.d-notebook .ti{margin:0}
.d-notebook .af{font-size:1em;margin:0;font-weight:700}
/* sign */
.d-sign{border:1px solid #333}
.d-sign .sg{background:#1f2d4a;color:#fff;margin:8px;border-radius:8px;outline:2px solid #fff;outline-offset:-6px;padding:14px 16px;text-align:center}
.d-sign .sic{display:block;width:26px;height:26px;margin:0 auto 4px}
.d-sign h4{font-size:1.16em;letter-spacing:.08em;text-transform:uppercase;margin:0}
.d-sign .su{font-size:.68em;letter-spacing:.2em;text-transform:uppercase;opacity:.88;margin:3px 0 0}
.d-sign .in{padding:6px 16px 14px}
.d-sign .af{font-weight:700}
.cmh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:.06em;font-size:.86em;color:var(--ink-2);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.cmh span{letter-spacing:0;font-weight:400;color:var(--muted)}
.cm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.cm .n{font-weight:700;color:var(--ink-2);font-size:.95em;padding-top:1px}
.cm .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cm p{margin:0}
.cm .by{text-align:right;color:var(--muted);font-size:.9em;margin-top:4px}
.doc h3{text-align:center;font-size:1em;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.doc .dh{font-weight:700}

/* items */
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.q:last-child{border-bottom:0}
.q .qn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;background:#fff;color:var(--ink-2)}
.q.ans .qn{background:var(--acc);border-color:var(--acc);color:#fff}
.q.ex{background:#f7f8f9;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px;border-bottom:0;margin-bottom:6px}
.q.ex .qn{font-size:.72em;border-style:dashed}
.q .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.q .qt{margin:3px 0 8px}
.q.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:#fff6c7}100%{background:transparent}}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--line-2);border-radius:6px;cursor:pointer;background:#fff;line-height:1.45}
.opts.row .opt{min-width:112px}
.opt:hover{background:#f1f5fa;border-color:var(--line)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .rb{width:18px;height:18px;border:2px solid #7c8693;border-radius:50%;flex:none;margin-top:2px;position:relative;background:#fff}
.opt .lt{font-weight:700;color:var(--ink-2);min-width:12px}
.opt.on{background:var(--acc-w);border-color:var(--acc-line)}

<script id="exam-data" type="application/json">{"build":"202610251936","tests":{"1":{"id":1,"roman":"I","lesen":{"t1":{"instruction":"Lesen Sie zuerst die zehn Überschriften. Lesen Sie dann die fünf Texte und entscheiden Sie, welche Überschrift (a–j) am besten zu welchem Text (1–5) passt. Tragen Sie Ihre Lösungen in den Antwortbogen bei den Aufgaben 1–5 ein.","headlines":[{"letter":"a","text":"Ältere Mieter sollen große Wohnungen räumen"},{"letter":"b","text":"Ein freier Tag mehr lockt Bewerber in die Werkstatt"},{"letter":"c","text":"Früher Arbeitsbeginn als Schutz vor der Hitze"},{"letter":"d","text":"Gemeinsam arbeiten, wo früher Züge hielten"},{"letter":"e","text":"Gesetz verbietet Bauarbeiten bei großer Hitze"},{"letter":"f","text":"Handwerkskammer empfiehlt Vier-Tage-Woche für alle Betriebe"},{"letter":"g","text":"Kleiner wohnen – zum Vorteil von Jung und Alt"},{"letter":"h","text":"Lieferdienst ersetzt den letzten Supermarkt im Dorf"},{"letter":"i","text":"Stillgelegte Bahnstrecke soll bald wieder Pendler befördern"},{"letter":"j","text":"Wenn Kunden zu Mitbesitzern werden"}],"texts":[{"no":"1","paragraphs":["Hannelore Brandt hat 41 Jahre lang in der Vierzimmerwohnung im dritten Stock gewohnt. Hier hat sie zwei Söhne großgezogen, hier ist ihr Mann gestorben. Doch irgendwann wurden ihr die Treppen zu steil und die Räume zu groß. „Ich habe drei Zimmer geheizt, die niemand mehr betreten hat“, sagt die 78-Jährige. An einen Umzug war trotzdem lange nicht zu denken: Eine kleinere Wohnung im selben Viertel hätte mehr gekostet als die alte, denn Frau Brandt zahlte noch eine Miete aus den Achtzigerjahren. Genau hier setzt ein Programm der städtischen Wohnungsbaugesellschaft an. Wer aus einer großen in eine kleinere Wohnung des Unternehmens wechselt, zahlt dort pro Quadratmeter nicht mehr als bisher. Außerdem übernimmt die Gesellschaft die Umzugskosten und schickt einen Handwerker, der Lampen und Regale anbringt. Frau Brandt lebt heute zwei Straßen weiter im Erdgeschoss. Ihre neue Wohnung hat zwei Zimmer und einen kleinen Garten. „Ich kenne hier jede Nachbarin, das war mir wichtig“, sagt sie. In ihre alte Wohnung ist eine Familie mit drei Kindern eingezogen, die sich bis dahin zwei Zimmer geteilt hatte. Seit dem Start vor zwei Jahren haben 140 Haushalte mitgemacht. Das klingt nach wenig, doch für die Stadt zählt jede große Wohnung, die frei wird: Neue Familienwohnungen zu bauen dauert Jahre und kostet ein Vielfaches. Kritik kommt vom Mieterverein. Er befürchtet, ältere Menschen könnten sich gedrängt fühlen, ihre vertraute Umgebung aufzugeben. Die Wohnungsbaugesellschaft widerspricht: Die Teilnahme sei freiwillig, niemand werde gezielt angeschrieben."]},{"no":"2","paragraphs":["Um fünf Uhr morgens ist es auf der Baustelle am Stadtrand von Freiburg noch dämmrig, doch die ersten Bagger laufen bereits. Seit Juni beginnt der Arbeitstag für die Straßenbauer zwei Stunden früher als sonst und endet um 13 Uhr – bevor sich der Asphalt in der Sonne auf über 50 Grad aufheizt. „Nachmittags war das kaum auszuhalten, abends kamen die Leute völlig erschöpft nach Hause“, sagt Polier Andreas Kühn. Die Firma hat außerdem Sonnensegel aufgestellt, verteilt kostenlos Wasser und Sonnencreme und hat die Pausen verlängert. Eine feste Temperaturgrenze, ab der im Freien nicht mehr gearbeitet werden darf, gibt es in Deutschland nicht. Arbeitgeber sind jedoch verpflichtet, ihre Beschäftigten vor gesundheitlichen Gefahren zu schützen – und dazu gehört auch große Hitze. Nicht alle sind von den neuen Zeiten begeistert: Einige Anwohner haben sich bei der Stadt über den Lärm am frühen Morgen beschwert."]},{"no":"3","paragraphs":["Als im Frühjahr 2023 der letzte Supermarkt in Wiesenbach schloss, lag die nächste Einkaufsmöglichkeit plötzlich elf Kilometer entfernt. Für viele der 900 Einwohnerinnen und Einwohner, vor allem für ältere Menschen ohne Auto, war das ein ernstes Problem, denn der Bus fährt nur dreimal am Tag. Der Gemeinderat suchte monatelang nach einer Lösung, doch keine Handelskette wollte sich auf den kleinen Ort einlassen. Statt auf einen neuen Investor zu warten, gründeten die Wiesenbacher eine Genossenschaft. Wer mitmachen wollte, erwarb einen Anteil für 250 Euro – am Ende kamen 310 Mitglieder und rund 80.000 Euro zusammen. Heute gibt es im „Laden am Brunnen“ Brot, Obst und Gemüse, Milchprodukte aus der Region und das Nötigste für den Haushalt. Zwei Verkäuferinnen sind fest angestellt, nachmittags helfen Ehrenamtliche an der Kasse. Über das Sortiment entscheiden die Mitglieder einmal im Jahr gemeinsam; so kamen zum Beispiel glutenfreie Nudeln und Katzenfutter ins Regal. „Billiger als der Discounter sind wir nicht“, räumt Vorstand Markus Heilmann ein. „Aber die Leute rechnen anders: Sie sparen sich die Fahrt und treffen hier ihre Nachbarn.“ Tatsächlich ist die kleine Sitzecke neben dem Kaffeeautomaten oft voller als der Laden selbst. Einmal im Monat findet dort sogar ein Kochabend für Alleinstehende statt. Im Sommer stehen vor dem Laden zwei Tische, an denen man ein Eis essen oder auf den Bus warten kann. Ein Onlinehändler hatte zuvor versucht, das Dorf mit einem Lieferdienst zu versorgen, das Angebot aber nach wenigen Monaten mangels Bestellungen wieder eingestellt. Nach dem ersten Geschäftsjahr schreibt der Laden eine schwarze Null. Mehr soll es auch gar nicht sein, betont Heilmann: „Bleibt am Jahresende etwas übrig, stecken wir es in längere Öffnungszeiten.“"]},{"no":"4","paragraphs":["Seit fast zwanzig Jahren hält in Hohenwalde kein Zug mehr. Wo früher Fahrkarten verkauft wurden, stehen heute zwölf Schreibtische, eine Kaffeemaschine und ein Drucker, den sich alle teilen. „Landbüro“ nennt der örtliche Verein sein Projekt im alten Bahnhofsgebäude, und die Nachfrage übertrifft alle Erwartungen: Von Montag bis Donnerstag ist fast jeder Platz belegt. Die meisten Nutzerinnen und Nutzer wohnen in den umliegenden Dörfern und arbeiten für Unternehmen in Berlin. Statt täglich zwei Stunden im Auto zu sitzen, fahren sie nur noch ein- oder zweimal pro Woche in die Hauptstadt. Ins Landbüro kommen die meisten mit dem Fahrrad. Für Eltern gibt es seit dem Frühjahr sogar eine kleine Spielecke, die vormittags von einer Tagesmutter betreut wird. „Zu Hause fällt mir die Decke auf den Kopf, und im Großraumbüro komme ich nicht zum Nachdenken“, sagt die Grafikerin Lena Marquardt. Möglich wurde das Projekt erst, als der Ort vor drei Jahren ans Glasfasernetz angeschlossen wurde; vorher war an Videokonferenzen kaum zu denken. Ein fester Platz kostet 120 Euro im Monat – ein Bruchteil dessen, was in Berlin verlangt wird. Anfangs beäugten manche Alteingesessene die „Laptop-Leute“ misstrauisch. Inzwischen trifft sich der Heimatverein abends in den Räumen, und im Sommer wird auf dem ehemaligen Bahnsteig gemeinsam gegrillt."]},{"no":"5","paragraphs":["Freitags ist die Werkstatt der Tischlerei Özdemir in Hameln leer. Seit gut einem Jahr arbeiten die 14 Beschäftigten nur noch von Montag bis Donnerstag, dafür neun statt sieben Stunden am Tag. Der Lohn ist gleich geblieben. „Viele Kollegen aus der Branche haben mich für verrückt erklärt“, erzählt Inhaber Kerem Özdemir. „Aber ich hatte zwei Jahre lang keine einzige Bewerbung auf meine Ausbildungsplätze bekommen. Irgendetwas musste sich ändern.“ Nachdem er das neue Modell in den sozialen Medien vorgestellt hatte, meldeten sich innerhalb eines Monats 23 junge Leute. Drei von ihnen hat er als Auszubildende eingestellt. Auch die Zahl der Krankheitstage ist seither gesunken. Ganz ohne Nachteile ist das Modell allerdings nicht. Wer freitags anruft, landet auf dem Anrufbeantworter, und dringende Reparaturen müssen manchmal bis Montag warten. Einige ältere Mitarbeiter taten sich anfangs schwer mit den langen Tagen; zwei von ihnen arbeiten deshalb weiterhin an fünf Tagen, dafür kürzer. Die Handwerkskammer verfolgt das Experiment mit Interesse, warnt aber vor zu viel Euphorie: In Betrieben, die an feste Termine auf Baustellen gebunden seien, lasse sich das Modell nicht ohne Weiteres übertragen. Özdemir selbst will nicht mehr zurück. Den freien Freitag nutzt er inzwischen, um die Fußballmannschaft seiner Tochter zu trainieren – „zum ersten Mal, seit ich die Firma übernommen habe“."]}],"items":[{"no":"1","answer":"g"},{"no":"2","answer":"c"},{"no":"3","answer":"j"},{"no":"4","answer":"d"},{"no":"5","answer":"b"}]},"t2":{"instruction":"Lesen Sie zuerst den Artikel und lösen Sie dann die Aufgaben 6–10 zu dem Text.","kind":"article","title":"Die unterschätzte Kraft flüchtiger Begegnungen","lead":"Ein kurzer Plausch beim Bäcker, ein Gruß im Treppenhaus – solche Kontakte gelten als belanglos. Die Forschung sieht das inzwischen anders.","paragraphs":["Jeden Morgen um halb acht kauft Katja Behrens zwei Brötchen in der Bäckerei an der Ecke. Den Namen der Verkäuferin kennt sie nicht, wohl aber deren Meinung zum Wetter, zum Stadtfest und zur Baustelle vor dem Rathaus. „Das dauert keine zwei Minuten“, sagt die 34-jährige Steuerberaterin, „aber wenn die Bäckerei Betriebsferien hat, fehlt mir etwas.“ Was sie beschreibt, nennen Soziologen „schwache Bindungen“: Beziehungen zu Menschen, denen wir regelmäßig begegnen, ohne sie wirklich zu kennen – die Nachbarin aus dem dritten Stock, der Busfahrer der Linie 12, die anderen Eltern vor dem Kindergarten.","Lange galten solche Kontakte als Nebensache. Wer soziale Beziehungen erforschte, interessierte sich für Familie, Partnerschaft und enge Freundschaften. Das änderte sich, als der US-Soziologe Mark Granovetter in den 1970er-Jahren untersuchte, wie Menschen zu ihrer Arbeitsstelle gekommen waren. Das überraschende Ergebnis: Den entscheidenden Hinweis hatten sie häufiger von entfernten Bekannten erhalten als von engen Freunden. Granovetters Erklärung leuchtet bis heute ein. Enge Freunde bewegen sich meist in denselben Kreisen wie wir und wissen deshalb ungefähr dasselbe. Flüchtige Bekannte dagegen öffnen uns Türen zu Welten, zu denen wir sonst keinen Zugang hätten.","Neuere Studien zeigen, dass schwache Bindungen nicht nur nützlich sind, sondern auch der Stimmung guttun. In einer Untersuchung notierten die Teilnehmenden mehrere Tage lang, mit wem sie gesprochen hatten und wie sie sich fühlten. An Tagen mit vielen kurzen Gesprächen – etwa mit Kolleginnen aus anderen Abteilungen oder mit dem Personal im Café – waren sie zufriedener und fühlten sich weniger einsam. Das galt für zurückhaltende Menschen ebenso wie für gesellige.","Hinzu kommt ein Denkfehler, den Psychologen immer wieder beobachten: Wir unterschätzen, wie gern andere mit uns ins Gespräch kommen. In Experimenten sollten Pendler im Zug eine fremde Person ansprechen. Die meisten rechneten mit einer peinlichen Situation. Hinterher bewerteten sie die Fahrt jedoch deutlich positiver als diejenigen, die still für sich geblieben waren – und auch die Angesprochenen hatten das Gespräch überwiegend genossen.","Gerade solche Begegnungen sind allerdings seltener geworden. Wer im Homeoffice arbeitet, grüßt morgens keinen Pförtner und trifft mittags niemanden an der Kaffeemaschine. Wer online bestellt und im Supermarkt an der Selbstbedienungskasse bezahlt, spricht unter Umständen den ganzen Tag mit keinem Menschen. Einige Fachleute sehen darin einen Grund, warum sich laut Umfragen auch viele junge Menschen einsam fühlen, obwohl sie ständig mit Freunden chatten. Einsamkeit, so ihr Argument, entsteht nicht nur dann, wenn enge Beziehungen fehlen, sondern auch, wenn der Alltag keine beiläufigen Kontakte mehr bietet.","Manche Städte ziehen daraus bereits Konsequenzen: Sie öffnen Bibliotheken auch am Sonntag, stellen Bänke dort auf, wo sich Wege kreuzen, oder unterstützen Cafés, in denen man ohne Verzehrzwang sitzen darf. Stadtplaner sprechen von „dritten Orten“ – Räumen zwischen Wohnung und Arbeitsplatz, an denen man anderen begegnet, ohne sich verabreden zu müssen.","Vor übertriebenen Erwartungen warnt allerdings die Psychologin Miriam Albers. „Ein Plausch an der Kasse ersetzt keine Freundin, die einen nachts aus dem Krankenhaus abholt“, sagt sie. Zudem seien Menschen verschieden: Wer unter sozialen Ängsten leide, dürfe sich durch gut gemeinte Ratschläge nicht zusätzlich unter Druck gesetzt fühlen. Aus dem kleinen Gespräch dürfe keine weitere Pflicht werden, die man – wie die täglichen Schritte oder das Glas Wasser – abhaken müsse. Ihr Vorschlag ist bescheidener: „Wer das nächste Mal an der Bushaltestelle wartet, kann das Handy ja einfach mal in der Tasche lassen.“"],"source":"","taskInstruction":"Lösen Sie die Aufgaben 6–10. Entscheiden Sie, welche Lösung (a, b oder c) richtig ist, und tragen Sie Ihre Lösung in den Antwortbogen bei den Aufgaben 6–10 ein.","items":[{"no":"6","stem":"Für Frau Behrens ist das Gespräch beim Bäcker","options":{"a":"ein Ritual, das sie vermisst, wenn es ausfällt.","b":"eine Chance, die Verkäuferin kennenzulernen.","c":"eine lästige Pflicht."},"answer":"a"},{"no":"7","stem":"Granovetters Untersuchung ergab, dass","options":{"a":"enge Freunde die besseren Jobtipps geben.","b":"Menschen mit vielen Freunden schneller Arbeit finden.","c":"Jobtipps eher von flüchtigen Bekannten kamen."},"answer":"c"},{"no":"8","stem":"Laut den Studien","options":{"a":"genießen Pendler ruhige Fahrten mehr.","b":"erwarten viele von Gesprächen mit Fremden zu wenig.","c":"leiden Schüchterne unter solchen Gesprächen."},"answer":"b"},{"no":"9","stem":"Einige Fachleute erklären die Einsamkeit junger Menschen mit","options":{"a":"fehlenden Zufallsbegegnungen.","b":"zu viel Zeit am Handy.","c":"dem Mangel an engen Freundschaften."},"answer":"a"},{"no":"10","stem":"Miriam Albers","options":{"a":"rät Ängstlichen, sich zu Gesprächen zu zwingen.","b":"sieht in flüchtigen Kontakten einen Ersatz für Freunde.","c":"warnt vor Smalltalk als Pflicht."},"answer":"c"}]},"t3":{"instruction":"Lesen Sie zuerst die zehn Situationen (11–20) und dann die zwölf Info-Texte (a–l). Welcher Info-Text passt zu welcher Situation? Sie können jeden Info-Text nur einmal verwenden. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 11–20. Manchmal gibt es keine Lösung. Markieren Sie dann x.","items":[{"no":"11","text":"Ein Bekannter sucht sofort einen Musikkurs für seinen Sohn (5).","answer":"x"},{"no":"12","text":"Ein Freund möchte auf dem Balkon Gemüse ziehen.","answer":"j"},{"no":"13","text":"Ein Kollege möchte kostenlos und gemeinsam mit anderen gärtnern.","answer":"h"},{"no":"14","text":"Eine Freundin will ihrer Tochter (8) nicht gleich eine Geige kaufen.","answer":"e"},{"no":"15","text":"Eine Nachbarsfamilie wünscht sich einen eigenen Garten.","answer":"b"},{"no":"16","text":"Ihr Neffe (16) sucht mit seiner Band einen Übungsraum.","answer":"g"},{"no":"17","text":"Ihr Vater (66) will auf seinem E-Piano spielen lernen.","answer":"c"},{"no":"18","text":"Ihre Kinder (6 und 9) sollen Instrumente ausprobieren.","answer":"k"},{"no":"19","text":"Ihre Nachbarin will ihre alten Obstbäume selbst schneiden lernen.","answer":"l"},{"no":"20","text":"Sie wüssten gern, warum Ihre Zimmerpflanzen gelbe Blätter bekommen.","answer":"f"}],"infos":[{"letter":"a","header":"Stimmwerk","tag":"","title":"SINGEN OHNE NOTEN","subtitle":"","facts":[],"body":["Sie singen gern unter der Dusche, trauen sich aber nicht in einen Chor, weil Sie keine Noten lesen können? Bei uns ist das kein Problem: Unsere Chorleiterin bringt Ihnen alle Lieder nach Gehör bei, Notenkenntnisse sind ausdrücklich keine Voraussetzung. Mitsingen kann jeder ab 18 Jahren. Geprobt wird jeden Mittwoch von 19.30 bis 21.30 Uhr im Gemeindesaal St. Markus. Der Beitrag beträgt 15 Euro im Monat; die erste Probe ist kostenlos und unverbindlich."],"footer":"Kontakt: stimmwerk-chor@web.de"},{"letter":"b","header":"","tag":"KLEINGARTENVEREIN","title":"Sonnenhang e. V.","subtitle":"","facts":[],"body":["Sie träumen von einem eigenen Stück Grün mitten in der Stadt? In unserer Anlage am Stadtpark werden regelmäßig Parzellen zwischen 250 und 400 Quadratmetern frei, die meisten davon mit Gartenlaube. Die Pacht beträgt rund 180 Euro im Jahr; für Laube und Bepflanzung zahlen Sie dem Vorgänger außerdem eine einmalige Ablöse. Bitte beachten Sie: Laut Satzung muss mindestens ein Drittel der Fläche für Obst und Gemüse genutzt werden, und jedes Mitglied leistet zehn Gemeinschaftsstunden im Jahr. Familien mit Kindern werden bei der Vergabe bevorzugt, die Wartezeit liegt derzeit bei etwa einem Jahr."],"footer":"Sprechstunde: jeden ersten Samstag im Monat, 10–12 Uhr, Vereinsheim"},{"letter":"c","header":"","tag":"","title":"Es ist nie zu spät für Chopin","subtitle":"","facts":[],"body":["Sie wollten schon als Kind Klavier spielen und haben jetzt endlich Zeit dafür? Als Diplom-Pianistin unterrichte ich seit 20 Jahren ausschließlich Erwachsene – vom Berufseinsteiger bis zur Rentnerin mit 80. Ohne Leistungsdruck, dafür mit viel Geduld lernen Sie Stücke, die Ihnen wirklich gefallen, ob Klassik, Jazz oder Filmmusik. Der Unterricht findet bei Ihnen zu Hause statt; ein Klavier oder E-Piano sollte also vorhanden sein. Termine sind auch vormittags möglich, die erste Stunde ist kostenlos."],"footer":"Martina Kessler · Tel. 0511 / 34 92 17"},{"letter":"d","header":"","tag":"Saatgutbibliothek","title":"Samen leihen in der Stadtbibliothek","subtitle":"","facts":[],"body":["Seit diesem Frühjahr können Sie bei uns nicht nur Bücher, sondern auch Saatgut ausleihen – kostenlos und ohne Bibliotheksausweis. In unserer Saatgutbibliothek finden Sie über 80 alte Gemüse- und Blumensorten, die im Handel kaum noch erhältlich sind. Das Prinzip ist einfach: Sie nehmen Samen mit, ziehen daraus Ihre Pflanzen und bringen nach der Ernte einen Teil der neuen Samen zurück. So bleiben seltene Sorten erhalten."],"footer":"Stadtbibliothek, Erdgeschoss · zu den üblichen Öffnungszeiten"},{"letter":"e","header":"","tag":"","title":"ERST MIETEN, DANN KAUFEN","subtitle":"","facts":[],"body":["Ein gutes Instrument ist teuer – und ob Ihr Kind nach einem halben Jahr noch Freude daran hat, weiß niemand. Deshalb vermieten wir Geigen, Celli, Querflöten und Klarinetten, Kindergeigen sogar in allen Größen. Die Miete beginnt bei 15 Euro im Monat, die Mindestmietdauer beträgt drei Monate. Entscheiden Sie sich später für den Kauf, rechnen wir bis zu zwölf Monatsmieten auf den Kaufpreis an. Wächst Ihr Kind aus seiner Geige heraus, tauschen wir sie kostenlos gegen die nächste Größe. Alle Instrumente werden vor der Übergabe in unserer Werkstatt sorgfältig geprüft."],"footer":"MUSIKHAUS BRANDES · GEORGSTRASSE 21"},{"letter":"f","header":"","tag":"BOTANISCHER GARTEN","title":"Sprechstunde für kranke Pflanzen","subtitle":"","facts":[],"body":["Die Rosen haben schwarze Flecken, die Tomaten welken, und am Gummibaum im Wohnzimmer fallen die Blätter ab? Im Botanischen Garten beraten Sie unsere Gärtnermeisterinnen und -meister jeden Dienstag von 14 bis 17 Uhr kostenlos. Bringen Sie am besten einige betroffene Blätter in einer Plastiktüte oder aussagekräftige Fotos mit. Gemeinsam finden wir heraus, ob Schädlinge, eine Krankheit oder einfach ein ungünstiger Standort dahinterstecken, und empfehlen Ihnen möglichst umweltfreundliche Gegenmittel. Eine Anmeldung ist nicht erforderlich, Hausbesuche sind allerdings nicht möglich."],"footer":"Eingang Nord, Grünes Haus"},{"letter":"g","header":"","tag":"","title":"LAUT SEIN ERWÜNSCHT!","subtitle":"","facts":[],"body":["Ihr habt eine Band, aber die Nachbarn beschweren sich schon nach fünf Minuten? Im Keller des Jugendzentrums „Alte Post“ gibt es zwei schallgedämmte Proberäume mit Schlagzeug, Verstärkern und Mikrofonen. Nutzen dürfen sie Bands, deren Mitglieder zwischen 14 und 21 Jahre alt sind. Jede Band bekommt zwei feste Termine pro Woche, die Nutzung ist kostenlos. Einmal im Monat gibt euch außerdem ein erfahrener Musiker Tipps für das Zusammenspiel und den ersten Auftritt. Wer mitmachen will, kommt einfach mit der ganzen Band zu unserer Sprechstunde."],"footer":"→ Jugendzentrum Alte Post · Sprechstunde Mo–Fr 15–20 Uhr"},{"letter":"h","header":"","tag":"","title":"Grüne Lücke","subtitle":"Gemeinschaftsgarten am Güterbahnhof","facts":[],"body":["Wo früher Autos parkten, wachsen heute Kartoffeln, Bohnen und Sonnenblumen. Rund 40 Menschen aus dem Viertel bewirtschaften unseren Garten gemeinsam – eigene Beete gibt es bei uns nicht, die Ernte wird geteilt. Werkzeug, Saatgut und Gießkannen sind vorhanden, Vorkenntnisse brauchen Sie keine. Mitmachen kostet nichts, über eine kleine Spende freuen wir uns trotzdem. Neue Gesichter sind jederzeit willkommen: Gerade Zugezogene finden bei uns schnell Anschluss. Wir treffen uns jeden Samstag von 10 bis 13 Uhr, danach wird oft zusammen gekocht."],"footer":"www.gruene-luecke.de"},{"letter":"i","header":"","tag":"","title":"Musikgarten","subtitle":"für die Kleinsten","facts":[],"body":["Singen, tanzen, trommeln: In unseren Eltern-Kind-Kursen entdecken Kinder von 18 Monaten bis drei Jahren gemeinsam mit Mama, Papa oder den Großeltern die Welt der Musik. Die Gruppen mit höchstens acht Kindern treffen sich einmal pro Woche für 45 Minuten, wahlweise vormittags oder am frühen Nachmittag. Rasseln, Glockenspiele und kleine Trommeln zum Ausprobieren bringen wir mit. Unsere Kurse zur musikalischen Früherziehung für Vier- bis Sechsjährige sind leider bis zum Ende des Schuljahres ausgebucht, die Warteliste ist geschlossen."],"footer":"Musikschule am Lindenplatz · Tel. 0511 / 12 30 45"},{"letter":"j","header":"","tag":"17. APRIL","title":"Gemüse auf kleinstem Raum","subtitle":"","facts":["Do, 18–21 Uhr"],"body":["Wer keinen Garten hat, muss auf frische Tomaten, Kräuter und Salat nicht verzichten. In unserem Abendworkshop erfahren Sie, welche Sorten sich für Töpfe und Kästen eignen, was auf einem schattigen Nordbalkon noch gedeiht und wie Sie mit wenig Wasser auskommen. Außerdem bauen Sie ein kleines Hochbeet aus Holz, das Sie anschließend mit nach Hause nehmen. Der Workshop richtet sich an Anfängerinnen und Anfänger, das Material ist im Preis inbegriffen."],"footer":"45 € · Gartencenter Grünwerk · Anmeldung: www.gruenwerk.de"},{"letter":"k","header":"PHILHARMONIE","tag":"","title":"Klassik zum Anfassen","subtitle":"","facts":[],"body":["Einmal im Monat lädt die Philharmonie Familien mit Kindern von fünf bis zehn Jahren sonntags um 11 Uhr zu einem einstündigen Mitmachkonzert ein. Eine Moderatorin erklärt kindgerecht, was die Musikerinnen und Musiker gerade spielen, und das Publikum darf mitsingen und mitklatschen. Nach dem Konzert beginnt im Foyer das beliebte Instrumentenkarussell: Unter Anleitung von Orchestermitgliedern dürfen die Kinder Geige, Trompete, Harfe und Pauke selbst in die Hand nehmen und ihnen erste Töne entlocken. Karten kosten 8 Euro für Kinder und 14 Euro für Erwachsene."],"footer":"Vorverkauf an der Konzertkasse und unter www.philharmonie-nord.de"},{"letter":"l","header":"","tag":"NATURSCHUTZGRUPPE MÜHLBACH E. V.","title":"Der richtige Schnitt","subtitle":"","facts":[],"body":["Alte Apfel- und Birnbäume tragen oft nur noch wenige Früchte, weil ihre Kronen zu dicht geworden sind. Die Naturschutzgruppe Mühlbach zeigt Ihnen an zwei Samstagen im Februar direkt auf der Streuobstwiese, wie Sie Ihre Bäume zurückschneiden, ohne ihnen zu schaden. Nach einer kurzen Einführung greifen Sie selbst zu Schere und Säge – selbstverständlich unter fachkundiger Anleitung. Das Werkzeug wird gestellt; bitte denken Sie an feste Schuhe, Handschuhe und warme Kleidung. Die Teilnahme kostet 25 Euro, für Mitglieder ist der Kurs kostenlos."],"footer":"Anmeldung: kurse@ng-muehlbach.de"}]},"sb1":{"instruction":"Lesen Sie den folgenden Text und entscheiden Sie, welches Wort (a, b oder c) in die jeweilige Lücke passt. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 21–30.","paragraphs":["Sehr geehrte Frau Dr. Lindner,","vielleicht erinnern Sie sich noch an mich: Von März bis August letzten Jahres war ich Praktikantin in Ihrer Abteilung und habe Herrn Albrecht unterstützt, {{21}} Team damals die große Kundenbefragung durchgeführt hat. Besonders gern erinnere ich mich an die Präsentation der Ergebnisse vor der Geschäftsleitung, bei der Sie mir wertvolle Tipps gegeben haben. Die Zeit bei Ihnen hat mich stark geprägt, {{22}} ich mich inzwischen um einen Masterstudienplatz in Marktforschung beworben habe.","Für diese Bewerbung benötige ich zwei Empfehlungsschreiben, und dabei habe ich sofort an Sie gedacht. {{23}} Sie dazu bereit, würde mir das sehr helfen. Die Universität legt nämlich großen Wert {{24}}, dass Bewerberinnen und Bewerber bereits Erfahrungen in der Praxis gesammelt haben. Mein Studium der Betriebswirtschaft habe ich im Februar mit der Note 1,7 abgeschlossen.","Leider ist die Bewerbungsfrist in diesem Jahr deutlich verkürzt {{25}}: Alle Unterlagen müssen bis zum 15. Mai vorliegen. {{26}} der knappen Zeit wende ich mich schon heute an Sie. {{27}} Ihnen die Arbeit zu erleichtern, habe ich {{28}} erlaubt, eine kurze Übersicht über meine damaligen Aufgaben beizufügen. Sie können das Schreiben sowohl per Post schicken {{29}} direkt im Bewerbungsportal der Universität hochladen.","{{30}} ich eine Antwort der Universität erhalte, melde ich mich selbstverständlich wieder bei Ihnen. Falls Sie noch Fragen haben, erreichen Sie mich jederzeit unter 0176 / 52 48 19.","Mit freundlichen Grüßen","Julia Kowalski"],"items":[{"no":"21","options":{"a":"dem","b":"denen","c":"dessen"},"answer":"c"},{"no":"22","options":{"a":"sodass","b":"weil","c":"wobei"},"answer":"a"},{"no":"23","options":{"a":"Hätten","b":"Wären","c":"Würden"},"answer":"b"},{"no":"24","options":{"a":"darauf","b":"davon","c":"dazu"},"answer":"a"},{"no":"25","options":{"a":"geworden","b":"werden","c":"worden"},"answer":"c"},{"no":"26","options":{"a":"Aufgrund","b":"Trotz","c":"Während"},"answer":"a"},{"no":"27","options":{"a":"Anstatt","b":"Ohne","c":"Um"},"answer":"c"},{"no":"28","options":{"a":"mich","b":"mir","c":"sich"},"answer":"b"},{"no":"29","options":{"a":"als auch","b":"noch","c":"oder"},"answer":"a"},{"no":"30","options":{"a":"Seitdem","b":"Sobald","c":"Solange"},"answer":"b"}]},"sb2":{"instruction":"Lesen Sie den folgenden Text und entscheiden Sie, welches Wort aus dem Kasten (a–o) in die Lücken 31–40 passt. Sie können jedes Wort im Kasten nur einmal verwenden. Nicht alle Wörter passen in den Text. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 31–40.","title":"Mehrweg statt Einweg: eine ernüchternde Bilanz","paragraphs":["Seit Januar 2023 sind Restaurants, Imbisse und Cafés, die Speisen und Getränke zum Mitnehmen verkaufen, {{31}} verpflichtet, neben Einwegverpackungen auch Mehrwegbehälter anzubieten. Ziel ist es, die Müllberge in den Innenstädten zu verringern. Allein bei Kaffeebechern zum Mitnehmen kommen in Deutschland jedes Jahr mehrere Milliarden Stück zusammen. Die Mehrwegvariante darf dabei nicht teurer sein als die Einwegverpackung. Ausgenommen {{32}} sind lediglich kleine Betriebe mit höchstens fünf Beschäftigten und maximal 80 Quadratmetern Verkaufsfläche. Sie müssen allerdings Gefäße befüllen, die Kundinnen und Kunden selbst mitbringen. Umweltverbände hatten sich von der neuen Regel viel {{33}}. Doch die Bilanz fällt bislang ernüchternd aus. {{34}} Schätzungen aus der Branche wird nur ein kleiner Teil der Speisen tatsächlich in Mehrweggefäßen über die Theke gereicht. Viele Gäste wissen gar nicht, dass sie {{35}} die Alternative einen Anspruch haben, und in manchen Lokalen wird sie nicht einmal aktiv angeboten. Hinzu kommt, dass zahlreiche Pfandsysteme nebeneinander bestehen, die nicht miteinander {{36}} sind. Wer seine Schüssel mittags beim Imbiss ausleiht, kann sie abends nicht {{37}} in der Bäckerei am Bahnhof zurückgeben. Den zusätzlichen Weg nehmen viele Kundinnen und Kunden nicht in {{38}}.","Kontrollen finden zudem kaum statt. Verstöße bleiben meist folgenlos. Zuständig sind die Behörden der Länder, und die sind nach eigenen Angaben personell {{39}} ausgestattet. Umweltverbände fordern deshalb ein einheitliches Pfandsystem für ganz Deutschland und eine Abgabe auf Einwegverpackungen. Die Branche selbst setzt dagegen auf Freiwilligkeit und eine bessere Information der Gäste. Nur so, argumentieren sie, könne sich Mehrweg im Alltag {{40}}. Einige Städte gehen bereits eigene Wege: In Tübingen wird seit 2022 eine Steuer auf Einwegbecher, -teller und -besteck erhoben. Nach Angaben der Stadt landen seitdem deutlich weniger Verpackungen in den öffentlichen Mülleimern."],"words":{"a":"ANGEWIESEN","b":"AUF","c":"DARAUF","d":"DAVON","e":"DURCHSETZEN","f":"EINFACH","g":"GESETZLICH","h":"KAUF","i":"KNAPP","j":"KOMPATIBEL","k":"NACH","l":"RECHNUNG","m":"TROTZ","n":"UMSETZEN","o":"VERSPROCHEN"},"items":[{"no":"31","answer":"g"},{"no":"32","answer":"d"},{"no":"33","answer":"o"},{"no":"34","answer":"k"},{"no":"35","answer":"b"},{"no":"36","answer":"j"},{"no":"37","answer":"f"},{"no":"38","answer":"h"},{"no":"39","answer":"i"},{"no":"40","answer":"e"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun eine Nachrichtensendung. Dazu sollen Sie fünf Aufgaben lösen. Sie hören die Nachrichtensendung nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Die meisten Menschen über 65, die noch arbeiten, tun das vor allem aus finanziellen Gründen.","answer":"F"},{"no":"42","text":"In den neuen Kleinbussen zahlen Fahrgäste denselben Preis wie für eine normale Fahrt.","answer":"R"},{"no":"43","text":"Wegen der Unwetter in Norditalien ist neben dem Bahn- auch der Flugverkehr eingestellt worden.","answer":"F"},{"no":"44","text":"Die Autorinnen der Studie raten Eltern, Smartphones nachts nicht im Kinderzimmer zu lassen.","answer":"R"},{"no":"45","text":"Viele Störche verbringen den Winter inzwischen nicht mehr in Afrika.","answer":"R"}]},"t2":{"instruction":"Sie hören ein Rundfunk-Interview. Dazu sollen Sie zehn Aufgaben lösen. Sie hören dieses Interview nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu 60 Sekunden Zeit.","items":[{"no":"46","text":"Frau Sander hatte als Kind viel mit Tieren zu tun.","answer":"F"},{"no":"47","text":"Frau Sander konnte ihre Ausbildung schneller abschließen als üblich.","answer":"R"},{"no":"48","text":"Frau Sander empfindet ihren Arbeitsalltag meistens als Idylle.","answer":"F"},{"no":"49","text":"Frau Sander verdient am meisten mit der Pflege von Flächen.","answer":"R"},{"no":"50","text":"Die Border Collies schützen die Herde vor Wölfen.","answer":"F"},{"no":"51","text":"Für gerissene Schafe zahlt das Land nur unter bestimmten Bedingungen.","answer":"R"},{"no":"52","text":"Frau Sander verreist nur, wenn ihre Tiere im Stall stehen.","answer":"R"},{"no":"53","text":"Heute versorgt ein Kollege aus dem Nachbardorf die Herde.","answer":"F"},{"no":"54","text":"Frau Sander rät, den Beruf in der härtesten Zeit kennenzulernen.","answer":"R"},{"no":"55","text":"An ihrem früheren Arbeitsplatz vermisst Frau Sander heute nichts mehr.","answer":"F"}]},"t3":{"instruction":"Sie hören jetzt fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Ansagen nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 56–60. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"","items":[{"no":"56","text":"Während der zweiwöchigen Praxisferien bekommen Patientinnen und Patienten keine Rezepte für ihre Medikamente.","answer":"F"},{"no":"57","text":"Reisende nach Rheine, die ein Fahrrad dabeihaben, müssen auf eine andere Verbindung ausweichen.","answer":"R"},{"no":"58","text":"Den Jubiläumsrabatt von zwanzig Prozent gibt es auch auf Artikel, die bereits reduziert sind.","answer":"F"},{"no":"59","text":"Wenn Frau Petrović morgen nicht zu Hause ist, bekommt sie ohne Kosten einen neuen Termin.","answer":"F"},{"no":"60","text":"Mit der Eintrittskarte für die Museumsnacht kann man an diesem Abend auch Busse und Bahnen benutzen.","answer":"R"}]}},"schreiben":{"intro":"Wählen Sie zuerst zwischen Aufgabe A und Aufgabe B. Entscheiden Sie schnell, denn die zur Verfügung stehende Zeit ist begrenzt auf 30 Minuten!","tasks":[{"letter":"A","kind":"Bitte um Informationen","lead":"Sie lesen im Internet folgende Anzeige:","ad":{"header":"SicherDaheim","tag":"HAUSNOTRUF","title":"Allein leben – aber nie allein gelassen.","subtitle":"","facts":["Notrufknopf als Armband oder Kette, wasserdicht","Zentrale mit geschultem Personal, 24 Stunden am Tag","auf Wunsch Hinterlegung eines Wohnungsschlüssels","Installation durch unsere Techniker – ohne Bohren","Kostenübernahme durch die Pflegekasse möglich"],"body":["Mit unserem Hausnotruf sind Sie rund um die Uhr mit unserer Zentrale verbunden. Ein Knopfdruck genügt – und wir kümmern uns um alles Weitere."],"footer":"Jetzt vier Wochen unverbindlich testen! · info@sicherdaheim.de"},"situation":["Ihre Großmutter lebt allein und ist vor Kurzem in ihrer Wohnung gestürzt. Sie interessieren sich für den Hausnotruf und möchten mehr darüber erfahren. Schreiben Sie eine E-Mail an SicherDaheim."],"choice":["Behandeln Sie darin entweder","a) drei der folgenden Punkte oder","b) zwei der folgenden Punkte und einen weiteren Aspekt Ihrer Wahl."],"points":["Beschreiben Sie die Situation Ihrer Großmutter.","Erläutern Sie, welche Leistungen für Sie besonders wichtig sind.","Fragen Sie nach den Kosten und der Vertragslaufzeit.","Erkundigen Sie sich, wie die Testphase abläuft."],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss. Schreiben Sie mindestens 150 Wörter.","words":150,"model":{"label":"Beispiel für Variante a): drei der vier Leitpunkte (ca. 190 Wörter)","text":"Betreff: Anfrage zu Ihrem Hausnotruf für meine Großmutter\n\nSehr geehrte Damen und Herren,\n\nauf Ihrer Internetseite bin ich auf Ihr Angebot aufmerksam geworden und möchte mich im Namen meiner Großmutter nach einigen Einzelheiten erkundigen.\n\nMeine Großmutter ist 84 Jahre alt und lebt seit dem Tod meines Großvaters allein. Vor drei Wochen ist sie im Bad gestürzt und lag fast eine Stunde auf dem Boden, bis eine Nachbarin sie gefunden hat. Seitdem machen wir uns große Sorgen, zumal ich 200 Kilometer entfernt wohne.\n\nBesonders wichtig ist uns, dass der Notrufknopf wasserdicht ist, da meine Großmutter ihn auch beim Duschen tragen soll. Außerdem würden wir gern einen Wohnungsschlüssel hinterlegen, damit im Notfall niemand die Tür aufbrechen muss.\n\nKönnten Sie mir bitte mitteilen, wie hoch die monatlichen Kosten sind und welchen Anteil die Pflegekasse übernimmt? Mich würde auch interessieren, ob es eine Mindestlaufzeit gibt und mit welcher Frist man den Vertrag kündigen kann.\n\nFür eine baldige Antwort wäre ich Ihnen sehr dankbar. Gern können Sie mich auch telefonisch unter 0170 / 33 81 42 erreichen.\n\nMit freundlichen Grüßen\nDaniel Moreno"}},{"letter":"B","kind":"Beschwerde","lead":"Sie lesen folgende Werbeanzeige:","ad":{"header":"","tag":"RADABO","title":"Ihr E-Bike für 49 € im Monat","subtitle":"","facts":["Wartung und Reparaturen inklusive","Ersatzrad innerhalb von 48 Stunden, falls Ihr Rad ausfällt","Diebstahlversicherung inklusive","Service-Hotline sieben Tage die Woche","monatlich kündbar"],"body":["Kein Kaufpreis, keine Sorgen: Wir liefern Ihnen ein neues E-Bike direkt vor die Haustür – und Sie fahren einfach los."],"footer":"www.radabo.de · service@radabo.de"},"situation":["Sie haben vor drei Monaten ein E-Bike bei RadAbo gemietet. Leider waren Sie mit dem Service überhaupt nicht zufrieden. Schreiben Sie eine Beschwerde an RadAbo."],"choice":["Behandeln Sie darin entweder","a) drei der folgenden Punkte oder","b) zwei der folgenden Punkte und einen weiteren Aspekt Ihrer Wahl."],"points":["Erklären Sie, warum Sie sich für das Angebot entschieden haben.","Beschreiben Sie, welche Probleme aufgetreten sind.","Schildern Sie, wie der Kundenservice reagiert hat.","Stellen Sie klar, was Sie nun von RadAbo erwarten."],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss. Schreiben Sie mindestens 150 Wörter.","words":150,"model":{"label":"Beispiel für Variante b): zwei Leitpunkte und ein eigener Aspekt (ca. 190 Wörter)","text":"Betreff: Beschwerde über mein E-Bike-Abo (Kundennummer 48213)\n\nSehr geehrte Damen und Herren,\n\nseit drei Monaten miete ich bei Ihnen ein E-Bike. Leider bin ich mit Ihrem Service sehr unzufrieden und möchte mich hiermit beschweren.\n\nBereits nach sechs Wochen ließ sich der Akku nicht mehr laden. Ich habe den Defekt noch am selben Tag gemeldet. Obwohl Sie in Ihrer Werbung ein Ersatzrad innerhalb von 48 Stunden versprechen, wurde es erst nach neun Tagen geliefert. Zwei Wochen später sprang die Kette ab, und seitdem quietschen die Bremsen bei jeder Fahrt.\n\nFür mich hatte das erhebliche Folgen: Ich fahre täglich zwölf Kilometer zur Arbeit und musste in dieser Zeit auf Bus und Taxi ausweichen. Zweimal bin ich zu spät zu einem wichtigen Termin gekommen, und die Taxifahrten haben mich rund 80 Euro gekostet.\n\nIch erwarte daher, dass Sie mir diese Kosten erstatten und die Gebühr für den betreffenden Monat gutschreiben. Außerdem bitte ich Sie, die Bremsen umgehend überprüfen zu lassen. Sollte ich bis zum 30. Juni keine Antwort erhalten, werde ich den Vertrag kündigen und mich an die Verbraucherzentrale wenden.\n\nMit freundlichen Grüßen\nAylin Demir"}}]},"audio":[{"src":"telc%20B2%20Modelltest%201.1.mp3","dur":277.81},{"src":"telc%20B2%20Modelltest%201.2.mp3","dur":453.56},{"src":"telc%20B2%20Modelltest%201.3.mp3","dur":346.02}],"pdf":"telc%20B2%20Modelltest%201.pdf","pages":{"loesung":20,"muster":21,"kommentar":26,"hoertexte":24}},"2":{"id":2,"roman":"II","lesen":{"t1":{"instruction":"Lesen Sie zuerst die zehn Überschriften. Lesen Sie dann die fünf Texte und entscheiden Sie, welche Überschrift (a–j) am besten zu welchem Text (1–5) passt. Tragen Sie Ihre Lösungen in den Antwortbogen bei den Aufgaben 1–5 ein.","headlines":[{"letter":"a","text":"Bücherei verkauft Werke heimischer Künstler"},{"letter":"b","text":"Die Oberstufe darf eine Stunde länger schlafen"},{"letter":"c","text":"Eine Stunde Stille für reizempfindliche Kunden"},{"letter":"d","text":"Hersteller müssen Ersatzteile künftig länger liefern"},{"letter":"e","text":"Kunstwerke auf Zeit für die eigenen vier Wände"},{"letter":"f","text":"Rentner übernehmen die Ausbildung im Betrieb"},{"letter":"g","text":"Ruheständler helfen Lehrlingen durch schwere Zeiten"},{"letter":"h","text":"Ruhige Einkaufsstunde vertreibt die Stammkundschaft"},{"letter":"i","text":"Späterer Schulbeginn bringt nachweislich bessere Noten"},{"letter":"j","text":"Zuschuss bewahrt kaputte Geräte vor dem Müll"}],"texts":[{"no":"1","paragraphs":["Dienstags zwischen 18 und 19 Uhr ist es im Supermarkt von Christian Wendt in Bielefeld ungewöhnlich ruhig. Die Musik ist ausgeschaltet, das Licht über den Regalen gedimmt, und die Scanner an den Kassen piepen nur leise. Es gibt keine Durchsagen, und niemand füllt Regale auf. Die „stille Stunde“ soll vor allem Menschen helfen, für die ein gewöhnlicher Einkauf eine Qual ist: etwa Autistinnen und Autisten, aber auch Menschen, die unter Migräne oder Angstzuständen leiden. Den Anstoß gab eine Kundin, deren autistischer Sohn beim Betreten des Marktes regelmäßig in Panik geriet. Wendt probierte die Idee zunächst einen Monat lang aus – und behielt sie bei. Die Mitarbeiterinnen und Mitarbeiter waren anfangs skeptisch, inzwischen schätzen viele von ihnen die ruhigere Stunde selbst. „Für manche ist das die einzige Stunde in der Woche, in der sie ohne Begleitung einkaufen können“, sagt Wendt. Inzwischen nutzen auch ganz andere Kunden das Angebot: ältere Menschen, die in Ruhe die Preisschilder lesen wollen, oder Eltern, deren Babys bei Lärm unruhig werden. Die Befürchtung, der Umsatz könnte sinken, hat sich nicht bestätigt – im Gegenteil: Zwischen 18 und 19 Uhr kommen heute sogar etwas mehr Kunden als früher. Eine Vorschrift für solche Angebote gibt es nicht, und Wendt hält auch nichts davon. „Das muss jeder Markt für sich entscheiden“, sagt er. Mehrere Geschäfte in der Region, darunter zwei Drogeriemärkte, haben sich inzwischen angeschlossen. Ein Nachbarmarkt hat den Versuch allerdings nach wenigen Wochen wieder aufgegeben: Dort hatten die Kunden die Ruhe kaum bemerkt."]},{"no":"2","paragraphs":["Der Toaster ist kaputt, der Staubsauger saugt nicht mehr richtig – früher landeten solche Geräte in Neustadt meist im Müll. Seit einem Jahr übernimmt die Stadt die Hälfte der Reparaturkosten für Elektrogeräte, höchstens aber 100 Euro pro Haushalt und Jahr. Wer den Bonus nutzen will, lässt sein Gerät in einem der teilnehmenden Fachbetriebe reparieren und reicht die Rechnung anschließend online ein; das Geld kommt nach etwa zwei Wochen aufs Konto. Am häufigsten geht es um Kaffeevollautomaten, Waschmaschinen und Fernseher. Bei Elektro-Weber, einem kleinen Laden in der Altstadt, hat sich die Zahl der Aufträge seither fast verdoppelt; Inhaber Stefan Weber hat sogar einen zusätzlichen Mitarbeiter eingestellt. „Bei vielen Kunden lohnt sich die Reparatur erst durch den Zuschuss“, sagt er. Neue Geräte seien oft so billig, dass viele den Weg in die Werkstatt sonst gar nicht erst antreten würden. Allerdings kann Weber nicht jeden Wunsch erfüllen: Für manche Handys und Kopfhörer gibt es schlicht keine Ersatzteile, andere sind so verklebt, dass man sie nicht öffnen kann. Umweltverbände loben das Programm, fordern aber mehr: Die Hersteller müssten verpflichtet werden, Ersatzteile über viele Jahre bereitzuhalten. Die Stadt will den Bonus zunächst zwei weitere Jahre anbieten und danach Bilanz ziehen."]},{"no":"3","paragraphs":["Als Jonas Berger im zweiten Lehrjahr zum ersten Mal ernsthaft ans Aufhören dachte, lag es nicht an der Arbeit in der Kfz-Werkstatt. „Da lief es gut, aber in der Berufsschule habe ich in Mathe nichts mehr verstanden“, erzählt der 18-Jährige. Hinzu kam Ärger mit seinem Meister, weil er morgens oft zu spät kam. Dass Jonas heute kurz vor der Gesellenprüfung steht, verdankt er auch Horst Wiegand. Der 69-Jährige war vierzig Jahre lang Ingenieur in der Autoindustrie und begleitet seit seinem Ruhestand ehrenamtlich Auszubildende. Einmal pro Woche treffen sich die beiden in der Stadtbibliothek, rechnen Aufgaben durch oder üben für Prüfungen. Kennengelernt haben sie sich über die Berufsschule, deren Sozialarbeiterin Jonas auf das Angebot aufmerksam machte. Wiegand hat Jonas auch geholfen, einen Lernplan aufzustellen – und morgens pünktlich aus dem Bett zu kommen. „Manchmal reden wir aber auch einfach darüber, wie man mit einem schwierigen Chef umgeht“, sagt Wiegand. Vermittelt werden solche Tandems von einem bundesweiten Programm, in dem sich Tausende Ruheständlerinnen und Ruheständler engagieren. Der Bedarf ist groß: Seit Jahren wird in Deutschland mehr als jeder vierte Ausbildungsvertrag vorzeitig gelöst, während viele Betriebe kaum noch Nachwuchs finden. Für die Jugendlichen und die Betriebe ist die Begleitung kostenlos; finanziert wird sie vom Bund. Wichtig ist den Verantwortlichen allerdings eine klare Grenze: Die Ehrenamtlichen sind keine Ersatz-Ausbilder. Für die fachliche Ausbildung bleibt allein der Betrieb zuständig; die Begleiter sollen vor allem zuhören, Mut machen und beim Lernen helfen. Nach Angaben des Programms schließen rund drei Viertel der begleiteten Jugendlichen ihre Ausbildung erfolgreich ab. Jonas’ Meister war anfangs skeptisch, weil er Einmischung in seinen Betrieb befürchtete. Inzwischen hat er selbst bei dem Programm angerufen – für seinen nächsten Azubi."]},{"no":"4","paragraphs":["In der Stadtbücherei von Lindenfeld kann man sich nicht nur Romane und Kochbücher ausleihen, sondern auch Kunst. Rund 600 Originale regionaler Künstlerinnen und Künstler – Gemälde, Grafiken und Fotografien – lagern im Untergeschoss. Für fünf Euro darf man sich ein Werk drei Monate lang ins Wohnzimmer hängen. Ausgesucht wird vor Ort oder bequem über einen Online-Katalog. „Viele sind überrascht, wie sehr ein einziges Bild einen Raum verändert“, sagt die Leiterin Sabine Ortmann. Besonders gefragt sind großformatige Landschaften; abstrakte Werke bleiben dagegen oft monatelang im Depot. Gefällt ein Bild besonders gut, stellt die Bücherei den Kontakt zur Künstlerin oder zum Künstler her – verkaufen darf sie selbst allerdings nichts. Die anfängliche Sorge, die Bilder könnten in fremden Wohnungen Schaden nehmen, hat sich als unbegründet erwiesen: In zehn Jahren ist lediglich ein Rahmen zu Bruch gegangen. Versichert sind die Werke trotzdem, und zwar über die Stadt."]},{"no":"5","paragraphs":["Am Humboldt-Gymnasium in Waldheim beginnt der Unterricht für die Oberstufe seit diesem Schuljahr erst um 8.50 Uhr – fast eine Stunde später als bisher. Hintergrund sind Erkenntnisse der Schlafforschung: In der Pubertät verschiebt sich die innere Uhr, sodass Jugendliche abends später müde werden und morgens eigentlich länger schlafen müssten. „In der ersten Stunde saßen viele mit halb geschlossenen Augen im Klassenraum“, erinnert sich Schulleiterin Petra Unger. Ganz reibungslos lief die Umstellung allerdings nicht. Weil der Unterricht am Nachmittag nun länger dauert, mussten einige Schülerinnen und Schüler ihr Training im Sportverein verschieben, und die Busse fuhren in den ersten Wochen noch nach dem alten Fahrplan. Wer früher kommen möchte, kann ab 7.45 Uhr in der Bibliothek lernen – ein Angebot, das überraschend viele nutzen. Eine erste Umfrage fällt dennoch positiv aus: Die meisten fühlen sich im Unterricht wacher und können sich besser konzentrieren. Auch die Lehrkräfte berichten, dass in den ersten Stunden weniger gegähnt und mehr diskutiert werde. Ob sich auch die Noten verbessern, untersucht derzeit ein Team von Schlafforschern; Ergebnisse werden im nächsten Sommer erwartet. Für die Klassen fünf bis zehn bleibt es vorerst beim bisherigen Stundenplan, weil dort viele Eltern auf einen frühen Unterrichtsbeginn angewiesen sind."]}],"items":[{"no":"1","answer":"c"},{"no":"2","answer":"j"},{"no":"3","answer":"g"},{"no":"4","answer":"e"},{"no":"5","answer":"b"}]},"t2":{"instruction":"Lesen Sie zuerst den Artikel und lösen Sie dann die Aufgaben 6–10 zu dem Text.","kind":"article","title":"Warum Langeweile besser ist als ihr Ruf","lead":"Kaum haben wir eine freie Minute, greifen wir zum Smartphone. Dabei kann gerade das Nichtstun wertvoll sein – allerdings nicht in jeder Form.","paragraphs":["Die Schlange an der Supermarktkasse ist lang, der Bus hat Verspätung, im Wartezimmer sitzen noch sechs Leute. Früher hätte man in solchen Momenten aus dem Fenster geschaut oder die Gedanken schweifen lassen. Heute zieht fast jeder nach wenigen Sekunden das Handy aus der Tasche. „Wir haben verlernt, uns zu langweilen“, sagt der Psychologe Thomas Brandl, der seit Jahren zu diesem Thema forscht. „Und zwar nicht, weil unser Leben so spannend geworden wäre, sondern weil wir jede Lücke sofort füllen.“","Wie schwer vielen Menschen das Nichtstun fällt, zeigte ein Experiment an der University of Virginia, das vor einigen Jahren für Aufsehen sorgte. Die Teilnehmenden sollten eine Viertelstunde allein in einem kahlen Raum sitzen und ihren Gedanken nachhängen. Nur eine Möglichkeit, sich zu beschäftigen, gab es: Per Knopfdruck konnten sie sich selbst einen leichten Stromschlag versetzen. Zuvor hatten viele von ihnen angegeben, sie würden sogar Geld bezahlen, um diesen Schmerz nicht noch einmal spüren zu müssen. Trotzdem drückten zwei Drittel der Männer und ein Viertel der Frauen mindestens einmal auf den Knopf.","Dabei spricht einiges dafür, dass Langeweile durchaus nützlich sein kann. In einer britischen Studie mussten Versuchspersonen zunächst eine Viertelstunde lang Nummern aus einem Telefonbuch abschreiben – eine bewusst eintönige Aufgabe. Anschließend sollten sie sich möglichst viele Verwendungsmöglichkeiten für Plastikbecher ausdenken. Die Gelangweilten waren dabei deutlich einfallsreicher als eine Vergleichsgruppe, die ohne die langweilige Vorarbeit direkt begonnen hatte. Eine dritte Gruppe, die die Nummern nur lesen musste, war sogar noch kreativer. Die Forscherinnen vermuten, dass sich der Kopf in eintönigen Phasen auf die Suche nach Anregung begibt und dabei auf ungewöhnliche Ideen stößt.","Für Kinder gilt das nach Ansicht vieler Fachleute in besonderem Maße. „Viele Eltern sehen es als ihre Pflicht an, ein Kind sofort zu beschäftigen, sobald es sich beklagt, dass ihm langweilig ist“, sagt die Erziehungswissenschaftlerin Karin Lorenz. „Dabei lernen Kinder gerade in solchen Momenten, selbst etwas mit sich anzufangen.“ Wer immer ein Programm geboten bekomme, verlasse sich später auch als Erwachsener darauf, dass andere für Unterhaltung sorgen.","Allerdings ist Langeweile nicht gleich Langeweile. Die Forschung unterscheidet zwischen kurzen Momenten des Leerlaufs und einem Zustand, der über Wochen oder Monate anhält – etwa bei einer Arbeit, die dauerhaft unterfordert. Auch in der Schule führt ständige Unterforderung häufig dazu, dass Kinder abschalten oder den Unterricht stören. Menschen, die sich ständig langweilen, neigen Studien zufolge eher zu Heißhungerattacken, riskantem Verhalten und Niedergeschlagenheit. „Chronische Langeweile ist keine Quelle der Kreativität, sondern ein Warnsignal“, betont Brandl. Wer sich im Job über Monate hinweg nutzlos fühle, solle das nicht als Chance zur Selbstfindung verklären, sondern etwas ändern.","Was folgt da
