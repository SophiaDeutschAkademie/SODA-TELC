<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>telc Deutsch C1 Hochschule digital — Sophia Deutsch Akademie</title>
<style>
/* Pretendard (SIL Open Font License 1.1, digital-src/fonts/Pretendard-OFL.txt), Teilmenge mit den hier verwendeten Zeichen */
@font-face{font-family:"Pretendard SODA";src:url(data:font/woff;base64,__UI_FONT__) format("woff");font-weight:45 930;font-style:normal;font-display:swap}
:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1f5a9e;--acc-2:#17457a;--acc-w:#e6eef8;--acc-line:#9db9dc;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:980px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.blog .bh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.86em;color:var(--muted);border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:12px}
.blog .bh b{color:var(--ink-2)}
.blog h3,.art h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.blog p,.art p,.doc p{margin:0 0 .75em}
.blog .cl{margin-top:.6em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}
.art .fn{font-size:.85em;color:var(--muted);margin-top:8px}
.cmh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:.06em;font-size:.86em;color:var(--ink-2);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.cmh span{letter-spacing:0;font-weight:400;color:var(--muted)}
.cm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.cm .n{font-weight:700;color:var(--ink-2);font-size:.95em;padding-top:1px}
.cm .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cm p{margin:0}
.cm .by{text-align:right;color:var(--muted);font-size:.9em;margin-top:4px}
.doc h3{text-align:center;font-size:1em;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.doc .dh{font-weight:700}

/* items */
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.q:last-child{border-bottom:0}
.q .qn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;background:#fff;color:var(--ink-2)}
.q.ans .qn{background:var(--acc);border-color:var(--acc);color:#fff}
.q.ex{background:#f7f8f9;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px;border-bottom:0;margin-bottom:6px}
.q.ex .qn{font-size:.72em;border-style:dashed}
.q .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.q .qt{margin:3px 0 8px}
.q.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:#fff6c7}100%{background:transparent}}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--line-2);border-radius:6px;cursor:pointer;background:#fff;line-height:1.45}
.opts.row .opt{min-width:112px}
.opt:hover{background:#f1f5fa;border-color:var(--line)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .rb{width:18px;height:18px;border:2px solid #7c8693;border-radius:50%;flex:none;margin-top:2px;position:relative;background:#fff}
.opt .lt{font-weight:700;color:var(--ink-2);min-width:12px}
.opt.on{background:var(--acc-w);border-color:var(--acc-line)}
.opt.on .rb{border-color:var(--acc)}
.opt.on .rb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.opt input:focus-visible+.rb{outline:2px solid var(--acc);outline-offset:2px}
.opt.dis{cursor:default}
.opt.dis:hover{background:#fff}
.q.ex .opt{background:transparent}
.q.ex .opt.on{background:#e9ecef;border-color:#c5ccd3}
.q.ex .opt.on .rb{border-color:#7c8693}
.q.ex .opt.on .rb::after{background:#7c8693}
.selw{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.selw label{font-size:.92em;color:var(--ink-2);font-weight:700}
.selw select{min-width:92px;height:36px;border:1.5px solid var(--line);border-radius:6px;background:#fff;padding:0 10px;font-weight:700}
.q.ans .selw select{border-color:var(--acc);background:var(--acc-w)}
.grid{width:100%;border-collapse:collapse;font-size:var(--fs)}
.grid th{font-size:.82em;color:var(--ink-2);text-align:center;padding:6px 4px 8px;vertical-align:bottom;border-bottom:2px solid var(--line);line-height:1.3;position:sticky;top:-20px;background:#fff;z-index:2;box-shadow:0 1px 0 var(--line)}
.grid th:first-child,.grid th:nth-child(2){text-align:left}
.grid th .k{display:block;font-size:1.05em;color:var(--ink)}
.grid td{border-bottom:1px solid var(--line-2);padding:10px 4px;vertical-align:middle}
.grid td.no{width:40px;font-weight:700;color:var(--ink-2)}
.grid td.c{width:84px;text-align:center}
.grid tr.ex td{background:#f7f8f9}
.grid tr.ans td.no{color:var(--acc)}
.grid .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cell{display:inline-flex;width:40px;height:40px;align-items:center;justify-content:center;border-radius:50%;cursor:pointer;position:relative}
.cell:hover{background:#eef2f8}
.cell input{position:absolute;opacity:0}
.cell .rb{width:20px;height:20px;border:2px solid #7c8693;border-radius:50%;position:relative;background:#fff}
.cell.on .rb{border-color:var(--acc)}
.cell.on .rb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--acc)}
.cell input:focus-visible+.rb{outline:2px solid var(--acc);outline-offset:2px}
tr.ex .cell.on .rb{border-color:#7c8693}tr.ex .cell.on .rb::after{background:#7c8693}
.txh{font-size:.8em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 0;padding-top:12px;border-top:2px solid var(--line-2)}
.txh:first-child{margin-top:0;border-top:0;padding-top:0}

/* Schreiben */
.task p{margin:0 0 .7em}
.task ul{margin:0 0 .9em;padding-left:1.2em}
.task ul li{margin:.25em 0}
.post{border:1px solid var(--line);border-radius:6px;margin:4px 0 14px;overflow:hidden}
.post .pt{display:flex;justify-content:space-between;gap:10px;background:#f3f5f7;padding:6px 12px;font-size:.85em;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.post .pa{padding:10px 12px 0;font-weight:700;font-size:.9em}
.post p{padding:4px 12px 12px;margin:0}
.wr{display:flex;flex-direction:column;flex:1;min-height:0}
.wr .pb{display:flex;flex-direction:column;padding:14px 16px 12px;gap:10px}
.sz{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.sz span{font-size:12px;color:var(--muted);margin-right:4px}
.sz button{min-width:32px;height:30px;border:1px solid var(--line);border-radius:5px;background:#fff;font-weight:700;font-size:15px;padding:0 6px}
.sz button:hover{background:var(--acc-w)}
textarea.ed{flex:1;min-height:260px;width:100%;resize:none;border:1.5px solid var(--line);border-radius:6px;padding:14px 16px;font-size:var(--fs);line-height:1.65;background:#fff}
textarea.ed:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-w)}
.wc{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}
.wc b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}


/* ---------- telc: Texte, Luecken, Hilfslisten ---------- */
.txs .tn{display:flex;align-items:center;gap:10px;font-size:1.05em;margin:0 0 6px}
.txs .tn b{display:inline-flex;width:28px;height:28px;border-radius:4px;background:var(--ink);color:#fff;align-items:center;justify-content:center;font-size:.9em}
.txs .tb{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--line-2)}
.txs .tb:last-child{border-bottom:0;margin-bottom:0}
.txs p,.doc p{margin:0 0 .75em}
.art .iq{font-weight:700;color:var(--ink-2)}
.rh{font-size:.8em;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.hlist{list-style:none;padding:0;margin:0 0 18px;border:1px solid var(--line);border-radius:6px;background:#f8f9fb}
.hlist li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:7px 12px;border-bottom:1px solid var(--line-2);line-height:1.4}
.hlist li:last-child{border-bottom:0}
.hlist li b{color:var(--ink-2)}
.hlist li.used{color:#8a929d}
.hlist li.used span{text-decoration:line-through;text-decoration-color:#b4bbc4}
.gapx{display:inline-flex;align-items:baseline;gap:6px;min-width:84px;margin:0 2px;padding:0 6px;border-bottom:2px solid var(--ink-2);background:#f1f4f9;border-radius:3px 3px 0 0;cursor:pointer;font-weight:700;line-height:1.45;vertical-align:baseline}
.gapx b{font-size:.74em;color:var(--ink-2)}
.gapx i{font-style:normal;color:var(--ink)}
.gapx.filled{background:var(--acc-w);border-bottom-color:var(--acc)}
.gapx.filled b{color:var(--acc-2)}
.gapx:hover{background:#e3eaf4}
.opts.row.w .opt{min-width:100px}
.opts.row.s .opt{min-width:0;padding:8px 14px}
.task .ctxl{font-weight:700}
.wc.low b{color:var(--warn)}

/* ---------- telc C1 Hochschule ---------- */
.art .intro{color:var(--ink-2);margin-bottom:10px}
.leadq{font-weight:700;color:var(--ink-2);margin:0 0 10px}
.rh.mt{margin-top:22px}
.selgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin:0 0 16px}
.selgrid .q{align-items:center;padding:10px 0}
.selgrid .selw{margin-top:0}
.gapx.sent{display:inline;min-width:0;margin:0;padding:2px 6px;font-weight:500;line-height:1.75;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gapx.sent b{display:inline-block;margin-right:.5em}
.gapx.sent i:empty{display:inline-block;width:7em}
.gapx.ex{cursor:default;pointer-events:none;background:#eef0f3;border-bottom-color:var(--line)}
.gapx.ex i{color:var(--ink-2);font-weight:500}
.gapx.ex.sent{font-weight:500}
.slide{margin:0 0 14px;padding:14px 18px 6px}
.slide h3{font-size:1.08em;line-height:1.3;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.slide .sli{position:relative;margin:0 0 .5em;padding-left:1.15em}
.slide .sli.b::before{content:"•";position:absolute;left:.1em;color:var(--muted)}
.slide .sli.d{padding-left:2.3em}
.slide .sli.d::before{content:"–";position:absolute;left:1.25em;color:var(--muted)}
.slide .q{padding:10px 0}
input.nin{width:100%;height:42px;border:1.5px solid var(--line);border-radius:6px;padding:0 12px;background:var(--panel);font-size:var(--fs)}
input.nin:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-w)}
.q.ans input.nin{border-color:var(--acc)}
input.nin:disabled{background:var(--soft,#f1f3f5);color:var(--ink-2)}
.quotes{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.quotes blockquote{margin:0;padding:10px 14px;border-left:4px solid var(--acc);border-radius:0 6px 6px 0;background:var(--soft,#f6f8f9)}
table.rv td.m.r{width:84px}
.rate{display:inline-flex;gap:4px}
.rate button{width:34px;height:30px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-weight:700;color:var(--ink-2);padding:0}
.rate button.on{background:var(--acc-w);border-color:var(--acc);color:var(--acc-2)}
.rate button.no.on{background:var(--warn-w);border-color:var(--warn);color:var(--warn)}
table.rv tr.pend td.n{color:var(--muted)}
@media (max-width:560px){.selgrid{grid-template-columns:minmax(0,1fr)}}

/* ---------- footer ---------- */
.foot{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 16px;background:#fff;border-top:1px solid var(--line);flex:none}
.ovw{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ovw .lbl{font-size:11.5px;color:var(--muted);line-height:1.25;white-space:nowrap}
.ovw .lbl b{display:block;color:var(--ink);font-size:13px}
.chips{display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:thin;padding:4px 2px;min-width:0}
.chip{flex:none;min-width:25px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.chip.ans{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.cur{box-shadow:0 0 0 2px var(--ink)}
.chip:disabled{opacity:.45;cursor:not-allowed}
.gap{flex:none;width:7px}
.foot .ovbtn{display:none}
.nav{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:#f3f5f7}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:var(--acc-2)}
.btn.out{border-color:var(--acc);color:var(--acc-2)}

/* ---------- start / end / result pages ---------- */
.page{min-height:100vh;display:flex;flex-direction:column}

.facts span{border:1px solid var(--line-2);background:#f6f8f9;border-radius:5px;padding:5px 11px;font-size:13.5px;font-weight:700;color:var(--ink-2)}

.links{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0}

<body>
<div id="app"></div>
<audio id="aud" preload="auto"></audio>
<script id="exam-data" type="application/json">__EXAM_DATA__</script>
<script>
(function () {
  'use strict';

  /* 선생님 이메일 주소를 넣으면 '메일로 보내기'의 받는 사람에 자동으로 들어갑니다. 예: var LEHRER_MAIL = 'name@example.com'; */
  var LEHRER_MAIL = '';

  var D = JSON.parse(document.getElementById('exam-data').textContent);
  var LOGO = '__LOGO_DATA_URI__';
  var PREFIX = 'sodaTelcC1HS.v1.';
  var MOD = {
    lesen: { name: 'Lesen', full: 'Leseverstehen und Sprachbausteine', minutes: 90, ko: '읽기·어휘문법' },
    hoeren: { name: 'Hören', full: 'Hörverstehen', minutes: 40, ko: '듣기' },
    schreiben: { name: 'Schreiben', full: 'Schriftlicher Ausdruck', minutes: 70, ko: '쓰기' }
  };
  var WORDS_MIN = 350;   /* telc C1 Hochschule: Text mit mindestens 350 Wörtern */
  var FS = [16, 18, 20.5];

  /* ---------- helpers ---------- */
  function lsGet(k) { try { var v = window.localStorage.getItem(PREFIX + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }
  function lsDel(k) { try { window.localStorage.removeItem(PREFIX + k); } catch (e) { /* storage unavailable */ } }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function wordCount(t) {
    var m = String(t || '').match(/[A-Za-zÀ-ÖØ-öø-ÿĀ-žẞ0-9]+(?:['’\-][A-Za-zÀ-ÖØ-öø-ÿĀ-žẞ0-9]+)*/g);
    return m ? m.length : 0;
  }
  function nowStr() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  var ICON = {
    clock: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 5.5V10l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    lock: '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="6.5" rx="1.3" fill="currentColor"/><path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    check: '<svg width="13" height="13" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5 5.6 10.5 11.5 3.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    marker: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13.5h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4.2 10.6 10.6 4.2l2 2-6.4 6.4H4.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    erase: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 13.5h7.3M2.8 10.2l6.4-6.4 3.4 3.4-5.6 5.6H5.1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
    vol: '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 7h2.6L9 4v10l-3.4-3H3z" fill="currentColor"/><path d="M11.5 6.2a4 4 0 0 1 0 5.6M13.4 4.3a6.7 6.7 0 0 1 0 9.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    prev: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M8.8 2.5 4.3 7l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    next: '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5.2 2.5 9.7 7l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  /* ---------- route ---------- */
  function parseRoute() {
    var m = /^#?(\d{1,2})-(lesen|hoeren|schreiben)(?:-(ergebnis))?$/.exec(location.hash);
    return m ? { mt: m[1], mod: m[2], view: m[3] || '' } : null;
  }
  var R = parseRoute();
  if (!R || !D.tests[R.mt]) { location.replace('index.html#digital'); return; }
  var T = D.tests[R.mt];
  if (T.minutes && T.minutes.hoeren) MOD.hoeren.minutes = T.minutes.hoeren;   /* gedruckte Prüfungszeit 40 Minuten (nie kürzer als Audio + 2 Minuten) */
  if (T.schreiben) { if (T.schreiben.minWords) WORDS_MIN = T.schreiben.minWords; if (T.schreiben.minutes) MOD.schreiben.minutes = T.schreiben.minutes; }
  var STATE_KEY = 'mt' + R.mt + '.' + R.mod + '.state';
  var RESULT_KEY = 'mt' + R.mt + '.' + R.mod + '.result';
  var BACK = 'index.html#d' + R.mt;
  var app = document.getElementById('app');
  var AUD = document.getElementById('aud');
  document.title = 'Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + ' — telc C1 Hochschule digital';
  window.addEventListener('hashchange', function () { location.reload(); });

  /* ---------- item renderers ---------- */
  function optRow(no, val, label, letter, checked, dis) {
    return '<label class="opt' + (checked ? ' on' : '') + (dis ? ' dis' : '') + '"><input type="radio" name="a' + esc(no) + '" value="' + esc(val) + '"' +
      (checked ? ' checked' : '') + (dis ? ' disabled' : ' data-no="' + esc(no) + '"') + '><span class="rb"></span>' +
      (letter ? '<span class="lt">' + esc(letter) + '</span>' : '') + '<span>' + esc(label) + '</span></label>';
  }
  function qWrap(no, inner) {
    return '<div class="q" id="q-' + esc(no) + '"><div class="qn">' + esc(no) + '</div><div class="qb">' + inner + '</div></div>';
  }
  function exBlock(inner) {
    return '<div class="q ex"><div class="qn">0</div><div class="qb"><span class="bsp">Beispiel</span>' + inner + '</div></div>';
  }
  function abcItem(it) {
    var h = '<p class="qt">' + esc(it.stem) + '</p><div class="opts" role="radiogroup" aria-label="Aufgabe ' + esc(it.no) + '">';
    ['a', 'b', 'c'].forEach(function (k) { h += optRow(it.no, k, it.options[k], k, false, false); });
    return qWrap(it.no, h + '</div>');
  }
  function sbItem(it) {
    var h = '<div class="opts row w" role="radiogroup" aria-label="Lücke ' + esc(it.no) + '">';
    ['a', 'b', 'c', 'd'].forEach(function (k) { h += optRow(it.no, k, it.options[k], k, false, false); });
    return qWrap(it.no, h + '</div>');
  }
  function rfnItem(it) {
    return qWrap(it.no, '<p class="qt">' + esc(it.text) + '</p><div class="opts row" role="radiogroup" aria-label="Aufgabe ' + esc(it.no) + '">' +
      optRow(it.no, 'r', 'richtig', 'r', false, false) + optRow(it.no, 'f', 'falsch', 'f', false, false) +
      optRow(it.no, 'n', 'steht nicht im Text', '–', false, false) + '</div>');
  }
  function secOpts(no, sel, dis) {
    return '<div class="opts row s" role="radiogroup" aria-label="Aufgabe ' + esc(no) + '">' +
      'abcde'.split('').map(function (k) { return optRow(no, k, '', k, k === sel, dis); }).join('') + '</div>';
  }
  function secItem(it) {
    return qWrap(it.no, '<p class="qt">' + esc(it.stem) + '</p>' + secOpts(it.no, null, false));
  }
  function selCompact(it, label, keys) {
    var h = '<div class="selw"><label for="s-' + esc(it.no) + '">' + esc(label) + '</label>' +
      '<select id="s-' + esc(it.no) + '" data-no="' + esc(it.no) + '"><option value="">–</option>';
    keys.forEach(function (k) { h += '<option value="' + k + '">' + k + '</option>'; });
    return qWrap(it.no, h + '</select></div>');
  }
  var L8 = 'abcdefgh'.split(''), L10 = 'abcdefghij'.split('');
  function para(arr) { return (arr || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join(''); }

  /* ---------- text renderers ---------- */
  function sectionsHTML(secs) {
    return '<div class="txs">' + secs.map(function (x) {
      return '<div class="tb" id="tx-' + esc(x.letter) + '"><h3 class="tn"><b>' + esc(x.letter) + '</b></h3><p>' + esc(x.text) + '</p></div>';
    }).join('') + '</div>';
  }
  function hlistHTML(list) {
    return '<ol class="hlist" id="hlist">' + list.map(function (h) {
      return '<li data-k="' + esc(h.letter) + '"><b>' + esc(h.letter) + '</b><span>' + esc(h.text) + '</span></li>';
    }).join('') + '</ol>';
  }
  /* Luecken {{n}}: Lesen Teil 1 setzt ganze Saetze ein (sent), Sprachbausteine einzelne Woerter. {{0}} ist das Beispiel. */
  function gapParas(arr, ex) {
    ex = ex || {};
    return (arr || []).map(function (p) {
      return '<p>' + esc(p).replace(/\n/g, '<br>').replace(/\{\{(\d+)\}\}/g, function (m, n) {
        if (n === '0') return '<span class="gapx ex' + (ex.sent ? ' sent' : '') + '" id="g-0" title="Beispiel"><b>0</b><i>' + esc(ex.text || '') + '</i></span>';
        return '<span class="gapx' + (ex.sent ? ' sent' : '') + '" id="g-' + n + '" data-gap="' + n + '" role="button" tabindex="0" title="Lücke ' + n + '"><b>' + n + '</b><i></i></span>';
      }) + '</p>';
    }).join('');
  }
  function artHTML(t, ex) {
    return '<article class="card art">' + (t.title ? '<h3>' + esc(t.title) + '</h3>' : '') + (ex ? gapParas(t.paragraphs, ex) : para(t.paragraphs)) + '</article>';
  }
  function slidesHTML(h3) {
    return h3.slides.map(function (sl) {
      var inner = '<h3>' + esc(sl.title) + '</h3>';
      sl.lines.forEach(function (ln) {
        if (ln.no === '0') {
          inner += '<div class="q ex"><div class="qn">0</div><div class="qb"><span class="bsp">Beispiel</span><p class="qt">' + esc(ln.text) +
            '</p><input class="nin" type="text" value="' + esc(h3.exampleAnswer) + '" disabled aria-label="Beispiel"></div></div>';
        } else if (ln.no) {
          inner += qWrap(ln.no, '<p class="qt">' + esc(ln.text) + '</p><input class="nin" type="text" data-no="' + esc(ln.no) +
            '" maxlength="240" autocomplete="off" spellcheck="false" aria-label="Aufgabe ' + esc(ln.no) + '">');
        } else {
          inner += '<p class="sli' + (ln.bullet ? ' b' : '') + (ln.dash ? ' d' : '') + '">' + esc(ln.text) + '</p>';
        }
      });
      return '<section class="card slide">' + inner + '</section>';
    }).join('');
  }

  /* ---------- module models ---------- */
  var SENT = {}, STMT = {};
  function sumW(items) { return items.reduce(function (a, it) { return a + it.w; }, 0); }
  function buildLesen() {
    var L = T.lesen, pages = [], items = [];
    function reg(list, type, teil, page, w) {
      list.forEach(function (it) { items.push({ no: it.no, type: type, answer: it.answer, teil: teil, page: page, w: w, src: it }); });
    }
    // Teil 1: Saetze in Luecken
    var t1 = L.t1;
    t1.sentences.forEach(function (s) { SENT[s.letter] = s.text; });
    pages.push({ key: 'L1', teil: 1, title: 'Lesen Teil 1', inst: [t1.instruction, t1.intro], leftTitle: 'Text', rightTitle: 'Aufgaben 1–6',
      left: artHTML(t1, { sent: true, text: t1.example.text }),
      right: '<div class="selgrid">' + t1.items.map(function (it) { return selCompact(it, 'Lücke ' + it.no, L8); }).join('') + '</div>' +
        '<p class="rh">Sätze a–h</p>' + hlistHTML(t1.sentences) });
    reg(t1.items, 'sent', 1, 0, 2);
    // Teil 2: Absatz finden
    var t2 = L.t2;
    pages.push({ key: 'L2', teil: 2, title: 'Lesen Teil 2', inst: [t2.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben 7–12',
      left: (t2.title ? '<h3 class="h1t">' + esc(t2.title) + '</h3>' : '') + sectionsHTML(t2.sections),
      right: '<p class="leadq">' + esc(t2.itemsLead) + '</p>' +
        exBlock('<p class="qt">' + esc(t2.example.stem) + '</p>' + secOpts('ex', t2.example.answer, true)) + t2.items.map(secItem).join('') });
    reg(t2.items, 'sec', 2, 1, 2);
    // Teil 3: richtig / falsch / nicht im Text + Ueberschrift
    var t3 = L.t3, hd = t3.headline;
    var hdItem = { no: hd.no, stem: hd.instruction, short: 'Passende Überschrift zum Text', options: hd.options, answer: hd.answer };
    pages.push({ key: 'L3', teil: 3, title: 'Lesen Teil 3', inst: [t3.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben 13–24',
      left: artHTML(t3),

  function buildHoeren() {
    var H = T.hoeren, pages = [], items = [], h1 = H.t1, h2 = H.t2, h3 = H.t3;
    function range(n) { return 'Aufgaben ' + n[0].no + '–' + n[n.length - 1].no; }
    // Teil 1: Aussagen zuordnen
    h1.statements.forEach(function (s) { STMT[s.letter] = s.text; });
    pages.push({ key: 'H1', teil: 1, title: 'Hören Teil 1', inst: [h1.instruction, h1.readNote], rightTitle: range(h1.items),

        '<p class="rh">Aussagen a–j</p>' + hlistHTML(h1.statements) });
    h1.items.forEach(function (it) { items.push({ no: it.no, type: 'h1', answer: it.answer, teil: 1, page: 0, w: 1, src: it }); });
    // Teil 2: a / b / c
    pages.push({ key: 'H2', teil: 2, title: 'Hören Teil 2', inst: [h2.instruction, h2.readNote], rightTitle: range(h2.items), right: h2.items.map(abcItem).join('') });
    h2.items.forEach(function (it) { items.push({ no: it.no, type: 'abc', answer: it.answer, teil: 2, page: 1, w: 2, src: it }); });
    // Teil 3: Notizen zum Vortrag (freie Eingabe, Selbstbewertung)
    var lineText = {};
    h3.slides.forEach(function (sl) { sl.lines.forEach(function (ln) { if (ln.no && ln.no !== '0') lineText[ln.no] = ln.text; }); });
    h3.items.forEach(function (it) { it.text = lineText[it.no] || ''; });

    h3.items.forEach(function (it) { items.push({ no: it.no, type: 'note', answer: it.solution, teil: 3, page: 2, w: 2, src: it }); });
    return { pages: pages, items: items, teile: [1, 2, 3], two: false, max: sumW(items), labels: { 1: 'Teil 1', 2: 'Teil 2', 3: 'Teil 3' } };

  var M = R.mod === 'lesen' ? buildLesen() : R.mod === 'hoeren' ? buildHoeren() : buildSchreiben();
  var ITEM = {};

  /* ---------- state ---------- */

        ['Umlaute und ß können Sie mit den Sonderzeichen-Tasten einfügen.', 'ä, ö, ü, ß는 특수문자 버튼으로 넣을 수 있습니다.'],
        ['Bewertet wird nur der Text im Textfeld. Nach Ablauf der Zeit wird das Modul automatisch abgegeben.', '입력란의 글만 평가 대상이며, 시간이 끝나면 자동으로 제출됩니다.']
      ]
    }[R.mod];

      '<p class="sl">Übungsprüfung im digitalen Format — wie am Computer im Prüfungszentrum.</p>' +
      '<div class="facts">' + facts.map(function (f) { return '<span>' + esc(f) + '</span>'; }).join('') + '</div>' +

      '<div class="namef"><label for="nm">Name (für das Ergebnis) · 이름</label><input id="nm" autocomplete="name" maxlength="40" value="' + esc(lsGet('name') || '') + '"></div>';
    if (R.mod === 'hoeren') {
      h += '<div class="rules" style="margin-top:-6px"><h2>Tonprobe</h2><div class="acts"><div class="vol">' + ICON.vol +
        '<input type="range" min="0" max="100" step="1" id="volr0" aria-label="Lautstärke"></div><button class="btn sm" id="probe" type="button">Tonprobe abspielen</button></div>' +
        '<p class="note" style="margin-top:8px">Spielt die ersten Sekunden von Teil 1 ab. · 음량 확인용으로 Teil 1 앞부분을 몇 초 들려줍니다.</p></div>';

      h += '<button class="btn pri" id="resume" type="button">Prüfung fortsetzen (' + fmt(saved.remaining) + ')</button><button class="btn" id="restart" type="button">Neu beginnen</button>';

      h += '<button class="btn pri" id="tour" type="button">Tutorial ansehen und starten</button><button class="btn out" id="go" type="button">Ohne Tutorial starten</button>';

      '<a class="back" href="' + BACK + '">← Modelltest ' + esc(T.roman) + ' · 모듈 선택</a></section></main></div>';
    app.innerHTML = h;
    var nm = $('#nm');
    nm.addEventListener('input', function () { lsSet('name', nm.value.trim()); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr0'); vr.value = Math.round(getVol() * 100);
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
      $('#probe').addEventListener('click', function () {

        else { try { AUD.currentTime = 0; } catch (e) { /* ignore */ } }

        var p = AUD.play();

          probeTimer = null;
          if (!timerId) { audioAllowPause = true; AUD.pause(); audioAllowPause = false; }
          b.disabled = false; b.textContent = 'Tonprobe abspielen';
        }, 6000);
        if (p && p.catch) p.catch(function () { b.disabled = false; b.textContent = 'Tonprobe abspielen'; toast('Audio konnte nicht abgespielt werden.', true); });
      });
    }
    if ($('#tour')) $('#tour').addEventListener('click', function () { begin(freshState(), true); });
    if ($('#go')) $('#go').addEventListener('click', function () { begin(freshState(), false); });
    if ($('#resume')) $('#resume').addEventListener('click', function () { begin(saved, false); });
    if ($('#restart')) $('#restart').addEventListener('click', function () {
      modal('Neu beginnen?', ['Ihre bisherigen Antworten in diesem Modul werden gelöscht.', '지금까지의 답이 지워집니다.'], [

      ]);
    });
    if ($('#seeres')) $('#seeres').addEventListener('click', function () { showResult(res); });
    window.scrollTo(0, 0);
  }

  /* ---------- volume ---------- */
  function getVol() { var v = lsGet('vol'); return typeof v === 'number' ? v : 0.85; }
  function setVol(v) { v = Math.max(0, Math.min(1, v)); AUD.volume = v; lsSet('vol', v); }

  /* ---------- exam shell ---------- */
  function begin(state, withTour) {
    clearTimeout(probeTimer); probeTimer = null;
    if (R.mod === 'hoeren') { audioAllowPause = true; try { AUD.pause(); } catch (e) { /* ignore */ } audioAllowPause = false; }
    S = state;
    warned = {}; markMode = false;
    if (S.build !== D.build) { S.marks = {}; S.build = D.build; }
    if (typeof S.font !== 'number') S.font = 0;
    if (!(S.page >= 0 && S.page < M.pages.length)) S.page = 0;
    if (S.remaining < 60 * 10) warned[10] = true;
    if (S.remaining < 60 * 5) warned[5] = true;
    renderExam();
    if (withTour) runTour(function () { startClock(); });
    else startClock();
  }

  function renderExam() {
    var h = '<div class="exam" id="exam">' + topHTML(true);
    h += '<nav class="tabs" aria-label="Teile"><div class="tl" role="tablist" id="tabs"></div><div class="tr" id="tools"></div></nav>';
    if (R.mod === 'hoeren') {
      h += '<div class="abar" id="abar"><div class="st"><span class="dot"></span><span id="ast">Bereit</span></div><div class="pg"><i id="apg"></i></div><span class="tm" id="atm"></span></div>';
    }
    h += '<main class="main" id="main"></main>';
    h += '<footer class="foot"><div class="ovw" id="ov"><div class="lbl">Aufgabenübersicht<b id="ovc"></b></div><div class="chips" id="chips"></div>' +
      '<button class="btn sm ovbtn" id="ovbtn" type="button"></button></div>' +
      '<div class="nav" id="nav"><button class="btn" id="prev" type="button" aria-label="Zurück">' + ICON.prev + '<span class="tx">Zurück</span></button><button class="btn pri" id="next" type="button">Weiter' + ICON.next + '</button>' +
      '<button class="btn out" id="submit" type="button">Abgeben</button></div></footer></div>';
    app.innerHTML = h;
    applyFont();
    // tools
    var tools = '';
    if (R.mod === 'lesen') {
      tools = '<button class="tbtn" id="mk" type="button" aria-pressed="false" title="Textstellen markieren">' + ICON.marker + '<span class="tx">Markieren</span></button>' +
        '<button class="tbtn icon" id="mkx" type="button" title="Markierungen auf dieser Seite löschen" aria-label="Markierungen löschen">' + ICON.erase + '</button>';
    }
    $('#tools').innerHTML = tools;
    // events
    $$('#fz button').forEach(function (b) { b.addEventListener('click', function () { S.font = +b.getAttribute('data-fz'); lsSet('font', S.font); applyFont(); saveSoon(); }); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr'); vr.value = Math.round(getVol() * 100); AUD.volume = getVol();
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
    }
    $('#help').addEventListener('click', function () { if (!tourEls) runTour(null); });
    $('#prev').addEventListener('click', function () { go(S.page - 1); });
    $('#next').addEventListener('click', function () { go(S.page + 1); });
    $('#submit').addEventListener('click', askSubmit);
    $('#ovbtn').addEventListener('click', openOverview);
    if (R.mod === 'lesen') {
      $('#mk').addEventListener('click', function () { markMode = !markMode; this.setAttribute('aria-pressed', String(markMode)); var pl = $('#pbL'); if (pl) pl.classList.toggle('mk', markMode); });
      $('#mkx').addEventListener('click', function () {
        var pl = $('#pbL'); if (!pl) return;
        $$('mark.hl', pl).forEach(unwrap); pl.normalize(); delete S.marks[M.pages[S.page].key]; saveSoon();
      });
    }
    var main = $('#main');
    main.addEventListener('change', onAnswer);
    main.addEventListener('input', onNote);
    main.addEventListener('mouseup', onMarkUp);
    main.addEventListener('touchend', function (e) { setTimeout(function () { onMarkUp(e); }, 30); });
    main.addEventListener('click', onMarkClick);
    main.addEventListener('click', onGapClick);
    main.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('gapx')) { e.preventDefault(); onGapClick(e); } });
    renderPage();
  }

  function applyFont() {
    var root = document.documentElement;
    root.style.setProperty('--fs', FS[S ? S.font : 0] + 'px');
    $$('#fz button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-fz') === S.font)); });
  }

  function teilPages(teil) { var r = []; M.pages.forEach(function (p, i) { if (p.teil === teil) r.push(i); }); return r; }
  function maxReachable() {
    if (R.mod !== 'hoeren' || S.audio.done) return M.pages.length - 1;
    return S.audio.track;
  }

  function renderTabs() {
    var cur = M.pages[S.page].teil;
    var h = M.teile.map(function (teil) {
      var pidx = teilPages(teil)[0];
      var locked = pidx > maxReachable();
      var label, pr = '', done = false;
      if (M.writing) {
        var wc = wordCount(S.texts[teil]);
        label = M.labels[teil];
        pr = wc + ' / ' + WORDS_MIN;
        done = wc >= WORDS_MIN;
      } else {
        var its = M.items.filter(function (it) { return it.teil === teil; });
        var ans = its.filter(function (it) { return S.answers[it.no] != null; }).length;
        label = M.labels[teil]; pr = ans + '/' + its.length; done = ans === its.length;
      }
      return '<button class="tab' + (done ? ' done' : '') + '" role="tab" type="button" data-teil="' + teil + '" aria-selected="' + (teil === cur) + '"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '<span class="lock">' + ICON.lock + '</span>' : '') + esc(label) + ' <span class="pr">' + (done && !M.writing ? ICON.check + ' ' : '') + esc(pr) + '</span></button>';
    }).join('');

  function onMarkUp() {
    if (!markMode || R.mod !== 'lesen') return;

  /* ---------- clock ---------- */

  /* self: Selbstbewertung der Notizen (Hören Teil 3): 1 = richtig, 0 = falsch, fehlt = noch nicht bewertet (zählt 0 Punkte) */
  function score(ans, self) {

      else ok = g != null && g === it.answer;
      if (!per[it.teil]) per[it.teil] = { c: 0, n: 0, p: 0, max: 0 };
      per[it.teil].n++; per[it.teil].max += it.w;
      if (ok) { per[it.teil].c++; per[it.teil].p += it.w; correct++; pts += it.w; }
      rows.push({ no: it.no, teil: it.teil, g: g == null ? null : g, a: it.answer, ok: ok, note: note, rated: rated });
    });
    return { correct: correct, total: M.items.length, points: pts, max: M.max, percent: Math.round(pts * 100 / M.max), per: per, rows: rows, pending: pending };
  }

  function ansLabel(it, v) {

    if (it.type === 'abc' || it.type === 'sb') return v + ') ' + (it.src.options[v] || '');
    if (it.type === 'sent') return v + ') ' + (SENT[v] || '');
    if (it.type === 'h1') return v + ') ' + (STMT[v] || '');
    if (it.type === 'sec') return 'Absatz ' + v;

  }
  function itemPrompt(it) {
    var s = it.src;
    if (it.type === 'sent' || it.type === 'sb') return 'Lücke ' + s.no;
    if (it.type === 'h1') return s.label;
    if (it.type === 'sec') return 'In welchem Abschnitt … ' + s.stem;
    return s.short || s.stem || s.text || '';

  function selfWord(v) { return v === 1 ? 'richtig' : v === 0 ? 'falsch' : 'offen'; }
  function resultText(res) {
    var lines = ['telc Deutsch C1 Hochschule · Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + ' (digital)', 'Name: ' + (res.name || '-'), 'Datum: ' + res.finished,
      'Bearbeitungszeit: ' + fmt(res.used) + (res.byTime ? ' (Zeit abgelaufen)' : '')];
    if (res.score) {
      var sc = res.score, self = res.self || {};
      lines.push('Ergebnis: ' + sc.correct + '/' + sc.total + ' richtig · ' + fp(sc.points) + ' von ' + sc.max + ' Punkten (' + sc.percent + ' %)');
      lines.push('Teile: ' + Object.keys(sc.per).map(function (k) { return M.labels[k] + ' ' + sc.per[k].c + '/' + sc.per[k].n + ' (' + fp(sc.per[k].p) + ' P.)'; }).join(' · '));
      var wrong = sc.rows.filter(function (r) { return !r.ok; });
      if (wrong.length) {
        lines.push('', 'Falsch / offen:');
        wrong.forEach(function (r) {
          if (r.note) lines.push('  ' + r.no + ': ' + (r.g == null ? 'offen' : r.g) + ' → Musterlösung: ' + r.a + ' (Selbstbewertung: ' + selfWord(self[r.no]) + ')');
          else lines.push('  ' + r.no + ': ' + (r.g == null ? 'offen' : r.g) + ' → Lösung ' + r.a);
        });

    } else {
      var any = false;

        var tx = res.texts[i + 1] || '';

      });

      '<div class="mb">' + buttons.map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';
    document.body.appendChild(bg);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    close.el = bg;
    function onKey(e) { if (e.key === 'Escape' && !blocking) close(); }
    document.addEventListener('keydown', onKey);

      btn.addEventListener('click', function () { var b = buttons[+btn.getAttribute('data-i')]; close(); if (b.fn) b.fn(); });
    });
    if (!blocking) bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    var pri = $('.btn.pri', bg) || $('.btn', bg); if (pri) pri.focus();
    return close;
  }

      ['.pane.l', 'Hier stehen die Aufgabe und zwei Zitate, die Ihnen erste Ideen geben.', '여기에 과제와 아이디어를 주는 인용문 두 개가 있습니다.'],
      ['#ed', 'Schreiben Sie Ihren Text in dieses Feld.', '이 입력란에 글을 씁니다.'],
      ['#wc', 'Die Wörter werden automatisch gezählt. Ihr Text soll mindestens 350 Wörter umfassen.', '단어 수가 자동으로 계산됩니다. 글은 350단어 이상이어야 합니다.'],
      ['#sz', 'Mit diesen Tasten fügen Sie ä, ö, ü und ß ein.', '이 버튼으로 ä, ö, ü, ß를 넣습니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#nav', 'Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '다 쓰면 ‘Abgeben’을 누릅니다.']
    ]);
  }
  function runTour(done) {
    var steps = tourSteps().filter(function (s) { return $(s[0]); });
    if ($('#help') && $('#help').offsetParent !== null) {
      steps.splice(steps.length - 1, 0, ['#help', 'Mit „?“ können Sie dieses Tutorial während der Prüfung noch einmal ansehen.', '‘?’를 누르면 시험 중에도 이 튜토리얼을 다시 볼 수 있습니다.']);
    }
    var i = 0;
    var block = document.createElement('div'); block.className = 'tipblock';
    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);
      $('#tnext').focus();
    }
    function end() {
      closeTour();
      window.removeEventListener('resize', place);
      if (!done) return;
      modal('Prüfung starten', ['Das Tutorial ist beendet. Wenn Sie auf „Prüfung starten“ klicken, beginnt die Prüfungszeit' + (R.mod === 'hoeren' ? ' und der erste Hörtext wird abgespielt.' : '.'),
        '‘Prüfung starten’을 누르면 시험 시간이 시작됩니다' + (R.mod === 'hoeren' ? '. 첫 음원도 바로 재생됩니다.' : '.')], [
        { label: 'Prüfung starten', pri: true, fn: done }
      ], true);
    }
    window.addEventListener('resize', place);
    place();
  }
  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
</body>
</html>
