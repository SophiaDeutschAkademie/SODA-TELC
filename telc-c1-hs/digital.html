      'abcde'.split('').map(function (k) { return optRow(no, k, '', k, k === sel, dis); }).join('') + '</div>';
  }
  function secItem(it) {
    return qWrap(it.no, '<p class="qt">' + esc(it.stem) + '</p>' + secOpts(it.no, null, false));
  }
  function selCompact(it, label, keys) {
    var h = '<div class="selw"><label for="s-' + esc(it.no) + '">' + esc(label) + '</label>' +
      '<select id="s-' + esc(it.no) + '" data-no="' + esc(it.no) + '"><option value="">–</option>';
    keys.forEach(function (k) { h += '<option value="' + k + '">' + k + '</option>'; });
    return qWrap(it.no, h + '</select></div>');
  }
  var L8 = 'abcdefgh'.split(''), L10 = 'abcdefghij'.split('');
  function para(arr) { return (arr || []).map(function (p) { return '<p>' + esc(p) + '</p>'; }).join(''); }

  /* ---------- text renderers ---------- */
  function sectionsHTML(secs) {
    return '<div class="txs">' + secs.map(function (x) {
      return '<div class="tb" id="tx-' + esc(x.letter) + '"><h3 class="tn"><b>' + esc(x.letter) + '</b></h3><p>' + esc(x.text) + '</p></div>';
    }).join('') + '</div>';
  }
  function hlistHTML(list) {
    return '<ol class="hlist" id="hlist">' + list.map(function (h) {
      return '<li data-k="' + esc(h.letter) + '"><b>' + esc(h.letter) + '</b><span>' + esc(h.text) + '</span></li>';
    }).join('') + '</ol>';
  }
  /* Luecken {{n}}: Lesen Teil 1 setzt ganze Saetze ein (sent), Sprachbausteine einzelne Woerter. {{0}} ist das Beispiel. */
  function gapParas(arr, ex) {
    ex = ex || {};
    return (arr || []).map(function (p) {
      return '<p>' + esc(p).replace(/\n/g, '<br>').replace(/\{\{(\d+)\}\}/g, function (m, n) {
        if (n === '0') return '<span class="gapx ex' + (ex.sent ? ' sent' : '') + '" id="g-0" title="Beispiel"><b>0</b><i>' + esc(ex.text || '') + '</i></span>';
        return '<span class="gapx' + (ex.sent ? ' sent' : '') + '" id="g-' + n + '" data-gap="' + n + '" role="button" tabindex="0" title="Lücke ' + n + '"><b>' + n + '</b><i></i></span>';
      }) + '</p>';
    }).join('');
  }
  function artHTML(t, ex) {
    return '<article class="card art">' + (t.title ? '<h3>' + esc(t.title) + '</h3>' : '') + (ex ? gapParas(t.paragraphs, ex) : para(t.paragraphs)) + '</article>';
  }
  function slidesHTML(h3) {
    return h3.slides.map(function (sl) {
      var inner = '<h3>' + esc(sl.title) + '</h3>';
      sl.lines.forEach(function (ln) {
        if (ln.no === '0') {
          inner += '<div class="q ex"><div class="qn">0</div><div class="qb"><span class="bsp">Beispiel</span><p class="qt">' + esc(ln.text) +
            '</p><input class="nin" type="text" value="' + esc(h3.exampleAnswer) + '" disabled aria-label="Beispiel"></div></div>';
        } else if (ln.no) {
          inner += qWrap(ln.no, '<p class="qt">' + esc(ln.text) + '</p><input class="nin" type="text" data-no="' + esc(ln.no) +
            '" maxlength="240" autocomplete="off" spellcheck="false" aria-label="Aufgabe ' + esc(ln.no) + '">');
        } else {
          inner += '<p class="sli' + (ln.bullet ? ' b' : '') + (ln.dash ? ' d' : '') + '">' + esc(ln.text) + '</p>';
        }
      });
      return '<section class="card slide">' + inner + '</section>';
    }).join('');
  }

  /* ---------- module models ---------- */
  var SENT = {}, STMT = {};
  function sumW(items) { return items.reduce(function (a, it) { return a + it.w; }, 0); }
  function buildLesen() {
    var L = T.lesen, pages = [], items = [];
    function reg(list, type, teil, page, w) {
      list.forEach(function (it) { items.push({ no: it.no, type: type, answer: it.answer, teil: teil, page: page, w: w, src: it }); });
    }
    // Teil 1: Saetze in Luecken
    var t1 = L.t1;
    t1.sentences.forEach(function (s) { SENT[s.letter] = s.text; });
    pages.push({ key: 'L1', teil: 1, title: 'Lesen Teil 1', inst: [t1.instruction, t1.intro], leftTitle: 'Text', rightTitle: 'Aufgaben 1–6',
      left: artHTML(t1, { sent: true, text: t1.example.text }),
      right: '<div class="selgrid">' + t1.items.map(function (it) { return selCompact(it, 'Lücke ' + it.no, L8); }).join('') + '</div>' +
        '<p class="rh">Sätze a–h</p>' + hlistHTML(t1.sentences) });
    reg(t1.items, 'sent', 1, 0, 2);
    // Teil 2: Absatz finden
    var t2 = L.t2;
    pages.push({ key: 'L2', teil: 2, title: 'Lesen Teil 2', inst: [t2.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben 7–12',
      left: (t2.title ? '<h3 class="h1t">' + esc(t2.title) + '</h3>' : '') + sectionsHTML(t2.sections),
      right: '<p class="leadq">' + esc(t2.itemsLead) + '</p>' +
        exBlock('<p class="qt">' + esc(t2.example.stem) + '</p>' + secOpts('ex', t2.example.answer, true)) + t2.items.map(secItem).join('') });
    reg(t2.items, 'sec', 2, 1, 2);
    // Teil 3: richtig / falsch / nicht im Text + Ueberschrift
    var t3 = L.t3, hd = t3.headline;
    var hdItem = { no: hd.no, stem: hd.instruction, short: 'Passende Überschrift zum Text', options: hd.options, answer: hd.answer };
    pages.push({ key: 'L3', teil: 3, title: 'Lesen Teil 3', inst: [t3.instruction], leftTitle: 'Text', rightTitle: 'Aufgaben 13–24',
      left: artHTML(t3),
      right: '<p class="leadq">' + esc(t3.itemsLead) + '</p>' + t3.items.map(rfnItem).join('') + '<p class="rh mt">Aufgabe ' + esc(hd.no) + '</p>' + abcItem(hdItem) });
    reg(t3.items, 'rfn', 3, 2, 2);
    reg([hdItem], 'abc', 3, 2, 2);
    // Sprachbausteine
    var sb = L.sb, ex = sb.example;
    pages.push({ key: 'S1', teil: 4, title: 'Sprachbausteine', inst: [sb.instruction], leftTitle: 'Text', rightTitle: 'Lücken 25–46',
      left: artHTML(sb, { sent: false, text: ex.options[ex.answer] }),
      right: exBlock('<p class="qt"><b>Lücke 0</b></p><div class="opts row w">' +
        'abcd'.split('').map(function (k) { return optRow('ex', k, ex.options[k], k, k === ex.answer, true); }).join('') + '</div>') + sb.items.map(sbItem).join('') });
    reg(sb.items, 'sb', 4, 3, 1);
    return { pages: pages, items: items, teile: [1, 2, 3, 4], two: true, max: sumW(items),
      labels: { 1: 'Lesen 1', 2: 'Lesen 2', 3: 'Lesen 3', 4: 'Sprachbausteine' } };
  }

  function buildHoeren() {
    var H = T.hoeren, pages = [], items = [], h1 = H.t1, h2 = H.t2, h3 = H.t3;
    function range(n) { return 'Aufgaben ' + n[0].no + '–' + n[n.length - 1].no; }
    // Teil 1: Aussagen zuordnen
    h1.statements.forEach(function (s) { STMT[s.letter] = s.text; });
    pages.push({ key: 'H1', teil: 1, title: 'Hören Teil 1', inst: [h1.instruction, h1.readNote], rightTitle: range(h1.items),
      right: (h1.title ? '<h3 class="h1t">' + esc(h1.title) + '</h3>' : '') +
        '<div class="selgrid">' + h1.items.map(function (it) { return selCompact(it, it.label, L10); }).join('') + '</div>' +
        '<p class="rh">Aussagen a–j</p>' + hlistHTML(h1.statements) });
    h1.items.forEach(function (it) { items.push({ no: it.no, type: 'h1', answer: it.answer, teil: 1, page: 0, w: 1, src: it }); });
    // Teil 2: a / b / c
    pages.push({ key: 'H2', teil: 2, title: 'Hören Teil 2', inst: [h2.instruction, h2.readNote], rightTitle: range(h2.items), right: h2.items.map(abcItem).join('') });
    h2.items.forEach(function (it) { items.push({ no: it.no, type: 'abc', answer: it.answer, teil: 2, page: 1, w: 2, src: it }); });
    // Teil 3: Notizen zum Vortrag (freie Eingabe, Selbstbewertung)
    var lineText = {};
    h3.slides.forEach(function (sl) { sl.lines.forEach(function (ln) { if (ln.no && ln.no !== '0') lineText[ln.no] = ln.text; }); });
    h3.items.forEach(function (it) { it.text = lineText[it.no] || ''; });
    pages.push({ key: 'H3', teil: 3, title: 'Hören Teil 3', inst: [h3.instruction, h3.exampleNote, h3.readNote], rightTitle: range(h3.items), right: slidesHTML(h3) });
    h3.items.forEach(function (it) { items.push({ no: it.no, type: 'note', answer: it.solution, teil: 3, page: 2, w: 2, src: it }); });
    return { pages: pages, items: items, teile: [1, 2, 3], two: false, max: sumW(items), labels: { 1: 'Teil 1', 2: 'Teil 2', 3: 'Teil 3' } };
  }

  function themeHTML(th) {
    var h = '<div class="task">' + para(th.paragraphs);
    if (th.quotes && th.quotes.length) {
      h += '<p class="ctxl">' + esc(th.quoteLead) + '</p><div class="quotes">' + th.quotes.map(function (q) { return '<blockquote>' + esc(q) + '</blockquote>'; }).join('') + '</div>';
    }
    return h + '</div>';
  }
  function buildSchreiben() {
    var W = T.schreiben;
    var pages = W.themes.map(function (th, i) {
      return { key: 'W' + th.no, teil: i + 1, title: 'Thema ' + th.no, leftTitle: 'Thema ' + th.no, left: '<p class="inst">' + esc(W.instruction) + '</p>' + themeHTML(th), theme: th };
    });
    return { pages: pages, items: [], teile: [1, 2], two: true, writing: true, labels: { 1: 'Thema 1', 2: 'Thema 2' } };
  }

  var M = R.mod === 'lesen' ? buildLesen() : R.mod === 'hoeren' ? buildHoeren() : buildSchreiben();
  var ITEM = {};
  M.items.forEach(function (it) { ITEM[it.no] = it; });

  /* ---------- state ---------- */
  var S = null;
  var timerId = null, lastTick = 0, saveTimer = null, lastSave = 0, warned = {};
  var markMode = false, audioAllowPause = false, audioLastPos = 0, advanceTimer = null, probeTimer = null;

  function freshState() {
    return { build: D.build, page: 0, remaining: MOD[R.mod].minutes * 60, answers: {}, marks: {}, texts: { 1: '', 2: '' },
      started: Date.now(), audio: { track: 0, pos: 0, done: false }, font: (lsGet('font') || 0) };
  }
  function save() { if (S) { S.saved = Date.now(); lsSet(STATE_KEY, S); lastSave = Date.now(); } }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }

  /* ---------- top bar ---------- */
  function topHTML(running) {
    var sec = S ? S.remaining : MOD[R.mod].minutes * 60;
    var f = S ? S.font : (lsGet('font') || 0);
    return '<header class="top">' +
      '<img class="logo" src="' + LOGO + '" alt="Sophia Deutsch Akademie">' +
      '<div class="id"><b><span class="gz">telc Deutsch </span>C1 Hochschule · ' + MOD[R.mod].name + '</b><span>Modelltest ' + esc(T.roman) + ' · Übungsprüfung im digitalen Format · Sophia Deutsch Akademie</span></div>' +
      '<div class="sp"></div><div class="tool">' +
      (running && R.mod === 'hoeren' ? '<div class="vol" id="vol" title="Lautstärke">' + ICON.vol + '<input type="range" min="0" max="100" step="1" id="volr" aria-label="Lautstärke"></div>' : '') +
      (running ? '<button class="hlp" id="help" type="button" title="Hilfe: Tutorial noch einmal ansehen" aria-label="Hilfe">?</button>' : '') +
      (running ? '<div class="fz" id="fz" role="group" aria-label="Schriftgröße">' +
        [0, 1, 2].map(function (i) { return '<button type="button" class="s' + (i + 1) + '" data-fz="' + i + '" aria-pressed="' + (f === i) + '" aria-label="Schriftgröße ' + (i + 1) + '">A</button>'; }).join('') + '</div>' : '') +
      '<div class="timer" id="tm" role="timer" aria-live="off">' + ICON.clock + '<div class="tl"><small>Verbleibende Zeit</small><b id="tmv">' + fmt(sec) + '</b></div></div>' +
      '</div></header>';
  }

  /* ---------- start page ---------- */
  function showStart() {
    stopAll();
    var saved = lsGet(STATE_KEY), res = lsGet(RESULT_KEY);
    var info = MOD[R.mod];
    var facts = R.mod === 'lesen' ? ['90 Minuten', 'Lesen 1–3 · Sprachbausteine', '46 Aufgaben', '70 Punkte']
      : R.mod === 'hoeren' ? [MOD.hoeren.minutes + ' Minuten', '3 Teile', '28 Aufgaben', 'Alle Hörtexte nur einmal', 'Kopfhörer empfohlen', '48 Punkte']
      : ['70 Minuten', 'Ein Thema zur Wahl', 'mindestens 350 Wörter', '48 Punkte'];
    var rules = {
      lesen: [
        ['Dieses Modul enthält Leseverstehen (Teil 1–3) und Sprachbausteine. Alle vier Teile haben zusammen 90 Minuten Zeit. Die Reihenfolge der Teile können Sie selbst wählen.', '읽기(Teil 1–3)와 어휘·문법(Sprachbausteine)을 합쳐 90분입니다. Teil 순서는 자유롭게 정할 수 있습니다.'],
        ['Links sehen Sie den Text, rechts die Aufgaben. In Teil 1 ordnen Sie Sätze den Lücken zu, in Teil 2 suchen Sie den passenden Absatz, in Teil 3 entscheiden Sie zwischen richtig, falsch und „steht nicht im Text“.', '왼쪽은 지문, 오른쪽은 문항입니다. Teil 1은 빈칸에 맞는 문장 고르기, Teil 2는 해당 문단 고르기, Teil 3은 richtig · falsch · nicht im Text 고르기입니다.'],
        ['In Teil 1 und in den Sprachbausteinen erscheint Ihre Antwort direkt in der Lücke des Textes. Mit einem Klick auf die Lücke springen Sie zur Aufgabe.', 'Teil 1과 어휘·문법에서는 고른 답이 지문의 빈칸에 바로 들어갑니다. 빈칸을 누르면 해당 문항으로 이동합니다.'],
        ['Mit „Markieren“ können Sie Textstellen farbig hervorheben.', '‘Markieren’을 켜고 드래그하면 지문에 형광펜을 칠할 수 있습니다.'],
        ['Sie können Ihre Antworten bis zum Ende der Prüfungszeit ändern. Danach wird das Modul automatisch abgegeben.', '시간이 끝날 때까지 답을 고칠 수 있고, 시간이 끝나면 자동으로 제출됩니다.']
      ],
      hoeren: [
        ['Die drei Hörtexte werden automatisch nacheinander abgespielt. Sie hören jeden Text nur einmal. Sie können nicht anhalten oder zurückspulen.', '음원 3개가 자동으로 이어서 재생됩니다. 각 음원은 한 번만 들려주며, 멈추거나 되감을 수 없습니다.'],
        ['Der Bildschirm wechselt mit dem Hörtext automatisch zum nächsten Teil. Lesen Sie die Aufgaben schon vor dem Hören; die Aufnahme nennt die Lesezeit. Frühere Teile können Sie wieder öffnen und Antworten ändern.', '음원에 맞춰 화면이 다음 Teil로 넘어갑니다. 듣기 전에 문항을 미리 읽으세요(읽는 시간은 음원 안에 있습니다). 지나간 Teil은 다시 열어 답을 고칠 수 있습니다.'],
        ['Teil 1: Ordnen Sie jeder Person eine Aussage zu (zwei Aussagen bleiben übrig). Teil 2: Wählen Sie a, b oder c. Teil 3: Schreiben Sie Stichworte in die freien Zeilen.', 'Teil 1: 화자마다 맞는 문장을 고릅니다(문장 2개는 남습니다). Teil 2: a, b, c 중에서 고릅니다. Teil 3: 입력란에 단어를 입력합니다.'],
        ['Teil 3 wird nicht automatisch bewertet. Nach der Abgabe vergleichen Sie Ihre Notizen mit der Musterlösung und bewerten sich selbst.', '3부는 자동 채점이 되지 않습니다. 제출한 뒤 정답 예시를 보고 스스로 채점합니다.'],
        ['Stellen Sie die Lautstärke vor dem Start ein. Verwenden Sie am besten Kopfhörer.', '시작 전에 음량을 맞추세요. 헤드폰 사용을 권합니다.']
      ],
      schreiben: [
        ['Wählen Sie eines der beiden Themen und schreiben Sie einen Text, in dem Sie Ihren eigenen Standpunkt erarbeiten und argumentativ darlegen. Der Text soll mindestens 350 Wörter umfassen.', '두 주제 중 하나를 골라 내 입장을 이유와 예를 들어 쓰는 글을 씁니다. 350단어 이상이어야 합니다.'],
        ['Mit „Thema 1“ und „Thema 2“ wechseln Sie zwischen den Aufgaben. Zu jedem Thema stehen zwei Zitate, die Ihnen erste Ideen geben. Schreiben Sie nur zu einem Thema: In der Prüfung wird ein Text bewertet.', '‘Thema 1’, ‘Thema 2’ 버튼으로 과제를 바꿉니다. 주제마다 아이디어를 주는 인용문이 두 개 있습니다. 시험에서는 하나만 평가됩니다. 한 주제로만 쓰세요.'],
        ['Schreiben Sie Ihren Text in das Textfeld. Die Wörter werden automatisch gezählt. Es gibt keine Rechtschreibkorrektur.', '입력란에 글을 쓰면 단어 수가 자동으로 계산됩니다. 맞춤법 자동 교정은 없습니다.'],
        ['Umlaute und ß können Sie mit den Sonderzeichen-Tasten einfügen.', 'ä, ö, ü, ß는 특수문자 버튼으로 넣을 수 있습니다.'],
        ['Bewertet wird nur der Text im Textfeld. Nach Ablauf der Zeit wird das Modul automatisch abgegeben.', '입력란의 글만 평가 대상이며, 시간이 끝나면 자동으로 제출됩니다.']
      ]
    }[R.mod];
    var resumeOK = saved && saved.remaining > 1;
    var h = '<div class="page">' + topHTML(false) + '<main class="pgm"><section class="sheet">' +
      '<p class="ey">Modelltest ' + esc(T.roman) + ' · Modul ' + info.name + '</p>' +
      '<h1>telc Deutsch C1 Hochschule · ' + info.full + '</h1>' +
      '<p class="sl">Übungsprüfung im digitalen Format — wie am Computer im Prüfungszentrum.</p>' +
      '<div class="facts">' + facts.map(function (f) { return '<span>' + esc(f) + '</span>'; }).join('') + '</div>' +
      '<div class="rules"><h2>Hinweise</h2><ul>' + rules.map(function (r) { return '<li>' + esc(r[0]) + '<small>' + esc(r[1]) + '</small></li>'; }).join('') + '</ul></div>' +
      '<div class="namef"><label for="nm">Name (für das Ergebnis) · 이름</label><input id="nm" autocomplete="name" maxlength="40" value="' + esc(lsGet('name') || '') + '"></div>';
    if (R.mod === 'hoeren') {
      h += '<div class="rules" style="margin-top:-6px"><h2>Tonprobe</h2><div class="acts"><div class="vol">' + ICON.vol +
        '<input type="range" min="0" max="100" step="1" id="volr0" aria-label="Lautstärke"></div><button class="btn sm" id="probe" type="button">Tonprobe abspielen</button></div>' +
        '<p class="note" style="margin-top:8px">Spielt die ersten Sekunden von Teil 1 ab. · 음량 확인용으로 Teil 1 앞부분을 몇 초 들려줍니다.</p></div>';
    }
    h += '<div class="acts">';
    if (resumeOK) {
      h += '<button class="btn pri" id="resume" type="button">Prüfung fortsetzen (' + fmt(saved.remaining) + ')</button><button class="btn" id="restart" type="button">Neu beginnen</button>';
    } else {
      h += '<button class="btn pri" id="tour" type="button">Tutorial ansehen und starten</button><button class="btn out" id="go" type="button">Ohne Tutorial starten</button>';
    }
    if (res) h += '<button class="btn" id="seeres" type="button">Letztes Ergebnis</button>';
    h += '</div><p class="note">Die Prüfungszeit beginnt erst, wenn Sie auf „Starten“ klicken. · 시작 버튼을 눌러야 시간이 흐릅니다. 시험 중 창을 닫으면 그 시점까지 저장되고, 다시 열면 이어서 풀 수 있습니다.</p>' +
      '<a class="back" href="' + BACK + '">← Modelltest ' + esc(T.roman) + ' · 모듈 선택</a></section></main></div>';
    app.innerHTML = h;
    var nm = $('#nm');
    nm.addEventListener('input', function () { lsSet('name', nm.value.trim()); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr0'); vr.value = Math.round(getVol() * 100);
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
      $('#probe').addEventListener('click', function () {
        var b = this;
        if (curSrc() !== T.audio[0].src) AUD.src = T.audio[0].src;
        else { try { AUD.currentTime = 0; } catch (e) { /* ignore */ } }
        AUD.volume = getVol();
        var p = AUD.play();
        b.disabled = true; b.textContent = 'Tonprobe läuft …';
        clearTimeout(probeTimer);
        probeTimer = setTimeout(function () {
          probeTimer = null;
          if (!timerId) { audioAllowPause = true; AUD.pause(); audioAllowPause = false; }
          b.disabled = false; b.textContent = 'Tonprobe abspielen';
        }, 6000);
        if (p && p.catch) p.catch(function () { b.disabled = false; b.textContent = 'Tonprobe abspielen'; toast('Audio konnte nicht abgespielt werden.', true); });
      });
    }
    if ($('#tour')) $('#tour').addEventListener('click', function () { begin(freshState(), true); });
    if ($('#go')) $('#go').addEventListener('click', function () { begin(freshState(), false); });
    if ($('#resume')) $('#resume').addEventListener('click', function () { begin(saved, false); });
    if ($('#restart')) $('#restart').addEventListener('click', function () {
      modal('Neu beginnen?', ['Ihre bisherigen Antworten in diesem Modul werden gelöscht.', '지금까지의 답이 지워집니다.'], [
        { label: 'Abbrechen' },
        { label: 'Neu beginnen', pri: true, fn: function () { lsDel(STATE_KEY); showStart(); } }
      ]);
    });
    if ($('#seeres')) $('#seeres').addEventListener('click', function () { showResult(res); });
    window.scrollTo(0, 0);

    $('#ast').innerHTML = esc(main) + (extra ? '<span class="sx">' + esc(extra) + '</span>' : '');
    var pos = S.audio.done ? dur : (curSrc() === (T.audio[i] && T.audio[i].src) ? AUD.currentTime : S.audio.pos) || 0;
    $('#apg').style.width = (S.audio.done ? 100 : Math.min(100, dur ? pos / dur * 100 : 0)) + '%';
    $('#atm').textContent = S.audio.done ? '' : fmt(pos) + ' / ' + fmt(dur);
  }

  /* ---------- submit / finish ---------- */
  function nTexts(texts) { return [1, 2].filter(function (k) { return String((texts || {})[k] || '').trim(); }).length; }
  function countOpen() {
    if (M.writing) return nTexts(S.texts) ? 0 : 1;
    return M.items.filter(function (it) { return S.answers[it.no] == null; }).length;
  }
  function askSubmit() {
    var open = countOpen();
    var de, ko;
    if (M.writing) {
      var n = nTexts(S.texts), wc = Math.max(wordCount(S.texts[1]), wordCount(S.texts[2]));
      if (!n) {
        de = 'Sie haben noch keinen Text geschrieben. Möchten Sie das Modul trotzdem abgeben?';
        ko = '아직 아무 글도 쓰지 않았습니다. 그래도 제출할까요?';
      } else if (n === 2) {
        de = 'Sie haben zu beiden Themen geschrieben. In der Prüfung wird nur ein Text bewertet. Möchten Sie das Modul jetzt abgeben?';
        ko = '두 주제 모두 글을 썼습니다. 시험에서는 하나만 평가됩니다. 지금 제출할까요? 제출하면 더 이상 고칠 수 없습니다.';
      } else {
        de = 'Möchten Sie das Modul jetzt abgeben? Danach können Sie Ihren Text nicht mehr ändern.';
        ko = '지금 제출할까요? 제출하면 더 이상 고칠 수 없습니다.';
        if (wc < WORDS_MIN) {
          de = 'Ihr Text hat erst ' + wc + ' Wörter (verlangt: mindestens ' + WORDS_MIN + '). Möchten Sie das Modul trotzdem abgeben?';
          ko = '글이 아직 ' + wc + '단어입니다(' + WORDS_MIN + '단어 이상이어야 합니다). 그래도 제출할까요?';
        }
      }
    } else {
      de = open ? 'Sie haben noch ' + open + ' offene ' + (open === 1 ? 'Aufgabe' : 'Aufgaben') + '. Möchten Sie das Modul trotzdem abgeben?' : 'Sie haben alle Aufgaben bearbeitet. Möchten Sie das Modul jetzt abgeben?';
      ko = open ? '아직 풀지 않은 문항이 ' + open + '개 있습니다. 그래도 제출할까요?' : '모든 문항을 풀었습니다. 지금 제출할까요?';
      if (R.mod === 'hoeren' && !S.audio.done) { de += ' Der Hörtext wird dann beendet.'; ko += ' 음원 재생도 끝납니다.'; }
    }
    modal('Modul abgeben', [de, ko], [{ label: 'Zurück zur Prüfung' }, { label: 'Abgeben', pri: true, fn: function () { finish(false); } }]);
  }

  /* self: Selbstbewertung der Notizen (Hören Teil 3): 1 = richtig, 0 = falsch, fehlt = noch nicht bewertet (zählt 0 Punkte) */
  function score(ans, self) {
    ans = ans || {}; self = self || {};
    var per = {}, correct = 0, rows = [], pts = 0, pending = 0;
    M.items.forEach(function (it) {
      var g = ans[it.no], note = it.type === 'note', rated = true, ok;
      if (note) { rated = self[it.no] === 1 || self[it.no] === 0; ok = self[it.no] === 1; if (!rated) pending++; }
      else ok = g != null && g === it.answer;
      if (!per[it.teil]) per[it.teil] = { c: 0, n: 0, p: 0, max: 0 };
      per[it.teil].n++; per[it.teil].max += it.w;
      if (ok) { per[it.teil].c++; per[it.teil].p += it.w; correct++; pts += it.w; }
      rows.push({ no: it.no, teil: it.teil, g: g == null ? null : g, a: it.answer, ok: ok, note: note, rated: rated });
    });
    return { correct: correct, total: M.items.length, points: pts, max: M.max, percent: Math.round(pts * 100 / M.max), per: per, rows: rows, pending: pending };
  }

  function finish(byTime) {
    if (R.mod === 'lesen') saveMarks();
    stopAll();
    var res = { v: 1, build: D.build, mt: R.mt, mod: R.mod, name: lsGet('name') || '', finished: nowStr(), byTime: !!byTime,
      used: Math.round(MOD[R.mod].minutes * 60 - Math.max(0, S.remaining)) };
    if (M.writing) res.texts = { 1: S.texts[1] || '', 2: S.texts[2] || '' };
    else { res.answers = S.answers; res.self = {}; res.score = score(S.answers, res.self); }
    lsSet(RESULT_KEY, res);
    lsDel(STATE_KEY);
    S = null;
    showEnd(res);
  }

  function showEnd(res) {
    var ans = M.writing ? (nTexts(res.texts) ? (nTexts(res.texts) === 1 ? '1 Text abgegeben' : '2 Texte abgegeben') : 'kein Text geschrieben')

    app.innerHTML = '<div class="page">' + topHTML(false).replace(/<b id="tmv">[^<]*<\/b>/, '<b id="tmv">' + (res.byTime ? '00:00' : '—') + '</b>') + '<main class="pgm"><section class="sheet">' +
      '<p class="ey">Modelltest ' + esc(T.roman) + ' · Modul ' + MOD[R.mod].name + '</p>' +

      '<p class="sl" style="margin-top:4px">' + (res.byTime ? '시험 시간이 끝나 자동으로 제출되었습니다.' : '제출이 완료되었습니다.') + ' 결과 화면에서 ' + (M.writing ? '답안을 확인하고 선생님께 보낼 수 있습니다.' : '점수와 정답을 확인하세요.') + '</p>' +
      '<div class="acts" style="margin-top:22px"><button class="btn pri" id="toRes" type="button">' + (M.writing ? 'Meine Texte ansehen · 답안 보기' : 'Ergebnis ansehen · 결과 보기') + '</button>' +
      '<a class="btn" href="' + BACK + '">Zur Modulübersicht</a></div></section></main></div>';
    $('#toRes').addEventListener('click', function () { showResult(res); });
    window.scrollTo(0, 0);
  }

  /* ---------- results ---------- */
  function ansLabel(it, v) {
    if (v == null || v === '') return '—';
    if (it.type === 'note') return String(v);
    if (it.type === 'rfn') return { r: 'richtig (r)', f: 'falsch (f)', n: 'steht nicht im Text (–)' }[v] || v;
    if (it.type === 'abc' || it.type === 'sb') return v + ') ' + (it.src.options[v] || '');
    if (it.type === 'sent') return v + ') ' + (SENT[v] || '');
    if (it.type === 'h1') return v + ') ' + (STMT[v] || '');
    if (it.type === 'sec') return 'Absatz ' + v;
    return v;
  }
  function itemPrompt(it) {
    var s = it.src;
    if (it.type === 'sent' || it.type === 'sb') return 'Lücke ' + s.no;
    if (it.type === 'h1') return s.label;
    if (it.type === 'sec') return 'In welchem Abschnitt … ' + s.stem;
    return s.short || s.stem || s.text || '';
  }
  function selfWord(v) { return v === 1 ? 'richtig' : v === 0 ? 'falsch' : 'offen'; }
  function resultText(res) {
    var lines = ['telc Deutsch C1 Hochschule · Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + ' (digital)', 'Name: ' + (res.name || '-'), 'Datum: ' + res.finished,
      'Bearbeitungszeit: ' + fmt(res.used) + (res.byTime ? ' (Zeit abgelaufen)' : '')];
    if (res.score) {
      var sc = res.score, self = res.self || {};
      lines.push('Ergebnis: ' + sc.correct + '/' + sc.total + ' richtig · ' + fp(sc.points) + ' von ' + sc.max + ' Punkten (' + sc.percent + ' %)');
      lines.push('Teile: ' + Object.keys(sc.per).map(function (k) { return M.labels[k] + ' ' + sc.per[k].c + '/' + sc.per[k].n + ' (' + fp(sc.per[k].p) + ' P.)'; }).join(' · '));
      var wrong = sc.rows.filter(function (r) { return !r.ok; });
      if (wrong.length) {
        lines.push('', 'Falsch / offen:');
        wrong.forEach(function (r) {
          if (r.note) lines.push('  ' + r.no + ': ' + (r.g == null ? 'offen' : r.g) + ' → Musterlösung: ' + r.a + ' (Selbstbewertung: ' + selfWord(self[r.no]) + ')');
          else lines.push('  ' + r.no + ': ' + (r.g == null ? 'offen' : r.g) + ' → Lösung ' + r.a);
        });
      }
      if (sc.pending) lines.push('', 'Hinweis: ' + sc.pending + ' Notizen (Teil 3) sind noch nicht selbst bewertet.');
    } else {
      var any = false;
      T.schreiben.themes.forEach(function (th, i) {
        var tx = res.texts[i + 1] || '';
        if (tx.trim()) { any = true; lines.push('', '— Thema ' + th.no + ' · ' + wordCount(tx) + ' Wörter —', tx.trim()); }
      });
      if (!any) lines.push('', '(kein Text)');
    }
    return lines.join('\n');
  }
  function fp(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }
  function copyText(txt) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '복사했습니다.' : '복사하지 못했습니다. 텍스트를 직접 선택해 복사하세요.', !ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {

    } else fallback();

  function downloadText(txt, name) {

      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
    } catch (e) { toast('파일을 저장하지 못했습니다.', true); }
  }

  function showResult(res, keep) {
    stopAll();
    var h = '<div class="page">' + topHTML(false).replace(/<div class="timer"[\s\S]*?<\/div><\/div>/, '') + '<main class="pgm"><section class="sheet" style="max-width:880px">' +

        '<p class="note" style="margin:0 0 12px">' + (R.mod === 'lesen' ? 'Leseverstehen 46 Aufgaben = 70 Punkte (Teil 1–3 je 2 Punkte, Sprachbausteine je 1 Punkt).' : 'Hörverstehen 48 Punkte (Teil 1 je 1 Punkt, Teil 2 und 3 je 2 Punkte).') +
        ' 실제 telc 시험에서는 필기 전체(166점)의 60 %(99점) 이상이 필요합니다. 60 %는 이 모듈만 볼 때의 참고 기준입니다.</p>';
      if (hasNotes) {

          '. · 3부(65–74번)는 자동 채점이 되지 않습니다. 정답 예시를 보고 내용이 맞으면 ✓, 아니면 ✗를 눌러 스스로 채점하세요. 누르기 전까지는 0점으로 계산됩니다.</p>';
      }
      h += '<table class="rv"><thead><tr><th>Nr.</th><th>Aufgabe</th><th>Ihre Antwort</th><th>' + (hasNotes ? 'Lösung / Musterlösung' : 'Lösung') + '</th><th></th></tr></thead><tbody>';
      var lastT = 0, self = res.self || {};
      sc.rows.forEach(function (r) {
        var it = ITEM[r.no]; if (!it) return;
        if (r.teil !== lastT) { h += '<tr class="tp"><td colspan="5">' + esc(M.labels[r.teil]) + '</td></tr>'; lastT = r.teil; }
        var mark, cls;

          mark = '<span class="rate" data-no="' + esc(r.no) + '"><button type="button" data-v="1" class="' + (sv === 1 ? 'on' : '') + '" aria-pressed="' + (sv === 1) + '" aria-label="Aufgabe ' + esc(r.no) + ' richtig">✓</button>' +
            '<button type="button" data-v="0" class="no' + (sv === 0 ? ' on' : '') + '" aria-pressed="' + (sv === 0) + '" aria-label="Aufgabe ' + esc(r.no) + ' falsch">✗</button></span>';
          cls = r.rated ? (r.ok ? 'ok' : 'no') : 'pend';
        } else { mark = r.ok ? '✓' : '✗'; cls = r.ok ? 'ok' : 'no'; }
        h += '<tr class="' + cls + '"><td class="n">' + esc(r.no) + '</td><td class="rvq">' + esc(itemPrompt(it)) + '</td><td class="g">' + esc(ansLabel(it, r.g)) + '</td><td>' + esc(ansLabel(it, r.a)) +
          '</td><td class="m' + (r.note ? ' r' : '') + '">' + mark + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="links">' +
        (pg.loesung ? '<a class="btn sm" href="' + pdf + '#page=' + pg.loesung + '" target="_blank" rel="noopener">Lösungsschlüssel (PDF S. ' + pg.loesung + ')</a>' : '') +
        (pg.kommentar ? '<a class="btn sm" href="' + pdf + '#page=' + pg.kommentar + '" target="_blank" rel="noopener">Kommentar für Lehrende (S. ' + pg.kommentar + ')</a>' : '') +
        (R.mod === 'hoeren' && pg.hoertexte ? '<a class="btn sm" href="' + pdf + '#page=' + pg.hoertexte + '" target="_blank" rel="noopener">Hörtexte (S. ' + pg.hoertexte + ')</a>' : '') + '</div>';
    } else {
      T.schreiben.themes.forEach(function (th, i) {
        var tx = res.texts[i + 1] || '', wc = wordCount(tx), m = th.model;
        h += '<div class="wtask"><h3>Thema ' + esc(th.no) + '<small>' + (tx.trim() ? wc + ' Wörter' + (wc < WORDS_MIN ? ' · unter ' + WORDS_MIN : '') : 'nicht bearbeitet') + '</small></h3>';
        if (tx.trim()) h += '<pre>' + esc(tx) + '</pre>';
        if (m && m.paragraphs && m.paragraphs.length) {
          h += '<details><summary>Musterlösung · Thema ' + esc(th.no) + '</summary><div class="mdl">' + (m.title ? '<p><b>' + esc(m.title) + '</b></p>' : '') +

            (m.hint ? '<p class="note" style="margin:8px 0 0"><b>Hinweis:</b> ' + esc(m.hint) + '</p>' : '') + '</details>';
        }

      h += '<div class="links">' + (pg.muster ? '<a class="btn sm" href="' + pdf + '#page=' + pg.muster + '" target="_blank" rel="noopener">Musterlösung (PDF S. ' + pg.muster + ')</a>' : '') + '</div>';
    }
    h += '<div class="acts" style="margin-top:22px"><button class="btn pri" id="cp" type="button">' + (M.writing ? '답안 복사' : '결과 복사') + '</button>' +
      '<button class="btn" id="dl" type="button">txt로 저장</button><button class="btn" id="ml" type="button">메일로 보내기</button>' +
      '<button class="btn" id="again" type="button">다시 풀기</button><a class="btn" href="' + BACK + '">모듈 선택</a></div>' +
      '<a class="back" href="index.html#digital">← 디지털 시험 목록</a></section></main></div>';
    app.innerHTML = h;
    var txt = resultText(res);

    $('#cp').addEventListener('click', function () { copyText(txt); });
    $('#dl').addEventListener('click', function () { downloadText(txt, fname.replace(/[\\/:*?"<>|_]+/g, ' ')); });

  }

  /* ---------- overlays ---------- */
  function modal(title, lines, buttons, blocking) {
    var bg = document.createElement('div');
    bg.className = 'mbg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdt"><h3 id="mdt">' + esc(title) + '</h3>' +
      lines.map(function (l, i) { return '<p class="' + (i ? 'ko' : '') + '">' + esc(l) + '</p>'; }).join('') +
      '<div class="mb">' + buttons.map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';
    document.body.appendChild(bg);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    close.el = bg;
    function onKey(e) { if (e.key === 'Escape' && !blocking) close(); }
    document.addEventListener('keydown', onKey);
    $$('button', bg).forEach(function (btn) {
      btn.addEventListener('click', function () { var b = buttons[+btn.getAttribute('data-i')]; close(); if (b.fn) b.fn(); });
    });
    if (!blocking) bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    var pri = $('.btn.pri', bg) || $('.btn', bg); if (pri) pri.focus();
    return close;
  }
  var toastTimer = null;
  function toast(msg, warn) {
    var t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.toggle('w', !!warn); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }
  function openOverview() {
    if (M.writing) return;
    var reach = maxReachable();
    var h = '<div class="ovgrid">', last = 0;
    M.items.forEach(function (it) {
      if (it.teil !== last) { h += '<span class="tp">' + esc(M.labels[it.teil]) + '</span>'; last = it.teil; }
      var ans = S.answers[it.no] != null;
      h += '<button class="chip' + (ans ? ' ans' : '') + '" type="button" data-no="' + esc(it.no) + '"' + (it.page > reach ? ' disabled' : '') + '>' + esc(it.no) + '</button>';
    });
    h += '</div>';
    var close = modal('Aufgabenübersicht', [countOpen() + ' offene Aufgaben', '번호를 누르면 그 문항으로 이동합니다.'], [{ label: 'Schließen' }]);
    var md = $('.modal', close.el);
    md.insertAdjacentHTML('beforeend', h);
    $$('.ovgrid .chip', md).forEach(function (c) { c.addEventListener('click', function () { close(); jumpTo(c.getAttribute('data-no')); }); });
  }

  /* ---------- tutorial ---------- */
  var tourEls = null;
  function tourSteps() {
    var common = [
      ['#tm', timerId ? 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft weiter, während Sie das Tutorial ansehen.' : 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft erst, wenn Sie die Prüfung starten.',
        timerId ? '남은 시험 시간입니다. 튜토리얼을 보는 동안에도 시간은 흐릅니다.' : '남은 시험 시간입니다. 시험을 시작해야 시간이 흐릅니다.']
    ];
    if (R.mod === 'lesen') return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen den vier Teilen: Lesen 1–3 und Sprachbausteine. Die Zahl zeigt, wie viele Aufgaben Sie im Teil schon gelöst haben.', '네 Teil(읽기 1–3, 어휘·문법) 사이를 이동합니다. 숫자는 그 Teil에서 푼 문항 수입니다.'],
      ['#paneL', 'Links steht der Text. In Teil 1 und in den Sprachbausteinen erscheint Ihre Antwort direkt in der Lücke. Mit einem Klick auf die Lücke springen Sie zur Aufgabe.', '왼쪽에는 지문이 있습니다. Teil 1과 어휘·문법에서는 고른 답이 빈칸에 바로 들어가고, 빈칸을 누르면 그 문항으로 이동합니다.'],
      ['#paneR', 'Rechts stehen die Aufgaben. Wählen Sie die richtige Lösung aus. Sie können Ihre Antwort jederzeit ändern.', '오른쪽에는 문항이 있습니다. 정답을 고르세요. 답은 언제든 바꿀 수 있습니다.'],
      ['#mk', 'Mit „Markieren“ heben Sie wichtige Textstellen farbig hervor: einschalten, dann Text mit der Maus markieren. Ein Klick auf die Markierung löscht sie wieder.', '‘Markieren’을 켜고 지문을 드래그하면 형광펜이 칠해집니다. 칠한 곳을 누르면 지워집니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'In der Aufgabenübersicht sehen Sie, welche Aufgaben schon beantwortet (blau) und welche noch offen sind. Mit einem Klick springen Sie direkt zur Aufgabe.', '문항 번호표에서 푼 문항(파랑)과 남은 문항을 확인하고, 번호를 눌러 바로 이동합니다.'],
      ['#nav', 'Mit „Weiter“ und „Zurück“ blättern Sie. Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '‘Weiter’와 ‘Zurück’으로 넘기고, 다 풀면 ‘Abgeben’을 누릅니다.']
    ]);
    if (R.mod === 'hoeren') return common.concat([
      ['#vol', 'Hier stellen Sie die Lautstärke ein.', '음량을 조절합니다.'],
      ['#abar', 'Hier sehen Sie, welcher Hörtext gerade läuft. Die Hörtexte starten automatisch und laufen nur einmal. Sie können nicht anhalten oder zurückspulen.', '지금 재생 중인 음원이 표시됩니다. 음원은 자동으로 시작되고 한 번만 재생됩니다. 멈추거나 되감을 수 없습니다.'],
      ['#tabs', 'Mit dem Hörtext wechselt auch der Teil. Spätere Teile sind gesperrt, frühere Teile können Sie wieder öffnen.', '음원에 맞춰 Teil이 바뀝니다. 다음 Teil은 잠겨 있고, 지나간 Teil은 다시 열 수 있습니다.'],
      ['#paneR', 'Teil 1: Ordnen Sie jeder Person eine Aussage zu. Teil 2: Wählen Sie a, b oder c. Teil 3: Schreiben Sie Stichworte in die freien Zeilen unter den Folien.', 'Teil 1: 화자마다 문장을 고릅니다. Teil 2: a, b, c 중에서 고릅니다. Teil 3: Folie 아래 입력란에 단어를 입력합니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'Die Aufgabenübersicht zeigt, welche Aufgaben noch offen sind.', '문항 번호표에서 남은 문항을 확인합니다.'],
      ['#nav', 'Nach dem letzten Hörtext können Sie Ihre Antworten noch prüfen und dann auf „Abgeben“ klicken.', '마지막 음원이 끝난 뒤 답을 확인하고 ‘Abgeben’을 누릅니다.']
    ]);
    return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen Thema 1 und Thema 2 und sehen die Zahl Ihrer Wörter. Schreiben Sie nur zu einem Thema.', 'Thema 1과 Thema 2 사이를 이동하고 단어 수를 확인합니다. 한 주제로만 쓰세요.'],
      ['.pane.l', 'Hier stehen die Aufgabe und zwei Zitate, die Ihnen erste Ideen geben.', '여기에 과제와 아이디어를 주는 인용문 두 개가 있습니다.'],
      ['#ed', 'Schreiben Sie Ihren Text in dieses Feld.', '이 입력란에 글을 씁니다.'],
      ['#wc', 'Die Wörter werden automatisch gezählt. Ihr Text soll mindestens 350 Wörter umfassen.', '단어 수가 자동으로 계산됩니다. 글은 350단어 이상이어야 합니다.'],
      ['#sz', 'Mit diesen Tasten fügen Sie ä, ö, ü und ß ein.', '이 버튼으로 ä, ö, ü, ß를 넣습니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#nav', 'Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '다 쓰면 ‘Abgeben’을 누릅니다.']
    ]);
  }
  function runTour(done) {
    var steps = tourSteps().filter(function (s) { return $(s[0]); });
    if ($('#help') && $('#help').offsetParent !== null) {
      steps.splice(steps.length - 1, 0, ['#help', 'Mit „?“ können Sie dieses Tutorial während der Prüfung noch einmal ansehen.', '‘?’를 누르면 시험 중에도 이 튜토리얼을 다시 볼 수 있습니다.']);
    }
    var i = 0;
    var block = document.createElement('div'); block.className = 'tipblock';
    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);
      $('#tnext').focus();
    }
    function end() {
      closeTour();
      window.removeEventListener('resize', place);
      if (!done) return;
      modal('Prüfung starten', ['Das Tutorial ist beendet. Wenn Sie auf „Prüfung starten“ klicken, beginnt die Prüfungszeit' + (R.mod === 'hoeren' ? ' und der erste Hörtext wird abgespielt.' : '.'),
        '‘Prüfung starten’을 누르면 시험 시간이 시작됩니다' + (R.mod === 'hoeren' ? '. 첫 음원도 바로 재생됩니다.' : '.')], [
        { label: 'Prüfung starten', pri: true, fn: done }
      ], true);
    }
    window.addEventListener('resize', place);
    place();
  }
  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
</body>
