ach Frau Wendt vor allem, dass","options":{"a":"sich der Schrott in bestimmten Umlaufbahnen ballt.","b":"sich die Teile gleichmäßig um die Erde verteilen.","c":"die meisten Teile zu klein sind, um Schaden anzurichten."},"answer":"a"},{"no":"57","stem":"Die Internationale Raumstation","options":{"a":"ist durch ihre Hülle vor allen Trümmern geschützt.","b":"muss größeren Teilen regelmäßig ausweichen.","c":"ist 2009 mit einem Satelliten zusammengestoßen."},"answer":"b"},{"no":"58","stem":"Das sogenannte Kessler-Syndrom beschreibt","options":{"a":"die Gefahr, die herabfallende Teile für Menschen darstellen.","b":"die rasche Zunahme der Satelliten privater Firmen.","c":"eine Kettenreaktion von Zusammenstößen."},"answer":"c"},{"no":"59","stem":"Wie lange ein Teil im All bleibt, hängt nach Frau Wendt vor allem","options":{"a":"von der Höhe seiner Umlaufbahn ab.","b":"von seiner Geschwindigkeit ab.","c":"von dem Material ab, aus dem es besteht."},"answer":"a"},{"no":"60","stem":"Die internationalen Regeln gegen Weltraumschrott","options":{"a":"sind seit Kurzem für alle Staaten der Welt verbindlich.","b":"haben bisher meist den Charakter von Empfehlungen.","c":"sehen bei Verstößen hohe Geldstrafen vor."},"answer":"b"},{"no":"61","stem":"Missionen, die Schrott einsammeln sollen,","options":{"a":"sind bereits seit einigen Jahren erfolgreich im Einsatz.","b":"eignen sich vor allem für kleine Splitter.","c":"können jeweils nur einzelne große Teile bergen."},"answer":"c"},{"no":"62","stem":"Am wichtigsten ist nach Frau Wendt, dass","options":{"a":"Satelliten nach ihrer Mission die Umlaufbahn verlassen.","b":"künftig deutlich weniger Raketen gestartet werden.","c":"Satelliten künftig robuster und besser gepanzert gebaut werden."},"answer":"a"},{"no":"63","stem":"Im Projekt an der Hochschule","options":{"a":"beobachten Studierende Schrott mit einem eigenen Radar.","b":"haben Studierende ein Gerät zum Einfangen von Trümmern gebaut.","c":"erproben Studierende ein Segel, das Satelliten abbremst."},"answer":"c"},{"no":"64","stem":"Frau Wendt ist vorsichtig optimistisch, weil","options":{"a":"die Zahl der Satelliten inzwischen wieder sinkt.","b":"auch die Betreiber saubere Umlaufbahnen brauchen.","c":"neue Technik den Schrott bald vollständig beseitigen wird."},"answer":"b"}]},"t3":{"instruction":"Sie hören einen Vortrag. Sie hören den Vortrag nur einmal. Sie haben Handzettel mit den Folien der Präsentation erhalten. Schreiben Sie die fehlenden Informationen stichwortartig in die freien Zeilen 65–74 in der rechten Spalte.","exampleNote":"Die Lösung 0 ist ein Beispiel.","readNote":"Lesen Sie jetzt die Stichworte. Sie haben dazu eine Minute Zeit.","finalNote":"Sie haben jetzt fünf Minuten Zeit, Ihre Antworten zu den Aufgaben 65–74 auf den Antwortbogen zu übertragen.","exampleAnswer":"Technik und Gesellschaft","slides":[{"title":"Ringvorlesung","lines":[{"no":"0","bullet":false,"dash":false,"text":"„…“"},{"no":"","bullet":false,"dash":false,"text":"Thema heute: Von der Ortszeit zur Weltzeit"},{"no":"","bullet":false,"dash":false,"text":"Referentin: Dr. Katharina Vogel, Lehrstuhl für Technikgeschichte"}]},{"title":"Ortszeit","lines":[{"no":"","bullet":true,"dash":false,"text":"zwölf Uhr = höchster Sonnenstand"},{"no":"65","bullet":true,"dash":false,"text":"Verschiebung je Längengrad: …"},{"no":"","bullet":true,"dash":false,"text":"Berlin – Aachen: fast eine halbe Stunde"}]},{"title":"Eisenbahn","lines":[{"no":"66","bullet":true,"dash":false,"text":"Problem beim Umsteigen: …"},{"no":"67","bullet":true,"dash":false,"text":"Großbritannien, 1840er-Jahre: alle Strecken nach …"},{"no":"","bullet":true,"dash":false,"text":"USA 1883: Zeitzonen der Bahngesellschaften"}]},{"title":"Meridiankonferenz 1884","lines":[{"no":"","bullet":true,"dash":false,"text":"Washington, 25 Staaten"},{"no":"68","bullet":true,"dash":false,"text":"Beschluss: …"},{"no":"69","bullet":true,"dash":false,"text":"nicht einverstanden: …"}]},{"title":"Deutschland","lines":[{"no":"","bullet":true,"dash":false,"text":"um 1890: fünf verschiedene Bahnzeiten"},{"no":"","bullet":true,"dash":false,"text":"Moltke 1891 im Reichstag"},{"no":"70","bullet":true,"dash":false,"text":"Begründung: …"},{"no":"71","bullet":true,"dash":false,"text":"1. April 1893: …"}]},{"title":"Zeit heute","lines":[{"no":"","bullet":true,"dash":false,"text":"Physikalisch-Technische Bundesanstalt, Braunschweig"},{"no":"72","bullet":true,"dash":false,"text":"Taktgeber: …"},{"no":"73","bullet":true,"dash":false,"text":"Verbreitung: …"}]},{"title":"Zeit als Politik","lines":[{"no":"","bullet":true,"dash":false,"text":"China: eine Landeszeit seit 1949"},{"no":"74","bullet":true,"dash":false,"text":"Spanien seit 1940: …"}]}],"items":[{"no":"65","solution":"vier Minuten"},{"no":"66","solution":"jede Bahngesellschaft fuhr nach eigener Zeit → Anschlüsse schwer zu berechnen / Uhren mit verschiedenen Zeiten"},{"no":"67","solution":"Londoner Zeit (Zeit der Sternwarte Greenwich)"},{"no":"68","solution":"Nullmeridian durch Greenwich"},{"no":"69","solution":"Frankreich (Enthaltung, Pariser Zeit bis 1911) („Frankreich“ genügt)"},{"no":"70","solution":"militärische Gründe: Truppentransporte mit der Bahn im Kriegsfall"},{"no":"71","solution":"Mitteleuropäische Zeit gilt im ganzen Reich (gesetzlich, für alle Lebensbereiche)"},{"no":"72","solution":"Atomuhren"},{"no":"73","solution":"Funksignal eines Langwellensenders (bei Frankfurt) für Funkuhren"},{"no":"74","solution":"Mitteleuropäische Zeit trotz Lage westlich von Greenwich / gleiche Zeit wie Deutschland"}]}},"schreiben":{"instruction":"Wählen Sie eines der folgenden zwei Themen. Schreiben Sie einen Text, in dem Sie Ihren eigenen Standpunkt dazu erarbeiten und argumentativ darlegen. Ihr Text soll mindestens 350 Wörter umfassen. Sie haben 70 Minuten Zeit.","minWords":350,"minutes":70,"themes":[{"no":"1","paragraphs":["Die Studierendenvertretung Ihrer Hochschule schlägt vor, ehrenamtliches Engagement mit Leistungspunkten zu belohnen. In einem Seminar sollen Sie dazu Stellung nehmen.","Erörtern Sie Vor- und Nachteile dieses Vorschlags. Berücksichtigen Sie auch Ihre eigenen Erfahrungen und ziehen Sie am Schluss ein begründetes Fazit."],"quoteLead":"Die folgenden Zitate geben Ihnen erste Ideen:","quotes":["„Wer sich für andere einsetzt, lernt dabei mehr als in manchem Seminar.“","„Ein Ehrenamt, das man für Punkte übernimmt, ist kein Ehrenamt mehr.“"],"model":{"title":"Leistungspunkte für das Ehrenamt – Anerkennung oder Widerspruch?","paragraphs":["Ob in der Nachhilfe für Schulkinder, im Sportverein oder bei der Tafel: Viele Studierende engagieren sich neben ihrem Studium ehrenamtlich. Die Studierendenvertretung unserer Hochschule schlägt nun vor, dieses Engagement mit Leistungspunkten anzuerkennen. Was auf den ersten Blick wie eine selbstverständliche Würdigung aussieht, wirft bei näherem Hinsehen grundsätzliche Fragen auf.","Für den Vorschlag spricht zunächst, dass im Ehrenamt tatsächlich gelernt wird. Wer eine Hausaufgabenhilfe organisiert oder in einem Verein Verantwortung übernimmt, trainiert genau die Fähigkeiten, die in Stellenanzeigen gefordert werden: Organisationsgeschick, Teamfähigkeit und den Umgang mit Konflikten. Zudem lernen Studierende dabei Menschen kennen, denen sie im Hörsaal kaum begegnen würden. Insofern trifft das erste Zitat einen wahren Kern. Hinzu kommt ein Gerechtigkeitsargument. Wer sich engagiert, hat weniger Zeit für das Studium und braucht unter Umständen länger bis zum Abschluss. Leistungspunkte könnten diesen Nachteil ausgleichen und gerade diejenigen ermutigen, die glauben, sich ein Ehrenamt neben dem Studium nicht leisten zu können.","Andererseits besteht die Gefahr, dass das Engagement seinen Charakter verändert. Ein Ehrenamt lebt davon, dass man es freiwillig und ohne Gegenleistung übernimmt. Würden Punkte vergeben, könnten manche nur noch dort helfen, wo es sich für den Lebenslauf lohnt; genau davor warnt das zweite Zitat. Offen ist außerdem die Frage der Bewertung: Wer soll prüfen, ob jemand in einem Verein tatsächlich etwas gelernt hat, und nach welchen Maßstäben? Ohne klare Kriterien würde die Vergabe der Punkte beliebig. Schließlich droht zusätzliche Bürokratie: Bescheinigungen, Stundenzettel und Nachweise würden ausgerechnet das belasten, was bisher ohne Formulare funktioniert.","Ich selbst habe zwei Jahre lang ehrenamtlich Deutschkurse für Geflüchtete gegeben. Leistungspunkte habe ich dafür nie vermisst. Gewünscht hätte ich mir allerdings, dass meine Hochschule diese Erfahrung überhaupt zur Kenntnis nimmt, etwa in Form eines Zertifikats, das ich einer Bewerbung beilegen kann. Was ich dort gelernt habe – Geduld, verständliches Erklären und den Umgang mit sehr unterschiedlichen Erwartungen –, hilft mir heute in jedem Referat.","Ich komme daher zu einem differenzierten Ergebnis. Eine pauschale Anrechnung jeder ehrenamtlichen Tätigkeit halte ich für falsch. Sinnvoll wäre es dagegen, das Engagement in einem begleitenden Modul anzuerkennen, in dem die Studierenden ihre Erfahrungen reflektieren und schriftlich auswerten. Ein solches Modul stünde allen offen, unabhängig davon, wo sie sich engagieren. Dann würden die Punkte nicht für das Helfen vergeben, sondern für das Lernen daraus, und das Ehrenamt bliebe, was es sein soll: freiwillig."],"hint":"Aufbau: Einleitung mit Problemaufriss – Argumente dafür mit Bezug auf Zitat 1 – Argumente dagegen mit Bezug auf Zitat 2 – eigene Erfahrung – differenziertes Fazit mit Gegenvorschlag. Sprachliche Mittel: Konjunktiv II (könnten, würden, wäre), Relativsätze mit „wer“, Nominalisierungen (Würdigung, Anrechnung, Vergabe), Antithese im Schlusssatz (für das Helfen – für das Lernen daraus). Umfang: 378 Wörter."}},{"no":"2","paragraphs":["Ihre Hochschulzeitung fragt, ob der Staat einige wenige Spitzenuniversitäten besonders fördern sollte.","Legen Sie dar, was für eine solche gezielte Förderung und was für eine gleichmäßige Förderung aller Hochschulen spricht, und begründen Sie am Schluss Ihre Position."],"quoteLead":"Die folgenden Zitate geben Ihnen erste Ideen:","quotes":["„Nur wer seine besten Hochschulen stärkt, kann international mithalten.“","„Gute Bildung braucht man nicht an wenigen Orten, sondern überall im Land.“"],"model":{"title":"Spitzenförderung oder gute Hochschulen für alle?","paragraphs":["Seit einigen Jahren fördern Bund und Länder im Rahmen der Exzellenzstrategie ausgewählte Universitäten mit zusätzlichen Mitteln. Unsere Hochschulzeitung fragt nun, ob dieser Weg der richtige ist. Die Antwort hängt davon ab, was man von einem Hochschulsystem erwartet: internationale Spitzenleistungen, eine gute Ausbildung für möglichst viele oder beides zugleich. Die Frage betrifft dabei nicht nur Politik und Hochschulleitungen, sondern auch uns Studierende ganz direkt.","Für eine gezielte Förderung spricht vor allem, dass Spitzenforschung teuer ist. Große Forschungsgeräte, international gefragte Wissenschaftlerinnen und Wissenschaftler und modern ausgestattete Labore lassen sich nicht an jeder Hochschule finanzieren. Wer die Mittel gleichmäßig verteilt, riskiert, dass am Ende keine einzige Universität mit Oxford, Stanford oder der ETH Zürich mithalten kann. Das erste Zitat bringt diese Sorge auf den Punkt. Außerdem kann der Wettbewerb um Fördergelder Hochschulen dazu anspornen, ihr Profil zu schärfen und Schwerpunkte zu setzen. Nicht zuletzt ziehen Spitzenuniversitäten talentierte Forschende aus dem Ausland an, von denen die gesamte Wissenschaft profitiert.","Andererseits studiert die große Mehrheit nicht an Exzellenzuniversitäten, sondern an Hochschulen, die von der Förderung kaum etwas haben. Dort sind Seminare oft überfüllt, Gebäude sanierungsbedürftig und viele Stellen befristet. Wenn sich Geld und Ansehen an wenigen Orten bündeln, wandern zudem die besten Lehrenden dorthin ab, und die Unterschiede zwischen den Regionen wachsen. Hinzu kommt, dass auch an kleineren Hochschulen herausragende Forschung entsteht, die ohne verlässliche Mittel gar nicht erst sichtbar wird. Das zweite Zitat erinnert zu Recht daran, dass gute Bildung kein Privileg einzelner Städte sein darf.","Ich habe meinen Bachelor an einer kleinen Universität gemacht, die in keinem internationalen Ranking auftaucht. Die Betreuung war hervorragend, gerade weil die Gruppen klein waren. Für den Master bin ich an eine große Exzellenzuniversität gewechselt und habe dort zwar beeindruckende Forschung erlebt, aber auch Vorlesungen mit fünfhundert Teilnehmenden, in denen niemand meinen Namen kannte. Beide Erfahrungen haben mir gezeigt, dass Exzellenz in der Forschung nicht automatisch gute Lehre bedeutet.","Ich halte deshalb beide Ziele für berechtigt, aber nicht für gleichrangig. Die Grundfinanzierung aller Hochschulen muss Vorrang haben, denn sie entscheidet über die Qualität der Ausbildung für die große Mehrheit. Zusätzliche Mittel für Spitzenforschung sind sinnvoll, allerdings nur, wenn sie nicht auf Kosten der Lehre gehen und auch kleineren Hochschulen mit starken Schwerpunkten offenstehen. Wer Spitze will, braucht eine breite Basis; sonst fehlt der Nachwuchs, aus dem die Spitze von morgen hervorgeht."],"hint":"Aufbau: Einleitung mit Leitfrage – Argumente für Spitzenförderung mit Zitat 1 – Argumente für Breitenförderung mit Zitat 2 – eigene Erfahrung als Beleg – gewichtendes Fazit mit Bedingung. Sprachliche Mittel: Gegenüberstellung (Für … spricht – Andererseits), konditionale Einschränkung (allerdings nur, wenn), Passiversatz (lassen sich … finanzieren), Konzessivgefüge (zwar … aber). Umfang: 383 Wörter."}}]},"muendlich":{"teil1":[{"who":"A","themes":["Beschreiben Sie eine Erfindung oder Entdeckung, die den Alltag der Menschen stark verändert hat. Welche Folgen hatte sie, und wie beurteilen Sie diese?","Sollte ein Auslandssemester für alle Studierenden verpflichtend sein? Welche Vorteile und welche Nachteile hätte eine solche Regelung? Begründen Sie Ihre Meinung."]},{"who":"B","themes":["Stellen Sie ein Buch, einen Film oder eine Serie vor, die Sie zum Nachdenken gebracht hat. Worum geht es, und warum ist das Werk aus Ihrer Sicht wichtig?","Sollten Studierende ihre Lehrenden öffentlich und namentlich bewerten dürfen, zum Beispiel auf Online-Plattformen? Begründen Sie Ihre Meinung."]},{"who":"C","themes":["Beschreiben Sie eine Forschungsfrage aus Ihrem Fach, die Sie besonders interessiert. Warum ist sie wichtig, und wie könnte man sie untersuchen?","Gruppenarbeit oder Einzelarbeit – welche Arbeitsform bringt im Studium mehr? Begründen Sie Ihre Meinung. Gibt es Gegenargumente?"]}],"teil2":[{"no":"1","text":"„Habe Mut, dich deines eigenen Verstandes zu bedienen!“","author":"Immanuel Kant, 1724–1804, Philosoph"},{"no":"2","text":"„Ich kann freilich nicht sagen, ob es besser werden wird, wenn es anders wird; aber so viel kann ich sagen: Es muss anders werden, wenn es gut werden soll.“","author":"Georg Christoph Lichtenberg, 1742–1799, Physiker und Schriftsteller"},{"no":"3","text":"„Wenn es einen Glauben gibt, der Berge versetzen kann, so ist es der Glaube an die eigene Kraft.“","author":"Marie von Ebner-Eschenbach, 1830–1916, Schriftstellerin"}]},"audio":[{"src":"telc%20C1%20HS%20Modelltest%202.1.mp3","dur":556.23},{"src":"telc%20C1%20HS%20Modelltest%202.2.mp3","dur":708.08},{"src":"telc%20C1%20HS%20Modelltest%202.3.mp3","dur":856.76}],"minutes":{"hoeren":40},"pdf":"telc%20C1%20HS%20Modelltest%202.pdf","pages":{"loesung":20,"muster":21,"kommentar":31,"hoertexte":25}},"3":{"id":3,"roman":"III","lesen":{"t1":{"instruction":"Lesen Sie den folgenden Text. Welche der Sätze a–h gehören in die Lücken 1–6? Es gibt jeweils nur eine richtige Lösung. Zwei Sätze können nicht zugeordnet werden. Markieren Sie Ihre Lösungen für die Aufgaben 1–6 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","intro":"In einer populärwissenschaftlichen Zeitschrift lesen Sie folgenden Beitrag:","title":"Der Mann, der die Kontinente wandern ließ","paragraphs":["Wer eine Weltkarte aufmerksam betrachtet, dem fällt es fast zwangsläufig auf: Die Ostküste Südamerikas und die Westküste Afrikas passen zusammen wie die Teile eines Puzzles. {{0}} Der Meteorologe und Polarforscher Alfred Wegener dagegen nahm die Beobachtung ernst und zog daraus 1912 einen kühnen Schluss: Die Kontinente seien einst zu einer einzigen Landmasse vereint gewesen und hätten sich im Laufe von Jahrmillionen voneinander entfernt.","Dabei stützte sich Wegener keineswegs nur auf die Form der Küstenlinien. {{1}} So fand man Fossilien des Mesosaurus, eines kleinen Süßwasserreptils, sowohl in Brasilien als auch im Süden Afrikas – ein Tier, das niemals einen ganzen Ozean hätte durchqueren können. Auch Gesteinsschichten und Gebirgszüge setzten sich auf beiden Seiten des Atlantiks nahezu nahtlos fort. Zusammen ergaben diese Indizien ein Bild, das sich mit bloßem Zufall kaum erklären ließ.","Dennoch stieß seine Theorie in der Fachwelt überwiegend auf heftige Ablehnung. {{2}} Vor allem konnte Wegener nicht überzeugend erklären, welche Kraft ganze Kontinente über die Erdoberfläche schieben sollte. Seine Vermutung, dafür seien die Fliehkraft der Erddrehung und die Gezeiten verantwortlich, ließ sich rechnerisch leicht widerlegen: Beide Kräfte sind viel zu schwach.","Wegener selbst erlebte die Anerkennung seiner Idee nicht mehr. {{3}} Erst in den 1950er- und 1960er-Jahren lieferte die Erforschung der Ozeanböden die fehlenden Belege. Geologen entdeckten, dass entlang der mittelozeanischen Rücken ständig glutflüssiges Gestein aus dem Erdinneren aufsteigt, erkaltet und als neue Kruste zu beiden Seiten hin auseinandergedrückt wird. {{4}}","Am Meeresboden entstehen so Streifen mit wechselnder Magnetisierung, die beiderseits der Rücken spiegelbildlich verlaufen. Aus diesen und weiteren Befunden entwickelte sich die Theorie der Plattentektonik, die heute als Fundament der modernen Geowissenschaften gilt. {{5}}","Wegeners Grundgedanke, dass die Kontinente wandern, hat sich damit als richtig erwiesen, auch wenn er sich in der Frage nach dem Antrieb geirrt hatte. Heute lässt sich die Drift sogar direkt messen. {{6}} Das entspricht ungefähr dem Tempo, mit dem unsere Fingernägel wachsen. Ein großes Institut für Polar- und Meeresforschung in Bremerhaven trägt seinen Namen."],"sentences":[{"letter":"a","text":"Nach ihr bewegen sich nicht die Kontinente allein, sondern riesige Platten, auf denen sie gewissermaßen mitreisen."},{"letter":"b","text":"Diese Kräfte reichen nach heutigem Kenntnisstand völlig aus, um die Wanderung der Kontinente zu erklären."},{"letter":"c","text":"Dass ausgerechnet ein Meteorologe die Geologie umkrempeln wollte, empfanden viele Fachleute als Anmaßung."},{"letter":"d","text":"Satellitenmessungen zeigen, dass sich Europa und Nordamerika jedes Jahr um zwei bis drei Zentimeter voneinander entfernen."},{"letter":"e","text":"Er kam im November 1930 bei einer Expedition auf dem grönländischen Inlandeis ums Leben, kurz nach seinem fünfzigsten Geburtstag."},{"letter":"f","text":"Er trug vielmehr Belege aus ganz unterschiedlichen Fachgebieten zusammen, von der Paläontologie bis zur Klimageschichte."},{"letter":"g","text":"Wegener hatte zuvor jahrzehntelang als Professor für Geologie an mehreren Universitäten gelehrt und galt deshalb als unbestrittene Autorität seines Fachs."},{"letter":"h","text":"Dabei hält das erkaltende Gestein die Richtung des Erdmagnetfelds fest, das sich im Laufe der Erdgeschichte immer wieder umgepolt hat."}],"example":{"letter":"z","text":"Lange sahen die meisten Gelehrten darin jedoch nicht mehr als einen Zufall."},"items":[{"no":"1","answer":"f"},{"no":"2","answer":"c"},{"no":"3","answer":"e"},{"no":"4","answer":"h"},{"no":"5","answer":"a"},{"no":"6","answer":"d"}]},"t2":{"instruction":"Lesen Sie den folgenden Text. In welchem Textabsatz a–e finden Sie die Antworten auf die Fragen 7–12? Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7–12 auf dem Antwortbogen.","title":"Feierabend heißt Feierabend","sections":[{"letter":"a","text":"Das Smartphone liegt beim Abendessen neben dem Teller, es vibriert kurz, und schon ist man in Gedanken wieder im Büro. Für einen großen Teil der Berufstätigen gehört das längst zum Alltag: Umfragen zufolge ist die Mehrheit auch abends, am Wochenende und sogar im Urlaub für Vorgesetzte oder Kollegen erreichbar. Wo der Arbeitstag endet und das Privatleben beginnt, können viele kaum noch sagen. Manche empfinden das nicht einmal mehr als Belastung, sondern als selbstverständlichen Teil des Berufslebens. Einige Staaten haben darauf reagiert. In Frankreich müssen größere Unternehmen seit 2017 mit ihren Beschäftigten Regeln aushandeln, die ein ‚Recht auf Abschalten‘ sichern, und Portugal hat es Arbeitgebern inzwischen weitgehend untersagt, ihre Angestellten nach Dienstschluss zu kontaktieren. In Deutschland dagegen wird zwar viel über das Thema diskutiert, verbindliche Vorgaben gibt es jedoch kaum. Ich bin überzeugt, dass wir dringend klare Regeln brauchen – die Frage ist nur, wer sie aufstellen sollte."},{"letter":"b","text":"Zugegeben: Die ständige Verbindung hat auch Vorzüge, und manche möchten sie nicht mehr missen. Wer kleine Kinder hat, kann nachmittags früher gehen und abends noch eine dringende Anfrage bearbeiten, statt bis sechs Uhr im Büro zu sitzen. Teams, die über mehrere Zeitzonen verteilt sind, könnten ohne ein gewisses Maß an Flexibilität kaum zusammenarbeiten. Auch ist nicht jede Nachricht nach Feierabend eine Zumutung: Eine kurze Rückfrage, die man in einer Minute beantworten kann, erspart einem Kollegen am nächsten Morgen womöglich einen halben Tag Arbeit. Viele Selbstständige schätzen es zudem, ihre Zeit frei einzuteilen und auch spätabends noch Aufträge anzunehmen. Und mancher Vorgesetzte ist schlicht dankbar, wenn eine wichtige Entscheidung nicht bis Montag warten muss. Es wäre also falsch, die Erreichbarkeit pauschal zu verteufeln. Ausschlaggebend ist vielmehr, ob sie freiwillig ist und die Ausnahme bleibt – oder ob sie stillschweigend erwartet wird."},{"letter":"c","text":"Genau diese stille Erwartung ist das eigentliche Problem. Arbeitspsychologen wissen seit Langem, dass Erholung nur gelingt, wenn man auch gedanklich Abstand von der Arbeit gewinnt. Wer jederzeit mit einer Nachricht rechnen muss, findet diesen Abstand nie. Gefährdet sind dabei gerade die Engagierten, denen es ohnehin schwerfällt, Grenzen zu ziehen. Eine Untersuchung aus den USA kam zu dem Ergebnis, dass bereits die Erwartung, abends E-Mails lesen zu müssen, Anspannung und Ängste auslöst – unabhängig davon, wie viel Zeit man tatsächlich damit verbringt. Bemerkenswert ist ein weiterer Befund: Auch die Partnerinnen und Partner der Befragten waren mit ihrer Beziehung weniger zufrieden. Die Folgen betreffen also nicht nur den Einzelnen. Auf Dauer drohen Schlafstörungen und Erschöpfung, im schlimmsten Fall ein Burn-out, der Betroffene monatelang aus dem Berufsleben reißt. Dass die Unternehmen dabei am Ende mehr verlieren, als sie durch schnelle Antworten gewinnen, wird erstaunlich selten bedacht."},{"letter":"d","text":"Muss also der Gesetzgeber eingreifen? Hier bin ich skeptisch. Das französische Gesetz verpflichtet die Unternehmen lediglich dazu, Vereinbarungen auszuhandeln; wie viel sich dadurch im Arbeitsalltag tatsächlich verändert hat, ist umstritten. Ein starres Verbot wiederum ließe sich in vielen Berufen kaum umsetzen; in einer Klinik oder bei der Feuerwehr wäre eine feste Sperrzeit schlicht undenkbar. Zudem birgt ein solches Verbot eine Gefahr: Wer abends keine Nachrichten mehr verschicken darf, erledigt die Arbeit womöglich trotzdem – nur eben unsichtbar, ohne dass sie irgendwo erfasst wird. Für Selbstständige, die niemandem Rechenschaft schulden, hilft ein Gesetz ohnehin nicht. Vor allem aber nützt ein Recht auf Unerreichbarkeit wenig, wenn sich niemand traut, es in Anspruch zu nehmen, weil er fürchtet, als weniger engagiert zu gelten. Eine Regel, die nur auf dem Papier steht, beruhigt allenfalls das Gewissen der Politik."},{"letter":"e","text":"Entscheidend ist deshalb, was in den Betrieben selbst geschieht. Teams sollten offen darüber sprechen, wann eine schnelle Antwort wirklich nötig ist und wann eine Nachricht bis zum nächsten Morgen warten kann. Schon eine einfache Abmachung hilft: Wer abends schreibt, erwartet keine Antwort vor Arbeitsbeginn. Einige Unternehmen sind dabei bereits vor Jahren eigene Wege gegangen: Bei Volkswagen etwa leiten die Server für viele Beschäftigte nach Dienstschluss keine E-Mails mehr auf das Diensthandy weiter, und bei Daimler können Mails, die während des Urlaubs eintreffen, auf Wunsch automatisch gelöscht werden. Technik allein ändert allerdings wenig an der Haltung. Solange die Chefin selbst um Mitternacht Nachrichten verschickt, wird kaum jemand glauben, dass Abschalten tatsächlich erwünscht ist. Wer will, dass der Feierabend respektiert wird, muss ihn also zuerst selbst vorleben. Erreichbarkeit sollte die Ausnahme sein, auf die man sich für Notfälle verständigt – nicht eine Pflicht, die man stillschweigend erfüllt."}],"exampleLead":"In welchem Abschnitt …","example":{"stem":"erwähnt der Autor ein Land, in dem Arbeitgeber ihre Angestellten nach Dienstschluss kaum noch kontaktieren dürfen?","answer":"a"},"itemsLead":"In welchem Abschnitt …","items":[{"no":"7","stem":"stellt der Autor fest, dass die meisten Beschäftigten auch außerhalb der Arbeitszeit erreichbar sind?","answer":"a"},{"no":"8","stem":"bezweifelt der Autor, dass staatliche Vorschriften allein viel bewirken?","answer":"d"},{"no":"9","stem":"weist der Autor darauf hin, dass auch das private Umfeld der Beschäftigten leidet?","answer":"c"},{"no":"10","stem":"räumt der Autor ein, dass manche Menschen von der ständigen Verbindung profitieren?","answer":"b"},{"no":"11","stem":"fordert der Autor, dass Vorgesetzte beim Abschalten mit gutem Beispiel vorangehen?","answer":"e"},{"no":"12","stem":"erklärt der Autor, dass schon das Warten auf mögliche Nachrichten belastet?","answer":"c"}]},"t3":{"instruction":"Lesen Sie den folgenden Text und die Aussagen 13–23. Welche der Aussagen sind richtig (r), falsch (f) oder gar nicht im Text enthalten (–)? Es gibt jeweils nur eine richtige Lösung. Markieren Sie Ihre Lösungen für die Aufgaben 13–23 auf dem Antwortbogen.","title":"","paragraphs":["Herr K. ist 86 Jahre alt und erkennt seine eigene Tochter nicht mehr. Wenn sie ihn im Pflegeheim besucht, begrüßt er sie höflich wie eine Fremde. Doch als im Aufenthaltsraum die ersten Takte eines alten Schlagers erklingen, hebt er den Kopf, bewegt die Lippen – und singt die zweite Strophe fehlerfrei mit. Pflegekräfte kennen solche Momente seit Langem. Die Forschung dagegen hat erst in den vergangenen Jahren begonnen, systematisch zu untersuchen, warum Melodien offenbar noch im Gedächtnis haften, wenn vieles andere längst verloren ist.","„Musikalische Erinnerungen sind erstaunlich widerstandsfähig“, sagt Jonas Berger, der als Musikpsychologe an einer Universität erforscht, wie das Gehirn Musik verarbeitet. Ein Grund dafür sei, dass ein Lied nicht an einer einzigen Stelle abgelegt werde. Beim Hören und Mitsingen arbeiten zahlreiche Hirnregionen zusammen: solche, die Klänge entschlüsseln, solche, die Bewegungen steuern, und solche, die für Gefühle zuständig sind. Fällt eine dieser Regionen aus, können andere einen Teil ihrer Aufgaben übernehmen. Das erklärt auch, warum manche Menschen nach einem Schlaganfall nicht mehr sprechen, wohl aber noch singen können. Eine Studie zeigte zudem, dass gerade jene Areale, die beim Wiedererkennen vertrauter Melodien aktiv sind, von der Alzheimer-Krankheit vergleichsweise spät angegriffen werden.","Hinzu kommt die Macht der Gefühle. Was uns bewegt, behalten wir besser – und kaum etwas bewegt uns so sehr wie die Musik unserer Jugend. Fragt man ältere Menschen nach ihren Lieblingsliedern, nennen sie auffallend häufig Titel, die sie zwischen dem zehnten und dem dreißigsten Lebensjahr kennengelernt haben. Psychologen sprechen vom ‚Erinnerungshügel‘: In diesem Lebensabschnitt bildet sich die Persönlichkeit heraus, erste enge Beziehungen entstehen, und die Musik, die diese Zeit begleitet, verknüpft sich mit besonders intensiven Erlebnissen. Der erste Tanz, das erste Konzert oder die Abschlussfeier bleiben deshalb oft ein Leben lang mit einem bestimmten Lied verbunden.","Wie eng Musik und Gefühl zusammenhängen, lässt sich im Gehirn sogar beobachten. Forschende in Kanada stellten fest, dass bei besonders ergreifenden Stellen eines Musikstücks der Botenstoff Dopamin ausgeschüttet wird – derselbe, der auch bei gutem Essen oder anderen Belohnungen eine Rolle spielt. Die Teilnehmenden hatten dafür Stücke mitgebracht, bei denen sie regelmäßig Gänsehaut bekamen. Bemerkenswert ist der Zeitpunkt: Die Ausschüttung beginnt bereits kurz vor dem Höhepunkt, also in dem Moment, in dem wir ihn erwarten. Die Vorfreude gehört offenbar zum Genuss dazu.","Genau hier setzt die Musiktherapie an. In immer mehr Pflegeheimen werden für die Bewohnerinnen und Bewohner persönliche Playlists zusammengestellt, die Lieder aus ihrer Vergangenheit enthalten. Erste Studien deuten darauf hin, dass solche Angebote Unruhe und Ängste lindern können und manche Betroffene sogar weniger Beruhigungsmittel benötigen. Pflegekräfte berichten zudem, dass sich einige Bewohnerinnen und Bewohner danach leichter waschen und anziehen lassen. Berger warnt allerdings vor überzogenen Erwartungen: „Musik bremst den Verlauf einer Demenz nicht. Aber sie kann Momente schaffen, in denen ein Mensch für kurze Zeit wieder er selbst ist – und in denen die Angehörigen ihn wiederfinden.“","Auch in der Neurologie wird die Wirkung von Musik genutzt.","Menschen mit Parkinson, die beim Gehen oft ins Stocken geraten, finden mithilfe eines gleichmäßigen Rhythmus leichter in einen flüssigen Schritt. Die Musik übernimmt dabei gewissermaßen die Rolle eines inneren Taktgebers, den die Krankheit gestört hat. Ähnlich hilft sie Menschen nach einem Schlaganfall, Bewegungen wieder einzuüben.","Dass sich Musik hartnäckig im Kopf festsetzt, erleben aber auch Gesunde – manchmal mehr, als ihnen lieb ist. Den sogenannten Ohrwurm kennt fast jeder: Einer finnischen Untersuchung zufolge haben neun von zehn Menschen mindestens einmal pro Woche eine Melodie im Kopf, die sich nicht abstellen lässt. Meist handelt es sich nur um einen kurzen Ausschnitt, häufig den Refrain, der sich in einer Schleife wiederholt. Begünstigt werden Ohrwürmer durch Stress, Müdigkeit und Langeweile, vor allem aber durch Lieder, die man kurz zuvor oder besonders oft gehört hat. Warum ausgerechnet bestimmte Melodien hängen bleiben, ist nur teilweise geklärt; eingängige Tonfolgen mit einem überraschenden Sprung prägen sich offenbar besonders leicht ein.","Wer einen Ohrwurm loswerden möchte, kann es mit einem überraschend einfachen Mittel versuchen: Kaugummi kauen. Britische Psychologen fanden heraus, dass die Bewegungen von Kiefer und Zunge jene Bereiche beanspruchen, die wir auch zum inneren Mitsingen benötigen. Die Melodie verliert dadurch an Kraft, verschwindet allerdings nicht in jedem Fall. Manche Fachleute raten außerdem, das Lied einmal vollständig anzuhören, damit das Gehirn es als abgeschlossen ablegt.","Keinen Bestand hatte dagegen eine andere populäre Annahme: dass Musik schlauer macht. Anfang der 1990er-Jahre sorgte eine kleine Studie für Aufsehen, nach der Studierende räumliche Aufgaben besser lösten, nachdem sie zehn Minuten lang eine Sonate von Mozart gehört hatten. Der Effekt war gering und hielt nur etwa eine Viertelstunde an. Trotzdem kamen bald CDs für Säuglinge auf den Markt, und in einem amerikanischen Bundesstaat sollten die Eltern Neugeborener sogar eine CD mit klassischer Musik geschenkt bekommen. Spätere Untersuchungen konnten den ‚Mozart-Effekt‘ jedoch nicht bestätigen. Eine große Auswertung zahlreicher Studien kam 2010 zu dem Schluss, dass es ihn praktisch nicht gibt.","Anders sieht es aus, wenn Menschen selbst musizieren. Wer über Jahre ein Instrument lernt, trainiert Gehör, Feinmotorik und Konzentration zugleich, und bei Berufsmusikern lassen sich tatsächlich Unterschiede im Aufbau des Gehirns nachweisen. „Ob Musikunterricht Kinder allgemein klüger macht, ist allerdings umstritten“, sagt Berger. „Kinder, die ein Instrument lernen, wachsen häufig in Familien auf, die auch sonst viel in Bildung investieren. Was davon Ursache und was Folge ist, lässt sich nur schwer auseinanderhalten.“ Als Argument gegen den Musikunterricht will er das nicht verstanden wissen: „Musik ist wertvoll, auch ohne dass sie uns schlauer machen muss.“","Und wie steht es mit Musik beim Lernen? Viele Studierende schwören darauf, beim Lesen Kopfhörer zu tragen. Die Forschung ist sich hier nicht einig. Instrumentalmusik kann die Stimmung heben und störende Geräusche überdecken, etwa wenn man in einem lauten Café arbeitet. Musik mit Gesang dagegen lenkt bei Leseaufgaben eher ab, weil das Gehirn die Wörter des Liedes unwillkürlich mitverarbeitet und sie mit dem gelesenen Text in Konkurrenz treten. „Wer einen anspruchsvollen Fachtext verstehen will, sollte lieber auf Lieder mit Text verzichten“, rät Berger. „Beim Abtippen von Notizen oder anderen Routinearbeiten ist die Lieblingsplaylist dagegen kein Problem.“","Beim Sprachenlernen wiederum kann Gesang sogar nützen. In einem Experiment in Schottland lernten Erwachsene kurze Sätze in einer ihnen unbekannten Sprache, dem Ungarischen. Wer sie singend einübte, konnte sie später deutlich besser wiedergeben als Teilnehmende, die sie lediglich nachsprachen. Rhythmus und Tonhöhe verleihen den Wörtern offenbar zusätzliche Merkmale, die das Abrufen erleichtern.","„Die Melodie dient dem Gedächtnis als Gerüst“, erklärt Berger. „Die Wörter lassen sich gewissermaßen an ihr aufhängen.“","Für Herrn K. spielen solche Fragen keine Rolle mehr. Wenn am Nachmittag die Musiktherapeutin kommt, sitzt er schon in der ersten Reihe. Dann singt er mit, manchmal falsch, aber mit sichtlicher Freude. Seine Tochter sagt, das seien die Augenblicke, in denen sie ihren Vater zurückbekomme – zumindest für die Dauer eines Liedes."],"itemsLead":"Aussagen 13–23","items":[{"no":"13","text":"Bei den Besuchen seiner Tochter weiß Herr K. nach kurzer Zeit wieder, wer sie ist.","answer":"f"},{"no":"14","text":"Laut Berger ist das Gedächtnis für Lieder auf viele Stellen im Gehirn verteilt.","answer":"r"},{"no":"15","text":"Ältere Menschen haben oft eine Vorliebe für Musik, die sie in jungen Jahren kennengelernt haben.","answer":"r"},{"no":"16","text":"Die kanadische Untersuchung zum Dopamin wurde mit Berufsmusikern durchgeführt.","answer":"n"},{"no":"17","text":"Die Lieder für die Playlists werden von Fachleuten nach wissenschaftlichen Kriterien ausgewählt.","answer":"n"},{"no":"18","text":"Berger zufolge schreitet eine Demenz mit Musik langsamer voran.","answer":"f"},{"no":"19","text":"Menschen, die selbst ein Instrument spielen, haben häufiger Ohrwürmer als andere.","answer":"n"},{"no":"20","text":"Kauen kann helfen, eine lästige Melodie im Kopf abzuschwächen.","answer":"r"},{"no":"21","text":"Die Mozart-Studie wurde mit Studierenden durchgeführt und später mehrfach bestätigt.","answer":"f"},{"no":"22","text":"Berger hält es für erwiesen, dass Musikunterricht Kinder intelligenter macht.","answer":"f"},{"no":"23","text":"Berger empfiehlt, schwierige Fachtexte ohne Gesang im Hintergrund zu lesen.","answer":"r"}],"headline":{"instruction":"Welche der Überschriften a, b oder c trifft die Aussage des Textes am besten? Markieren Sie Ihre Lösung für die Aufgabe 24 auf dem Antwortbogen.","no":"24","options":{"a":"Neue Wege der Musiktherapie in deutschen Pflegeheimen","b":"Warum Musik Kinder nachweislich klüger macht","c":"Was Musik in unserem Kopf bewirkt"},"answer":"c"}},"sb":{"instruction":"Lesen Sie den folgenden Text. Welche Lösung (a, b, c oder d) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 25–46 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","title":"Wie das Fahrrad laufen lernte","paragraphs":["Am 12. Juni 1817 {{0}} in Mannheim ein merkwürdiges Gefährt für Aufsehen. Der badische Forstbeamte Karl Drais saß auf einem {{25}} Gestell mit zwei hintereinander angeordneten Rädern und stieß {{26}} mit den Füßen vom Boden ab. Auf diese Weise legte er in knapp einer Stunde rund vierzehn Kilometer {{27}} und war damit schneller als die Postkutsche. Seine ‚Laufmaschine‘ gilt heute als Urahn des Fahrrads.","Warum Drais gerade in diesen Jahren nach einem Fortbewegungsmittel ohne Pferd suchte, ist bis heute {{28}}. Manche Historiker vermuten einen Zusammenhang mit einer Naturkatastrophe: 1815 war in Indonesien der Vulkan Tambora {{29}}. Die ausgestoßenen Gase kühlten das Klima weltweit ab, {{30}} das Jahr 1816 in Europa als ‚Jahr ohne Sommer‘ in die Geschichte einging. Die Ernten fielen aus, Hafer wurde unbezahlbar, und viele Pferde mussten geschlachtet {{31}}. Ein Fahrzeug, das ohne Futter auskam, war plötzlich eine verlockende Idee.","Zunächst war die Begeisterung groß. Drais erhielt 1818 ein Privileg, {{32}} seine Erfindung schützte, und {{33}} in Paris als auch in London fuhren junge Männer, {{34}} Familien sich das neue Spielzeug leisten konnten, stolz durch die Parks. In England nannte man das Laufrad spöttisch ‚Dandy Horse‘. Doch {{35}} der holprigen Straßen wichen viele Fahrer auf die Gehwege aus, und mehrere Städte verboten das Fahren dort bis auf {{36}}. Die Mode {{37}} fast so schnell, wie sie gekommen war. Drais selbst starb 1851 verarmt in Karlsruhe. Im {{38}} betrachtet war er seiner Zeit weit voraus.","Jahrzehnte später griffen französische Handwerker die Idee wieder {{39}}. In den 1860er-Jahren brachten sie Pedale {{40}} Vorderrad an, und bald folgten Hochräder, auf {{41}} nur Wagemutige fuhren: Ihr Antriebsrad war fast mannshoch, und Stürze aus dieser Höhe endeten oft böse. Den Durchbruch brachte schließlich ein Modell mit zwei etwa gleich großen Rädern und Kettenantrieb, das 1885 in England vorgestellt {{42}}. Als drei Jahre später der luftgefüllte Reifen {{43}} wurde, war das moderne Fahrrad geboren.","Heute kommt in Deutschland auf fast jeden Einwohner ein Fahrrad, und Millionen Menschen fahren täglich {{44}}. Je dichter der Verkehr in den Städten wird, {{45}} wichtiger wird das Fahrrad als Alternative zum Auto. Ob Drais geahnt hat, was aus seiner Laufmaschine einmal werden {{46}}?"],"example":{"options":{"a":"brachte","b":"machte","c":"sorgte","d":"stellte"},"answer":"c"},"items":[{"no":"25","options":{"a":"hölzerne","b":"hölzernen","c":"hölzerner","d":"verholzten"},"answer":"b"},{"no":"26","options":{"a":"einander","b":"ihn","c":"sich","d":"uns"},"answer":"c"},{"no":"27","options":{"a":"ab","b":"entgegen","c":"fort","d":"zurück"},"answer":"d"},{"no":"28","options":{"a":"umstritten","b":"unbestritten","c":"unumstritten","d":"zerstritten"},"answer":"a"},{"no":"29","options":{"a":"ausbrechen","b":"ausgebracht","c":"ausgebrochen","d":"ausgebrochene"},"answer":"c"},{"no":"30","options":{"a":"damit","b":"nachdem","c":"ob","d":"sodass"},"answer":"d"},{"no":"31","options":{"a":"geworden","b":"werden","c":"worden","d":"wurden"},"answer":"b"},{"no":"32","options":{"a":"das","b":"dass","c":"dem","d":"dessen"},"answer":"a"},{"no":"33","options":{"a":"sowohl","b":"weder","c":"wenngleich","d":"zwar"},"answer":"a"},{"no":"34","options":{"a":"dem","b":"denen","c":"deren","d":"dessen"},"answer":"c"},{"no":"35","options":{"a":"trotz","b":"wegen","c":"wider","d":"zwecks"},"answer":"b"},{"no":"36","options":{"a":"Weitere","b":"Weiterem","c":"weiteres","d":"Weiteres"},"answer":"d"},{"no":"37","options":{"a":"verschwand","b":"verschwendete","c":"verschwindet","d":"verschwunden"},"answer":"a"},{"no":"38","options":{"a":"nachhinein","b":"Nachhinein","c":"Nachhinnein","d":"Nachinein"},"answer":"b"},{"no":"39","options":{"a":"an","b":"auf","c":"ein","d":"voran"},"answer":"b"},{"no":"40","options":{"a":"am","b":"im","c":"vom","d":"zum"},"answer":"a"},{"no":"41","options":{"a":"denen","b":"deren","c":"die","d":"diejenigen"},"answer":"a"},{"no":"42","options":{"a":"hat","b":"wird","c":"worden","d":"wurde"},"answer":"d"},{"no":"43","options":{"a":"empfunden","b":"entdeckt","c":"erfunden","d":"gefunden"},"answer":"c"},{"no":"44","options":{"a":"rad","b":"Rad","c":"Räder","d":"Rat"},"answer":"b"},{"no":"45","options":{"a":"als","b":"da","c":"dennoch","d":"desto"},"answer":"d"},{"no":"46","options":{"a":"worden","b":"wurde","c":"würde","d":"würden"},"answer":"c"}]}},"hoeren":{"t1":{"instruction":"Sie hören die Meinungen von acht Personen. Sie hören die Meinungen nur einmal. Entscheiden Sie beim Hören, welche Aussage (a–j) zu welcher Person (Sprecher/in 1–8) passt. Zwei Aussagen passen nicht. Markieren Sie Ihre Lösungen für die Aufgaben 47–54 auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aussagen a–j. Sie haben dazu eine Minute Zeit.","title":"Studienabbruch und Fachwechsel","statements":[{"letter":"a","text":"Zweifel zu Studienbeginn sind oft nur eine Phase, die vorübergeht."},{"letter":"b","text":"Wer an seinem Studium zweifelt, sollte sich möglichst bald Unterstützung holen."},{"letter":"c","text":"Wer sein Studium abbricht, hat später auf dem Arbeitsmarkt deutlich schlechtere Chancen."},{"letter":"d","text":"In manchen Fächern ist der Sprung von der Schule an die Hochschule zu groß."},{"letter":"e","text":"Ein Neuanfang in einem anderen Fach hat mir mehr gebracht als stures Durchhalten."},{"letter":"f","text":"Ob jemand sein Studium beendet, hängt auch davon ab, aus welchem Elternhaus er kommt."},{"letter":"g","text":"Ich musste erst lernen, die Entscheidung meines Kindes zu respektieren."},{"letter":"h","text":"Finanzielle Not wird als Grund für einen Studienabbruch oft übersehen."},{"letter":"i","text":"Hochschulen sollten alle Bewerberinnen und Bewerber vor der Zulassung verpflichtend testen, um Fehlentscheidungen zu vermeiden."},{"letter":"j","text":"Betriebe können davon profitieren, Menschen einzustellen, die ihr Studium nicht beendet haben."}],"items":[{"no":"47","label":"Sprecherin 1","answer":"e"},{"no":"48","label":"Sprecher 2","answer":"g"},{"no":"49","label":"Sprecherin 3","answer":"b"},{"no":"50","label":"Sprecher 4","answer":"j"},{"no":"51","label":"Sprecher 5","answer":"d"},{"no":"52","label":"Sprecherin 6","answer":"a"},{"no":"53","label":"Sprecherin 7","answer":"f"},{"no":"54","label":"Sprecher 8","answer":"h"}]},"t2":{"instruction":"Sie hören eine Radiosendung. Sie hören die Sendung nur einmal. Entscheiden Sie beim Hören, welche Aussage (a, b oder c) am besten passt. Markieren Sie Ihre Lösungen für die Aufgaben 55–64 auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 55–64. Sie haben dazu drei Minuten Zeit.","items":[{"no":"55","stem":"Bionik bedeutet nach Prof. Seifert,","options":{"a":"Formen aus der Natur möglichst detailgetreu nachzubauen.","b":"Funktionsprinzipien der Natur technisch zu nutzen.","c":"Lebewesen mithilfe der Technik gezielt zu verändern."},"answer":"b"},{"no":"56","stem":"Den Begriff ‚Bionik‘ gibt es","options":{"a":"schon seit der Zeit Leonardo da Vincis um 1500.","b":"erst seit dem Beginn des 21. Jahrhunderts.","c":"seit einer Konferenz vor gut sechzig Jahren."},"answer":"c"},{"no":"57","stem":"Der Erfinder des Klettverschlusses","options":{"a":"wurde durch eine zufällige Beobachtung angeregt.","b":"suchte gezielt nach einem neuen Verschluss für Schuhe.","c":"ließ seine Idee noch im selben Jahr schützen."},"answer":"a"},{"no":"58","stem":"Lotusblätter bleiben sauber, weil","options":{"a":"ihre Oberfläche besonders eben und glatt ist.","b":"Regentropfen den Dreck von der rauen Fläche spülen.","c":"die Pflanze ständig eine neue Schicht aus Wachs bildet."},"answer":"b"},{"no":"59","stem":"Bei der Gestaltung des japanischen Schnellzugs","options":{"a":"orientierte man sich an einem Vogelschnabel.","b":"ging es in erster Linie um mehr Geschwindigkeit.","c":"arbeitete man eng mit Biologen zusammen."},"answer":"a"},{"no":"60","stem":"Die Natur ist nach Prof. Seifert","options":{"a":"dem Menschen in sämtlichen technischen Fragen überlegen.","b":"für Ingenieure nur in Ausnahmefällen ein brauchbares Vorbild.","c":"eine Quelle von Lösungen, die nicht immer optimal sind."},"answer":"c"},{"no":"61","stem":"Bauteile nach dem Vorbild von Knochen","options":{"a":"brauchen weniger Werkstoff bei gleicher Stabilität.","b":"sind leichter, halten aber weniger Belastung aus.","c":"werden bisher hauptsächlich in der Medizin eingesetzt."},"answer":"a"},{"no":"62","stem":"Die Zusammenarbeit in den Projekten wird nach Prof. Seifert vor allem erschwert durch","options":{"a":"fehlendes Geld für gemeinsame Vorhaben.","b":"die verschiedenen Sprachen der Fächer.","c":"das geringe Interesse der Technik an Biologie."},"answer":"b"},{"no":"63","stem":"Der Greifer nach dem Vorbild des Geckos","options":{"a":"hält Gegenstände mithilfe eines besonderen Klebstoffs.","b":"ist bereits in mehreren Fabriken im Einsatz.","c":"hat noch Schwächen, wenn Flächen nicht sauber sind."},"answer":"c"},{"no":"64","stem":"Prof. Seifert wünscht sich vor allem, dass","options":{"a":"möglichst wenige Arten verschwinden.","b":"mehr junge Leute das Fach studieren.","c":"Unternehmen öfter mit Hochschulen kooperieren."},"answer":"a"}]},"t3":{"instruction":"Sie hören einen Vortrag. Sie hören den Vortrag nur einmal. Sie haben Handzettel mit den Folien der Präsentation erhalten. Schreiben Sie die fehlenden Informationen stichwortartig in die freien Zeilen 65–74 in der rechten Spalte.","exampleNote":"Die Lösung 0 ist ein Beispiel.","readNote":"Lesen Sie jetzt die Stichworte. Sie haben dazu eine Minute Zeit.","finalNote":"Sie haben jetzt fünf Minuten Zeit, Ihre Antworten zu den Aufgaben 65–74 auf den Antwortbogen zu übertragen.","exampleAnswer":"Wirtschaft im Alltag","slides":[{"title":"Ringvorlesung","lines":[{"no":"0","bullet":false,"dash":false,"text":"„…“"},{"no":"","bullet":false,"dash":false,"text":"Thema heute: Warum wir anders entscheiden, als wir denken"},{"no":"","bullet":false,"dash":false,"text":"Referent: Dr. Tobias Lindner, Lehrstuhl für Verhaltensökonomik"}]},{"title":"Das klassische Modell","lines":[{"no":"","bullet":true,"dash":false,"text":"„Homo oeconomicus“"},{"no":"65","bullet":true,"dash":false,"text":"Annahme: Menschen …"},{"no":"","bullet":true,"dash":false,"text":"Gegenbelege seit den 1970er-Jahren"}]},{"title":"Ankereffekt","lines":[{"no":"","bullet":true,"dash":false,"text":"Experiment: Glücksrad und Schätzfrage"},{"no":"66","bullet":true,"dash":false,"text":"Ergebnis: …"},{"no":"67","bullet":true,"dash":false,"text":"Beispiel aus dem Alltag: …"}]},{"title":"Experiment: Münzwurf","lines":[{"no":"68","bullet":true,"dash":false,"text":"zugrunde liegender Effekt: …"},{"no":"","bullet":true,"dash":false,"text":"Verluste wiegen etwa doppelt so schwer wie Gewinne"},{"no":"69","bullet":true,"dash":false,"text":"Folge an der Börse: …"}]},{"title":"Standardoptionen","lines":[{"no":"","bullet":true,"dash":false,"text":"Organspende: Österreich und Deutschland (Studie 2003)"},{"no":"70","bullet":true,"dash":false,"text":"Unterschied in der Regelung: …"},{"no":"71","bullet":true,"dash":false,"text":"Erklärung: …"}]},{"title":"Nudging","lines":[{"no":"","bullet":true,"dash":false,"text":"Thaler und Sunstein, 2008"},{"no":"72","bullet":true,"dash":false,"text":"Ziel: …"},{"no":"73","bullet":true,"dash":false,"text":"Beispiel Altersvorsorge: …"}]},{"title":"Kritik","lines":[{"no":"74","bullet":true,"dash":false,"text":"Haupteinwand: …"},{"no":"","bullet":true,"dash":false,"text":"Gegenkonzept: „Boosting“"}]}],"items":[{"no":"65","solution":"handeln rational, wägen Kosten und Nutzen ab, wählen das für sich Beste"},{"no":"66","solution":"wer die hohe Zahl gedreht hatte, schätzte deutlich höher (zufällige Zahl beeinflusst das Urteil)"},{"no":"67","solution":"durchgestrichener ‚Statt‘-Preis lässt das Angebot günstig erscheinen / erste Zahl in der Gehaltsverhandlung setzt den Rahmen (ein Beispiel genügt)"},{"no":"68","solution":"Verlustaversion"},{"no":"69","solution":"Aktien mit Verlust werden zu lange behalten (Gewinne zu früh verkauft)"},{"no":"70","solution":"Österreich: Spender ist, wer nicht widerspricht – Deutschland: ausdrückliche Zustimmung nötig"},{"no":"71","solution":"Menschen bleiben bei der Voreinstellung (Entscheidung wird aufgeschoben, wirkt wie Empfehlung)"},{"no":"72","solution":"ohne Verbote zu Entscheidungen im eigenen Interesse bewegen; Wahlfreiheit bleibt"},{"no":"73","solution":"automatische Aufnahme mit Austrittsmöglichkeit → Teilnahme steigt von unter 50 auf über 80 %"},{"no":"74","solution":"Bevormundung / Manipulation („Kritik“ allein genügt nicht)"}]}},"schreiben":{"instruction":"Wählen Sie eines der folgenden zwei Themen. Schreiben Sie einen Text, in dem Sie Ihren eigenen Standpunkt dazu erarbeiten und argumentativ darlegen. Ihr Text soll mindestens 350 Wörter umfassen. Sie haben 70 Minuten Zeit.","minWords":350,"minutes":70,"themes":[{"no":"1","paragraphs":["In einem Seminar wird diskutiert, ob jedes Studium ein Pflichtmodul zum Thema Nachhaltigkeit enthalten sollte.","Erörtern Sie Vor- und Nachteile eines solchen Moduls, greifen Sie die Zitate auf und berücksichtigen Sie Ihre eigenen Erfahrungen. Ziehen Sie am Schluss ein begründetes Fazit."],"quoteLead":"Die folgenden Zitate geben Ihnen erste Ideen:","quotes":["„Wer studiert, muss die Folgen seines Handelns verstehen – in jedem Fach.“","„Pflichtkurse erzeugen selten Begeisterung, meist nur Anwesenheit.“"],"model":{"title":"Nachhaltigkeit für alle – ein Pflichtmodul für jedes Studium?","paragraphs":["Ob Klimawandel, knappe Rohstoffe oder globale Lieferketten: Kaum eine Frage wird die kommenden Jahrzehnte so stark prägen wie die nach einer nachhaltigen Entwicklung. Vor diesem Hintergrund wird an unserer Hochschule diskutiert, ob jedes Studium ein Pflichtmodul zu diesem Thema enthalten sollte. Dabei geht es um mehr als Organisatorisches, nämlich darum, welche Aufgabe ein Studium heute überhaupt hat. Im Folgenden werden die wichtigsten Argumente beider Seiten gegeneinander abgewogen.","Für ein solches Modul spricht zunächst, dass Nachhaltigkeit kein Thema einzelner Fächer ist. Ingenieurinnen und Ingenieure entscheiden über den Energieverbrauch von Maschinen, Betriebswirtinnen und Betriebswirte über Lieferketten und Lehrkräfte darüber, was die nächste Generation lernt. Insofern ist dem ersten Zitat zuzustimmen: Wer die Folgen seines beruflichen Handelns nicht kennt, kann kaum verantwortungsbewusst urteilen. Hinzu kommt, dass ein gemeinsames Modul Studierende unterschiedlicher Fachrichtungen zusammenbringen würde. Gerade dieser Austausch fehlt im spezialisierten Studienalltag häufig, obwohl sich die großen Probleme unserer Zeit nur fächerübergreifend lösen lassen.","Andererseits ist der Einwand, den das zweite Zitat formuliert, nicht von der Hand zu weisen. Eine Veranstaltung, die man belegen muss, wird leicht als lästige Pflicht empfunden, und ein Kurs, der alle Fächer gleichermaßen ansprechen soll, bleibt oft an der Oberfläche. Zudem sind viele Studienpläne bereits so dicht, dass ein zusätzliches Modul nur auf Kosten anderer Inhalte eingeführt werden könnte. Nicht zuletzt stellt sich die Frage, wer ein solches Modul unterrichten soll, ohne dass es zu einer bloßen Aneinanderreihung von Schlagworten verkommt.","Meine eigenen Erfahrungen bestätigen beide Sichtweisen. In einem fächerübergreifenden Wahlseminar zum Thema Wasser habe ich mit Studierenden aus der Biologie, der Volkswirtschaftslehre und der Architektur zusammengearbeitet und dabei mehr über die Grenzen meines eigenen Fachs gelernt als in manchem Pflichtkurs. Allerdings saßen dort ausschließlich Studierende, die sich ohnehin für das Thema interessierten. Ob die Diskussionen in einer Pflichtveranstaltung ebenso lebhaft gewesen wären, bezweifle ich.","Insgesamt halte ich ein Pflichtmodul dennoch für sinnvoll – allerdings nur, wenn es nicht als allgemeine Vorlesung für alle konzipiert wird. Überzeugender wäre es, Nachhaltigkeit in jedem Studiengang mit fachspezifischen Fragen zu verknüpfen und in Projekten zu bearbeiten, an denen mehrere Fächer beteiligt sind. Auf diese Weise ließe sich vermeiden, dass aus dem Modul eine Veranstaltung wird, die – wie im zweiten Zitat befürchtet – lediglich Anwesenheit erzeugt."],"hint":"Textsorte Erörterung für ein Seminar. Aufbau: Einleitung mit Leitfrage – Argumente dafür mit Bezug auf Zitat 1 – Argumente dagegen mit Bezug auf Zitat 2 – eigene Erfahrung, die beide Seiten stützt – Fazit mit Bedingung. Sprachliche Mittel: sachlicher, unpersönlicher Stil (Im Folgenden werden … abgewogen; ist … zuzustimmen), Nominalstil (Aneinanderreihung, Austausch), Konjunktiv II (würde, könnte, wäre, ließe sich), Konnektoren der Abwägung (zunächst, andererseits, zudem, nicht zuletzt, insgesamt). Umfang: 361 Wörter."}},{"no":"2","paragraphs":["Ein Studierendenmagazin fragt, ob sich Hochschulen stärker für Berufstätige und Ältere öffnen sollten.","Nehmen Sie aus Ihrer persönlichen Sicht Stellung: Legen Sie Chancen und Probleme einer solchen Öffnung dar, beziehen Sie die Zitate ein und begründen Sie Ihre Meinung."],"quoteLead":"Die folgenden Zitate geben Ihnen erste Ideen:","quotes":["„Lernen hört nicht mit Mitte zwanzig auf.“","„Wo die Hörsäle schon jetzt voll sind, ist kein Platz für weitere Gäste.“"],"model":{"title":"Hörsaal ohne Altersgrenze","paragraphs":["Neben mir saß im letzten Semester eine Frau, die gut doppelt so alt war wie ich. Sie arbeitete als Krankenpflegerin, studierte nebenbei Gesundheitswissenschaften und stellte in jedem Seminar Fragen, auf die wir Jüngeren nie gekommen wären. Nach den Sitzungen haben wir uns oft unterhalten, und ich habe dabei mehr über den Alltag in einer Klinik erfahren als aus manchem Fachaufsatz. Seitdem frage ich mich, warum solche Studierende an unseren Hochschulen noch immer die Ausnahme sind.","Für eine stärkere Öffnung spricht aus meiner Sicht vor allem, dass sich die Arbeitswelt immer schneller verändert. Wer mit Mitte zwanzig seinen Abschluss macht, wird in seinem Berufsleben kaum ohne Weiterbildung auskommen. Das erste Zitat bringt es auf den Punkt: Lernen hört nicht mit Mitte zwanzig auf – und es sollte auch nicht an den Türen der Hochschulen enden. Außerdem profitieren wir Jüngeren selbst davon. Berufstätige bringen Erfahrungen aus der Praxis mit, die kein Lehrbuch ersetzen kann, und sie zwingen uns, Theorien an der Wirklichkeit zu messen.","Gleichzeitig verstehe ich die Sorge, die im zweiten Zitat zum Ausdruck kommt. In vielen Einführungsvorlesungen bekommt man schon jetzt nur mit Glück einen Sitzplatz, und Betreuungsplätze für Abschlussarbeiten sind knapp. Wenn zusätzliche Gruppen hinzukommen, ohne dass mehr Personal eingestellt wird, leidet die Qualität für alle. Hinzu kommt, dass Berufstätige ganz andere Bedürfnisse haben: Mit Veranstaltungen am Vormittag können sie wenig anfangen, und wer Familie hat, kann nicht für jede Gruppenarbeit spontan in die Bibliothek kommen.","Ich bin dennoch klar für eine Öffnung, allerdings nicht zum Nulltarif. Die Hochschulen bräuchten eigene Angebote am Abend, am Wochenende und online, die zusätzlich finanziert werden, statt die vorhandenen Plätze einfach aufzuteilen. Ebenso könnten Arbeitgeber ihren Beschäftigten feste Lernzeiten einräumen. Denkbar wären auch kürzere Zertifikatskurse, für die man kein vollständiges Studium aufnehmen muss. So hätten beide Gruppen etwas davon, und niemand müsste um seinen Platz im Hörsaal fürchten.","Meine Sitznachbarin hat übrigens inzwischen ihren Abschluss gemacht und leitet heute eine Station in einem großen Krankenhaus. Für mich ist sie der beste Beweis dafür, dass Hochschulen gewinnen, wenn sie nicht nur für eine Altersgruppe da sind. Ein Hörsaal ohne Altersgrenze ist kein Luxus, sondern eine Investition in die Zukunft – für die Älteren ebenso wie für uns."],"hint":"Textsorte persönliche Stellungnahme für ein Magazin. Aufbau: persönlicher Einstieg mit einer Begegnung – Chancen mit Bezug auf Zitat 1 – Probleme mit Bezug auf Zitat 2 – eigene Position mit konkreten Vorschlägen – Rückgriff auf den Einstieg im Schluss. Sprachliche Mittel: Ich-Perspektive und wertende Ausdrücke (aus meiner Sicht, Ich bin dennoch klar für …), anschauliches Beispiel, Konjunktiv II für Vorschläge (bräuchten, wären, hätten), Gegenüberstellung (gleichzeitig, dennoch). Umfang: 361 Wörter."}}]},"muendlich":{"teil1":[{"who":"A","themes":["Beschreiben Sie, wie das Internet das Einkaufen verändert hat. Welche Folgen hat diese Entwicklung für Innenstädte und Geschäfte?","Sollte es für junge Erwachsene ein verpflichtendes soziales Jahr geben? Welche Vorteile und welche Nachteile hätte eine solche Regelung? Begründen Sie Ihre Meinung."]},{"who":"B","themes":["Stellen Sie ein Gericht vor, das für Ihr Herkunftsland typisch ist. Welche Geschichte hat es, und welche Rolle spielt es heute?","Sollten Kinder schon in der Grundschule programmieren lernen? Begründen Sie Ihre Meinung."]},{"who":"C","themes":["Beschreiben Sie, wie Sie eine Fremdsprache gelernt haben. Was hat Ihnen geholfen, und was fiel Ihnen schwer?","Sollten Schulen ein Fach einführen, in dem es um Alltagskompetenzen wie Gesundheit, Finanzen und Konfliktlösung geht? Begründen Sie Ihre Meinung. Gibt es Gegenargumente?"]}],"teil2":[{"no":"1","text":"„Nicht die Wahrheit, in deren Besitz irgendein Mensch ist …, sondern die aufrichtige Mühe, die er angewandt hat, hinter die Wahrheit zu kommen, macht den Wert des Menschen.“","author":"Gotthold Ephraim Lessing, 1729–1781, Dichter und Philosoph"},{"no":"2","text":"„Das Talent gleicht dem Schützen, der ein Ziel trifft, welches die Übrigen nicht erreichen können; das Genie dem, der eines trifft, bis zu welchem sie nicht einmal zu sehen vermögen.“","author":"Arthur Schopenhauer, 1788–1860, Philosoph"},{"no":"3","text":"„Stets findet Überraschung statt, da, wo man’s nicht erwartet hat.“","author":"Wilhelm Busch, 1832–1908, Dichter und Zeichner"}]},"audio":[{"src":"telc%20C1%20HS%20Modelltest%203.1.mp3","dur":540.21},{"src":"telc%20C1%20HS%20Modelltest%203.2.mp3","dur":656.27},{"src":"telc%20C1%20HS%20Modelltest%203.3.mp3","dur":894.8}],"minutes":{"hoeren":40},"pdf":"telc%20C1%20HS%20Modelltest%203.pdf","pages":{"loesung":20,"muster":21,"kommentar":31,"hoertexte":25}},"4":{"id":4,"roman":"IV","lesen":{"t1":{"instruction":"Lesen Sie den folgenden Text. Welche der Sätze a–h gehören in die Lücken 1–6? Es gibt jeweils nur eine richtige Lösung. Zwei Sätze können nicht zugeordnet werden. Markieren Sie Ihre Lösungen für die Aufgaben 1–6 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","intro":"In einer populärwissenschaftlichen Zeitschrift lesen Sie folgenden Beitrag:","title":"Wie die Hieroglyphen ihre Stimme zurückbekamen","paragraphs":["Mehr als vierzehn Jahrhunderte lang konnte niemand die Hieroglyphen an den Tempeln und in den Gräbern Ägyptens lesen. Die jüngste bekannte Inschrift dieser Art stammt aus dem Jahr 394 nach Christus. {{0}} Die Gelehrten der frühen Neuzeit hielten die Zeichen deshalb für eine Bilderschrift voller geheimer Symbole, deren Sinn sich nur Eingeweihten erschließe. Der Jesuit Athanasius Kircher etwa deutete im 17. Jahrhundert ganze Inschriften als religiöse Botschaften – durchweg falsch.","Die Wende brachte ein Zufallsfund. Im Juli 1799 stießen französische Soldaten bei Schanzarbeiten nahe der Stadt Rosette im Nildelta auf eine Steinplatte mit drei Inschriften. {{1}} Da man Griechisch lesen konnte, schien der Schlüssel zur Entzifferung plötzlich zum Greifen nah.","Doch die Hoffnung trog zunächst. Nach der Niederlage der Franzosen in Ägypten gelangte der Stein 1802 nach London, wo er bis heute im British Museum zu sehen ist. {{2}} Der englische Arzt und Physiker Thomas Young, der auch durch seine Versuche zur Natur des Lichts berühmt wurde, erkannte zwar, dass die ovalen Umrandungen, die sogenannten Kartuschen, die Namen von Herrschern enthielten. Ein System hinter den Zeichen fand er jedoch nicht, zumal er annahm, dass nur fremde Namen mit Lautzeichen geschrieben wurden.","Den Durchbruch schaffte schließlich der Franzose Jean-François Champollion. {{3}} Er verglich die Kartuschen mit den Namen Ptolemaios und Kleopatra, die er aus griechischen Inschriften kannte, und konnte so einzelnen Zeichen Laute zuordnen. {{4}} Am 14. September 1822 soll er in das Arbeitszimmer seines Bruders gestürmt sein, „Ich hab’s!“ gerufen haben und vor Aufregung ohnmächtig geworden sein.","Kurz darauf stellte er seine Ergebnisse in einem Brief an die Pariser Akademie vor. {{5}} Die Hieroglyphen waren also keine geheimnisvolle Symbolschrift, wie man jahrhundertelang geglaubt hatte. In den folgenden Jahren zeigte Champollion zudem, dass sich mit ihnen ganz alltägliche Wörter festhalten ließen. Sein 1824 erschienenes Hauptwerk über das System der Hieroglyphen gilt bis heute als Grundstein der Ägyptologie.","Champollion selbst hatte nur wenig Zeit, die Früchte seiner Arbeit zu ernten. 1828 reiste er zum ersten Mal nach Ägypten, wo er zahlreiche Inschriften vor Ort abschrieb und übersetzte, statt sich wie bisher auf ungenaue Kopien verlassen zu müssen. {{6}} Vollständig erschlossen wurde die Sprache erst von späteren Generationen, die auf seinen Grundlagen aufbauten."],"sentences":[{"letter":"a","text":"Darin wies er nach, dass die Zeichen nicht nur für Begriffe standen, sondern häufig auch Laute wiedergaben."},{"letter":"b","text":"Young hatte das System zu diesem Zeitpunkt bereits vollständig entschlüsselt, seine Ergebnisse aber nie veröffentlicht."},{"letter":"c","text":"Abschriften verbreiteten sich jedoch rasch unter Europas Gelehrten, und ein regelrechter Wettlauf begann."},{"letter":"d","text":"Schon 1832 starb er in Paris, gerade einmal einundvierzig Jahre alt."},{"letter":"e","text":"Sie enthielt denselben Erlass dreimal: in Hieroglyphen, in demotischer Alltagsschrift und auf Griechisch."},{"letter":"f","text":"Mit diesen Lautwerten las er bald auch Namen, die auf keiner zweisprachigen Inschrift standen, etwa Ramses."},{"letter":"g","text":"Er beherrschte zahlreiche alte und orientalische Sprachen, darunter das Koptische, die späteste Form des Ägyptischen."},{"letter":"h","text":"Der Stein wurde zunächst in Kairo ausgestellt, wo ihn der junge Champollion während seines Studiums mehrmals abzeichnete."}],"example":{"letter":"z","text":"Mit den letzten Priestern, die sie noch beherrschten, ging auch das Wissen um ihre Bedeutung verloren."},"items":[{"no":"1","answer":"e"},{"no":"2","answer":"c"},{"no":"3","answer":"g"},{"no":"4","answer":"f"},{"no":"5","answer":"a"},{"no":"6","answer":"d"}]},"t2":{"instruction":"Lesen Sie den folgenden Text. In welchem Textabsatz a–e finden Sie die Antworten auf die Fragen 7–12? Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7–12 auf dem Antwortbogen.","title":"Kleider ohne Wert","sections":[{"letter":"a","text":"Wer heute einen Kleiderschrank öffnet, findet darin oft mehr, als er jemals tragen wird. Zwischen 2000 und 2014 hat sich die weltweite Produktion von Kleidung ungefähr verdoppelt, und in Deutschland kauft jeder Mensch Schätzungen zufolge im Schnitt sechzig neue Teile im Jahr. Gleichzeitig bleiben Kleidungsstücke immer kürzer im Gebrauch. Manche tragen wir nur ein paar Mal, andere hängen noch mit Preisschild im Schrank, bis wir sie irgendwann aussortieren. Möglich gemacht hat diesen Wandel ein Geschäftsmodell, das unter dem Namen „Fast Fashion“ bekannt geworden ist: Große Ketten bringen nicht mehr zwei Kollektionen im Jahr heraus, sondern beinahe jede Woche neue Ware, und das zu Preisen, die kaum höher sind als die eines Mittagessens. Ich halte diese Entwicklung für einen der großen blinden Flecken unserer Konsumgesellschaft, über den erstaunlich wenig gesprochen wird."},{"letter":"b","text":"Zugegeben: Die billige Mode hat nicht nur Schattenseiten. Für Familien mit kleinem Einkommen ist es eine Erleichterung, dass ein Wintermantel für Kinder nicht mehr ein halbes Monatsgehalt kostet. Auch Jugendliche, die mit ihrer Kleidung zeigen wollen, wer sie sind, können heute Trends folgen, die früher nur Wohlhabenden offenstanden. Mode ist dadurch gewissermaßen demokratischer geworden, und der Wunsch, sich schön zu kleiden, ist ohnehin nichts Verwerfliches. Zudem garantiert ein hoher Preis keineswegs, dass ein Kleidungsstück unter besseren Bedingungen entstanden ist; manche teure Marke lässt in denselben Fabriken nähen wie die Billigketten. Mir geht es daher nicht darum, Menschen für ihre Einkäufe zu verurteilen. Wer mit wenig Geld auskommen muss, kann sich die fair produzierte Jacke für zweihundert Euro schlicht nicht leisten. Mein Unbehagen gilt einem System, das darauf angelegt ist, dass wir möglichst schnell wieder kaufen."},{"letter":"c","text":"Die Rechnung für dieses System zahlen andere. Für ein einziges Baumwoll-T-Shirt werden je nach Anbaugebiet mehrere Tausend Liter Wasser verbraucht, häufig in Regionen, in denen es ohnehin knapp ist. Beim Färben gelangen Chemikalien in Flüsse, und Synthetikkleidung verliert bei jeder Wäsche winzige Fasern, die Kläranlagen nur zum Teil zurückhalten; der Rest landet schließlich im Meer. Dazu kommen weite Transportwege, denn kaum ein Kleidungsstück, das hier verkauft wird, ist auch hier entstanden. Noch schwerer wiegen die Arbeitsbedingungen. Als 2013 in Bangladesch das Fabrikgebäude Rana Plaza einstürzte, starben mehr als 1100 Menschen, die meisten von ihnen Näherinnen. Danach versprachen viele Unternehmen Besserung, und manche Fabriken sind heute tatsächlich sicherer. An den niedrigen Löhnen hat sich jedoch wenig geändert. Es beschämt mich, wie schnell solche Katastrophen aus den Schlagzeilen verschwinden, während die Kleidung, die dort genäht wird, weiterhin in unseren Läden hängt."},{"letter":"d","text":"Viele beruhigen ihr Gewissen, indem sie aussortierte Kleidung in den Altkleidercontainer werfen. Ich bezweifle allerdings, dass damit viel gewonnen ist. Nur ein kleiner Teil der gesammelten Ware wird hierzulande weiterverkauft; ein großer Teil geht ins Ausland, etwa nach Osteuropa oder Westafrika. Dort landet vieles auf Märkten, die längst mit Altkleidern überschwemmt sind, und was niemand kauft, endet auf Deponien oder an Stränden. Gemeinnützige Sammelstellen berichten zudem seit Jahren, dass die Qualität der abgegebenen Kleidung sinkt und immer weniger davon überhaupt noch tragbar ist. Auch das Recycling ist nicht so weit, wie die Werbung verspricht. Weil die meisten Kleidungsstücke aus Mischgeweben bestehen, lassen sich die Fasern kaum sortenrein trennen; weltweit wird weniger als ein Prozent des Materials wieder zu neuer Kleidung verarbeitet. Meist entstehen daraus allenfalls Putzlappen oder Dämmstoffe. Die Vorstellung, man könne unbesorgt weiter konsumieren, solange man nur ordentlich entsorgt, hält einer genaueren Prüfung nicht stand."},{"letter":"e","text":"Was also ist zu tun? Mit Appellen an die Vernunft der Kundschaft allein wird es nicht gehen. Die Politik muss dafür sorgen, dass die tatsächlichen Kosten im Preis sichtbar werden. Die Europäische Union will Hersteller künftig für Sammlung und Verwertung ihrer Textilien zahlen lassen. Das ist ein Schritt in die richtige Richtung, der aber nur wirkt, wenn die Abgaben spürbar ausfallen. Wegen eines Betrags, den man an der Kasse kaum bemerkt, wird kein Konzern sein Geschäftsmodell ändern. Ebenso wichtig wären längere Garantiefristen und ein Recht auf Reparatur, damit es sich wieder lohnt, ein Kleidungsstück flicken zu lassen, statt es zu ersetzen. Und wir selbst? Wir könnten mit einer einfachen Frage beginnen: Würde ich dieses Teil mindestens dreißigmal tragen? Wer ehrlich antwortet, wird manches im Laden hängen lassen. Mode darf Freude machen – aber sie sollte nicht zum Wegwerfartikel werden."}],"exampleLead":"In welchem Abschnitt …","example":{"stem":"erwähnt der Autor, wie oft große Modeketten neue Ware anbieten?","answer":"a"},"itemsLead":"In welchem Abschnitt …","items":[{"no":"7","stem":"stellt der Autor fest, dass viele Kleidungsstücke kaum benutzt werden?","answer":"a"},{"no":"8","stem":"räumt der Autor ein, dass preiswerte Mode manchen Menschen mehr Möglichkeiten bietet?","answer":"b"},{"no":"9","stem":"weist der Autor darauf hin, dass manche Kleidung beim Waschen Kunststoff abgibt?","answer":"c"},{"no":"10","stem":"zweifelt der Autor am Nutzen von Kleiderspenden?","answer":"d"},{"no":"11","stem":"fordert der Autor, dass die Preise die wahren Kosten der Mode zeigen?","answer":"e"},{"no":"12","stem":"begründet der Autor, warum aus alter Kleidung nur selten neue entsteht?","answer":"d"}]},"t3":{"instruction":"Lesen Sie den folgenden Text und die Aussagen 13–23. Welche der Aussagen sind richtig (r), falsch (f) oder gar nicht im Text enthalten (–)? Es gibt jeweils nur eine richtige Lösung. Markieren Sie Ihre Lösungen für die Aufgaben 13–23 auf dem Antwortbogen.","title":"","paragraphs":["Der Regionalzug hat zwanzig Minuten Verspätung, und auf dem Bahnsteig geschieht, was inzwischen fast überall geschieht: Kaum ist die Durchsage verklungen, greifen die Wartenden zu ihren Smartphones. Niemand schaut in die Landschaft, niemand hängt einfach seinen Gedanken nach. Ein Kind fragt, wie lange es noch dauert; die Mutter reicht ihm wortlos das Tablet. Die zwanzig Minuten werden gefüllt, bevor sie überhaupt leer werden können. Dabei hätte die Langeweile, der wir so eifrig ausweichen, womöglich mehr zu bieten, als wir ihr gemeinhin zutrauen.","„Langeweile ist ein unterschätztes Gefühl“, sagt Ines Kramer, die als Psychologin an einer Universität erforscht, wie Menschen mit ungenutzter Zeit umgehen. Mit Ruhe habe Langeweile wenig zu tun. Wer sich entspannt, möchte gerade nichts tun. Wer sich langweilt, möchte dagegen durchaus etwas tun, findet aber nichts, was ihn fesselt. Diese Kluft zwischen dem Wunsch nach Beschäftigung und dem Fehlen einer lohnenden Aufgabe empfinden die meisten als quälend – und zwar quälender, als man vermuten würde.","Wie unangenehm schon wenige Minuten ohne Ablenkung sein können, zeigte 2014 ein Experiment in den USA. Die Teilnehmenden sollten bis zu einer Viertelstunde allein in einem kargen Raum sitzen und sich mit ihren Gedanken beschäftigen. Zuvor hatten sie probeweise einen leichten Stromschlag erhalten, und viele gaben an, sie würden sogar Geld bezahlen, um ihn nicht noch einmal zu spüren. Selbst unter ihnen drückten zwei Drittel der Männer und ein Viertel der Frauen während dieser Zeit mindestens einmal auf den Knopf, der den Stromschlag auslöste. Offenbar war ihnen der kurze Schmerz lieber als die Leere.","Dass die Langeweile einen schlechten Ruf hat, ist nicht neu. Schon das deutsche Wort verrät, wie sie sich anfühlt: Die Weile, also die Zeit, wird lang. Der dänische Philosoph Søren Kierkegaard nannte die Langeweile 1843 gar die „Wurzel allen Übels“. In der Literatur des 19. Jahrhunderts erscheint sie häufig als Leiden reicher Adliger, die mit ihrer Zeit nichts anzufangen wissen. Erzieher und Moralisten sahen in ihr lange einen Charakterfehler, den man durch Fleiß und Pflichterfüllung austreiben müsse. Erst in den vergangenen zwei Jahrzehnten hat sich die Psychologie intensiver mit der Langeweile beschäftigt – und dabei manches Vorurteil korrigiert.","Kramer betrachtet die Langeweile heute als Signal, vergleichbar mit Hunger oder Schmerz. „Hunger sagt uns, dass wir essen sollten. Langeweile sagt uns, dass das, was wir gerade tun, uns nicht genügt“, erklärt sie. Das Gefühl dränge dazu, die Situation zu verändern: sich ein neues Ziel zu suchen, eine Tätigkeit abzubrechen oder eine andere Perspektive einzunehmen. In diesem Sinne sei Langeweile kein Defekt, sondern ein durchaus nützlicher Mechanismus, den die Evolution nicht ohne Grund hervorgebracht habe.","Dass Langeweile sogar kreativ machen kann, legt eine Studie aus Großbritannien nahe. Eine erste Gruppe musste zunächst eine Viertelstunde lang Nummern aus einem Telefonbuch abschreiben, eine zweite sollte die Nummern nur lesen, eine dritte begann ohne diese Vorübung. Anschließend sollten alle möglichst viele Verwendungsmöglichkeiten für zwei Plastikbecher finden. Die beiden gelangweilten Gruppen kamen auf deutlich mehr Einfälle als die dritte – am meisten diejenigen, die die Nummern bloß gelesen hatten.","„Wenn uns die Umgebung nichts bietet, beginnt der Geist, sich selbst zu beschäftigen“, sagt Kramer. Tagträume, in denen sich Gedanken frei verknüpfen, seien dafür ein idealer Nährboden.","Allerdings warnt Kramer davor, die Langeweile zu verklären. Wer sich dauerhaft langweilt, etwa weil der Alltag kaum Abwechslung oder Sinn bietet, ist häufig unzufrieden und neigt eher zu riskantem Verhalten. Die Forschung unterscheidet deshalb zwischen der vorübergehenden Langeweile, die jeder kennt, und einer dauerhaften Neigung, sich zu langweilen. Entscheidend sei, was man aus dem Gefühl mache. „Kurze Phasen der Langeweile können uns anregen. Chronische Langeweile dagegen ist ein Hinweis darauf, dass im Leben etwas Grundsätzliches nicht stimmt, und sollte ernst genommen werden.“","Gerade die kurzen Phasen aber kommen im Alltag vieler Menschen kaum noch vor. Wartezeiten an der Kasse, in der Bahn oder beim Arzt werden heute fast automatisch mit dem Smartphone überbrückt. Kramer vermutet, dass wir dadurch verlernen, Langeweile auszuhalten. Wirklich vertrieben werde sie durch das ständige Wischen ohnehin nicht. „Viele berichten, dass sie sich nach einer halben Stunde in sozialen Netzwerken leerer fühlen als vorher. Die Ablenkung füllt die Zeit, aber sie gibt uns nicht das Gefühl, etwas Sinnvolles getan zu haben.“","Auch in der Arbeitswelt ist Langeweile ein Thema, wenn auch eines, über das selten gesprochen wird. 2007 machten zwei Schweizer Unternehmensberater den Begriff „Boreout“ bekannt. Gemeint ist ein Zustand, in dem Beschäftigte dauerhaft unterfordert sind und ihre Tätigkeit als sinnlos erleben. Nach außen wirken die Betroffenen oft vielbeschäftigt: Sie strecken einfache Aufgaben über den ganzen Tag oder öffnen rasch ein Dokument, sobald jemand das Büro betritt. Denn wer zugibt, sich zu langweilen, fürchtet, als überflüssig zu gelten. Für die Gesundheit kann diese Unterforderung auf Dauer ähnlich belastend sein wie ständige Überforderung.","Bei Kindern sehen viele Eltern in der Langeweile ein Alarmsignal, auf das sie sofort reagieren müssen. Kaum klagt das Kind, ihm sei langweilig, wird ein Spiel, ein Ausflug oder ein Film angeboten. Kramer hält das für einen Fehler. „Kinder, die lernen, mit Langeweile umzugehen, entdecken eigene Interessen. Sie bauen aus Decken eine Höhle oder erfinden ein Spiel, auf das kein Erwachsener gekommen wäre.“ Eltern rät sie, die Klage gelassen hinzunehmen und dem Kind zuzutrauen, selbst eine Lösung zu finden. Ein Nachmittag ohne Programm sei für Kinder kein verlorener, sondern oft ein besonders wertvoller.","Und an der Hochschule? Dort gilt Langeweile vielen als sicheres Zeichen schlechter Lehre. Häufig ist zu lesen, die Aufmerksamkeit sinke in jeder Vorlesung nach zehn bis fünfzehn Minuten zwangsläufig ab. Kramer hält diese Regel für schlecht belegt: Die Studien, auf denen diese Annahme beruhe, seien klein und methodisch fragwürdig. Wie lange Studierende bei der Sache bleiben, hänge vielmehr davon ab, ob ein Thema sie berührt und ob sie selbst aktiv werden dürfen. Eine kurze Pause, eine Frage an das Publikum oder ein überraschendes Beispiel könne die Aufmerksamkeit jederzeit zurückholen.","Was also tun, wenn sich die Langeweile meldet? Kramer empfiehlt, das Gefühl zunächst wahrzunehmen, statt es sofort zu verdrängen. Hilfreich sei die Frage, was gerade fehlt: eine Herausforderung, ein Sinn oder schlicht eine Pause. Manchmal genüge es, die Gedanken eine Weile treiben zu lassen. Wer das regelmäßig übe, werde mit der Zeit gelassener. Wer dagegen bei jeder Regung zum Handy greife, nehme sich selbst die Chance, herauszufinden, was er eigentlich braucht. „Langeweile auszuhalten ist eine Fähigkeit, die man trainieren kann – ähnlich wie Geduld.“","Auf dem Bahnsteig hat sich inzwischen etwas verändert. Ein älterer Mann hat sein Telefon in die Jackentasche gesteckt und beobachtet die Krähen, die auf dem Nachbargleis nach Futter suchen.","Der Zug kommt in fünf Minuten, doch der Mann blickt nicht auf die Anzeigetafel. Vielleicht langweilt er sich. Vielleicht kommt ihm gerade eine Idee."],"itemsLead":"Aussagen 13–23","items":[{"no":"13","text":"Kramer zufolge ist Langeweile eine Form der Entspannung.","answer":"f"},{"no":"14","text":"Im amerikanischen Versuch nahmen einige Teilnehmende lieber einen kurzen Schmerz in Kauf, als nur nachzudenken.","answer":"r"},{"no":"15","text":"Bei den Frauen war der Anteil derer, die den Stromschlag auslösten, höher als bei den Männern.","answer":"f"},{"no":"16","text":"Kramer zufolge funktioniert Langeweile ähnlich wie Signale des Körpers.","answer":"r"},{"no":"17","text":"In der britischen Studie schrieben einige Teilnehmende Nummern ab und hatten danach weniger Ideen als die Gruppe ohne Vorübung.","answer":"f"},{"no":"18","text":"Kramer selbst verzichtet im Alltag weitgehend auf ihr Smartphone.","answer":"n"},{"no":"19","text":"Bekannt gemacht wurde der Begriff „Boreout“ von zwei Fachleuten aus der Wirtschaftsberatung.","answer":"r"},{"no":"20","text":"Unterforderte Angestellte sprechen meist offen über ihre Langeweile.","answer":"f"},{"no":"21","text":"Jugendliche langweilen sich häufiger als Erwachsene.","answer":"n"},{"no":"22","text":"Kramer bezweifelt, dass die Konzentration in Vorlesungen nach einer festen Zeit nachlässt.","answer":"r"},{"no":"23","text":"Kramer bietet Kurse an, in denen man den Umgang mit Langeweile üben kann.","answer":"n"}],"headline":{"instruction":"Welche der Überschriften a, b oder c trifft die Aussage des Textes am besten? Markieren Sie Ihre Lösung für die Aufgabe 24 auf dem Antwortbogen.","no":"24","options":{"a":"Warum das Smartphone die Langeweile nicht vertreibt","b":"Langeweile – ein Zustand, den man meiden sollte","c":"Vom Nutzen eines unbeliebten Gefühls"},"answer":"c"}},"sb":{"instruction":"Lesen Sie den folgenden Text. Welche Lösung (a, b, c oder d) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 25–46 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","title":"Eine Erfindung aus dem Schulheft","paragraphs":["Kaffee gehörte um 1900 in Deutschland längst zum Alltag, doch seine Zubereitung {{0}} viele Hausfrauen vor ein Problem. Meist wurde das Pulver einfach mit heißem Wasser {{25}}, sodass beim Trinken Kaffeesatz {{26}} die Zunge geriet. Andere Verfahren, bei {{27}} man Stoffbeutel oder Metallsiebe benutzte, lieferten {{28}} einen klareren Kaffee, doch die Beutel und Siebe waren mühsam zu reinigen. Mancher griff deshalb lieber gleich zum Tee.","Die Dresdner Hausfrau Melitta Bentz wollte sich damit nicht {{29}}. Sie probierte zunächst verschiedene Stoffe aus, doch keiner hielt den Kaffeesatz zuverlässig zurück. Kurzerhand nahm sie einen Messingtopf, schlug mit Hammer und Nagel Löcher {{30}} den Boden und legte ein Blatt Löschpapier aus dem Schulheft ihres Sohnes hinein. Das Ergebnis überzeugte sie: Der Kaffee lief klar und ohne Krümel durch, und das Papier {{31}} nach Gebrauch einfach weggeworfen werden.","Am 20. Juni 1908 ließ sie ihre Erfindung beim Kaiserlichen Patentamt als Gebrauchsmuster {{32}}. Noch im selben Jahr gründete sie gemeinsam mit ihrem Mann eine Firma, {{33}} Startkapital aus wenigen Pfennigen bestand. Hergestellt {{34}} die ersten Filter in der Dresdner Wohnung der Familie, und auf der Leipziger Messe {{35}} sich die Neuheit bald großer Beliebtheit: 1909 wurden dort bereits mehr als tausend Filter verkauft.","Der Erfolg hatte {{36}} Gründe. Der Filter war preiswert, und er sparte Zeit, {{37}} man keine Tücher mehr auskochen musste. Während des {{38}} Weltkriegs kam die Produktion allerdings fast zum {{39}}, weil Papier knapp war. 1929 zog das Unternehmen nach Minden in Westfalen, wo es bis heute seinen Sitz hat. In den Dreißigerjahren folgte schließlich die kegelförmige Filtertü
