  }

})();
</script>

:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1f5a9e;--acc-2:#17457a;--acc-w:#e6eef8;--acc-line:#9db9dc;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:980px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.blog .bh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.86em;color:var(--muted);border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:12px}
.blog .bh b{color:var(--ink-2)}
.blog h3,.art h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.blog p,.art p,.doc p{margin:0 0 .75em}
.blog .cl{margin-top:.6em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}
.art .fn{font-size:.85em;color:var(--muted);margin-top:8px}
.cmh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:.06em;font-size:.86em;color:var(--ink-2);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.cmh span{letter-spacing:0;font-weight:400;color:var(--muted)}
.cm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.cm .n{font-weight:700;color:var(--ink-2);font-size:.95em;padding-top:1px}
.cm .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cm p{margin:0}
.cm .by{text-align:right;color:var(--muted);font-size:.9em;margin-top:4px}
.doc h3{text-align:center;font-size:1em;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.doc .dh{font-weight:700}

/* items */
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.q:last-child{border-bottom:0}
.q .qn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;background:#fff;color:var(--ink-2)}
.q.ans .qn{background:var(--acc);border-color:var(--acc);color:#fff}
.q.ex{background:#f7f8f9;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px;border-bottom:0;margin-bottom:6px}
.q.ex .qn{font-size:.72em;border-style:dashed}
.q .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.q .qt{margin:3px 0 8px}
.q.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:#fff6c7}100%{background:transparent}}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--line-2);border-radius:6px;cursor:pointer;background:#fff;line-height:1.45}
.opts.row .opt{min-width:112px}

<script id="exam-data" type="application/json">{"build":"202610271320","tests":{"1":{"id":1,"roman":"I","lesen":{"t1":{"instruction":"Lesen Sie den folgenden Text. Welche der Sätze a–h gehören in die Lücken 1–6? Es gibt jeweils nur eine richtige Lösung. Zwei Sätze können nicht zugeordnet werden. Markieren Sie Ihre Lösungen für die Aufgaben 1–6 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","intro":"In der Wissenschaftsbeilage Ihrer Hochschulzeitung lesen Sie folgenden Artikel:","title":"Basisdemokratie im Bienenschwarm","paragraphs":["Wird ein Bienenvolk zu groß, teilt es sich: Die alte Königin verlässt mit einem großen Teil der Arbeiterinnen den Stock, und der Schwarm lässt sich zunächst an einem Ast in der Nähe nieder. {{0}} Diese Entscheidung ist für das Volk überlebenswichtig, denn ein schlecht gewählter Nistplatz – zu klein, zu feucht oder zu nah am Boden – kann bedeuten, dass es den nächsten Winter nicht übersteht.","Auf die Suche nach einer neuen Bleibe begeben sich allerdings nicht alle Bienen, sondern nur einige Hundert erfahrene Kundschafterinnen. {{1}} Kehrt eine von ihnen von einer vielversprechenden Höhle zurück, wirbt sie auf der Oberfläche der Traube mit einem Schwänzeltanz dafür. Winkel und Dauer der sogenannten Schwänzelphase verraten den anderen Bienen, in welcher Richtung und Entfernung der Ort liegt. {{2}} Ein hervorragender Standort gewinnt daher schneller neue Unterstützerinnen als ein mittelmäßiger; diese prüfen ihn ihrerseits und werben anschließend ebenfalls für ihn.","Bemerkenswert ist, dass keine einzelne Biene die verschiedenen Angebote miteinander vergleicht. {{3}} Mit jedem weiteren Besuch tanzt eine Kundschafterin weniger ausdauernd für ihren Favoriten, bis sie schließlich ganz damit aufhört. Im Rennen bleiben also nur Orte, die fortlaufend neue Fürsprecherinnen gewinnen. Hinzu kommt eine Art Einspruchsrecht: Bienen, die einen konkurrierenden Ort bevorzugen, stoßen Tänzerinnen mit dem Kopf an und senden dabei ein kurzes Vibrationssignal aus. {{4}}","Die eigentliche Entscheidung fällt jedoch nicht auf der Traube, sondern am Nistplatz selbst. {{5}} Ist diese Schwelle erreicht, kehren die Kundschafterinnen zurück und erzeugen einen hohen Pfeifton, der die übrigen Bienen veranlasst, ihre Flugmuskulatur aufzuwärmen. Kurz darauf erhebt sich der gesamte Schwarm. Den Weg zum neuen Zuhause weisen ihm die Kundschafterinnen, indem sie in schnellem Flug immer wieder durch die Wolke der Bienen schießen.","Der amerikanische Biologe Thomas Seeley, der Bienenschwärme seit den Siebzigerjahren erforscht und dafür unter anderem Nistkästen auf einer Insel vor der Küste von Maine aufgestellt hat, spricht deshalb von einer „Bienendemokratie“ und sieht darin ein Vorbild für menschliche Gremien. {{6}} Statt sich in endlosen Debatten zu verlieren, lassen sie zahlreiche voneinander unabhängige Prüfungen zu, bündeln deren Ergebnisse und legen im Voraus fest, ab wann genügend Zustimmung erreicht ist."],"sentences":[{"letter":"a","text":"Auf diese Weise schwächen sich die rivalisierenden Lager gegenseitig, bis eines deutlich überwiegt."},{"letter":"b","text":"Wie oft sie tanzt, hängt dagegen davon ab, wie sehr sie der Ort überzeugt hat."},{"letter":"c","text":"Gut funktionierende Gruppen, so seine Beobachtung, gehen nämlich ganz ähnlich vor."},{"letter":"d","text":"Der Schwänzeltanz verrät allerdings nichts über die Qualität eines Ortes, sondern ausschließlich etwas über dessen Richtung und Entfernung."},{"letter":"e","text":"Sie schwärmen in alle Richtungen aus und inspizieren Baumhöhlen oder Mauerspalten, manchmal fast eine Stunde lang."},{"letter":"f","text":"Dort bleibt er in der Regel mehrere Wochen, bis die Königin die Reise fortsetzt."},{"letter":"g","text":"Vielmehr sorgt ein schlichter Mechanismus dafür, dass schwächere Vorschläge nach und nach von selbst verschwinden."},{"letter":"h","text":"Halten sich dort etwa fünfzehn Kundschafterinnen gleichzeitig auf, gilt die Wahl als getroffen."}],"example":{"letter":"z","text":"Dort hängt er als dichte Traube, bis feststeht, wo er sich dauerhaft niederlassen wird."},"items":[{"no":"1","answer":"e"},{"no":"2","answer":"b"},{"no":"3","answer":"g"},{"no":"4","answer":"a"},{"no":"5","answer":"h"},{"no":"6","answer":"c"}]},"t2":{"instruction":"Lesen Sie den folgenden Text. In welchem Textabsatz a–e finden Sie die Antworten auf die Fragen 7–12? Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7–12 auf dem Antwortbogen.","title":"Englisch für alle – ein Gewinn mit Nebenwirkungen","sections":[{"letter":"a","text":"Die Wissenschaft hat schon mehrfach die Sprache gewechselt. Jahrhundertelang verständigten sich Gelehrte in ganz Europa auf Latein, bevor sich ab dem 17. Jahrhundert nach und nach die Landessprachen durchsetzten. Um 1900 war Deutsch eine der führenden Wissenschaftssprachen: Albert Einstein veröffentlichte seine bahnbrechenden Arbeiten 1905 in den Leipziger „Annalen der Physik“. Mathematiker und Mediziner publizierten je nach Herkunft auf Deutsch, Französisch oder Englisch, und wer mitreden wollte, las alle drei Sprachen. Dass sich das änderte, hatte zunächst wenig mit der Sprache selbst zu tun: Nach dem Ersten Weltkrieg wurden deutsche Forscher jahrelang von internationalen Kongressen ausgeschlossen, und in den Dreißigerjahren vertrieb das NS-Regime zahlreiche Wissenschaftlerinnen und Wissenschaftler ins Ausland, viele von ihnen in die USA. Heute erscheinen in den Naturwissenschaften Schätzungen zufolge weit über neunzig Prozent aller Fachaufsätze auf Englisch; in den Geistes- und Sozialwissenschaften ist der Anteil zwar geringer, wächst aber ebenfalls."},{"letter":"b","text":"Die Vorzüge dieser Entwicklung lassen sich kaum bestreiten. Eine gemeinsame Sprache senkt die Hürden für die Zusammenarbeit erheblich: Eine Epidemiologin in Seoul kann die Daten ihrer Kollegen aus São Paulo noch am Tag der Veröffentlichung lesen, und internationale Forschungsteams wären ohne Englisch kaum denkbar. Einheitliche Begriffe beugen zudem Missverständnissen vor, die beim Übersetzen zwischen vielen Sprachen zwangsläufig entstünden, und Gutachterinnen und Gutachter lassen sich leichter finden, wenn sie nicht aus derselben Sprachgemeinschaft stammen müssen wie die Autorinnen und Autoren. Auch kleinere Länder profitieren: Ergebnisse aus Estland oder Slowenien finden eine weltweite Leserschaft, die ihnen in der jeweiligen Landessprache verschlossen bliebe, und für junge Forschende aus ärmeren Staaten kann die gemeinsame Sprache zur Eintrittskarte in die internationale Fachwelt werden. Wer das Englische als Wissenschaftssprache grundsätzlich ablehnt, verkennt also, wie viel Austausch es überhaupt erst ermöglicht hat. Es wäre deshalb naiv, die Uhr zurückdrehen zu wollen."},{"letter":"c","text":"Weniger Beachtung findet dagegen die Frage, wer die Rechnung für diese Verständigung bezahlt. Befragungen unter Forschenden zeigen, dass Nichtmuttersprachler für die Lektüre eines Fachartikels deutlich mehr Zeit brauchen und für einen eigenen Aufsatz oft tagelang zusätzlich arbeiten – nicht selten auf eigene Kosten, wenn sie ein professionelles Lektorat beauftragen. Hinzu kommt, dass Gutachter ihre Manuskripte häufiger wegen sprachlicher Schwächen zurückschicken, selbst wenn die Ergebnisse überzeugen. Manche Nachwuchswissenschaftlerinnen und -wissenschaftler verzichten sogar darauf, auf internationalen Tagungen vorzutragen, weil sie fürchten, in der anschließenden Diskussion nicht schlagfertig genug zu sein. Wer für jeden Antrag, jedes Gutachten und jede E-Mail an Partner im Ausland länger braucht, hat am Ende weniger Zeit für das, worum es eigentlich gehen sollte: die Forschung. Ich halte es für ein Ärgernis, dass dieser Mehraufwand fast ausschließlich an den Einzelnen hängen bleibt, während Muttersprachler einen Vorsprung genießen, für den sie nichts getan haben."},{"letter":"d","text":"Folgen hat die Einsprachigkeit aber nicht nur für die Forschenden, sondern auch für die Sprachen, die aus der Wissenschaft verdrängt werden. Linguisten sprechen von einem Domänenverlust: Wo neue Fachbegriffe nur noch auf Englisch entstehen, entwickelt das Deutsche keinen eigenen Wortschatz mehr für das, was in den Laboren gerade geschieht. Schon heute lernen viele Studierende zentrale Konzepte ausschließlich auf Englisch und stellen erst im Berufsleben fest, dass ihnen die deutschen Entsprechungen fehlen. Das mag zunächst wie ein Anliegen von Sprachpflegern klingen. Tatsächlich betrifft es aber alle, die auf eine verständliche Vermittlung angewiesen sind – Patientinnen, die ihre Diagnose verstehen wollen, Lehrkräfte, die neue Erkenntnisse in den Unterricht tragen, oder Abgeordnete, die über Forschungsgelder entscheiden. Können Fachleute ihr Wissen eines Tages nur noch in einer Sprache ausdrücken, die ein großer Teil der Bevölkerung nicht sicher beherrscht, droht sich die Wissenschaft von der Gesellschaft zu entfernen, die sie finanziert."},{"letter":"e","text":"Die Lösung kann daher nicht in einer Rückkehr zu nationalen Wissenschaftssprachen liegen, wohl aber in einer bewusst gepflegten Mehrsprachigkeit. Fachaufsätze dürfen und sollen weiterhin auf Englisch erscheinen; Forschungsförderer könnten aber verlangen, dass zentrale Ergebnisse zusätzlich in allgemein verständlicher Form in der Landessprache veröffentlicht werden. Grundständige Studiengänge sollten in der Landessprache beginnen, damit sich Studierende die Begriffe ihres Faches zunächst in der Sprache aneignen, in der sie diese später auch erklären müssen. Hochschulen wiederum sollten mehrsprachige Lehrangebote nicht als Zugeständnis an ausländische Studierende betrachten, sondern als Bildungsziel für alle; wer in zwei Sprachen über sein Fach sprechen kann, versteht es in der Regel auch gründlicher. Große Hoffnungen setzen viele derzeit auf maschinelle Übersetzung, und tatsächlich leisten KI-gestützte Programme inzwischen Erstaunliches. Ob sie aber Fachbegriffe hervorbringen können, die es in der Zielsprache noch gar nicht gibt, darf bezweifelt werden. Übersetzen lässt sich nur, wofür eine Sprache Wörter hat – und die entstehen nicht von selbst."}],"exampleLead":"In welchem Abschnitt …","example":{"stem":"nennt der Autor politische Ereignisse als Grund dafür, dass eine Sprache an Bedeutung verlor?","answer":"a"},"itemsLead":"In welchem Abschnitt …","items":[{"no":"7","stem":"beklagt der Autor, dass die Kosten einer Entwicklung vor allem Einzelne tragen?","answer":"c"},{"no":"8","stem":"bezweifelt der Autor, dass Software fehlende Fachwörter einer Sprache erfinden kann?","answer":"e"},{"no":"9","stem":"räumt der Autor ein, dass die Entwicklung manchen Ländern zu mehr Aufmerksamkeit verhilft?","answer":"b"},{"no":"10","stem":"warnt der Autor vor einer wachsenden Kluft zwischen Forschung und Öffentlichkeit?","answer":"d"},{"no":"11","stem":"wird erwähnt, dass manche aus Unsicherheit eine Gelegenheit zur Präsentation auslassen?","answer":"c"},{"no":"12","stem":"stellt der Autor fest, dass eine Sprache nicht in allen Fächern gleich stark vorherrscht?","answer":"a"}]},"t3":{"instruction":"Lesen Sie den folgenden Text und die Aussagen 13–23. Welche der Aussagen sind richtig (r), falsch (f) oder gar nicht im Text enthalten (–)? Es gibt jeweils nur eine richtige Lösung. Markieren Sie Ihre Lösungen für die Aufgaben 13–23 auf dem Antwortbogen.","title":"","paragraphs":["Die Hausarbeit ist in zehn Tagen fällig, die Literatur liegt bereit, der Laptop ist aufgeklappt. Und doch beginnt der Nachmittag nicht mit der Gliederung, sondern mit dem Entkalken der Kaffeemaschine, dem Sortieren alter Urlaubsfotos und einem kurzen Blick aufs Handy, aus dem eine Stunde wird. Kaum jemand, der je studiert hat, kennt diese Szene nicht. Was nach einer harmlosen Marotte klingt, beschäftigt die Psychologie seit Jahrzehnten – und hat für viele Betroffene durchaus ernste Folgen.","Fachleute sprechen von Prokrastination, wenn jemand eine Aufgabe, die er selbst für wichtig hält, freiwillig und ohne triftigen Grund verschiebt, obwohl er absehen kann, dass ihm daraus Nachteile entstehen. Nicht jedes Aufschieben fällt also darunter. Wer eine Präsentation zurückstellt, um sich zunächst auf eine dringendere Prüfung vorzubereiten, setzt sinnvolle Prioritäten. Und wer weiß, dass er unter leichtem Zeitdruck am konzentriertesten arbeitet, und sich die verbleibende Zeit realistisch einteilt, schiebt ebenfalls nicht im psychologischen Sinn auf. Entscheidend ist das Gefühl, eigentlich anders handeln zu wollen – und es trotzdem nicht zu tun.","Wie verbreitet das Phänomen ist, lässt sich nur schätzen, weil die einschlägigen Untersuchungen mit unterschiedlichen Definitionen arbeiten. Internationale Studien gehen davon aus, dass etwa jeder fünfte Erwachsene chronisch aufschiebt, also nicht nur gelegentlich, sondern dauerhaft und in vielen Lebensbereichen. Unter Studierenden liegen die Werte deutlich höher, was Fachleute unter anderem auf die großen Freiräume des Studiums zurückführen: Anders als in der Schule kontrolliert kaum jemand, ob man regelmäßig arbeitet. In einer Befragung an einer süddeutschen Universität gab knapp die Hälfte der Teilnehmenden an, wichtige Aufgaben so häufig hinauszuzögern, dass ihre Leistungen darunter litten. Besonders oft aufgeschoben werden demnach Aufgaben ohne klare Struktur, etwa umfangreiche Haus- und Abschlussarbeiten.","Lange galt Aufschieben als Zeichen von Faulheit oder mangelnder Selbstorganisation. Diese Sichtweise ist nicht nur ungenau, sondern auch wenig hilfreich, weil sie bei Betroffenen zusätzlich Schuldgefühle weckt. Die Forschung zeichnet inzwischen ein anderes Bild. „Wer prokrastiniert, hat in der Regel kein Zeitproblem, sondern ein Gefühlsproblem“, sagt die Psychologin Annika Brandauer, die an einer Hochschulambulanz Studierende berät. Aufgaben, die als eintönig, unübersichtlich oder bedrohlich erlebt werden, lösen unangenehme Empfindungen aus – Langeweile, Frust oder die Angst, den eigenen Ansprüchen nicht zu genügen. Indem man sich einer angenehmeren Tätigkeit zuwendet, verschafft man sich kurzfristig Erleichterung, und genau diese Erleichterung wirkt wie eine Belohnung, die das Verhalten verstärkt. Zeitmanagementkurse, die lediglich Wochenpläne und Prioritätenlisten vermitteln, greifen deshalb oft zu kurz.","Hinzu kommt eine Eigenheit unseres Denkens, die Verhaltensökonomen seit Langem als Gegenwartsverzerrung beschreiben: Belohnungen, die wir sofort erhalten, erscheinen uns wertvoller als solche, die erst in Wochen oder Monaten winken. Die gute Note am Semesterende kann mit der Entspannung, die ein Serienabend unmittelbar verschafft, kaum konkurrieren. Studien deuten zudem darauf hin, dass manche Menschen ihr zukünftiges Ich beinahe wie eine fremde Person wahrnehmen. Die Arbeit auf später zu verschieben, fühlt sich dann an, als würde man sie einem anderen überlassen.","Eine Rolle spielt häufig auch Perfektionismus. Wer an sich selbst den Anspruch stellt, eine Hausarbeit müsse auf Anhieb brillant werden, erlebt schon den ersten, unvermeidlich holprigen Entwurf als Kränkung – und fängt lieber gar nicht erst an. Brandauer rät in solchen Fällen zu einer bewusst unvollkommenen Rohfassung: „Einen schlechten Text kann man verbessern, einen ungeschriebenen nicht.“","Die Folgen reichen über verpasste Fristen hinaus. Chronisches Aufschieben ist mit mehr Stress, schlechterem Schlaf und häufigeren Infekten in Verbindung gebracht worden, wobei bislang offen ist, was dabei Ursache und was Wirkung ist. Außerdem drohen finanzielle Nachteile, wenn sich das Studium verlängert und Förderungen wie das BAföG auslaufen. Besonders tückisch ist ein Kreislauf, den Brandauer in ihrer Beratung immer wieder beobachtet: Wer eine Aufgabe zu lange liegen lässt, schämt sich, und weil auch Scham ein unangenehmes Gefühl ist, wird die Aufgabe erst recht gemieden. „Viele kommen erst zu uns, wenn sie bereits eine Prüfung nicht angetreten haben“, berichtet sie.","Ausgerechnet Nachsicht mit sich selbst kann aus diesem Kreislauf herausführen. In einer kanadischen Studie wurden Studierende vor zwei aufeinanderfolgenden Zwischenprüfungen befragt. Wer angab, sich das Aufschieben vor der ersten Prüfung verziehen zu haben, schob vor der zweiten deutlich weniger auf. Die Forschenden erklären das damit, dass Selbstvergebung die negativen Gefühle abschwächt, die mit der Aufgabe verknüpft sind. Harte Selbstkritik dagegen macht es nach ihrem Befund wahrscheinlicher, dass man beim nächsten Mal erneut ausweicht.","Für den Alltag empfehlen Fachleute vor allem, den Einstieg so leicht wie möglich zu machen. Statt sich vorzunehmen, „am Wochenende an der Hausarbeit zu schreiben“, hilft es, einen konkreten ersten Schritt festzulegen, etwa: „Wenn ich am Samstag gefrühstückt habe, lese ich zwanzig Minuten lang den ersten Aufsatz.“ Solche Wenn-dann-Pläne entlasten, weil sie die Entscheidung vorwegnehmen, wann und womit man anfängt. Wer gar nicht weiß, wo er ansetzen soll, kann die Aufgabe zudem in so kleine Schritte zerlegen, dass jeder einzelne beinahe lächerlich leicht erscheint. Bewährt hat sich auch, in festen Zeitblöcken von etwa 25 Minuten zu arbeiten und dazwischen kurze Pausen einzulegen. Wichtig sei dabei weniger die genaue Dauer als das Signal, so Brandauer: Diese Zeit gehört der Aufgabe und nichts anderem.","Auch äußere Strukturen können helfen. In einem Experiment mit Studierenden schnitten diejenigen am besten ab, denen für eine Reihe von Aufgaben gleichmäßig verteilte Abgabetermine vorgegeben wurden; wer sich die Fristen selbst setzen durfte, landete im Mittelfeld, und am schlechtesten erging es jenen, für die nur ein einziger Abgabetermin am Semesterende galt. Viele Hochschulen bieten deshalb Schreibgruppen an, in denen Studierende zu festen Zeiten gemeinsam arbeiten. Einmal im Jahr laden zahlreiche Schreibzentren außerdem zu einer „Langen Nacht der aufgeschobenen Hausarbeiten“ ein, bei der bis in die frühen Morgenstunden geschrieben, beraten und gemeinsam durchgehalten wird.","Und das Smartphone? Dass ständig verfügbare Ablenkung das Aufschieben erleichtert, bestreitet niemand. Brandauer warnt jedoch davor, die Technik zum Hauptschuldigen zu erklären. „Das Handy ist nicht die Ursache, sondern nur der bequemste Notausgang“, sagt sie. Wer es beim Lernen in einen anderen Raum legt, gewinnt zwar Ruhe; das unangenehme Gefühl, vor dem man flieht, bleibt jedoch bestehen und sucht sich notfalls einen anderen Ausweg – etwa einen plötzlich unaufschiebbaren Wohnungsputz. Apps, die das Telefon für eine bestimmte Zeit sperren, können den Einstieg erleichtern, lösen das Grundproblem aber nicht.","Wann sollte man sich Unterstützung holen? Gelegentliches Aufschieben ist kein Grund zur Sorge.","Führt es aber dazu, dass man Prüfungen wiederholt verschiebt, Fristen verstreichen lässt oder das Studium insgesamt infrage stellt, raten Fachleute zu einem Gespräch in der psychologischen Beratungsstelle der Hochschule. Dort lässt sich auch klären, ob hinter dem Verhalten andere Belastungen stecken, etwa eine depressive Verstimmung, die einer eigenen Behandlung bedarf. Viele Beratungsstellen bieten dafür offene Sprechstunden an, teilweise auch online.","Ein Patentrezept gegen das Aufschieben gibt es nicht, und vermutlich wird kaum jemand es je ganz ablegen. Ziel sei es vielmehr, so Brandauer, das eigene Ausweichen früher zu bemerken und zu verstehen, welches Gefühl man gerade zu vermeiden versucht. „Wer weiß, wovor er davonläuft, kann sich auch dafür entscheiden, stehen zu bleiben.“"],"itemsLead":"Aussagen 13–23","items":[{"no":"13","text":"Auch wer unter Zeitdruck besonders gut arbeitet und realistisch plant, prokrastiniert im Sinne der Fachleute.","answer":"f"},{"no":"14","text":"Wie viele Menschen betroffen sind, ist auch wegen unterschiedlicher Definitionen schwer zu bestimmen.","answer":"r"},{"no":"15","text":"An der süddeutschen Universität wurden ausschließlich Studierende im ersten Semester befragt.","answer":"n"},{"no":"16","text":"Brandauer zufolge steckt hinter dem Aufschieben meist der Wunsch, unangenehmen Gefühlen auszuweichen.","answer":"r"},{"no":"17","text":"Studien zeigen, dass Menschen ihr künftiges Ich als besonders vertraut erleben.","answer":"f"},{"no":"18","text":"Dass chronisches Aufschieben krank macht, gilt inzwischen als erwiesen.","answer":"f"},{"no":"19","text":"Die kanadische Studie wurde später an anderen Hochschulen mit gleichem Ergebnis wiederholt.","answer":"n"},{"no":"20","text":"Wenn-dann-Pläne legen im Voraus fest, wann und womit man beginnt.","answer":"r"},{"no":"21","text":"Wer sich die Abgabetermine selbst setzen durfte, schnitt im Experiment am besten ab.","answer":"f"},{"no":"22","text":"Die „Lange Nacht der aufgeschobenen Hausarbeiten“ geht auf eine Idee von Studierenden zurück.","answer":"n"},{"no":"23","text":"Gelegentliches Aufschieben ist aus fachlicher Sicht kein Anlass zur Beunruhigung.","answer":"r"}],"headline":{"instruction":"Welche der Überschriften a, b oder c trifft die Aussage des Textes am besten? Markieren Sie Ihre Lösung für die Aufgabe 24 auf dem Antwortbogen.","no":"24","options":{"a":"Smartphones als Hauptursache des Aufschiebens","b":"Warum wir aufschieben und was dagegen hilft","c":"Neue Beratungsangebote für Studierende"},"answer":"b"}},"sb":{"instruction":"Lesen Sie den folgenden Text. Welche Lösung (a, b, c oder d) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 25–46 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","title":"Wie die deutsche Rechtschreibung einheitlich wurde","paragraphs":["Wer um 1870 einen Brief aus Bayern mit einem aus Preußen verglich, stieß auf erstaunliche Unterschiede. Wie man ein Wort schrieb, hing {{0}} davon ab, in welcher Region man zur Schule gegangen war; mitunter schwankte die Schreibung sogar innerhalb eines einzigen Briefes. Einer, {{25}} sich mit diesem Durcheinander nicht abfinden wollte, war Konrad Duden. Der Gymnasialdirektor aus dem {{26}} Hersfeld veröffentlichte 1880 ein Wörterbuch von {{27}} 190 Seiten. Er erfand darin keine neuen Regeln, {{28}} stützte sich weitgehend auf Schreibweisen, die an preußischen Schulen bereits üblich waren. Gerade {{29}} wurde das Buch rasch zu einem Erfolg: Lehrer, Drucker und Verlage griffen gern darauf zurück.","Eine verbindliche Regelung {{30}} es jedoch erst 1901, als sich Vertreter der deutschen Einzelstaaten in Berlin auf ein gemeinsames Regelwerk einigten; Österreich und die Schweiz schlossen sich kurz darauf an. Dudens Wörterbuch, {{31}} Einträge rasch an die Beschlüsse angepasst wurden, entwickelte sich zum maßgeblichen Nachschlagewerk. 1955 wurde diese Stellung sogar amtlich bestätigt: Die Kultusminister der Bundesrepublik erklärten, in {{32}} sei der Duden verbindlich. Dieses Vorrecht behielt er gut vier Jahrzehnte lang, {{33}} die Rechtschreibreform von 1996 es ihm entzog. Seitdem entscheidet die Redaktion nicht mehr selbst, {{34}} als richtig gilt; über das amtliche Regelwerk wacht seit 2004 der Rat für deutsche Rechtschreibung.","{{35}} ist der Name Duden bis heute ein Synonym für korrektes Schreiben geblieben. Das Wörterbuch {{36}} inzwischen in seiner 29. Auflage vor, und mit jeder Ausgabe kommen Wörter hinzu, die sich im Sprachgebrauch {{37}} haben. Wie sie ausgewählt werden, ist {{38}} spektakulär, als man vermuten könnte: Die Redaktion wertet ein riesiges Textkorpus aus und prüft, wie häufig ein Wort in unterschiedlichen Textsorten vorkommt. Auf diese Weise gelangen jedes Mal einige Tausend Einträge neu ins Wörterbuch, {{39}} veraltete Wörter nur selten gestrichen werden, {{40}} auch ältere Texte sollen verständlich bleiben.","Kritiker {{41}} dem Werk vor, es stifte mehr Verwirrung, als es beseitige, weil es bei vielen Wörtern zwei Schreibweisen zulasse, {{42}} „Delfin“ und „Delphin“. Für {{43}} Fälle markiert die Redaktion ihre Empfehlung gelb. Wer sich {{44}} hält, schreibt {{45}} einheitlich, auch wenn die andere Variante ebenso korrekt wäre. Dass ein Familienname einmal {{46}} sorgfältiges Schreiben stehen würde, hätte Konrad Duden, der 1911 starb, wohl selbst überrascht."],"example":{"options":{"a":"vor allem","b":"vor Allem","c":"vor allen","d":"vorallem"},"answer":"a"},"items":[{"no":"25","options":{"a":"dem","b":"den","c":"denen","d":"der"},"answer":"d"},{"no":"26","options":{"a":"hesischen","b":"hessichen","c":"hessischen","d":"Hessischen"},"answer":"c"},{"no":"27","options":{"a":"ringsum","b":"rund","c":"runde","d":"rundum"},"answer":"b"},{"no":"28","options":{"a":"denn","b":"sondern","c":"sowohl","d":"stattdessen"},"answer":"b"},{"no":"29","options":{"a":"allerdings","b":"dagegen","c":"deshalb","d":"trotzdem"},"answer":"c"},{"no":"30","options":{"a":"gab","b":"gäbe","c":"gebe","d":"gegeben"},"answer":"a"},{"no":"31","options":{"a":"denen","b":"deren","c":"dessen","d":"welchem"},"answer":"c"},{"no":"32","options":{"a":"Zweifelfällen","b":"Zweifels-Fällen","c":"zweifelsfällen","d":"Zweifelsfällen"},"answer":"d"},{"no":"33","options":{"a":"als","b":"bis","c":"nachdem","d":"seit"},"answer":"b"},{"no":"34","options":{"a":"das","b":"dass","c":"was","d":"welches"},"answer":"c"},{"no":"35","options":{"a":"Daher","b":"Demnach","c":"Dennoch","d":"Deswegen"},"answer":"c"},{"no":"36","options":{"a":"lässt","b":"legt","c":"liegt","d":"stellt"},"answer":"c"},{"no":"37","options":{"a":"durchgesetzt","b":"durchsetzend","c":"durchsetzt","d":"durchzusetzen"},"answer":"a"},{"no":"38","options":{"a":"am wenigsten","b":"wenig","c":"wenige","d":"weniger"},"answer":"d"},{"no":"39","options":{"a":"indem","b":"insofern","c":"sofern","d":"während"},"answer":"d"},{"no":"40","options":{"a":"dadurch","b":"dass","c":"denn","d":"weil"},"answer":"c"},{"no":"41","options":{"a":"legen","b":"setzen","c":"stellen","d":"werfen"},"answer":"d"},{"no":"42","options":{"a":"etwa","b":"etwaig","c":"etwaige","d":"etwas"},"answer":"a"},{"no":"43","options":{"a":"solche","b":"solchen","c":"solcher","d":"solches"},"answer":"a"},{"no":"44","options":{"a":"damit","b":"daran","c":"darauf","d":"dazu"},"answer":"b"},{"no":"45","options":{"a":"im wesentlichen","b":"im Wesentlichen","c":"Im Wesentlichen","d":"imwesentlichen"},"answer":"b"},{"no":"46","options":{"a":"für","b":"nach","c":"um","d":"vor"},"answer":"a"}]}},"hoeren":{"t1":{"instruction":"Sie hören die Meinungen von acht Personen. Sie hören die Meinungen nur einmal. Entscheiden Sie beim Hören, welche Aussage (a–j) zu welcher Person (Sprecher/in 1–8) passt. Zwei Aussagen passen nicht. Markieren Sie Ihre Lösungen für die Aufgaben 47–54 auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aussagen a–j. Sie haben dazu eine Minute Zeit.","title":"KI-Werkzeuge im Studium","statements":[{"letter":"a","text":"Ähnliche Befürchtungen gab es schon bei früheren technischen Neuerungen."},{"letter":"b","text":"Die Hochschule sollte die Kosten für bessere Programmversionen übernehmen."},{"letter":"c","text":"Gerade sicher formulierte Antworten machen es schwer, Fehler zu erkennen."},{"letter":"d","text":"KI verschafft mir Zeit, weil sie mir Nebensächliches abnimmt."},{"letter":"e","text":"Wer keine KI-Kenntnisse hat, wird es später im Berufsleben deutlich schwerer haben."},{"letter":"f","text":"Programme liefern mir nur einen Ausgangspunkt, die Angaben prüfe ich selbst."},{"letter":"g","text":"Sprachliche Hilfen können einen Nachteil gegenüber Muttersprachlern ausgleichen."},{"letter":"h","text":"Statt Hilfsmittel zu untersagen, sollten Hochschulen ihre Prüfungsformen ändern."},{"letter":"i","text":"Was erlaubt ist, hängt derzeit von der einzelnen Lehrveranstaltung ab."},{"letter":"j","text":"Wer sich das Formulieren abnehmen lässt, verpasst einen wichtigen Lernschritt."}],"items":[{"no":"47","label":"Sprecherin 1","answer":"f"},{"no":"48","label":"Sprecher 2","answer":"h"},{"no":"49","label":"Sprecherin 3","answer":"j"},{"no":"50","label":"Sprecher 4","answer":"g"},{"no":"51","label":"Sprecherin 5","answer":"i"},{"no":"52","label":"Sprecher 6","answer":"c"},{"no":"53","label":"Sprecherin 7","answer":"d"},{"no":"54","label":"Sprecher 8","answer":"a"}]},"t2":{"instruction":"Sie hören eine Radiosendung. Sie hören die Sendung nur einmal. Entscheiden Sie beim Hören, welche Aussage (a, b oder c) am besten passt. Markieren Sie Ihre Lösungen für die Aufgaben 55–64 auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 55–64. Sie haben dazu drei Minuten Zeit.","items":[{"no":"55","stem":"Frau Ostendorf hat die „Hitzewache“ ins Leben gerufen, weil","options":{"a":"ihr für ein eigenes Messnetz die Mittel fehlten.","b":"die städtischen Stationen ungenau maßen.","c":"sie die Vogelzählungen der Verbände fortsetzen wollte."},"answer":"a"},{"no":"56","stem":"In der Testphase hat sich gezeigt, dass","options":{"a":"die Sensoren häufig technische Mängel aufwiesen.","b":"Teilnehmende ihre Messwerte selbst überprüfen sollten.","c":"der Standort jedes Geräts kontrolliert werden muss."},"answer":"c"},{"no":"57","stem":"Unter den Freiwilligen sind vor allem","options":{"a":"Menschen im Ruhestand mit viel freier Zeit.","b":"Personen mittleren Alters, häufig mit Familie.","c":"Studierende, die selbst in Dachwohnungen leben."},"answer":"b"},{"no":"58","stem":"Frau Ostendorf bedauert, dass","options":{"a":"viele Teilnehmende nach kurzer Zeit wieder aufhören.","b":"wohlhabende Bewohner wenig Interesse zeigen.","c":"gerade in den heißesten Vierteln Messpunkte fehlen."},"answer":"c"},{"no":"59","stem":"Um neue Zielgruppen zu erreichen,","options":{"a":"kooperiert das Projekt mit Einrichtungen im Stadtteil.","b":"zahlt das Team den Teilnehmenden eine kleine Entschädigung.","c":"wirbt die Universität mit Pressemitteilungen."},"answer":"a"},{"no":"60","stem":"Zur Genauigkeit der Daten sagt Frau Ostendorf, dass","options":{"a":"einzelne Sensoren ebenso präzise messen wie Profistationen.","b":"erst die Menge der Geräte verlässliche Aussagen erlaubt.","c":"Laien ihre Werte häufig falsch in die Karten eintragen."},"answer":"b"},{"no":"61","stem":"Die städtischen Messstationen sind nach Frau Ostendorfs Ansicht","options":{"a":"durch Messungen von Bürgern bald ersetzbar.","b":"besser für feine räumliche Unterschiede geeignet.","c":"als Vergleichsgrundlage weiterhin unverzichtbar."},"answer":"c"},{"no":"62","stem":"Die Messungen haben unter anderem gezeigt, dass","options":{"a":"schon wenige Hundert Meter viel ausmachen können.","b":"sich Innenhöfe nachts stärker aufheizen als Kreuzungen.","c":"die Unterschiede tagsüber am größten sind."},"answer":"a"},{"no":"63","stem":"Dem Vorwurf, Freiwillige würden ausgenutzt, begegnet das Projekt, indem es","options":{"a":"die Zahl der Messungen pro Person von vornherein begrenzt.","b":"die Teilnehmenden an den Fragestellungen beteiligt.","c":"den Freiwilligen eine Aufwandsentschädigung in Aussicht stellt."},"answer":"b"},{"no":"64","stem":"Den größten Gewinn des Projekts sieht Frau Ostendorf darin, dass","options":{"a":"die Stadt inzwischen mehr Geld für neue Bäume ausgibt.","b":"es bald auf weitere Städte übertragen wird.","c":"die Ergebnisse für alle frei zugänglich sind."},"answer":"c"}]},"t3":{"instruction":"Sie hören einen Vortrag. Sie hören den Vortrag nur einmal. Sie haben Handzettel mit den Folien der Präsentation erhalten. Schreiben Sie die fehlenden Informationen stichwortartig in die freien Zeilen 65–74 in der rechten Spalte.","exampleNote":"Die Lösung 0 ist ein Beispiel.","readNote":"Lesen Sie jetzt die Stichworte. Sie haben dazu eine Minute Zeit.","finalNote":"Sie haben jetzt fünf Minuten Zeit, Ihre Antworten zu den Aufgaben 65–74 auf den Antwortbogen zu übertragen.","exampleAnswer":"Medizin im Gespräch","slides":[{"title":"Ringvorlesung","lines":[{"no":"0","bullet":false,"dash":false,"text":"„…“"},{"no":"","bullet":false,"dash":false,"text":"Thema heute: Placebo und Nocebo"},{"no":"","bullet":false,"dash":false,"text":"Referent: Dr. Jakob Wenninger, Institut für Medizinische Psychologie"}]},{"title":"Der Begriff „Placebo“","lines":[{"no":"","bullet":true,"dash":false,"text":"lateinisch: „ich werde gefallen“"},{"no":"65","bullet":true,"dash":false,"text":"18. Jahrhundert: Mittel, um Patienten …"},{"no":"66","bullet":true,"dash":false,"text":"seit den 1950er-Jahren: …"},{"no":"","bullet":true,"dash":false,"text":"Beecher 1955: „ein Drittel bessert sich“"},{"no":"","bullet":false,"dash":true,"text":"Einwand: Spontanverlauf"}]},{"title":"Wie wirken Placebos?","lines":[{"no":"67","bullet":true,"dash":false,"text":"Erwartung → …"},{"no":"68","bullet":true,"dash":false,"text":"… (vgl. pawlowscher Hund)"}]},{"title":"Äußerlichkeiten","lines":[{"no":"","bullet":true,"dash":false,"text":"Anzahl: zwei Tabletten > eine"},{"no":"","bullet":true,"dash":false,"text":"Farbe: blau → beruhigend, rot → anregend"},{"no":"69","bullet":true,"dash":false,"text":"weitere Faktoren: …, …"}]},{"title":"Offene Placebos","lines":[{"no":"","bullet":true,"dash":false,"text":"Patienten wissen: kein Wirkstoff"},{"no":"","bullet":true,"dash":false,"text":"Studie in Boston: Reizdarm"},{"no":"70","bullet":true,"dash":false,"text":"Ergebnis: …"},{"no":"71","bullet":true,"dash":false,"text":"vermutete Erklärung: …"}]},{"title":"Nocebo („ich werde schaden“)","lines":[{"no":"72","bullet":true,"dash":false,"text":"Beispiel: …"},{"no":"73","bullet":true,"dash":false,"text":"Problem für Studien: …"},{"no":"","bullet":true,"dash":false,"text":"britische Studie zu Cholesterinsenkern: Muskelschmerzen erst nach Aufhebung der Verblindung häufiger"}]},{"title":"Folgerungen für die Praxis","lines":[{"no":"","bullet":true,"dash":false,"text":"Worte wirken: Framing („Neun von zehn …“)"},{"no":"","bullet":true,"dash":false,"text":"Beziehung als Wirkfaktor; Placebo als Ergänzung, nicht als Ersatz"},{"no":"74","bullet":true,"dash":false,"text":"klare Grenze: …"}]}],"items":[{"no":"65","solution":"zufriedenzustellen / zu beruhigen (nicht: zu heilen)"},{"no":"66","solution":"Vergleichsmittel / Kontrolle in klinischen Studien (Arzneimittelstudien)"},{"no":"67","solution":"körpereigene Schmerzhemmung / Ausschüttung von Endorphinen"},{"no":"68","solution":"Lernen / Konditionierung"},{"no":"69","solution":"Größe · Preis · Darreichungsform (Spritze statt Tablette) (2 von 3 Lösungen erforderlich)"},{"no":"70","solution":"Beschwerden gingen trotzdem (deutlich) zurück / stärker als ohne Behandlung"},{"no":"71","solution":"Ritual der Behandlung (regelmäßige Einnahme, Zuwendung, aktiv etwas tun)"},{"no":"72","solution":"Beipackzettel lesen → mehr (der dort genannten) Nebenwirkungen"},{"no":"73","solution":"auch Placebogruppe klagt über Nebenwirkungen / bricht die Studie ab (auch: Nebenwirkungen hängen vom Wissen der Patienten ab)"},{"no":"74","solution":"keine heimliche Gabe / Patienten nicht täuschen"}]}},"schreiben":{"instruction":"Wählen Sie eines der folgenden zwei Themen. Schreiben Sie einen Text, in dem Sie Ihren eigenen Standpunkt dazu erarbeiten und argumentativ darlegen. Ihr Text soll mindestens 350 Wörter umfassen. Sie haben 70 Minuten Zeit.","minWords":350,"minutes":70,"themes":[{"no":"1","paragraphs":["In einem hochschuldidaktischen Seminar sollen Sie Ihre Haltung zur Anwesenheitspflicht in Lehrveranstaltungen reflektieren.","Erörtern Sie, ob Studierende zur Teilnahme an Seminaren und Vorlesungen verpflichtet werden sollten. Berücksichtigen Sie auch Ihre eigenen Erfahrungen und ziehen Sie am Schluss ein begründetes Fazit."],"quoteLead":"Die folgenden Zitate geben Ihnen erste Ideen:","quotes":["„Ein Seminar lebt vom Gespräch – wer fehlt, nimmt den anderen etwas weg.“","„Erwachsene Menschen entscheiden selbst, wie sie am besten lernen.“"],"model":{"title":"Anwesenheitspflicht – Bevormundung oder Voraussetzung für gute Lehre?","paragraphs":["Kaum eine Regelung an Hochschulen wird so häufig diskutiert wie die Anwesenheitspflicht. In manchen Bundesländern ist sie weitgehend abgeschafft, in anderen entscheiden die Lehrenden von Fall zu Fall. Die Frage, ob erwachsene Studierende zur Teilnahme an Lehrveranstaltungen verpflichtet werden dürfen, berührt dabei zwei Grundüberzeugungen, die sich nur schwer miteinander vereinbaren lassen.","Die Befürworter einer Pflicht verweisen zu Recht auf den Charakter vieler Lehrveranstaltungen. Ein Seminar ist kein Vortrag, den man ebenso gut nachlesen könnte, sondern ein Gespräch, das von der Beteiligung aller lebt. Fehlt die Hälfte der Gruppe, bleibt die Diskussion dünn, Referate werden vor leeren Stühlen gehalten, und die Lehrenden können ihre Planung kaum einhalten. Wer dem Seminar fernbleibt, schadet also nicht nur sich selbst, sondern nimmt den anderen tatsächlich etwas weg, wie es das erste Zitat formuliert. Hinzu kommt ein pädagogisches Argument: Gerade Studienanfängerinnen und -anfänger überschätzen häufig ihre Fähigkeit, Stoff eigenständig nachzuholen; eine verbindliche Struktur kann hier vor Fehlentscheidungen bewahren.","Dagegen steht die Auffassung, dass Erwachsene selbst entscheiden sollten, wie sie lernen. Studierende sind keine Schüler, und ein Studium soll sie nicht zuletzt zur Eigenverantwortung erziehen. Wer sich den Stoff einer Vorlesung besser mit dem Lehrbuch aneignet, nebenbei arbeiten muss oder ein Kind betreut, sollte nicht durch eine Unterschriftenliste diszipliniert werden. Zudem sagt bloße Anwesenheit wenig über den Lernerfolg aus: Wer unter Zwang im Hörsaal sitzt und auf sein Handy schaut, hat davon ebenso wenig wie die Veranstaltung selbst. Entscheidend sollte sein, ob jemand die Prüfung besteht, nicht, wie oft er einen Raum betreten hat.","Aus eigener Erfahrung neige ich zu einer Unterscheidung nach der Art der Veranstaltung. In meinem ersten Semester habe ich eine Vorlesung fast vollständig durch das Skript ersetzt – ohne Nachteil für die Klausur. Ein Seminar, in dem ich wegen eines Nebenjobs mehrfach fehlte, habe ich dagegen bis heute als verlorene Zeit in Erinnerung, und zwar nicht nur für mich: Als Referentin stand ich schließlich selbst vor halb leeren Reihen.","Mein Fazit lautet daher: Eine allgemeine Anwesenheitspflicht ist weder notwendig noch mit dem Selbstverständnis eines Studiums vereinbar. Für Veranstaltungen jedoch, deren Wert gerade im Austausch liegt – Seminare, Laborpraktika, Sprachkurse –, ist eine verbindliche Teilnahme gerechtfertigt, sofern sie begründet und maßvoll gehandhabt wird. Statt über Pflicht oder Freiheit zu streiten, sollten Hochschulen deshalb klar benennen, wo Anwesenheit einen Unterschied macht, und ihre Lehre so gestalten, dass sich die Frage im besten Fall gar nicht stellt."],"hint":"Aufbau: Einleitung mit Problemaufriss – Position 1 (Pflicht) mit Bezug auf Zitat 1 – Position 2 (Freiheit) mit Bezug auf Zitat 2 – eigene Erfahrung – differenziertes Fazit. Sprachliche Mittel: Konditionalgefüge (uneingeleitet und mit „sofern“), Nominalisierungen (Beteiligung, Eigenverantwortung), Konjunktiv II, Doppelpunkt und Gedankenstrich als Gliederungsmittel. Umfang: 389 Wörter."}},{"no":"2","paragraphs":["Ihre Fachschaft sammelt für eine Broschüre Beiträge zu der Frage, ob man direkt nach der Schule studieren sollte.","Legen Sie Vor- und Nachteile eines sofortigen Studienbeginns und einer Zwischenphase (Praktikum, Ausbildung, Auslandsjahr) dar und begründen Sie am Schluss Ihre Position."],"quoteLead":"Die folgenden Zitate geben Ihnen erste Ideen:","quotes":["„Wer nach der Schule ein Jahr pausiert, verliert den Anschluss und wertvolle Zeit.“","„Erst wer die Welt außerhalb des Klassenzimmers kennt, weiß, was er studieren will.“"],"model":{"title":"Studienbeginn: sofort oder nach einer Zwischenphase?","paragraphs":["Direkt studieren oder erst einmal etwas anderes tun? Diese Frage stellt sich fast jeder, der die Schule abschließt, und sie wird häufig so beantwortet, wie es Eltern, Freunde oder der Zufall nahelegen. Dabei lohnt es sich, beide Wege nüchtern gegeneinander abzuwägen.","Für einen sofortigen Studienbeginn spricht zunächst der Schwung. Wer gerade das Abitur hinter sich hat, ist das Lernen gewohnt, beherrscht die nötigen Techniken und muss sich nicht erst wieder auf Fristen und Prüfungen einstellen. Außerdem beginnen die meisten Mitschülerinnen und Mitschüler zur selben Zeit, sodass man den Übergang gemeinsam bewältigt. Nicht zuletzt ist ein früher Abschluss ein handfester Vorteil: Wer mit Anfang zwanzig ins Berufsleben eintritt, hat später noch Zeit für Umwege. Wer dagegen pausiert, so warnt das erste Zitat, verliere den Anschluss – und tatsächlich fällt manchen der Wiedereinstieg schwer, wenn sie ein Jahr lang keinen zusammenhängenden Text mehr geschrieben haben.","Doch auch für die Gegenposition gibt es gewichtige Argumente. Mit achtzehn weiß kaum jemand, was er wirklich will; die Studienfächer sind abstrakt, die Berufe dahinter unbekannt. Ein Praktikum, eine Ausbildung oder ein Jahr im Ausland verschaffen genau die Erfahrung, die das zweite Zitat meint: Man lernt, wie Arbeit sich anfühlt, welche Tätigkeiten einem liegen und welche nicht. Nicht wenige wechseln nach zwei Semestern das Fach oder brechen das Studium ab, weil sie es aus falschen Vorstellungen heraus begonnen haben. Ein Jahr, das solche Umwege erspart, ist keine verlorene Zeit, sondern eine Investition. Hinzu kommt die persönliche Reife: Wer einmal selbst Miete gezahlt und mit Kollegen Konflikte ausgetragen hat, tritt im Studium anders auf.","Ich selbst habe nach der Schule zwei Jahre in einem Krankenhaus gearbeitet, bevor ich mich für ein Studium entschieden habe. Der Wiedereinstieg war anstrengend, und ich habe meine jüngeren Kommilitonen zunächst um ihre Routine beneidet. Zugleich wusste ich jedoch genau, warum ich im Hörsaal saß, und dieses Wissen hat mich durch jede Durststrecke getragen.","Ich halte deshalb keinen der beiden Wege für grundsätzlich besser. Wer ein klares Ziel hat, sollte es nicht aufschieben; wer unsicher ist, gewinnt durch eine Zwischenphase mehr, als er an Zeit verliert. Entscheidend ist, dass die Pause einen Inhalt hat – ein Jahr, in dem man etwas ausprobiert, ist etwas anderes als ein Jahr, in dem man wartet. Schulen und Hochschulen könnten dabei helfen, indem sie beide Optionen gleichwertig vorstellen, statt den direkten Übergang als Normalfall zu behandeln."],"hint":"Aufbau: Einleitung – Vorteile des sofortigen Beginns mit Zitat 1 – Vorteile der Zwischenphase mit Zitat 2 – eigene Erfahrung – abwägendes Fazit mit Bedingung. Sprachliche Mittel: Relativsätze mit „wer“, Konjunktiv I in der indirekten Rede (verliere), Einschub (so warnt das erste Zitat), Antithese (Investition statt verlorener Zeit). Umfang: 386 Wörter."}}]},"muendlich":{"teil1":[{"who":"A","themes":["Beschreiben Sie das Prüfungssystem an Hochschulen in einem Land Ihrer Wahl (Prüfungsformen, Benotung, Wiederholungsmöglichkeiten). Was halten Sie davon?","Sollten Studierende neben dem Studium arbeiten? Welche Vorteile und welche Nachteile hat ein Nebenjob? Begründen Sie Ihre Meinung."]},{"who":"B","themes":["Stellen Sie eine Persönlichkeit aus Wissenschaft oder Kultur vor, die Sie beeindruckt. Was macht sie aus Ihrer Sicht bedeutend, und was kann man von ihr lernen?","Sollte der Zugang zum Studium durch Zulassungsbeschränkungen (z. B. Notendurchschnitt, Aufnahmeprüfung) geregelt werden? Welche Alternativen gibt es? Begründen Sie Ihre Meinung."]},{"who":"C","themes":["Beschreiben Sie, welche Rolle Sport und Bewegung im Alltag von Studierenden spielen und wie Hochschulen gesunde Gewohnheiten unterstützen könnten.","Große Vorlesungen oder kleine Seminare – welche Lehrform halten Sie für wirksamer? Begründen Sie Ihre Meinung. Gibt es Gegenargumente?"]}],"teil2":[{"no":"1","text":"„Man muss das Wahre immer wiederholen, weil auch der Irrtum um uns her immer wieder gepredigt wird.“","author":"Johann Wolfgang von Goethe, 1749–1832, Dichter"},{"no":"2","text":"„Phantasie ist wichtiger als Wissen, denn Wissen ist begrenzt.“","author":"Albert Einstein, 1879–1955, Physiker"},{"no":"3","text":"„Im Grunde sind es immer die Verbindungen mit Menschen, die dem Leben seinen Wert geben.“","author":"Wilhelm von Humboldt, 1767–1835, Gelehrter und Bildungsreformer"}]},"audio":[{"src":"telc%20C1%20HS%20Modelltest%201.1.mp3","dur":538.64},{"src":"telc%20C1%20HS%20Modelltest%201.2.mp3","dur":684.12},{"src":"telc%20C1%20HS%20Modelltest%201.3.mp3","dur":900.47}],"minutes":{"hoeren":40},"pdf":"telc%20C1%20HS%20Modelltest%201.pdf","pages":{"loesung":20,"muster":21,"kommentar":31,"hoertexte":25}},"2":{"id":2,"roman":"II","lesen":{"t1":{"instruction":"Lesen Sie den folgenden Text. Welche der Sätze a–h gehören in die Lücken 1–6? Es gibt jeweils nur eine richtige Lösung. Zwei Sätze können nicht zugeordnet werden. Markieren Sie Ihre Lösungen für die Aufgaben 1–6 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","intro":"Im Online-Magazin Ihrer Hochschule lesen Sie folgenden Beitrag:","title":"Was römischen Beton so haltbar macht","paragraphs":["Fast zweitausend Jahre nach ihrer Fertigstellung überspannt die Kuppel des Pantheons in Rom einen Raum von gut 43 Metern Durchmesser – ohne eine einzige Stahlstange. {{0}} Moderne Stahlbetonbauten dagegen zeigen oft schon nach wenigen Jahrzehnten Risse, weil eindringendes Wasser den Stahl rosten lässt.","Lange Zeit galt vor allem eine Zutat als Erklärung für die erstaunliche Haltbarkeit des römischen Betons. {{1}} Diese sogenannte Puzzolanerde reagiert mit Kalk und Wasser zu besonders beständigen Mineralen.","Besonders rätselhaft erschienen Forschenden die antiken Hafenanlagen, die seit zwei Jahrtausenden im Meer stehen. {{2}} Die Geologin Marie Jackson von der Universität Utah fand heraus, warum: Meerwasser sickert langsam in den Beton ein und lässt darin neue Kristalle wachsen. Statt das Gefüge zu zerstören, verdichtet das Salzwasser es also mit der Zeit.","Für die Haltbarkeit römischer Mauern an Land fehlte damit aber noch immer eine überzeugende Erklärung. {{3}} Im Mörtel vieler antiker Bauwerke finden sich nämlich kleine weiße Klümpchen aus Kalk, oft nur wenige Millimeter groß. Bis dahin sah man in ihnen ein Zeichen nachlässiger Arbeit: Die Römer hätten ihre Zutaten schlicht nicht gründlich genug vermischt.","Masic und seine Kollegen kamen zu einem anderen Schluss. {{4}} Dabei entsteht große Hitze, und ein Teil des Kalks bleibt in Klümpchen zurück. Dringt später Wasser durch einen feinen Riss ein, löst es Kalk aus diesen Klümpchen, der sich in der Spalte als Kalkstein ablagert und sie verschließt. Im Labor schlossen sich Risse in Proben nach diesem Rezept innerhalb von zwei Wochen von selbst, während sie in Vergleichsproben offen blieben.","Für die Bauindustrie ist das mehr als eine historische Kuriosität. {{5}} Ein Beton, der sich selbst repariert, müsste seltener erneuert werden und könnte diesen Anteil deutlich senken. {{6}} Ob sich das antike Rezept auf die Anforderungen moderner Bauwerke übertragen lässt, muss sich allerdings erst noch zeigen."],"sentences":[{"letter":"a","text":"Ihrer Ansicht nach verwendeten die Römer ungelöschten Kalk und mischten ihn direkt mit Asche und Wasser."},{"letter":"b","text":"Während moderner Beton im Salzwasser allmählich zerfällt, scheinen sie mit den Jahren sogar fester zu werden."},{"letter":"c","text":"Bei der Herstellung von Zement entstehen weltweit rund acht Prozent aller Kohlendioxid-Emissionen."},{"letter":"d","text":"Die Römer hielten ihre Bautechnik streng geheim, weshalb sich in keiner antiken Schrift ein Hinweis auf die verwendeten Materialien findet."},{"letter":"e","text":"Schon der Baumeister Vitruv empfahl im ersten Jahrhundert vor Christus eine besondere Asche aus der Gegend um Pozzuoli bei Neapel."},{"letter":"f","text":"Die Klümpchen bestehen demnach aus Asche, die bei der Verarbeitung nicht vollständig reagiert hat."},{"letter":"g","text":"Erste Versuche mit modernen Mischungen, denen ungelöschter Kalk zugesetzt wurde, verliefen bereits vielversprechend."},{"letter":"h","text":"Ein Team um den Materialforscher Admir Masic vom Massachusetts Institute of Technology hat sie 2023 möglicherweise gefunden."}],"example":{"letter":"z","text":"Sie gilt bis heute als größte Kuppel der Welt aus unbewehrtem Beton."},"items":[{"no":"1","answer":"e"},{"no":"2","answer":"b"},{"no":"3","answer":"h"},{"no":"4","answer":"a"},{"no":"5","answer":"c"},{"no":"6","answer":"g"}]},"t2":{"instruction":"Lesen Sie den folgenden Text. In welchem Textabsatz a–e finden Sie die Antworten auf die Fragen 7–12? Es gibt jeweils nur eine richtige Lösung. Jeder Absatz kann Antworten auf mehrere Fragen enthalten. Markieren Sie Ihre Lösungen für die Aufgaben 7–12 auf dem Antwortbogen.","title":"Bezahlen ohne Bargeld – ein Fortschritt mit Risiken","sections":[{"letter":"a","text":"Kaum ein Land hing so sehr am Bargeld wie Deutschland. Noch vor gut zehn Jahren wurden hierzulande vier von fünf Einkäufen an der Ladenkasse mit Münzen und Scheinen beglichen, und „Nur Bares ist Wahres“ war mehr als ein Sprichwort. Inzwischen hat sich das spürbar verschoben: Nach Erhebungen der Bundesbank wird nur noch etwa jeder zweite Einkauf bar bezahlt, bei größeren Beträgen greifen die meisten längst zur Karte oder zum Smartphone. Verschwunden ist das Bargeld damit aber keineswegs; gerade bei kleinen Summen bleibt es für viele das Zahlungsmittel der Wahl. Wie es anders aussehen kann, zeigt Schweden. Dort zahlt nur noch eine kleine Minderheit bar, viele Geschäfte nehmen gar keine Scheine mehr an, und selbst die Kollekte in der Kirche wird per App eingesammelt. Ich halte es dennoch für einen Fehler, das Bargeld leichtfertig aufzugeben."},{"letter":"b","text":"Dass so viele Menschen umsteigen, hat gute Gründe. Die Karte ist bequem, niemand muss nach passenden Münzen suchen, und wer sein Konto in einer App verwaltet, behält seine Ausgaben im Blick. An der Kasse geht es schneller voran, und im Ausland entfällt der lästige Umtausch. In der Pandemie kam ein weiteres Argument hinzu: Viele wollten keine Scheine mehr anfassen, die durch zahllose Hände gegangen waren, und Geschäfte baten ausdrücklich darum, kontaktlos zu zahlen. Auch für den Handel ist Bargeld weniger günstig, als es scheint. Es muss gezählt, im Tresor aufbewahrt, versichert und von Sicherheitsdiensten zur Bank gebracht werden, und jede Kasse, in der abends Geld liegt, lockt Einbrecher an. Wer nur auf die Gebühren der Kartenanbieter schaut, übersieht diese versteckten Kosten. Immer mehr Cafés nehmen deshalb nur noch Karten an."},{"letter":"c","text":"Ich will nicht verschweigen, dass ich selbst längst zu den Kartenzahlern gehöre. In meinem Portemonnaie steckt selten mehr als ein Zwanzigeuroschein, und an manchen Tagen merke ich erst abends, dass ich überhaupt kein Bargeld ausgegeben habe. Auch die Kritiker des Bargelds haben in einem Punkt recht: Wer schwarzarbeitet oder Steuern hinterziehen will, tut das bevorzugt mit Scheinen, die keine Spuren hinterlassen. Ein Allheilmittel gegen solche Geschäfte wäre die Abschaffung des Bargelds allerdings nicht, denn Betrüger finden erfahrungsgemäß andere Wege. Ich verstehe auch, dass viele Jüngere, die mit dem Smartphone aufgewachsen sind, die ganze Debatte für nostalgisch halten. Für die meisten Menschen geht es beim Bezahlen ohnehin um etwas anderes: um Gewohnheit, um Kontrolle und um das Gefühl, selbst entscheiden zu können, wie sie mit ihrem Geld umgehen."},{"letter":"d","text":"Genau diese Entscheidungsfreiheit sehe ich in Gefahr. Digitales Bezahlen ist nur möglich, solange Strom, Netz und Rechenzentren funktionieren. Vor wenigen Jahren fielen in Deutschland tagelang Tausende Kartenlesegeräte aus; in manchen Supermärkten konnte man nur noch mit Bargeld einkaufen. Bei einem großflächigen Stromausfall oder einem gezielten Cyberangriff wäre die Lage ungleich ernster: Wer dann kein Bargeld im Haus hat, steht im schlimmsten Fall ohne Zahlungsmittel da. Dazu kommt, dass ein großer Teil aller Kartenzahlungen über einige wenige Konzerne läuft, die meist nicht in Europa sitzen. Wer allein auf sie setzt, liefert sich ihren Preisen, ihren Regeln und ihrer Technik aus. Und schließlich hinterlässt jede digitale Zahlung Daten, aus denen sich ablesen lässt, wer wann wo was gekauft hat. Mit Münzen und Scheinen bleibt der Einkauf beim Bäcker dagegen eine Sache zwischen Kundin und Verkäufer."},{"letter":"e","text":"Was also ist zu tun? Niemand muss das digitale Bezahlen bremsen; es kommt vielmehr darauf an, die Wahlfreiheit zu sichern. Geschäfte, die Waren des täglichen Bedarfs verkaufen, also Supermärkte, Apotheken oder Bäckereien, sollten gesetzlich verpflichtet werden, Bargeld anzunehmen. Banken und Gemeinden müssten dafür sorgen, dass auch auf dem Land ein Geldautomat in erreichbarer Nähe bleibt. Gerade ältere Menschen, die mit Apps wenig anfangen können, wären sonst von einem Teil des Alltags ausgeschlossen. Und Kinder lernen den Wert des Geldes vermutlich noch immer am besten, wenn sie Münzen in der Hand halten. Selbst in Schweden setzt sich die Zentralbank inzwischen dafür ein, dass man Lebensmittel und Medikamente weiterhin bar bezahlen kann. Wer das Bargeld hierzulande vorschnell abschreibt, wiederholt also einen Fehler, den andere gerade mühsam korrigieren."}],"exampleLead":"In welchem Abschnitt …","example":{"stem":"nennt die Autorin ein Land, in dem nur noch wenige Menschen bar bezahlen?","answer":"a"},"itemsLead":"In welchem Abschnitt …","items":[{"no":"7","stem":"gibt die Autorin zu, dass sie selbst kaum noch mit Münzen und Scheinen bezahlt?","answer":"c"},{"no":"8","stem":"fordert die Autorin, bestimmte Geschäfte zur Annahme von Bargeld zu verpflichten?","answer":"e"},{"no":"9","stem":"erläutert die Autorin, warum Bargeld für Händler teurer ist, als viele glauben?","answer":"b"},{"no":"10","stem":"sieht die Autorin eine Gefahr darin, dass nur wenige Firmen den Zahlungsverkehr beherrschen?","answer":"d"},{"no":"11","stem":"nennt die Autorin einen gesundheitlichen Grund dafür, auf Bargeld zu verzichten?","answer":"b"},{"no":"12","stem":"stellt die Autorin fest, dass Bargeld trotz aller Veränderungen noch häufig genutzt wird?","answer":"a"}]},"t3":{"instruction":"Lesen Sie den folgenden Text und die Aussagen 13–23. Welche der Aussagen sind richtig (r), falsch (f) oder gar nicht im Text enthalten (–)? Es gibt jeweils nur eine richtige Lösung. Markieren Sie Ihre Lösungen für die Aufgaben 13–23 auf dem Antwortbogen.","title":"","paragraphs":["Wer in einer deutschen Großstadt nachts zum Himmel blickt, sieht mit etwas Glück ein paar Dutzend Sterne. In einer klaren Nacht fernab jeder Siedlung wären es mehrere Tausend, dazu das schimmernde Band der Milchstraße. Für einen großen Teil der Menschheit ist dieser Anblick inzwischen eine Seltenheit geworden. Einer viel beachteten Studie zufolge kann ein Drittel der Weltbevölkerung die Milchstraße nicht mehr mit bloßem Auge erkennen, in Europa sind es sogar rund sechzig Prozent. Wer jünger als dreißig ist und in einer Stadt aufwuchs, hat das Sternenband womöglich noch nie mit eigenen Augen gesehen.","Und die Nacht wird weiter heller. Satelliten erfassen zwar das Licht, das von der Erde nach oben abstrahlt, doch für den bläulichen Anteil moderner Leuchtdioden sind ihre Sensoren kaum empfindlich. Aufschlussreicher sind deshalb die Meldungen von Zehntausenden Menschen in aller Welt, die in regelmäßigen Abständen notieren, welche Sterne sie noch erkennen können. Ihre Beobachtungen legen nahe, dass die Helligkeit des Nachthimmels zwischen 2011 und 2022 um knapp zehn Prozent pro Jahr zugenommen hat – deutlich schneller, als die Satellitendaten vermuten ließen.","Ausgerechnet eine Technik, die als Fortschritt gefeiert wurde, hat diese Entwicklung beschleunigt. Leuchtdioden verbrauchen weit weniger Strom als die alten Natriumdampflampen, und viele Gemeinden haben ihre Straßenbeleuchtung in den vergangenen Jahren umgerüstet. Doch die Einsparung verleitet dazu, mehr und heller zu beleuchten: Parkplätze, Fassaden, Werbetafeln und Gärten werden nun die ganze Nacht angestrahlt, weil es kaum noch etwas kostet. Fachleute sprechen von einem Rebound-Effekt. Zudem enthält das Licht vieler Leuchtdioden einen hohen Blauanteil, der in der Atmosphäre stärker gestreut wird als gelbes Licht und den Himmel deshalb besonders aufhellt.","Genau genommen lassen sich dabei zwei Formen der Belastung unterscheiden. Da ist zum einen das direkte Licht einzelner Lampen, das blendet und in Räume fällt, in denen es nichts zu suchen hat. Zum anderen bildet sich über jeder Stadt eine sogenannte Lichtglocke: Licht, das nach oben entweicht, wird an Staub und Wassertröpfchen in der Luft gestreut und hellt den Himmel großflächig auf. Bei Bewölkung verstärkt sich der Effekt sogar, weil die Wolken das Licht zurückwerfen. Selbst Dörfer, die Dutzende Kilometer von einer Großstadt entfernt liegen, erleben deshalb kaum noch eine wirklich dunkle Nacht.","„Für viele Tiere ist künstliches Licht eine Falle“, sagt Lena Hartwig, die als Biologin an einer Universität die Folgen nächtlicher Beleuchtung erforscht. Nachtaktive Insekten orientieren sich am Mond und an den Sternen; eine Straßenlaterne lenkt sie von ihrem Kurs ab. Viele umkreisen die Lampe, bis sie erschöpft sind oder gefressen werden. Nach einer oft zitierten Schätzung sterben in Deutschland in einer einzigen Sommernacht rund eine Milliarde Insekten an künstlichen Lichtquellen. Das hat Folgen für Pflanzen, die auf nächtliche Bestäuber angewiesen sind: In einem Schweizer Experiment besuchten Insekten unter Straßenlaternen deutlich weniger Blüten, und die Pflanzen bildeten weniger Früchte als auf unbeleuchteten Vergleichsflächen.","Betroffen sind auch Vögel. Viele Arten ziehen nachts und nutzen dabei die Sterne als Kompass. Hell erleuchtete Gebäude locken sie an; manche kreisen stundenlang um hohe Türme, bis sie entkräftet zu Boden gehen, andere prallen gegen Glasfassaden.","In einigen Städten werden deshalb während der Hauptzugzeit nachts die Lichter an Hochhäusern gelöscht. Viele Fledermäuse wiederum meiden beleuchtete Bereiche und finden dadurch weniger Nahrung. An Küsten verlieren frisch geschlüpfte Meeresschildkröten die Orientierung, weil sie dem hellsten Horizont folgen, und der liegt heute oft nicht mehr über dem Meer, sondern über der Uferpromenade.","Und der Mensch? Unsere innere Uhr wird vor allem durch Licht gestellt. Am Abend schüttet der Körper das Hormon Melatonin aus, das uns müde macht; helles, besonders bläuliches Licht bremst diese Ausschüttung. Ob das Licht, das von der Straße ins Schlafzimmer fällt, tatsächlich krank macht, ist allerdings umstritten. Hartwig mahnt zur Vorsicht: „Es gibt Hinweise auf Zusammenhänge mit Schlafstörungen und Stoffwechselerkrankungen, aber die meisten Studien zeigen nur Korrelationen. Wer in einer hell erleuchteten Innenstadt wohnt, lebt meist auch sonst anders als jemand auf dem Land.“","Auch für die Wissenschaft selbst ist der helle Himmel ein Problem. Viele traditionsreiche Sternwarten in Europa liegen heute mitten in Städten und dienen fast nur noch der Lehre oder der Öffentlichkeitsarbeit. Für ihre Forschung weichen Astronominnen und Astronomen auf abgelegene Standorte aus; die Europäische Südsternwarte etwa betreibt ihre größten Teleskope in der chilenischen Atacamawüste, wo die Luft trocken ist und die nächste Großstadt weit entfernt liegt.","Dass es auch anders geht, zeigen die sogenannten Sternenparks. Als einer der ersten in Deutschland wurde 2014 das Westhavelland in Brandenburg anerkannt; weitere, etwa in der Rhön und in der Eifel, kamen hinzu. Die Gemeinden dort verpflichten sich, ihre Beleuchtung schrittweise anzupassen, ohne dass die Straßen deshalb dunkel bleiben müssten. Für den Tourismus ist das ein Gewinn: Hobbyastronomen nehmen lange Anfahrten in Kauf, um einmal einen Himmel ohne Lichtglocke zu erleben, und manche Pension wirbt inzwischen mit Sternführungen statt mit Wellnessangeboten.","Auch Städte können viel tun. Fulda wurde 2019 als erste deutsche „Sternenstadt“ ausgezeichnet. Neue Laternen strahlen dort nur noch nach unten, ihr Licht ist warmweiß statt bläulich, und in der zweiten Nachthälfte wird es gedimmt. „Entscheidend ist, Licht nur dort einzusetzen, wo es gebraucht wird, nur dann, wenn es gebraucht wird, und nicht heller als nötig“, sagt Hartwig. Viele Maßnahmen seien einfach umzusetzen: Abgeschirmte Leuchten verhindern, dass Licht zur Seite oder in den Himmel fällt, und Bewegungsmelder sorgen dafür, dass Wege nur beleuchtet sind, solange jemand sie benutzt.","Gesetzlich ist das Thema lange vernachlässigt worden. Seit 2021 verlangt das Bundesnaturschutzgesetz zwar, dass neue Beleuchtungsanlagen an Straßen und Wegen Insekten möglichst wenig schaden. Für private Grundstücke gibt es aber kaum Vorgaben, sodass jeder seinen Garten oder seine Hausfassade nach Belieben anstrahlen kann. Frankreich ist hier weiter: Dort müssen beleuchtete Schaufenster und Werbeanlagen schon seit Jahren in den Nachtstunden ausgeschaltet werden.","Hartwig sieht dennoch Grund zur Zuversicht, denn jeder Einzelne kann etwas beitragen. Gartenleuchten mit Zeitschaltuhr, warmweiße Lampen und Vorhänge, die das Licht im Haus halten, kosten wenig. „Niemand muss im Dunkeln stolpern“, betont sie. „Es geht nicht darum, auf Licht zu verzichten, sondern darum, es klüger zu nutzen. Anders als bei vielen Umweltproblemen verschwindet die Belastung in dem Moment, in dem man das Licht ausschaltet.“ Und sie fügt hinzu: „Wir müssen nur wieder lernen, dass zur Nacht auch die Dunkelheit gehört.“"],"itemsLead":"Aussagen 13–23","items":[{"no":"13","text":"In Europa kann die Mehrheit der Menschen die Milchstraße nicht mehr sehen.","answer":"r"},{"no":"14","text":"Satelliten erfassen das Licht moderner Leuchtdioden besonders zuverlässig.","answer":"f"},{"no":"15","text":"Weil Leuchtdioden wenig Strom verbrauchen, wird heute mehr beleuchtet als früher.","answer":"r"},{"no":"16","text":"Im Schweizer Versuch bildeten die Pflanzen unter den Laternen mehr Früchte.","answer":"f"},{"no":"17","text":"Seit Hochhäuser nachts dunkel bleiben, sterben nur noch halb so viele Zugvögel.","answer":"n"},{"no":"18","text":"Hartwig hält die gesundheitlichen Folgen nächtlicher Beleuchtung für ausreichend erforscht.","answer":"f"},{"no":"19","text":"Die Zahl der Besucher in den Sternenparks hat sich seit ihrer Gründung verdoppelt.","answer":"n"},{"no":"20","text":"Fulda hat für die Umrüstung seiner Laternen Fördergeld vom Bund erhalten.","answer":"n"},{"no":"21","text":"Für private Grundstücke gelten in Deutschland strenge Regeln zur Beleuchtung.","answer":"f"},{"no":"22","text":"Frankreich will seine Regeln demnächst auch auf private Gärten ausweiten.","answer":"n"},{"no":"23","text":"Hartwig hält die Folgen künstlichen Lichts für schnell umkehrbar.","answer":"r"}],"headline":{"instruction":"Welche der Überschriften a, b oder c trifft die Aussage des Textes am besten? Markieren Sie Ihre Lösung für die Aufgabe 24 auf dem Antwortbogen.","no":"24","options":{"a":"Zu viel Licht bei Nacht – Folgen und Auswege","b":"Warum Leuchtdioden das Problem heller Nächte lösen","c":"Sternenparks als neues Reiseziel für Urlauber"},"answer":"a"}},"sb":{"instruction":"Lesen Sie den folgenden Text. Welche Lösung (a, b, c oder d) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 25–46 auf dem Antwortbogen. Lücke (0) ist ein Beispiel.","title":"Ein Garten für Kinder","paragraphs":["Kaum ein deutsches Wort hat eine so weite Reise {{0}} wie „Kindergarten“. In London, New York oder Sydney benutzt man es ganz selbstverständlich, meist ohne zu ahnen, {{25}} es aus dem Deutschen stammt. {{26}} hat es Friedrich Fröbel, ein Pädagoge aus Thüringen, {{27}} es sein Leben lang um eine Frage ging: Wie lernen kleine Kinder? Von {{28}} strenger Disziplin hielt er wenig. Kinder lernen seiner Überzeugung nach nicht durch Stillsitzen und Zuhören. {{29}} erkunden sie die Welt im Spiel, mit allen Sinnen und aus eigenem Antrieb.","1840 verwendete Fröbel das Wort {{30}} für eine Einrichtung im thüringischen Bad Blankenburg. Der Name war Programm: Kinder sollten dort {{31}} Pflanzen gepflegt werden, die man nicht in eine Form zwingt, sondern beim Wachsen unterstützt. Für das Spiel entwickelte Fröbel besondere Materialien, {{32}} er „Spielgaben“ nannte – einfache Körper wie Ball, Kugel, Walze und Würfel, {{33}} Kinder Formen, Zahlen und Gesetzmäßigkeiten entdecken sollten. Manche Holzbaukästen, mit denen Kinder {{34}} spielen, gehen auf diese Ideen zurück.","Nicht überall stieß Fröbel auf Zustimmung. 1851 {{35}} Preußen die Kindergärten, weil die Behörden fürchteten, dort würden Unglauben und Umsturz gelehrt. Auslöser war {{36}} Anschein nach eine Verwechslung: Ein Neffe Fröbels hatte Schriften verfasst, die als gefährlich {{37}}. Fröbel selbst erlebte das Ende des Verbots nicht mehr. Er starb 1852, acht Jahre bevor es {{38}} wurde.","Danach breitete sich die Idee umso rascher aus. Engagierte Frauen wie Bertha von Marenholtz-Bülow warben in ganz Europa {{39}} Fröbels Pädagogik, und deutsche Auswanderer brachten sie über den Atlantik. Schon 1856 hatte Margarethe Schurz in Wisconsin den ersten Kindergarten der Vereinigten Staaten eröffnet – zu einer Zeit, {{40}} dort noch kaum jemand an Bildung für Kleinkinder dachte.","Heute besucht in Deutschland fast jedes Kind vor der Einschulung eine Kita. Das Wort „Kindergarten“ hört man hierzulande zwar immer seltener, {{41}} im Englischen {{42}} es sich bis heute gehalten. Ob Fröbel das gefallen {{43}}? Gefreut hätte ihn {{44}}, dass Kinder nicht mehr als kleine Erwachsene gelten, {{45}} man möglichst früh das Stillsitzen beibringen muss. Sein Grundgedanke, dass Lernen im Spiel beginnt, ist {{46}} aktuell wie vor bald zweihundert Jahren."],"example":{"options":{"a":"gefahren","b":"gegangen","c":"gemacht","d":"gereist"},"answer":"c"},"items":[{"no":"25","options":{"a":"damit","b":"das","c":"dass","d":"weil"},"answer":"c"},{"no":"26","options":{"a":"Geprägt","b":"Geprüft","c":"Gestempelt","d":"Gezeichnet"},"answer":"a"},{"no":"27","options":{"a":"dem","b":"den","c":"der","d":"dessen"},"answer":"a"},{"no":"28","options":{"a":"all zu","b":"allzu","c":"Allzu","d":"alzu"},"answer":"b"},{"no":"29","options":{"a":"Andernfalls","b":"Ebenso","c":"Trotzdem","d":"Vielmehr"},"answer":"d"},{"no":"30","options":{"a":"zum ersten mal","b":"zum ersten Mal","c":"zum Ersten Mal","d":"zum erstenmal"},"answer":"b"},{"no":"31","options":{"a":"als","b":"denn","c":"so","d":"wie"},"answer":"d"},{"no":"32","options":{"a":"das","b":"denen","c":"der","d":"die"},"answer":"d"},{"no":"33","options":{"a":"an dem","b":"an denen","c":"an deren","d":"an dessen"},"answer":"b"},{"no":"34","options":{"a":"heut zutage","b":"heute zu Tage","c":"heutzutage","d":"Heutzutage"},"answer":"c"},{"no":"35","options":{"a":"verbat","b":"verbietet","c":"verbot","d":"verboten"},"answer":"c"},{"no":"36","options":{"a":"allem","b":"allemal","c":"allen","d":"aller"},"answer":"a"},{"no":"37","options":{"a":"befanden","b":"gaben","c":"galt","d":"galten"},"answer":"d"},{"no":"38","options":{"a":"aufgehoben","b":"enthoben","c":"erhoben","d":"hervorgehoben"},"answer":"a"},{"no":"39","options":{"a":"an","b":"auf","c":"für","d":"gegen"},"answer":"c"},{"no":"40","options":{"a":"als","b":"ob","c":"wann","d":"wenn"},"answer":"a"},{"no":"41","options":{"a":"denn","b":"doch","c":"oder","d":"sondern"},"answer":"b"},{"no":"42","options":{"a":"hat","b":"ist","c":"wird","d":"würde"},"answer":"a"},{"no":"43","options":{"a":"gehabt","b":"hatte","c":"hätte","d":"wäre"},"answer":"c"},{"no":"44","options":{"a":"vermutend","b":"vermutet","c":"vermutlich","d":"Vermutungen"},"answer":"c"},{"no":"45","options":{"a":"dem","b":"denen","c":"derjenigen","d":"die"},"answer":"b"},{"no":"46","options":{"a":"als","b":"je","c":"noch","d":"so"},"answer":"d"}]}},"hoeren":{"t1":{"instruction":"Sie hören die Meinungen von acht Personen. Sie hören die Meinungen nur einmal. Entscheiden Sie beim Hören, welche Aussage (a–j) zu welcher Person (Sprecher/in 1–8) passt. Zwei Aussagen passen nicht. Markieren Sie Ihre Lösungen für die Aufgaben 47–54 auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aussagen a–j. Sie haben dazu eine Minute Zeit.","title":"Wohnen im Studium","statements":[{"letter":"a","text":"Bewerber aus dem Ausland haben es bei der Wohnungssuche besonders schwer."},{"letter":"b","text":"Möblierte Kleinstapartments sind für Studienanfänger die beste Lösung."},{"letter":"c","text":"Ein Wohnheim braucht Angebote, die die Bewohner miteinander ins Gespräch bringen."},{"letter":"d","text":"Die Höhe der Mieten hat bei der Wahl meines Studienorts den Ausschlag gegeben."},{"letter":"e","text":"Wer bei den Eltern wohnt, spart Geld, verpasst aber einen Teil des Studentenlebens."},{"letter":"f","text":"Ein Zimmer gegen Hilfe im Alltag kann für beide Seiten ein Gewinn sein."},{"letter":"g","text":"Alle Studienanfänger sollten im ersten Jahr in einem Wohnheim wohnen, damit sie leichter Anschluss finden."},{"letter":"h","text":"Das Zusammenleben mit Fremden hat mir beigebracht, Kompromisse einzugehen."},{"letter":"i","text":"Leer stehende Bürogebäude könnten zu Wohnraum für Studierende umgebaut werden."},{"letter":"j","text":"Der Staat müsste deutlich mehr Geld in günstige Wohnheimplätze investieren."}],"items":[{"no":"47","label":"Sprecherin 1","answer":"h"},{"no":"48","label":"Sprecher 2","answer":"e"},{"no":"49","label":"Sprecherin 3","answer":"j"},{"no":"50","label":"Sprecher 4","answer":"a"},{"no":"51","label":"Sprecherin 5","answer":"f"},{"no":"52","label":"Sprecher 6","answer":"d"},{"no":"53","label":"Sprecherin 7","answer":"i"},{"no":"54","label":"Sprecher 8","answer":"c"}]},"t2":{"instruction":"Sie hören eine Radiosendung. Sie hören die Sendung nur einmal. Entscheiden Sie beim Hören, welche Aussage (a, b oder c) am besten passt. Markieren Sie Ihre Lösungen für die Aufgaben 55–64 auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 55–64. Sie haben dazu drei Minuten Zeit.","items":[{"no":"55","stem":"Zum Weltraumschrott zählen nach Frau Wendt","options":{"a":"ausschließlich Teile, die größer als zehn Zentimeter sind.","b":"vor allem Satelliten, die noch in Betrieb sind.","c":"auch Gegenstände, die Astronauten verloren haben."},"answer":"c"},{"no":"56","stem":"Das Problem ist n
