lte ich fragen, ob unser Zimmer über einen Balkon verfügt – {{25}} wir bei der Buchung leider nicht gedacht haben. Falls nicht, {{26}} wir gegen einen kleinen Aufpreis gern in ein anderes Zimmer wechseln. Da wir mit dem Zug anreisen, sind wir {{27}} einen Parkplatz nicht angewiesen. Dankbar wären wir allerdings für einen Hinweis, {{28}} wir vom Bahnhof am einfachsten zu Ihnen gelangen – {{29}} wir wissen, fährt der Bus nur einmal pro Stunde.","Ich bitte Sie, {{30}} die Änderung kurz schriftlich zu bestätigen. Vielen Dank im Voraus.","Mit freundlichen Grüßen\nThomas Riedel"],"items":[{"no":"21","options":{"a":"am","b":"vom","c":"seit"},"answer":"b"},{"no":"22","options":{"a":"den","b":"dem","c":"der"},"answer":"c"},{"no":"23","options":{"a":"weil","b":"weshalb","c":"deshalb"},"answer":"b"},{"no":"24","options":{"a":"für","b":"über","c":"um"},"answer":"c"},{"no":"25","options":{"a":"woran","b":"worauf","c":"wofür"},"answer":"a"},{"no":"26","options":{"a":"hätten","b":"würden","c":"wären"},"answer":"b"},{"no":"27","options":{"a":"an","b":"auf","c":"für"},"answer":"b"},{"no":"28","options":{"a":"wo","b":"was","c":"wie"},"answer":"c"},{"no":"29","options":{"a":"Sobald","b":"Solange","c":"Soweit"},"answer":"c"},{"no":"30","options":{"a":"mir","b":"mich","c":"Ihnen"},"answer":"a"}]},"sb2":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 31–40. Benutzen Sie die Wörter a–o. Jedes Wort passt nur einmal. Markieren Sie Ihre Lösungen für die Aufgaben 31–40 auf dem Antwortbogen.","title":"","paragraphs":["Hallo Ben,","wie geht es dir? Ich habe eine Idee für das nächste Wochenende: Hast du {{31}} auf eine Radtour? Das Wetter soll gut werden, und ich möchte diesmal nicht die übliche Runde fahren, {{32}} bis zum See hinter den Hügeln. Wir fahren zuerst am Fluss entlang und dann über die Hügel. Es sind etwa 40 Kilometer – die Strecke ist zwar lang, aber nicht besonders {{33}}.","Wir treffen uns am besten um neun Uhr bei mir. Vorher solltest du unbedingt deine Reifen {{34}} und die Bremsen prüfen, {{35}} wird es gefährlich – die Abfahrt zum See ist ziemlich steil. Ich bringe Brote und Obst mit; könntest du {{36}} um die Getränke kümmern? Am Nachmittag können wir schwimmen, {{37}} das Wasser nicht zu kalt ist.","Mein altes Fahrrad {{38}} sich leider nicht mehr reparieren, aber ich habe seit zwei Wochen ein neues. Wenn du kein Rad hast: Mein Bruder kann dir {{39}} leihen. Ich wäre dir {{40}}, wenn du dich bis Donnerstag meldest – dann kann ich rechtzeitig einkaufen.","Bis bald\nLeon"],"words":{"a":"ANSPRUCHSVOLL","b":"AUFGEPUMPT","c":"AUFPUMPEN","d":"DANKBAR","e":"DICH","f":"DIR","g":"EINEN","h":"EINS","i":"FALLS","j":"LASSEN","k":"LÄSST","l":"LUST","m":"SONDERN","n":"SONST","o":"ZEIT"},"items":[{"no":"31","answer":"l"},{"no":"32","answer":"m"},{"no":"33","answer":"a"},{"no":"34","answer":"c"},{"no":"35","answer":"n"},{"no":"36","answer":"e"},{"no":"37","answer":"i"},{"no":"38","answer":"k"},{"no":"39","answer":"h"},{"no":"40","answer":"d"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Texte nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Der Sprecher ist heute froh, dass die Familie einen Hund hat.","answer":"R"},{"no":"42","text":"Die Sprecherin hat wegen ihrer Allergie keinen Kontakt zu Tieren.","answer":"F"},{"no":"43","text":"Der Sprecher würde sich wegen der Kosten keine Katze mehr anschaffen.","answer":"F"},{"no":"44","text":"Die Familie hat jetzt ein Haustier, das man auch mal ein paar Tage allein lassen kann.","answer":"R"},{"no":"45","text":"Der Sprecher lebt seit dem Tod seiner Frau sehr zurückgezogen.","answer":"F"}]},"t2":{"instruction":"Sie hören nun ein Gespräch. Dazu sollen Sie zehn Aufgaben lösen. Sie hören das Gespräch zweimal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu eine Minute Zeit.","items":[{"no":"46","text":"In der Schule hat Frau Pohl gern Sport gemacht.","answer":"F"},{"no":"47","text":"Ihr Hausarzt hat ihr zum Schwimmen geraten.","answer":"R"},{"no":"48","text":"In den ersten Monaten hat Frau Pohl allein trainiert.","answer":"R"},{"no":"49","text":"Frau Pohl ist im vergangenen Jahr einen Halbmarathon gelaufen.","answer":"F"},{"no":"50","text":"Wegen Knieschmerzen konnte sie vor dem Marathon eine Zeit lang nicht laufen.","answer":"R"},{"no":"51","text":"Ihr Mann läuft die langen Strecken mit ihr zusammen.","answer":"F"},{"no":"52","text":"Bei Kilometer 35 wollte Frau Pohl aufgeben.","answer":"R"},{"no":"53","text":"Frau Pohl war schneller, als sie sich vorgenommen hatte.","answer":"F"},{"no":"54","text":"Durch das Laufen hat Frau Pohl stark abgenommen.","answer":"F"},{"no":"55","text":"Anfängern rät Frau Pohl, nicht täglich zu laufen.","answer":"R"}]},"t3":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören jeden Text zweimal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen für die Aufgaben 56–60 auf dem Antwortbogen. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch.","readNote":"","items":[{"no":"56","text":"Der Regionalexpress nach Halle fährt um 10.47 Uhr von Gleis 9 ab.","answer":"F"},{"no":"57","text":"Donnerstags ist die Zahnarztpraxis länger geöffnet als an den anderen Tagen.","answer":"R"},{"no":"58","text":"Auf der A9 muss man wegen eines Unfalls mit etwa einer halben Stunde Verspätung rechnen.","answer":"R"},{"no":"59","text":"Am Wochenende wird es wärmer als heute.","answer":"R"},{"no":"60","text":"Neukunden bekommen auf alle Bestellungen zehn Prozent Rabatt.","answer":"F"}]}},"schreiben":{"intro":"","task":{"lead":"Sie haben von Ihrem Freund Marek folgende E-Mail erhalten:","mail":["Hallo ______,","stell dir vor: Eine Firma in deiner Stadt hat mir eine Stelle angeboten! Ich könnte im Oktober anfangen. Jetzt überlege ich, ob ich das machen soll – ich kenne dort ja niemanden außer dir.","Wie gefällt dir das Leben in der Stadt? Und wie findet man dort eine Wohnung? Ich habe gehört, das ist schwierig. Vielleicht könnten wir uns bald mal treffen und darüber reden?","Viele Grüße\nMarek"],"instruction":"Antworten Sie auf die E-Mail. Schreiben Sie etwas zu allen vier Punkten:","points":["wie Ihnen das Leben in Ihrer Stadt gefällt","Tipps für die Wohnungssuche","wie Sie Marek beim Umzug helfen können","ein Vorschlag für ein Treffen (wann, wo)"],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss.","model":{"label":"Beispiel für eine Antwort, die alle vier Leitpunkte behandelt (ca. 180 Wörter)","text":"Betreff: Deine neue Stelle – komm her!\n\nHallo Marek,\n\ndas ist eine super Nachricht! Ich freue mich sehr, dass du vielleicht bald hier wohnen wirst.\n\nMir gefällt das Leben in Leipzig sehr gut. Die Stadt ist nicht zu groß, man kommt überall mit dem Rad hin, und es gibt viele Cafés, Parks und Konzerte. Nur die Winter sind lang und grau – daran musst du dich gewöhnen.\n\nEine Wohnung zu finden ist nicht einfach, aber möglich. Schau nicht nur im Internet, sondern frag auch in der Firma – viele Wohnungen werden über Kollegen weitergegeben. Und sei bei einer Besichtigung pünktlich und bring alle Unterlagen mit, dann hast du bessere Chancen als die anderen.\n\nNatürlich helfe ich dir. Am Anfang kannst du bei mir auf dem Sofa schlafen, solange du willst. Ich kann auch mit dir Wohnungen besichtigen und beim Umzug Kisten tragen – mein Nachbar hat einen Transporter.\n\nWir sollten uns bald treffen! Wie wäre es am Samstag in zwei Wochen? Du kommst am Vormittag, ich zeige dir die Stadt, und abends kochen wir bei mir. Passt dir das?\n\nViele Grüße\nTomasz","marks":["","","","1","2","3","4",""],"notes":"Leitpunkte\n1 Leben in der Stadt → gefällt gut, Rad, Cafés; Nachteil Winter\n2 Tipps Wohnungssuche → Firma fragen, pünktlich, Unterlagen\n3 Hilfe beim Umzug → Sofa, Besichtigungen, Transporter\n4 Treffen → Samstag in zwei Wochen, Stadt zeigen, kochen\nAufbau Betreff · Anrede in der du-Form (Freund, informell) · Einleitung mit Reaktion auf die Nachricht · Schluss mit Frage · Grußformel und Name\nBewertung\nI Inhalt: alle vier Leitpunkte, passend zur Situation. Jeder fehlende Leitpunkt kostet eine Stufe.\nII Kommunikative Gestaltung: Register (du), Aufbau, Verknüpfungen wie nur, nicht nur … sondern auch, dann, natürlich.\nIII Formale Richtigkeit: Fehler dürfen das Verständnis nicht stören.\nTypische Fehler: Leitpunkt 3 (eigene Hilfe) vergessen, weil Marek nicht direkt danach fragt · Treffen ohne Zeit und Ort · nur Vorteile der Stadt nennen (Leitpunkt 1 wirkt dann dünn) · Sie statt du gegenüber einem Freund."}}},"audio":[{"src":"telc%20B1%20Modelltest%205.1.mp3","dur":376.01},{"src":"telc%20B1%20Modelltest%205.2.mp3","dur":644.88},{"src":"telc%20B1%20Modelltest%205.3.mp3","dur":713.51}],"minutes":{"hoeren":31},"pdf":"telc%20B1%20Modelltest%205.pdf","pages":{"loesung":19,"muster":20,"kommentar":24,"hoertexte":22}}}}</script>

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

    var L = T.lesen, pages = [], items = [];
    function reg(list, type, teil, page, w) {
      list.forEach(function (it) { items.push({ no: it.no, type: type, answer: it.answer, teil: teil, page: page, w: w, src: it }); });
    }
    // Teil 1
    L.t1.items.forEach(function (it, i) {
      var tx = L.t1.texts[i];
      it.prompt = '<b>Text ' + esc(it.no) + '</b>';
      it.text = 'Text ' + it.no + ': ' + clip(tx ? tx.paragraphs[0] : '', 56);
    });
    pages.push({ key: 'L1', teil: 1, title: 'Lesen Teil 1', inst: [L.t1.instruction], leftTitle: 'Texte 1–5', rightTitle: 'Aufgaben 1–5', left: textsHTML(L.t1),
      right: '<p class="rh">Überschriften a–j</p>' + hlistHTML(L.t1) + L.t1.items.map(function (it) { return selItem(it, 'Überschrift:', L10); }).join('') });
    reg(L.t1.items, 'sel1', 1, 0, 5);
    // Teil 2
    pages.push({ key: 'L2', teil: 2, title: 'Lesen Teil 2', inst: [L.t2.instruction], leftTitle: L.t2.kind === 'interview' ? 'Interview' : 'Artikel', rightTitle: 'Aufgaben 6–10',
      left: articleHTML(L.t2), right: (L.t2.taskInstruction ? '<p class="inst">' + esc(L.t2.taskInstruction) + '</p>' : '') + L.t2.items.map(abcItem).join('') });
    reg(L.t2.items, 'abc', 2, 1, 5);
    // Teil 3
    L.t3.items.forEach(function (it) { it.prompt = esc(it.text); });
    pages.push({ key: 'L3', teil: 3, title: 'Lesen Teil 3', inst: [L.t3.instruction], leftTitle: 'Anzeigen a–l', rightTitle: 'Situationen 11–20',
      left: adsHTML(L.t3.infos), right: L.t3.items.map(function (it) { return selItem(it, 'Anzeige:', L12.concat(['x'])); }).join('') });
    reg(L.t3.items, 'sel3', 3, 2, 2.5);
    // Sprachbausteine 1
    pages.push({ key: 'S1', teil: 4, title: 'Sprachbausteine Teil 1', inst: [L.sb1.instruction], leftTitle: 'Text', rightTitle: 'Lücken 21–30',
      left: '<article class="card doc">' + gapParas(L.sb1.paragraphs) + '</article>', right: L.sb1.items.map(sb1Item).join('') });
    reg(L.sb1.items, 'sb1', 4, 3, 1.5);
    // Sprachbausteine 2
    L.sb2.items.forEach(function (it) { it.prompt = '<b>Lücke ' + esc(it.no) + '</b>'; });
    pages.push({ key: 'S2', teil: 5, title: 'Sprachbausteine Teil 2', inst: [L.sb2.instruction], leftTitle: 'Text', rightTitle: 'Lücken 31–40',
      left: '<article class="card doc">' + (L.sb2.title ? '<h3 class="h1t">' + esc(L.sb2.title) + '</h3>' : '') + gapParas(L.sb2.paragraphs) + '</article>',
      right: '<p class="rh">Wörter a–o</p>' + wboxHTML(L.sb2.words) + L.sb2.items.map(function (it) { return selItem(it, 'Wort:', L15, function (k) { return k + ' – ' + L.sb2.words[k]; }); }).join('') });
    reg(L.sb2.items, 'sb2', 5, 4, 1.5);
    return { pages: pages, items: items, teile: [1, 2, 3, 4, 5], two: true, max: 105,
      labels: { 1: 'Lesen 1', 2: 'Lesen 2', 3: 'Lesen 3', 4: 'Sprachbausteine 1', 5: 'Sprachbausteine 2' } };
  }

  function buildHoeren() {
    var H = T.hoeren, pages = [], items = [];
    [['t1', 5], ['t2', 2.5], ['t3', 5]].forEach(function (d, i) {
      var t = H[d[0]], n = t.items;
      pages.push({ key: 'H' + (i + 1), teil: i + 1, title: 'Hören Teil ' + (i + 1), inst: [t.instruction, t.readNote], rightTitle: 'Aufgaben ' + n[0].no + '–' + n[n.length - 1].no,
        right: n.map(rfItem).join('') });
      n.forEach(function (it) { items.push({ no: it.no, type: 'rf', answer: it.answer, teil: i + 1, page: i, w: d[1], src: it }); });
    });
    return { pages: pages, items: items, teile: [1, 2, 3], two: false, max: 75, labels: { 1: 'Teil 1', 2: 'Teil 2', 3: 'Teil 3' } };
  }

  function taskHTML(tk) {
    var h = '<div class="task"><p class="ctxl">' + esc(tk.lead) + '</p>';
    h += '<div class="mailbox">' + (tk.mail || []).map(function (p) { return '<p>' + esc(p).replace(/\n/g, '<br>') + '</p>'; }).join('') + '</div>';
    h += '<p>' + esc(tk.instruction) + '</p>';
    h += '<ul class="pts">' + (tk.points || []).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul>';
    return h + '<p>' + esc(tk.closing) + '</p></div>';
  }
  function buildSchreiben() {
    var tk = T.schreiben.task;
    T.schreiben.tasks = [tk];   /* gemeinsame Ergebnis-/Textausgabe wie bei mehreren Aufgaben */
    var pages = [{ key: 'S1', teil: 1, title: 'Schriftlicher Ausdruck', leftTitle: 'E-Mail beantworten',
      left: (T.schreiben.intro ? '<p class="inst">' + esc(T.schreiben.intro) + '</p>' : '') + taskHTML(tk), task: tk }];
    return { pages: pages, items: [], teile: [1], two: true, writing: true, labels: { 1: 'E-Mail' } };
  }

  var M = R.mod === 'lesen' ? buildLesen() : R.mod === 'hoeren' ? buildHoeren() : buildSchreiben();
  var ITEM = {};
  M.items.forEach(function (it) { ITEM[it.no] = it; });

  /* ---------- state ---------- */
  var S = null;
  var timerId = null, lastTick = 0, saveTimer = null, lastSave = 0, warned = {};
  var markMode = false, audioAllowPause = false, audioLastPos = 0, advanceTimer = null, probeTimer = null;

  function freshState() {
    return { build: D.build, page: 0, remaining: MOD[R.mod].minutes * 60, answers: {}, marks: {}, texts: { 1: '', 2: '' },
      started: Date.now(), audio: { track: 0, pos: 0, done: false }, font: (lsGet('font') || 0) };
  }
  function save() { if (S) { S.saved = Date.now(); lsSet(STATE_KEY, S); lastSave = Date.now(); } }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 350); }

  /* ---------- top bar ---------- */
  function topHTML(running) {
    var sec = S ? S.remaining : MOD[R.mod].minutes * 60;
    var f = S ? S.font : (lsGet('font') || 0);
    return '<header class="top">' +
      '<img class="logo" src="' + LOGO + '" alt="Sophia Deutsch Akademie">' +
      '<div class="id"><b><span class="gz">telc Deutsch </span>B1 · ' + MOD[R.mod].name + '</b><span>Modelltest ' + esc(T.roman) + ' · Übungsprüfung im digitalen Format · Sophia Deutsch Akademie</span></div>' +
      '<div class="sp"></div><div class="tool">' +
      (running && R.mod === 'hoeren' ? '<div class="vol" id="vol" title="Lautstärke">' + ICON.vol + '<input type="range" min="0" max="100" step="1" id="volr" aria-label="Lautstärke"></div>' : '') +
      (running ? '<button class="hlp" id="help" type="button" title="Hilfe: Tutorial noch einmal ansehen" aria-label="Hilfe">?</button>' : '') +
      (running ? '<div class="fz" id="fz" role="group" aria-label="Schriftgröße">' +
        [0, 1, 2].map(function (i) { return '<button type="button" class="s' + (i + 1) + '" data-fz="' + i + '" aria-pressed="' + (f === i) + '" aria-label="Schriftgröße ' + (i + 1) + '">A</button>'; }).join('') + '</div>' : '') +
      '<div class="timer" id="tm" role="timer" aria-live="off">' + ICON.clock + '<div class="tl"><small>Verbleibende Zeit</small><b id="tmv">' + fmt(sec) + '</b></div></div>' +
      '</div></header>';
  }

  /* ---------- start page ---------- */
  function showStart() {
    stopAll();
    var saved = lsGet(STATE_KEY), res = lsGet(RESULT_KEY);
    var info = MOD[R.mod];
    var facts = R.mod === 'lesen' ? ['90 Minuten', 'Lesen 1–3 · Sprachbausteine 1–2', '40 Aufgaben'] : R.mod === 'hoeren' ? ['ca. ' + MOD.hoeren.minutes + ' Minuten', '3 Teile', '20 Aufgaben', 'Teil 1 einmal · Teil 2 und 3 zweimal', 'Kopfhörer empfohlen'] : ['30 Minuten', 'E-Mail mit vier Leitpunkten', 'Wörterzähler'];
    var rules = {
      lesen: [
        ['Dieses Modul enthält Leseverstehen (Teil 1–3) und Sprachbausteine (Teil 1–2). Alle fünf Teile haben zusammen 90 Minuten Zeit. Die Reihenfolge der Teile können Sie selbst wählen.', '읽기(Teil 1–3)와 어휘·문법(Sprachbausteine 1–2)을 합쳐 90분입니다. Teil 순서는 자유롭게 정할 수 있습니다.'],
        ['Links sehen Sie den Text, rechts die Aufgaben. Wählen Sie die richtige Lösung aus.', '왼쪽은 지문, 오른쪽은 문항입니다. 정답을 고르세요.'],
        ['In den Sprachbausteinen erscheint Ihre Antwort direkt in der Lücke des Textes. Mit einem Klick auf die Lücke springen Sie zur Aufgabe.', '어휘·문법에서는 고른 답이 지문의 빈칸에 바로 들어갑니다. 빈칸을 누르면 해당 문항으로 이동합니다.'],
        ['Mit „Markieren“ können Sie Textstellen farbig hervorheben.', '‘Markieren’을 켜고 드래그하면 지문에 형광펜을 칠할 수 있습니다.'],
        ['Sie können Ihre Antworten bis zum Ende der Prüfungszeit ändern. Danach wird das Modul automatisch abgegeben.', '시간이 끝날 때까지 답을 고칠 수 있고, 시간이 끝나면 자동으로 제출됩니다.']
      ],
      hoeren: [
        ['Die drei Hörtexte werden automatisch nacheinander abgespielt. Teil 1 hören Sie einmal, Teil 2 und Teil 3 jeweils zweimal (die Wiederholung steht schon in der Aufnahme). Sie können nicht anhalten oder zurückspulen.', '음원 3개가 자동으로 이어서 재생됩니다. Teil 1은 한 번, Teil 2·3은 두 번 들려주며(다시 들려주는 부분도 음원에 들어 있음), 멈추거나 되감을 수 없습니다.'],
        ['Der Bildschirm wechselt mit dem Hörtext automatisch zum nächsten Teil. Lesen Sie die Aufgaben schon vor dem Hören. Frühere Teile können Sie wieder öffnen und Antworten ändern.', '음원에 맞춰 화면이 다음 Teil로 넘어갑니다. 듣기 전에 문항을 미리 읽으세요. 지나간 Teil은 다시 열어 답을 고칠 수 있습니다.'],
        ['Entscheiden Sie bei jeder Aussage: richtig (+) oder falsch (–).', '각 문장이 맞으면 Richtig(+), 틀리면 Falsch(–)를 고릅니다.'],
        ['Stellen Sie die Lautstärke vor dem Start ein. Verwenden Sie am besten Kopfhörer.', '시작 전에 음량을 맞추세요. 헤드폰 사용을 권합니다.']
      ],
      schreiben: [
        ['Sie antworten auf eine E-Mail. Behandeln Sie alle vier Leitpunkte und wählen Sie Betreff, Anrede, Einleitung, Schluss und Grußformel passend zur Situation (Freund/in: du · Firma, Schule, Hausverwaltung: Sie).', '이메일에 답하는 글을 씁니다. 네 가지 Leitpunkte에 모두 답하고, 제목·인사·첫 문장·끝인사를 받는 사람에 맞게 정하세요(du 또는 Sie).'],
        ['Schreiben Sie Ihren Text in das Textfeld. Die Wörter werden automatisch gezählt (nur zur Orientierung). Es gibt keine Rechtschreibkorrektur.', '입력란에 글을 쓰면 단어 수가 자동으로 계산됩니다(참고용). 맞춤법 자동 교정은 없습니다.'],
        ['Umlaute und ß können Sie mit den Sonderzeichen-Tasten einfügen.', 'ä, ö, ü, ß는 특수문자 버튼으로 넣을 수 있습니다.'],
        ['Bewertet wird nur der Text im Textfeld. Nach Ablauf der Zeit wird das Modul automatisch abgegeben.', '입력란의 글만 평가 대상이며, 시간이 끝나면 자동으로 제출됩니다.']
      ]
    }[R.mod];
    var resumeOK = saved && saved.remaining > 1;
    var h = '<div class="page">' + topHTML(false) + '<main class="pgm"><section class="sheet">' +
      '<p class="ey">Modelltest ' + esc(T.roman) + ' · Modul ' + info.name + '</p>' +
      '<h1>telc Deutsch B1 · ' + info.full + '</h1>' +
      '<p class="sl">Übungsprüfung im digitalen Format — wie am Computer im Prüfungszentrum.</p>' +
      '<div class="facts">' + facts.map(function (f) { return '<span>' + esc(f) + '</span>'; }).join('') + '</div>' +
      '<div class="rules"><h2>Hinweise</h2><ul>' + rules.map(function (r) { return '<li>' + esc(r[0]) + '<small>' + esc(r[1]) + '</small></li>'; }).join('') + '</ul></div>' +
      '<div class="namef"><label for="nm">Name (für das Ergebnis) · 이름</label><input id="nm" autocomplete="name" maxlength="40" value="' + esc(lsGet('name') || '') + '"></div>';
    if (R.mod === 'hoeren') {
      h += '<div class="rules" style="margin-top:-6px"><h2>Tonprobe</h2><div class="acts"><div class="vol">' + ICON.vol +
        '<input type="range" min="0" max="100" step="1" id="volr0" aria-label="Lautstärke"></div><button class="btn sm" id="probe" type="button">Tonprobe abspielen</button></div>' +
        '<p class="note" style="margin-top:8px">Spielt die ersten Sekunden von Teil 1 ab. · 음량 확인용으로 Teil 1 앞부분을 몇 초 들려줍니다.</p></div>';
    }
    h += '<div class="acts">';
    if (resumeOK) {
      h += '<button class="btn pri" id="resume" type="button">Prüfung fortsetzen (' + fmt(saved.remaining) + ')</button><button class="btn" id="restart" type="button">Neu beginnen</button>';
    } else {
      h += '<button class="btn pri" id="tour" type="button">Tutorial ansehen und starten</button><button class="btn out" id="go" type="button">Ohne Tutorial starten</button>';
    }
    if (res) h += '<button class="btn" id="seeres" type="button">Letztes Ergebnis</button>';
    h += '</div><p class="note">Die Prüfungszeit beginnt erst, wenn Sie auf „Starten“ klicken. · 시작 버튼을 눌러야 시간이 흐릅니다. 시험 중 창을 닫으면 그 시점까지 저장되고, 다시 열면 이어서 풀 수 있습니다.</p>' +
      '<a class="back" href="' + BACK + '">← Modelltest ' + esc(T.roman) + ' · 모듈 선택</a></section></main></div>';
    app.innerHTML = h;
    var nm = $('#nm');
    nm.addEventListener('input', function () { lsSet('name', nm.value.trim()); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr0'); vr.value = Math.round(getVol() * 100);
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
      $('#probe').addEventListener('click', function () {
        var b = this;
        if (curSrc() !== T.audio[0].src) AUD.src = T.audio[0].src;
        else { try { AUD.currentTime = 0; } catch (e) { /* ignore */ } }
        AUD.volume = getVol();
        var p = AUD.play();
        b.disabled = true; b.textContent = 'Tonprobe läuft …';
        clearTimeout(probeTimer);
        probeTimer = setTimeout(function () {
          probeTimer = null;
          if (!timerId) { audioAllowPause = true; AUD.pause(); audioAllowPause = false; }
          b.disabled = false; b.textContent = 'Tonprobe abspielen';
        }, 6000);
        if (p && p.catch) p.catch(function () { b.disabled = false; b.textContent = 'Tonprobe abspielen'; toast('Audio konnte nicht abgespielt werden.', true); });
      });
    }
    if ($('#tour')) $('#tour').addEventListener('click', function () { begin(freshState(), true); });
    if ($('#go')) $('#go').addEventListener('click', function () { begin(freshState(), false); });
    if ($('#resume')) $('#resume').addEventListener('click', function () { begin(saved, false); });
    if ($('#restart')) $('#restart').addEventListener('click', function () {
      modal('Neu beginnen?', ['Ihre bisherigen Antworten in diesem Modul werden gelöscht.', '지금까지의 답이 지워집니다.'], [
        { label: 'Abbrechen' },
        { label: 'Neu beginnen', pri: true, fn: function () { lsDel(STATE_KEY); showStart(); } }
      ]);
    });
    if ($('#seeres')) $('#seeres').addEventListener('click', function () { showResult(res); });
    window.scrollTo(0, 0);
  }

  /* ---------- volume ---------- */
  function getVol() { var v = lsGet('vol'); return typeof v === 'number' ? v : 0.85; }
  function setVol(v) { v = Math.max(0, Math.min(1, v)); AUD.volume = v; lsSet('vol', v); }

  /* ---------- exam shell ---------- */
  function begin(state, withTour) {
    clearTimeout(probeTimer); probeTimer = null;
    if (R.mod === 'hoeren') { audioAllowPause = true; try { AUD.pause(); } catch (e) { /* ignore */ } audioAllowPause = false; }
    S = state;
    warned = {}; markMode = false;
    if (S.build !== D.build) { S.marks = {}; S.build = D.build; }
    if (typeof S.font !== 'number') S.font = 0;
    if (!(S.page >= 0 && S.page < M.pages.length)) S.page = 0;
    if (S.remaining < 60 * 10) warned[10] = true;
    if (S.remaining < 60 * 5) warned[5] = true;
    renderExam();
    if (withTour) runTour(function () { startClock(); });
    else startClock();
  }

  function renderExam() {
    var h = '<div class="exam" id="exam">' + topHTML(true);
    h += '<nav class="tabs" aria-label="Teile"><div class="tl" role="tablist" id="tabs"></div><div class="tr" id="tools"></div></nav>';
    if (R.mod === 'hoeren') {
      h += '<div class="abar" id="abar"><div class="st"><span class="dot"></span><span id="ast">Bereit</span></div><div class="pg"><i id="apg"></i></div><span class="tm" id="atm"></span></div>';
    }
    h += '<main class="main" id="main"></main>';
    h += '<footer class="foot"><div class="ovw" id="ov"><div class="lbl">Aufgabenübersicht<b id="ovc"></b></div><div class="chips" id="chips"></div>' +
      '<button class="btn sm ovbtn" id="ovbtn" type="button"></button></div>' +
      '<div class="nav" id="nav"><button class="btn" id="prev" type="button" aria-label="Zurück">' + ICON.prev + '<span class="tx">Zurück</span></button><button class="btn pri" id="next" type="button">Weiter' + ICON.next + '</button>' +
      '<button class="btn out" id="submit" type="button">Abgeben</button></div></footer></div>';
    app.innerHTML = h;
    applyFont();
    // tools
    var tools = '';
    if (R.mod === 'lesen') {
      tools = '<button class="tbtn" id="mk" type="button" aria-pressed="false" title="Textstellen markieren">' + ICON.marker + '<span class="tx">Markieren</span></button>' +
        '<button class="tbtn icon" id="mkx" type="button" title="Markierungen auf dieser Seite löschen" aria-label="Markierungen löschen">' + ICON.erase + '</button>';
    }
    $('#tools').innerHTML = tools;
    // events
    $$('#fz button').forEach(function (b) { b.addEventListener('click', function () { S.font = +b.getAttribute('data-fz'); lsSet('font', S.font); applyFont(); saveSoon(); }); });
    if (R.mod === 'hoeren') {
      var vr = $('#volr'); vr.value = Math.round(getVol() * 100); AUD.volume = getVol();
      vr.addEventListener('input', function () { setVol(vr.value / 100); });
    }
    $('#help').addEventListener('click', function () { if (!tourEls) runTour(null); });
    $('#prev').addEventListener('click', function () { go(S.page - 1); });
    $('#next').addEventListener('click', function () { go(S.page + 1); });
    $('#submit').addEventListener('click', askSubmit);
    $('#ovbtn').addEventListener('click', openOverview);
    if (R.mod === 'lesen') {
      $('#mk').addEventListener('click', function () { markMode = !markMode; this.setAttribute('aria-pressed', String(markMode)); var pl = $('#pbL'); if (pl) pl.classList.toggle('mk', markMode); });
      $('#mkx').addEventListener('click', function () {
        var pl = $('#pbL'); if (!pl) return;
        $$('mark.hl', pl).forEach(unwrap); pl.normalize(); delete S.marks[M.pages[S.page].key]; saveSoon();
      });
    }
    var main = $('#main');
    main.addEventListener('change', onAnswer);
    main.addEventListener('mouseup', onMarkUp);
    main.addEventListener('touchend', function (e) { setTimeout(function () { onMarkUp(e); }, 30); });
    main.addEventListener('click', onMarkClick);
    main.addEventListener('click', onGapClick);
    main.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('gapx')) { e.preventDefault(); onGapClick(e); } });
    renderPage();
  }

  function applyFont() {
    var root = document.documentElement;
    root.style.setProperty('--fs', FS[S ? S.font : 0] + 'px');
    $$('#fz button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-fz') === S.font)); });
  }

  function teilPages(teil) { var r = []; M.pages.forEach(function (p, i) { if (p.teil === teil) r.push(i); }); return r; }
  function maxReachable() {
    if (R.mod !== 'hoeren' || S.audio.done) return M.pages.length - 1;
    return S.audio.track;
  }

  function renderTabs() {
    var cur = M.pages[S.page].teil;
    var h = M.teile.map(function (teil) {
      var pidx = teilPages(teil)[0];
      var locked = pidx > maxReachable();
      var label, pr = '', done = false;
      if (M.writing) {
        var wc = wordCount(S.texts[teil]);
        label = M.labels[teil];
        pr = wc + ' Wörter';
        done = wc > 0;
      } else {
        var its = M.items.filter(function (it) { return it.teil === teil; });
        var ans = its.filter(function (it) { return S.answers[it.no] != null; }).length;
        label = M.labels[teil]; pr = ans + '/' + its.length; done = ans === its.length;
      }
      return '<button class="tab' + (done ? ' done' : '') + '" role="tab" type="button" data-teil="' + teil + '" aria-selected="' + (teil === cur) + '"' + (locked ? ' disabled' : '') + '>' +
        (locked ? '<span class="lock">' + ICON.lock + '</span>' : '') + esc(label) + ' <span class="pr">' + (done && !M.writing ? ICON.check + ' ' : '') + esc(pr) + '</span></button>';
    }).join('');
    var tabs = $('#tabs');
    tabs.innerHTML = h;
    $$('.tab', tabs).forEach(function (b) {
      b.addEventListener('click', function () {
        var teil = +b.getAttribute('data-teil');
        if (teil === M.pages[S.page].teil) return;
        go(teilPages(teil)[0]);
      });

  /* ---------- highlighting (Lesen) ---------- */

  function saveMarks() {
    var pl = $('#pbL'); if (!pl || !S) return;
    var key = M.pages[S.page].key;

  function onMarkUp() {
    if (!markMode || R.mod !== 'lesen') return;
    var pl = $('#pbL'); if (!pl) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    if (!pl.contains(range.commonAncestorContainer)) return;
    var rootNode = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentNode;
    var walker = document.createTreeWalker(rootNode, NodeFilter.SHOW_TEXT, null, false);
    var nodes = [], n;
    while ((n = walker.nextNode())) { if (range.intersectsNode(n)) nodes.push(n); }
    nodes.forEach(function (node) {
      if (node.parentNode && node.parentNode.closest && (node.parentNode.closest('mark.hl') || node.parentNode.closest('.inst') || node.parentNode.closest('.gapx'))) return;
      var start = node === range.startContainer ? range.startOffset : 0;
      var end = node === range.endContainer ? range.endOffset : node.nodeValue.length;
      if (end <= start) return;

  /* ---------- clock ---------- */

  function resultText(res) {
    var lines = ['telc Deutsch B1 · Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + ' (digital)', 'Name: ' + (res.name || '-'), 'Datum: ' + res.finished,
      'Bearbeitungszeit: ' + fmt(res.used) + (res.byTime ? ' (Zeit abgelaufen)' : '')];
    if (res.score) {
      var sc = res.score;
      lines.push('Ergebnis: ' + sc.correct + '/' + sc.total + ' richtig · ' + fp(sc.points) + ' von ' + sc.max + ' Punkten (' + sc.percent + ' %)');
      lines.push('Teile: ' + Object.keys(sc.per).map(function (k) { return M.labels[k] + ' ' + sc.per[k].c + '/' + sc.per[k].n + ' (' + fp(sc.per[k].p) + ' P.)'; }).join(' · '));
      var wrong = sc.rows.filter(function (r) { return !r.ok; });
      if (wrong.length) {
        lines.push('', 'Falsch / offen:');
        wrong.forEach(function (r) { lines.push('  ' + r.no + ': ' + (r.g == null ? 'offen' : r.g) + ' → Lösung ' + r.a); });
      }
    } else {
      var tx1 = res.texts[1] || '';
      if (tx1.trim()) lines.push('', '— E-Mail · ' + wordCount(tx1) + ' Wörter —', tx1.trim());
      else lines.push('', '(kein Text)');
    }
    return lines.join('\n');
  }
  function fp(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }
  function copyText(txt) {
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? '복사했습니다.' : '복사하지 못했습니다. 텍스트를 직접 선택해 복사하세요.', !ok);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { toast('복사했습니다.'); }, fallback);
    } else fallback();
  }
  function downloadText(txt, name) {
    try {
      var blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
    } catch (e) { toast('파일을 저장하지 못했습니다.', true); }
  }

  function showResult(res) {
    stopAll();
    var h = '<div class="page">' + topHTML(false).replace(/<div class="timer"[\s\S]*?<\/div><\/div>/, '') + '<main class="pgm"><section class="sheet" style="max-width:880px">' +
      '<p class="ey">Modelltest ' + esc(T.roman) + ' · Modul ' + MOD[R.mod].name + ' · Ergebnis</p>' +
      '<h1>' + (M.writing ? 'Ihr Text' : 'Ergebnis') + (res.name ? ' · ' + esc(res.name) : '') + '</h1>' +
      '<p class="sl">' + esc(res.finished) + ' · Bearbeitungszeit ' + fmt(res.used) + (res.byTime ? ' · Zeit abgelaufen' : '') + '</p>';
    var pdf = T.pdf, pg = T.pages || {};
    if (res.score) {
      var sc = res.score, ok = sc.percent >= 60;
      h += '<div class="score"><div class="bx"><small>Richtige Antworten</small><b>' + sc.correct + ' / ' + sc.total + '</b></div>' +
        '<div class="bx ' + (ok ? 'ok' : 'no') + '"><small>Punkte (von ' + sc.max + ')</small><b>' + fp(sc.points) + '</b></div>' +
        '<div class="bx ' + (ok ? 'ok' : 'no') + '"><small>Anteil · Richtwert 60 %</small><b>' + sc.percent + ' %</b></div></div>' +
        '<div class="tparts">' + Object.keys(sc.per).map(function (k) { return '<span>' + esc(M.labels[k]) + ' · ' + sc.per[k].c + '/' + sc.per[k].n + ' · ' + fp(sc.per[k].p) + ' / ' + fp(sc.per[k].max) + ' P.</span>'; }).join('') + '</div>' +
        '<p class="note" style="margin:0 0 12px">' + (R.mod === 'lesen' ? 'Leseverstehen 75 Punkte (Teil 1·2 je 5, Teil 3 je 2,5) + Sprachbausteine 30 Punkte (je 1,5) = 105 Punkte.' : 'Hörverstehen 75 Punkte (Teil 1·3 je 5, Teil 2 je 2,5).') +
        ' 실제 telc 시험에서는 필기 전체(225점)의 60 %(135점) 이상이 필요합니다. 60 %는 이 모듈만 볼 때의 참고 기준입니다.</p>';
      h += '<table class="rv"><thead><tr><th>Nr.</th><th>Aufgabe</th><th>Ihre Antwort</th><th>Lösung</th><th></th></tr></thead><tbody>';
      var lastT = 0;
      sc.rows.forEach(function (r) {
        var it = ITEM[r.no]; if (!it) return;
        if (r.teil !== lastT) { h += '<tr class="tp"><td colspan="5">' + esc(M.labels[r.teil]) + '</td></tr>'; lastT = r.teil; }
        h += '<tr class="' + (r.ok ? 'ok' : 'no') + '"><td class="n">' + esc(r.no) + '</td><td class="rvq">' + esc(itemPrompt(it)) + '</td><td class="g">' + esc(ansLabel(it, r.g)) + '</td><td>' + esc(ansLabel(it, r.a)) + '</td><td class="m">' + (r.ok ? '✓' : '✗') + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<div class="links">' +
        (pg.loesung ? '<a class="btn sm" href="' + pdf + '#page=' + pg.loesung + '" target="_blank" rel="noopener">Lösungsschlüssel (PDF S. ' + pg.loesung + ')</a>' : '') +
        (pg.kommentar ? '<a class="btn sm" href="' + pdf + '#page=' + pg.kommentar + '" target="_blank" rel="noopener">Kommentar für Lehrende (S. ' + pg.kommentar + ')</a>' : '') +
        (R.mod === 'hoeren' && pg.hoertexte ? '<a class="btn sm" href="' + pdf + '#page=' + pg.hoertexte + '" target="_blank" rel="noopener">Hörtexte (S. ' + pg.hoertexte + ')</a>' : '') + '</div>';
    } else {
      var tk = T.schreiben.task, tx = res.texts[1] || '', wc = wordCount(tx);
      h += '<div class="wtask"><h3>E-Mail beantworten<small>' + (tx.trim() ? wc + ' Wörter' : 'nicht bearbeitet') + '</small></h3>';
      if (tx.trim()) h += '<pre>' + esc(tx) + '</pre>';
      if (tk.model && tk.model.text) {
        var mps = tk.model.text.split('\n\n'), mk = tk.model.marks || [];
        h += '<details><summary>Musterlösung' + (tk.model.label ? ' · ' + esc(tk.model.label) : '') + '</summary><div class="mdl pp">' +
          mps.map(function (p, i) {
            return '<p' + (mk[i] ? '' : ' class="nolp"') + '>' + (mk[i] ? '<span class="lp" title="Leitpunkt ' + esc(mk[i]) + '">' + esc(mk[i]) + '</span>' : '') + esc(p).replace(/\n/g, '<br>') + '</p>';
          }).join('') + '</div>' +
          '<p class="note" style="margin:8px 0 0">Die Zahlen am Rand zeigen, welcher Leitpunkt in dem Absatz beantwortet wird. · 왼쪽 숫자는 그 문단이 답하는 Leitpunkt 번호입니다.</p>' +
          (tk.model.notes ? '<div class="mnotes">' + esc(tk.model.notes) + '</div>' : '') + '</details>';
      }
      h += '</div>';
      h += '<p class="note">Schriftlicher Ausdruck wird von Prüfenden bewertet (45 Punkte). Schicken Sie Ihren Text zur Korrektur an Ihre Lehrkraft. · 쓰기는 자동 채점되지 않습니다. 아래 버튼으로 선생님께 답안을 보내 첨삭을 받으세요.</p>';
      h += '<div class="links">' + (pg.muster ? '<a class="btn sm" href="' + pdf + '#page=' + pg.muster + '" target="_blank" rel="noopener">Musterlösung (PDF S. ' + pg.muster + ')</a>' : '') + '</div>';
    }
    h += '<div class="acts" style="margin-top:22px"><button class="btn pri" id="cp" type="button">' + (M.writing ? '답안 복사' : '결과 복사') + '</button>' +
      '<button class="btn" id="dl" type="button">txt로 저장</button><button class="btn" id="ml" type="button">메일로 보내기</button>' +
      '<button class="btn" id="again" type="button">다시 풀기</button><a class="btn" href="' + BACK + '">모듈 선택</a></div>' +
      '<a class="back" href="index.html#digital">← 디지털 시험 목록</a></section></main></div>';
    app.innerHTML = h;
    var txt = resultText(res);
    var fname = 'telc B1 Modelltest ' + T.roman + ' ' + MOD[R.mod].name + (res.name ? ' ' + res.name : '') + '.txt';
    $('#cp').addEventListener('click', function () { copyText(txt); });
    $('#dl').addEventListener('click', function () { downloadText(txt, fname.replace(/[\\/:*?"<>|_]+/g, ' ')); });
    $('#ml').addEventListener('click', function () {
      var subj = 'telc B1 Modelltest ' + T.roman + ' · ' + MOD[R.mod].name + (res.name ? ' · ' + res.name : '');
      location.href = 'mailto:' + encodeURIComponent(LEHRER_MAIL) + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(txt);
    });
    $('#again').addEventListener('click', function () {
      modal('Noch einmal?', ['Das Modul beginnt von vorn. Das letzte Ergebnis bleibt gespeichert, bis Sie das Modul erneut abgeben.', '처음부터 다시 풉니다. 다시 제출하기 전까지 지난 결과는 남아 있습니다.'], [
        { label: 'Abbrechen' }, { label: 'Neu beginnen', pri: true, fn: function () { lsDel(STATE_KEY); showStart(); } }
      ]);
    });
    window.scrollTo(0, 0);
  }

  /* ---------- overlays ---------- */
  function modal(title, lines, buttons, blocking) {
    var bg = document.createElement('div');
    bg.className = 'mbg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdt"><h3 id="mdt">' + esc(title) + '</h3>' +
      lines.map(function (l, i) { return '<p class="' + (i ? 'ko' : '') + '">' + esc(l) + '</p>'; }).join('') +
      '<div class="mb">' + buttons.map(function (b, i) { return '<button type="button" class="btn' + (b.pri ? ' pri' : '') + '" data-i="' + i + '">' + esc(b.label) + '</button>'; }).join('') + '</div></div>';
    document.body.appendChild(bg);
    function close() { if (bg.parentNode) bg.parentNode.removeChild(bg); document.removeEventListener('keydown', onKey); }
    close.el = bg;
    function onKey(e) { if (e.key === 'Escape' && !blocking) close(); }
    document.addEventListener('keydown', onKey);
    $$('button', bg).forEach(function (btn) {
      btn.addEventListener('click', function () { var b = buttons[+btn.getAttribute('data-i')]; close(); if (b.fn) b.fn(); });
    });
    if (!blocking) bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    var pri = $('.btn.pri', bg) || $('.btn', bg); if (pri) pri.focus();
    return close;
  }
  var toastTimer = null;
  function toast(msg, warn) {
    var t = $('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.classList.toggle('w', !!warn); t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 4200);
  }
  function openOverview() {
    if (M.writing) return;
    var reach = maxReachable();
    var h = '<div class="ovgrid">', last = 0;
    M.items.forEach(function (it) {
      if (it.teil !== last) { h += '<span class="tp">' + esc(M.labels[it.teil]) + '</span>'; last = it.teil; }
      var ans = S.answers[it.no] != null;
      h += '<button class="chip' + (ans ? ' ans' : '') + '" type="button" data-no="' + esc(it.no) + '"' + (it.page > reach ? ' disabled' : '') + '>' + esc(it.no) + '</button>';
    });
    h += '</div>';
    var close = modal('Aufgabenübersicht', [countOpen() + ' offene Aufgaben', '번호를 누르면 그 문항으로 이동합니다.'], [{ label: 'Schließen' }]);
    var md = $('.modal', close.el);
    md.insertAdjacentHTML('beforeend', h);
    $$('.ovgrid .chip', md).forEach(function (c) { c.addEventListener('click', function () { close(); jumpTo(c.getAttribute('data-no')); }); });
  }

  /* ---------- tutorial ---------- */
  var tourEls = null;
  function tourSteps() {
    var common = [
      ['#tm', timerId ? 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft weiter, während Sie das Tutorial ansehen.' : 'Hier sehen Sie die verbleibende Zeit. Die Zeit läuft erst, wenn Sie die Prüfung starten.',
        timerId ? '남은 시험 시간입니다. 튜토리얼을 보는 동안에도 시간은 흐릅니다.' : '남은 시험 시간입니다. 시험을 시작해야 시간이 흐릅니다.']
    ];
    if (R.mod === 'lesen') return common.concat([
      ['#tabs', 'Hier wechseln Sie zwischen den fünf Teilen: Lesen 1–3 und Sprachbausteine 1–2. Die Zahl zeigt, wie viele Aufgaben Sie im Teil schon gelöst haben.', '다섯 Teil(읽기 1–3, 어휘·문법 1–2) 사이를 이동합니다. 숫자는 그 Teil에서 푼 문항 수입니다.'],
      ['#paneL', 'Links steht der Text. In den Sprachbausteinen erscheint Ihre Antwort direkt in der Lücke.', '왼쪽에는 지문이 있습니다. 어휘·문법에서는 고른 답이 빈칸에 바로 들어갑니다.'],
      ['#paneR', 'Rechts stehen die Aufgaben. Wählen Sie die richtige Lösung aus. Sie können Ihre Antwort jederzeit ändern.', '오른쪽에는 문항이 있습니다. 정답을 고르세요. 답은 언제든 바꿀 수 있습니다.'],
      ['#mk', 'Mit „Markieren“ heben Sie wichtige Textstellen farbig hervor: einschalten, dann Text mit der Maus markieren. Ein Klick auf die Markierung löscht sie wieder.', '‘Markieren’을 켜고 지문을 드래그하면 형광펜이 칠해집니다. 칠한 곳을 누르면 지워집니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'In der Aufgabenübersicht sehen Sie, welche Aufgaben schon beantwortet (blau) und welche noch offen sind. Mit einem Klick springen Sie direkt zur Aufgabe.', '문항 번호표에서 푼 문항(파랑)과 남은 문항을 확인하고, 번호를 눌러 바로 이동합니다.'],
      ['#nav', 'Mit „Weiter“ und „Zurück“ blättern Sie. Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '‘Weiter’와 ‘Zurück’으로 넘기고, 다 풀면 ‘Abgeben’을 누릅니다.']
    ]);
    if (R.mod === 'hoeren') return common.concat([
      ['#vol', 'Hier stellen Sie die Lautstärke ein.', '음량을 조절합니다.'],
      ['#abar', 'Hier sehen Sie, welcher Hörtext gerade läuft. Die Hörtexte starten automatisch; die Wiederholung (Teil 2 und 3) steht schon in der Aufnahme. Sie können nicht anhalten oder zurückspulen.', '지금 재생 중인 음원이 표시됩니다. 음원은 자동으로 시작되고, Teil 2·3은 다시 들려주는 부분도 음원에 들어 있습니다. 멈추거나 되감을 수 없습니다.'],
      ['#tabs', 'Mit dem Hörtext wechselt auch der Teil. Spätere Teile sind gesperrt, frühere Teile können Sie wieder öffnen.', '음원에 맞춰 Teil이 바뀝니다. 다음 Teil은 잠겨 있고, 지나간 Teil은 다시 열 수 있습니다.'],
      ['#paneR', 'Lesen Sie die Aussagen und wählen Sie „Richtig“ oder „Falsch“.', '문장을 읽고 ‘Richtig’ 또는 ‘Falsch’를 고르세요.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#ov', 'Die Aufgabenübersicht zeigt, welche Aufgaben noch offen sind.', '문항 번호표에서 남은 문항을 확인합니다.'],
      ['#nav', 'Nach dem letzten Hörtext können Sie Ihre Antworten noch prüfen und dann auf „Abgeben“ klicken.', '마지막 음원이 끝난 뒤 답을 확인하고 ‘Abgeben’을 누릅니다.']
    ]);
    return common.concat([
      ['#tabs', 'Hier sehen Sie den Teil und die Zahl Ihrer Wörter.', '지금 Teil과 단어 수가 표시됩니다.'],
      ['.pane.l', 'Hier stehen die E-Mail, auf die Sie antworten, und die vier Leitpunkte.', '여기에 답할 이메일과 네 가지 Leitpunkte가 있습니다.'],
      ['#ed', 'Schreiben Sie Ihren Text in dieses Feld.', '이 입력란에 글을 씁니다.'],
      ['#wc', 'Die Wörter werden automatisch gezählt. Das ist nur eine Orientierung; die Aufgabe nennt keine Mindestzahl.', '단어 수가 자동으로 계산됩니다. 참고용이며 과제에 단어 수 기준은 없습니다.'],
      ['#sz', 'Mit diesen Tasten fügen Sie ä, ö, ü und ß ein.', '이 버튼으로 ä, ö, ü, ß를 넣습니다.'],
      ['#fz', 'Hier ändern Sie die Schriftgröße.', '글자 크기를 바꿉니다.'],
      ['#nav', 'Wenn Sie fertig sind, klicken Sie auf „Abgeben“.', '다 쓰면 ‘Abgeben’을 누릅니다.']
    ]);
  }
  function runTour(done) {
    var steps = tourSteps().filter(function (s) { return $(s[0]); });
    if ($('#help') && $('#help').offsetParent !== null) {
      steps.splice(steps.length - 1, 0, ['#help', 'Mit „?“ können Sie dieses Tutorial während der Prüfung noch einmal ansehen.', '‘?’를 누르면 시험 중에도 이 튜토리얼을 다시 볼 수 있습니다.']);
    }
    var i = 0;
    var block = document.createElement('div'); block.className = 'tipblock';
    var hole = document.createElement('div'); hole.className = 'hole';
    var tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
    document.body.appendChild(block); document.body.appendChild(hole); document.body.appendChild(tip);
    tourEls = [block, hole, tip];
    function place() {
      var el = $(steps[i][0]); if (!el) return;
      try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* ignore */ }
      var r = el.getBoundingClientRect(), pad = 5;
      var vw = window.innerWidth, vh = window.innerHeight;
      var top = Math.max(4, r.top - pad), left = Math.max(4, r.left - pad);
      var w = Math.min(vw - 8, r.width + pad * 2), hh = Math.min(vh - 8, r.height + pad * 2);
      hole.style.top = top + 'px'; hole.style.left = left + 'px'; hole.style.width = w + 'px'; hole.style.height = hh + 'px';
      tip.innerHTML = '<div class="stp">Tutorial · Schritt ' + (i + 1) + ' von ' + steps.length + '</div><p>' + esc(steps[i][1]) + '</p><p class="ko">' + esc(steps[i][2]) + '</p>' +
        '<div class="tb"><button class="btn sm" type="button" id="tskip">Tutorial beenden</button><span style="display:flex;gap:6px">' +
        (i > 0 ? '<button class="btn sm" type="button" id="tprev">Zurück</button>' : '') +
        '<button class="btn sm pri" type="button" id="tnext">' + (i < steps.length - 1 ? 'Weiter' : 'Fertig') + '</button></span></div>';
      var tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14, tx, ty;
      var clampX = function (x) { return Math.min(Math.max(8, x), vw - tw - 8); };
      var clampY = function (y) { return Math.min(Math.max(8, y), vh - th - 8); };
      if (top + hh + gap + th <= vh - 8) { ty = top + hh + gap; tx = clampX(left); }            // below
      else if (top - gap - th >= 8) { ty = top - gap - th; tx = clampX(left); }                // above
      else if (left - gap - tw >= 8) { tx = left - gap - tw; ty = clampY(top + hh / 2 - th / 2); }   // left
      else if (left + w + gap + tw <= vw - 8) { tx = left + w + gap; ty = clampY(top + hh / 2 - th / 2); } // right
      else { tx = clampX(left + w / 2 - tw / 2); ty = clampY(top + hh - th - 16); }              // inside, bottom
      tip.style.top = ty + 'px'; tip.style.left = tx + 'px';
      $('#tnext').addEventListener('click', function () { if (i < steps.length - 1) { i++; place(); } else end(); });
      if ($('#tprev')) $('#tprev').addEventListener('click', function () { i--; place(); });
      $('#tskip').addEventListener('click', end);
      $('#tnext').focus();
    }
    function end() {
      closeTour();
      window.removeEventListener('resize', place);
      if (!done) return;
      modal('Prüfung starten', ['Das Tutorial ist beendet. Wenn Sie auf „Prüfung starten“ klicken, beginnt die Prüfungszeit' + (R.mod === 'hoeren' ? ' und der erste Hörtext wird abgespielt.' : '.'),
        '‘Prüfung starten’을 누르면 시험 시간이 시작됩니다' + (R.mod === 'hoeren' ? '. 첫 음원도 바로 재생됩니다.' : '.')], [
        { label: 'Prüfung starten', pri: true, fn: done }
      ], true);
    }
    window.addEventListener('resize', place);
    place();
  }
  function closeTour() { if (tourEls) { tourEls.forEach(function (e) { if (e.parentNode) e.parentNode.removeChild(e); }); tourEls = null; } }

  /* ---------- go ---------- */
  if (R.view === 'ergebnis') {
    var rr = lsGet(RESULT_KEY);
    if (rr) { showResult(rr); return; }
  }
  showStart();
  window.__exam = {
    model: M, data: T,
    state: function () { return S; },
    seekEnd: function (left) { var t = Math.max(0, (AUD.duration || 0) - (left || 1)); audioLastPos = t; AUD.currentTime = t; }
  };
})();
</script>
