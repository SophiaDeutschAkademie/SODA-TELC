})();
</script>

:root{
  --bg:#e7eaee;--panel:#fff;--bar:#f5f6f8;--line:#cbd2da;--line-2:#e2e6eb;
  --ink:#1b2430;--ink-2:#434f5e;--muted:#68727f;
  --acc:#1f5a9e;--acc-2:#17457a;--acc-w:#e6eef8;--acc-line:#9db9dc;
  --warn:#a8322a;--warn-w:#fbecea;--mark:#ffe680;
  --fs:16px;
  --font:"Pretendard SODA",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:14px;height:58px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:5}
.top .logo{width:22px;height:auto;display:block;flex:none}
.top .id{display:flex;flex-direction:column;min-width:0;line-height:1.25;padding-left:12px;border-left:1px solid var(--line-2)}
.top .id b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id > span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tool{display:flex;align-items:center;gap:6px}
.hlp{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;font-weight:700;font-size:16px;color:var(--ink-2);padding:0}
.hlp:hover{background:var(--acc-w)}
.fz{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.fz button{border:0;background:none;width:34px;height:32px;padding:0;font-weight:700;color:var(--ink-2)}
.fz button+button{border-left:1px solid var(--line-2)}
.fz button[aria-pressed="true"]{background:var(--acc-w);color:var(--acc-2)}
.fz .s1{font-size:12px}.fz .s2{font-size:14px}.fz .s3{font-size:17px}
.vol{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:34px;background:#fff;color:var(--ink-2)}
.vol input{width:96px;accent-color:var(--acc)}
.timer{display:flex;align-items:center;gap:9px;height:42px;padding:0 12px 0 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.timer svg{flex:none;color:var(--ink-2)}
.timer .tl{display:flex;flex-direction:column;line-height:1.1}
.timer .tl small{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
.timer .tl b{font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.timer.low{border-color:var(--warn);background:var(--warn-w)}
.timer.low b,.timer.low svg{color:var(--warn)}

/* ---------- part tabs ---------- */
.tabs{display:flex;align-items:stretch;gap:0;background:var(--bar);border-bottom:1px solid var(--line);flex:none;padding:0 10px;min-height:46px}
.tabs .tl{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs .tl::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;border:0;border-top:3px solid transparent;background:none;padding:0 16px;font-weight:700;color:var(--ink-2);white-space:nowrap;position:relative}
.tab .pr{font-weight:400;font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line-2);border-radius:10px;padding:0 7px;line-height:18px}
.tab.done .pr{background:var(--acc-w);border-color:var(--acc-line);color:var(--acc-2)}
.tab[aria-selected="true"]{background:#fff;border-top-color:var(--acc);color:var(--ink);box-shadow:1px 0 0 var(--line),-1px 0 0 var(--line)}
.tab:disabled{cursor:not-allowed;color:#9aa3ad}
.tab:disabled .pr{opacity:.6}
.tab .lock{display:inline-flex;color:#9aa3ad}
.tabs .tr{display:flex;align-items:center;gap:8px;padding-left:10px}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.tbtn[aria-pressed="true"]{background:#fff6c7;border-color:#d9bf44;color:#5c4a00}
.tbtn.icon{padding:0 9px}

/* ---------- audio bar ---------- */
.abar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex:none}
.abar .st{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.abar .st .dot{width:10px;height:10px;border-radius:50%;background:#9aa3ad;flex:none}
.abar.on .st .dot{background:var(--acc);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.abar .pg{flex:1;height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;min-width:60px}
.abar .pg i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s linear}
.abar .tm{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- main panes ---------- */
.exam{display:flex;flex-direction:column;height:100vh;height:100dvh}
.main{flex:1;min-height:0;display:flex;gap:12px;padding:12px}
.pane{flex:1 1 0;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pane.l{flex-basis:54%}.pane.r{flex-basis:46%}
.pane.one{max-width:980px;margin:0 auto;width:100%}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 18px;border-bottom:1px solid var(--line-2);background:#fafbfc;flex:none}
.ph h2{font-size:14px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.ph .sub{display:flex;gap:4px}
.ph .sub button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:3px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.ph .sub button[aria-current="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.pb{flex:1;overflow:auto;padding:20px 24px 48px;font-size:var(--fs);line-height:1.62;-webkit-overflow-scrolling:touch}
.pb.mk{cursor:text}
.pb.mk ::selection{background:var(--mark)}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.pb.mk mark.hl{cursor:pointer}
.inst{color:var(--ink-2);font-weight:500;margin-bottom:16px}
.inst+.inst{margin-top:-8px}
.ctx{margin-bottom:16px;padding:12px 14px;background:#f6f8f9;border-left:3px solid var(--line);border-radius:0 4px 4px 0}
.h1t{font-size:calc(var(--fs)*1.15);font-weight:700;margin-bottom:10px}

/* texts */
.card{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
.blog .bh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.86em;color:var(--muted);border-bottom:1px solid var(--line-2);padding-bottom:8px;margin-bottom:12px}
.blog .bh b{color:var(--ink-2)}
.blog h3,.art h3{font-size:1.3em;line-height:1.25;margin-bottom:10px}
.blog p,.art p,.doc p{margin:0 0 .75em}
.blog .cl{margin-top:.6em}
.art .lead{font-weight:600;color:var(--ink-2);margin-bottom:12px}
.art .src{text-align:right;font-size:.85em;color:var(--muted);margin-top:8px}
.art .fn{font-size:.85em;color:var(--muted);margin-top:8px}
/* ---------- Anzeigen (Lesen Teil 3): jede Anzeige mit eigenem Layout ---------- */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:20px 18px;align-items:start;
  --ad-sans:var(--font);--ad-serif:var(--font);--ad-hand:var(--font);--ad-cond:var(--font);
  --ad-mono:var(--font)}
.adw{min-width:0}
.adl{display:flex;align-items:flex-end;gap:8px;font-weight:800;font-size:1.05em;line-height:1;margin:0 0 7px;color:var(--ink)}
.adl::after{content:"";flex:1;border-bottom:1px solid #8a9099;margin-bottom:2px}
.ad{position:relative;font-family:var(--ad-sans);font-size:.92em;line-height:1.5;color:#1c1c1c;background:#fff;overflow-wrap:break-word}
.ad p{margin:0 0 .55em}
.ad h4{margin:0 0 .35em;font-size:1.08em;line-height:1.25}
.ad .af{margin:.9em 0 0;font-size:.86em}
.ad .tg{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:#555}
.ad .ti{font-weight:700}
.ad ul.fx{list-style:none;padding:0;margin:.3em 0 .7em}
.ad ul.fx li{font-weight:700}
.ad .ft{width:100%;border-collapse:collapse;margin:.3em 0 .9em;font-size:.95em}
.ad .ft td{padding:.28em 0;border-bottom:1px dotted #8c8c8c;vertical-align:top}
.ad .ft td+td{text-align:right;font-weight:700;padding-left:10px}
.ad svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ad .lead{font-weight:700}
.ad .nw{white-space:nowrap}
/* inst */
.d-inst{border:1px solid #2b2b2b;padding:16px 18px}
.d-inst .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1.5px solid #222;padding-bottom:7px;margin-bottom:14px}
.d-inst .ah b{font-size:1.06em}
.d-inst .af{font-weight:700}
/* serif */
.d-serif{background:#f3f2ee;border:1px solid #b9b6ad;padding:18px 20px 14px;font-family:var(--ad-serif)}
.d-serif h4{text-align:center;font-size:1.42em;font-weight:300;letter-spacing:-.02em}
.d-serif .su{font-weight:600;text-align:center;border-bottom:1px solid #444;padding-bottom:8px;margin:8px 0 14px}
.d-serif .af{font-family:var(--ad-sans);font-size:.8em;color:#3a3a3a}
/* dashed */
.d-dashed{border:1.5px dashed #444;padding:16px 18px 0}
.d-dashed .hd b{display:block;font-size:1.08em}
.d-dashed .hd span{display:block;font-size:.72em;letter-spacing:.13em;text-transform:uppercase;color:#3d3d3d;margin:2px 0 12px}
.d-dashed .strip{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1.5px dashed #444;margin:14px -18px 0;padding:8px 18px;font-size:.86em}
/* barhead */
.d-barhead{border:1.5px solid #1c1c1c}
.d-barhead .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1c1c1c;color:#fff;padding:9px 14px}
.d-barhead .bar b{letter-spacing:.03em}
.d-barhead .bar svg{width:22px;height:22px;flex:none}
.d-barhead .in{padding:14px 16px 12px}
/* rules */
.d-rules{border-top:3px solid #111;border-bottom:3px solid #111;padding:16px 6px 12px;font-family:var(--ad-serif)}
.d-rules h4{font-weight:800;font-size:1.5em;letter-spacing:-.02em;text-align:center;margin:0}
.d-rules .su{text-align:center;font-family:var(--ad-sans);font-size:.72em;letter-spacing:.17em;text-transform:uppercase;margin:6px 0 14px}
.d-rules .af{text-align:center;border-top:1px solid #111;padding-top:8px;margin:14px 18px 0;font-family:var(--ad-sans);font-size:.8em}
/* inverse */
.d-inverse{background:#161c24;color:#eef1f4;padding:18px 18px 16px}
.d-inverse h4{font-size:1.24em;letter-spacing:.07em;text-transform:uppercase;margin:0}
.d-inverse .su{font-size:.72em;letter-spacing:.19em;text-transform:uppercase;color:#b9c2cc;border-bottom:1px solid #6d7782;padding-bottom:9px;margin:5px 0 14px}
.d-inverse .tg{color:#b9c2cc}
.d-inverse .af{font-weight:700}
/* classified */
.d-classified{border-top:2.5px solid #111;border-bottom:1px solid #8a8a8a;padding:9px 2px 10px}
.d-classified .ah{display:flex;justify-content:space-between;gap:10px;font-size:.76em;font-weight:700;letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:7px;margin-bottom:12px}
.d-classified .ah span{font-weight:400}
.d-classified p:not(.af){text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.d-classified .lead{font-family:var(--ad-sans)}
.d-classified .af{font-size:.78em}
/* mono */
.d-mono{border:1px solid #333;padding:14px 16px}
.d-mono .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #333;padding-bottom:7px;margin-bottom:11px}
.d-mono .mh b{font-size:1.06em}
.d-mono .mh svg{width:22px;height:22px;flex:none}
.d-mono .ft,.d-mono p.mt{font-variant-numeric:tabular-nums}
.d-mono p.mt{font-size:.94em;line-height:1.6;color:#2a2a2a;letter-spacing:.01em}
.d-mono .af{font-weight:700}
/* tearoff */
.d-tearoff{border:1px solid #333}
.d-tearoff .in{padding:16px 16px 12px}
.d-tearoff .hd{font-weight:700;font-size:.82em;letter-spacing:.06em;margin-bottom:4px}
.d-tearoff h4{font-weight:900;letter-spacing:-.02em;font-size:1.42em;line-height:1.08;text-transform:uppercase;margin-bottom:.5em}
.d-tearoff .af{font-weight:700}
.d-tearoff .tear{display:flex;border-top:1.5px dashed #444}
.d-tearoff .tear i{flex:1;display:flex;align-items:center;justify-content:center;min-height:92px;border-left:1.5px dashed #444;font-style:normal}
.d-tearoff .tear i:first-child{border-left:0}
.d-tearoff .tear span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.66em;font-weight:700;white-space:nowrap;letter-spacing:.02em}
/* chalk */
.d-chalk{background:#6f5d48;padding:9px;border-radius:4px}
.d-chalk .bd{background:#2c3833;color:#f3f3ee;padding:18px 16px 14px;text-align:center;font-weight:300;line-height:1.55;border-radius:2px;box-shadow:inset 0 0 34px rgba(0,0,0,.4)}
.d-chalk .hd{font-size:.86em;opacity:.85;margin-bottom:2px}
.d-chalk h4{font-size:1.5em;font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.15}
.d-chalk .su{text-decoration:underline wavy rgba(243,243,238,.75);text-underline-offset:7px;margin:2px 0 16px}
.d-chalk p{line-height:1.55}
.d-chalk .af{opacity:.9}
/* corp */
.d-corp{border:1px solid #333;padding:12px 16px}
.d-corp .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid #333;padding-bottom:7px;margin-bottom:11px}
.d-corp .wm{font-size:1.08em;font-weight:400;letter-spacing:-.01em}
.d-corp .wm b{font-weight:800}
.d-corp .wm small{font-size:.66em}
.d-corp .af{font-weight:700;border-top:1px solid #9a9a9a;padding-top:7px}
/* hotel */
.d-hotel{border:3px double #333;padding:5px}
.d-hotel .fr{border:1px solid #333;padding:14px 16px 12px;text-align:center;font-family:var(--ad-serif)}
.d-hotel .st{letter-spacing:.32em;font-size:.82em;margin-bottom:2px}
.d-hotel .hic{display:block;width:30px;height:30px;margin:0 auto 6px}
.d-hotel h4{font-weight:300;letter-spacing:.16em;text-transform:uppercase;font-size:1.12em;margin:0}
.d-hotel .ti{margin:4px 0 10px}
.d-hotel .fr>p:not(.st):not(.ti):not(.af){margin-top:10px}
.d-hotel .af{font-family:var(--ad-sans);font-size:.78em;letter-spacing:.06em}
/* band */
.d-band{border:1px solid #333}
.d-band .bn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#dcdcdc;border-bottom:1px solid #333;padding:9px 14px}
.d-band .bn b{font-size:1.42em;font-weight:800;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.d-band .bn span{font-size:.76em;font-weight:700;text-align:right;line-height:1.25;max-width:46%}
.d-band .in{padding:12px 14px}
/* stamp */
.d-stamp{border:1px solid #333;padding:16px 16px 12px}
.d-stamp .sb{float:right;margin:-4px -4px 8px 12px;width:68px;height:68px;border-radius:50%;background:#1d2a44;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:.66em;line-height:1.15;letter-spacing:.03em;text-transform:uppercase;transform:rotate(-12deg);padding:4px}
.d-stamp h4{font-size:1.32em}
.d-stamp .su{font-weight:700}
.d-stamp .bf{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px;border-top:2px solid #111;margin-top:12px;padding-top:8px}
.d-stamp .bf b{text-transform:uppercase;font-weight:800;font-size:.9em}
.d-stamp .bf span{font-size:.8em;text-align:right}
/* logo */
.d-logo{border:1px solid #333;padding:14px 16px 12px}
.d-logo .lg{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.d-logo .cir{width:44px;height:44px;border:1.5px solid #222;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:1.35em;flex:none}
.d-logo .cir svg{width:24px;height:24px}
.d-logo .nm b{display:block;font-weight:400;letter-spacing:.2em;text-transform:uppercase;font-size:1.08em;line-height:1.25}
.d-logo .nm small{display:block;font-size:.66em;letter-spacing:.22em;text-transform:uppercase;color:#555}
.d-logo .af{text-align:right}
/* browser */
.d-browser{border:1px solid #333;border-radius:6px;overflow:hidden}
.d-browser .bb{display:flex;align-items:center;gap:5px;background:#eceff2;border-bottom:1px solid #c5cbd2;padding:6px 10px}
.d-browser .bb i{width:9px;height:9px;border-radius:50%;border:1.3px solid #555;flex:none}
.d-browser .url{flex:1;min-width:0;margin-left:8px;background:#fff;border:1px solid #c5cbd2;border-radius:10px;font-size:.72em;padding:1px 10px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-browser .in{padding:12px 14px}
.d-browser .hd{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:#555;margin-bottom:2px}
.d-browser .cta{text-align:right;margin-top:10px}
.d-browser .cta span{display:inline-block;background:#1b2430;color:#fff;font-weight:700;font-size:.82em;padding:5px 14px;border-radius:4px}
/* stripes */
.d-stripes{border:1px solid #222}
.d-stripes .sx{height:13px;background:repeating-linear-gradient(-45deg,#1d1d1d 0 8px,#fff 8px 16px)}
.d-stripes .in{padding:12px 14px 10px}
.d-stripes .hd{font-weight:700;font-size:.82em;margin-bottom:2px}
.d-stripes h4{font-size:1.24em;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
/* ticket */
.d-ticket{display:grid;grid-template-columns:40px minmax(0,1fr);border:1px solid #333}
.d-ticket::before,.d-ticket::after{content:"";position:absolute;left:31px;width:17px;height:17px;border-radius:50%;background:#fff;border:1px solid #333}
.d-ticket::before{top:-9px}.d-ticket::after{bottom:-9px}
.d-ticket .stub{background:#ececec;border-right:2px dashed #777;display:flex;align-items:center;justify-content:center}
.d-ticket .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:.64em;letter-spacing:.22em;font-weight:700;white-space:nowrap}
.d-ticket .in{padding:14px 14px 12px}
.d-ticket h4{font-size:1.38em;letter-spacing:.2em;font-weight:800;margin:0}
.d-ticket .su{font-size:.66em;letter-spacing:.32em;text-transform:uppercase;color:#555;margin:0 0 12px}
.d-ticket .af{font-weight:700}
/* postcard */
.d-postcard{border:1px solid #333;padding:14px}
.d-postcard .pc{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:12px}
.d-postcard h4{font-weight:300;font-size:1.6em;line-height:1.15;letter-spacing:-.02em;margin-bottom:12px}
.d-postcard .side{border-left:1px solid #555;padding-left:12px;display:flex;flex-direction:column;gap:12px}
.d-postcard .stp{border:1.5px dashed #444;text-align:center;padding:8px 4px;font-weight:800;line-height:1.1}
.d-postcard .stp small{display:block;font-size:.6em;letter-spacing:.06em;text-transform:uppercase}
.d-postcard .stp b{display:block;font-size:1.12em;margin:2px 0}
.d-postcard .side i{display:block;border-bottom:1px solid #777;height:16px}
.d-postcard .af{font-weight:700}
/* badge */
.d-badge{border:1px solid #333}
.d-badge .bt{display:flex;justify-content:space-between;align-items:stretch;border-bottom:1px solid #333}
.d-badge .bt>div:first-child{padding:10px 14px;min-width:0}
.d-badge .hd{font-size:.68em;letter-spacing:.14em;text-transform:uppercase;color:#444;margin-bottom:2px}
.d-badge .bt h4{font-size:1.12em;margin:0}
.d-badge .pbx{background:#151515;color:#fff;text-align:center;padding:8px 12px;display:flex;flex-direction:column;justify-content:center;min-width:78px;line-height:1.1}
.d-badge .pbx b{font-size:1.22em;margin:2px 0}
.d-badge .pbx small{font-size:.62em}
.d-badge .in{padding:12px 14px}
.d-badge ul.sq{list-style:none;padding:0;margin:12px 0 0}
.d-badge ul.sq li{position:relative;padding-left:16px;font-size:.92em}
.d-badge ul.sq li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;background:#222}
/* timetable */
.d-timetable{border:1px solid #333}
.d-timetable .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1c1c1c;color:#fff;padding:9px 14px}
.d-timetable .bar span{font-size:.74em;letter-spacing:.12em;white-space:nowrap}
.d-timetable .in{padding:12px 14px}
.d-timetable .tt{border-top:1.5px dashed #555;margin-top:12px;padding-top:8px;font-size:.84em;line-height:1.7;color:#2a2a2a;font-variant-numeric:tabular-nums}
.d-timetable .pr{text-align:right;font-weight:800;margin:12px 0 0}
/* bignum */
.d-bignum{border:1px solid #333;padding:14px 16px}
.d-bignum h4{font-weight:300;font-size:1.32em;letter-spacing:-.01em;text-align:right;margin-bottom:12px}
.d-bignum .bn2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.d-bignum .num{text-align:center;padding-right:14px;border-right:1.5px solid #222}
.d-bignum .num b{display:block;font-size:3.2em;line-height:1;font-weight:800;letter-spacing:-.04em}
.d-bignum .num small{display:block;letter-spacing:.2em;font-size:.7em;font-weight:700;margin-top:4px}
.d-bignum .af{font-weight:700}
/* route */
.d-route{border:1px solid #333;padding:14px 16px}
.d-route .ah{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.d-route .ah b{font-size:1.08em}
.d-route .rt{display:flex;justify-content:space-between;position:relative;margin:14px 0 16px}
.d-route .rt::before{content:"";position:absolute;left:6px;right:6px;top:6px;border-top:1.5px solid #222}
.d-route .rt span{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72em;text-align:center;min-width:0}
.d-route .rt span:first-child{align-items:flex-start;text-align:left}
.d-route .rt span:last-child{align-items:flex-end;text-align:right}
.d-route .rt i{width:13px;height:13px;border-radius:50%;border:1.5px solid #222;background:#fff}
.d-route .af{font-weight:700}
/* pinned */
.d-pinned{padding:12px 6px 6px;background:transparent}
.d-pinned .pn{position:relative;background:#fbfaf6;border:1px solid #cfcac0;box-shadow:2px 5px 12px rgba(0,0,0,.18);padding:22px 16px 14px;transform:rotate(-1.2deg)}
.d-pinned .pin{position:absolute;top:-8px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#22324d;box-shadow:0 2px 3px rgba(0,0,0,.35)}
.d-pinned h4{text-align:center;font-size:1.06em;margin-bottom:.3em}
.d-pinned .ti{text-align:center;margin-bottom:.8em}
.d-pinned .af{text-align:center}
/* rounded */
.d-rounded{border:3px solid #1d1d1d;border-radius:16px;padding:16px;text-align:center}
.d-rounded .ric{display:block;width:30px;height:30px;margin:0 auto 6px}
.d-rounded h4{font-size:1.3em;letter-spacing:.22em;text-transform:uppercase;font-weight:800;margin:0}
.d-rounded .su{font-size:.7em;letter-spacing:.22em;text-transform:uppercase;margin:3px 0 13px}
.d-rounded .af{font-weight:700}
/* dropcap */
.d-dropcap{border-top:2px solid #111;border-bottom:1px solid #111;padding:9px 2px 10px}
.d-dropcap .ah{display:flex;justify-content:space-between;gap:10px;font-family:var(--ad-sans);font-size:.72em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding-bottom:8px;margin-bottom:12px}
.d-dropcap .ah span{font-weight:400}
.d-dropcap .dc{text-align:justify;-webkit-hyphens:auto;hyphens:auto}
.d-dropcap .dc::first-letter{float:left;font-size:3.3em;line-height:.85;font-weight:700;margin:5px 8px 0 0}
.d-dropcap .af{font-family:var(--ad-sans);font-size:.78em;clear:both}
/* coupon */
.d-coupon{border:1.5px dashed #444;padding:16px}
.d-coupon .sc{position:absolute;top:-12px;right:14px;width:22px;height:22px;background:#fff;padding:1px}
.d-coupon .su{font-size:.7em;letter-spacing:.12em;text-transform:uppercase;margin:2px 0 12px}
.d-coupon .cf{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84em;margin-top:12px}
/* greyband */
.d-greyband{border:1px solid #333}
.d-greyband .gb{background:#e1e1e1;border-bottom:1px solid #333;padding:8px 14px;font-size:1.1em}
.d-greyband .in{padding:12px 14px}
.d-greyband .af{font-weight:700}
/* club */
.d-club{border:1.5px solid #2c5e3f}
.d-club .cb{background:#2c5e3f;color:#fff;padding:12px 16px;font-weight:800;letter-spacing:-.01em;font-size:1.2em;border-bottom:5px solid #fff;box-shadow:0 5px 0 #2c5e3f}
.d-club .in{padding:16px 16px 12px}
.d-club h4{color:#1f4a31}
/* speech */
.d-speech{border:1px solid #333;padding:14px 16px}
.d-speech .hd{font-weight:700;font-size:.84em;letter-spacing:.04em;margin-bottom:9px}
.d-speech .bub{position:relative;display:inline-block;background:#e6eef8;border:1.5px solid #2b4f7d;border-radius:16px;padding:8px 14px;font-weight:800;font-size:1.06em;margin-bottom:18px}
.d-speech .bub::after{content:"";position:absolute;left:22px;bottom:-8px;width:13px;height:13px;background:#e6eef8;border-right:1.5px solid #2b4f7d;border-bottom:1.5px solid #2b4f7d;transform:rotate(45deg)}
/* notebook */
.d-notebook{border:1px solid #9fb4c6;padding:12px 14px 12px 38px;line-height:1.65em;background:#fff repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.65em - 1px),#d3e2ef calc(1.65em - 1px),#d3e2ef 1.65em);background-position:0 12px}
.d-notebook::before{content:"";position:absolute;left:26px;top:0;bottom:0;border-left:1.5px solid #9fb4c6}
.d-notebook h4{font-weight:700;font-size:1.2em;line-height:1.375em;margin:0}
.d-notebook p{margin:0 0 1.65em}
.d-notebook .ti{margin:0}
.d-notebook .af{font-size:1em;margin:0;font-weight:700}
/* sign */
.d-sign{border:1px solid #333}
.d-sign .sg{background:#1f2d4a;color:#fff;margin:8px;border-radius:8px;outline:2px solid #fff;outline-offset:-6px;padding:14px 16px;text-align:center}
.d-sign .sic{display:block;width:26px;height:26px;margin:0 auto 4px}
.d-sign h4{font-size:1.16em;letter-spacing:.08em;text-transform:uppercase;margin:0}
.d-sign .su{font-size:.68em;letter-spacing:.2em;text-transform:uppercase;opacity:.88;margin:3px 0 0}
.d-sign .in{padding:6px 16px 14px}
.d-sign .af{font-weight:700}
.cmh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:700;letter-spacing:.06em;font-size:.86em;color:var(--ink-2);border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px}
.cmh span{letter-spacing:0;font-weight:400;color:var(--muted)}
.cm{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.cm .n{font-weight:700;color:var(--ink-2);font-size:.95em;padding-top:1px}
.cm .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cm p{margin:0}
.cm .by{text-align:right;color:var(--muted);font-size:.9em;margin-top:4px}
.doc h3{text-align:center;font-size:1em;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.doc .dh{font-weight:700}

/* items */
.q{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.q:last-child{border-bottom:0}
.q .qn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em;background:#fff;color:var(--ink-2)}
.q.ans .qn{background:var(--acc);border-color:var(--acc);color:#fff}
.q.ex{background:#f7f8f9;margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px;border-bottom:0;margin-bottom:6px}
.q.ex .qn{font-size:.72em;border-style:dashed}
.q .bsp{display:block;font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.q .qt{margin:3px 0 8px}
.q.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:#fff6c7}100%{background:transparent}}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.row{flex-direction:row;flex-wrap:wrap;gap:8px}
.opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:8px 12px;border:1px solid var(--line-2);border-radius:6px;cursor:pointer;background:#fff;line-height:1.45}
.opts.row .opt{min-width:112px}
.opt:hover{background:#f1f5fa;border-color:var(--line)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .rb{width:18px;height:18px;border:2px solid #7c8693;border-radius:50%;flex:none;margin-top:2px;position:relative;background:#fff}
.opt .lt{font-weight:700;color:var(--ink-2);min-width:12px}
.opt.on{background:var(--acc-w);border-color:var(--acc-line)}

<script id="exam-data" type="application/json">{"build":"202610271235","tests":{"1":{"id":1,"roman":"I","lesen":{"t1":{"instruction":"Lesen Sie die Überschriften a–j und die Texte 1–5. Finden Sie für jeden Text die passende Überschrift. Sie können jede Überschrift nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 1–5 auf dem Antwortbogen.","headlines":[{"letter":"a","text":"Stadtrat nimmt Einnahmeverluste für mehr Besucher in Kauf"},{"letter":"b","text":"Stadt Dresden entwickelt App für Nachbarschaftshilfe"},{"letter":"c","text":"Umgekehrte Rollen bei der Suche nach Lehrlingen"},{"letter":"d","text":"Wochenendschlaf gleicht Schlafmangel aus, sagt Studie"},{"letter":"e","text":"Den Kleiderschrank auffrischen, ohne Geld auszugeben"},{"letter":"f","text":"Leere Kasse: Stadt kürzt Zuschüsse für Museen"},{"letter":"g","text":"Wer wenig schläft, lebt auf dem Arbeitsweg gefährlicher"},{"letter":"h","text":"Kleine Hilfen unter Nachbarn – digital organisiert"},{"letter":"i","text":"Handwerk zahlt Lehrlingen jetzt 200 Euro mehr im Monat"},{"letter":"j","text":"Sozialkaufhaus bittet um gut erhaltene Kleidung"}],"texts":[{"no":"1","paragraphs":["Wer kann mir eine Bohrmaschine leihen? Wer geht für mich einkaufen, wenn ich krank bin? Solche Fragen stellen die Dresdner inzwischen über eine App. „Meine Straße“ heißt sie, und nach nur einem Jahr zählt sie bereits 20.000 Nutzerinnen und Nutzer. Man meldet sich mit seiner Adresse an und sieht ausschließlich Nachrichten aus dem eigenen Stadtteil. Die meisten Angebote drehen sich um kleine Hilfen im Alltag; aber auch Spieleabende, Flohmärkte und gemeinsames Gärtnern werden darüber organisiert. Entwickelt hat die App ein Verein, die Stadt übernimmt lediglich die Serverkosten. Werbung gibt es nicht, und verdienen will damit niemand – „sonst wäre das Vertrauen schnell weg“, sagt Vereinsvorsitzende Ulrike Rau."]},{"no":"2","paragraphs":["Wer nachts weniger als sechs Stunden schläft, hat auf dem Weg zur Arbeit doppelt so oft einen Unfall wie Menschen mit sieben oder acht Stunden Schlaf. Zu diesem Ergebnis kommt eine Untersuchung der Universität Regensburg, für die 8.000 Berufstätige drei Jahre lang befragt wurden; die Studie ist inzwischen abgeschlossen. Besonders gefährdet sind Menschen, die im Schichtdienst arbeiten. Den Betrieben raten die Forscher, Schichten nicht zu häufig zu wechseln und längere Pausen zu erlauben. Mehr Schlaf am Wochenende gleicht den Mangel übrigens nicht aus, wie viele glauben. Einen einfachen Tipp haben die Forscher für alle: das Handy abends aus dem Schlafzimmer verbannen."]},{"no":"3","paragraphs":["Der Kleiderschrank ist voll, und trotzdem hat man nichts anzuziehen? Dagegen hilft am Samstag der Kleidertausch im Jugendzentrum Nord. Jeder bringt bis zu zehn gut erhaltene Kleidungsstücke mit und darf dafür ebenso viele wieder mitnehmen; Geld wechselt dabei nicht den Besitzer. Wer nichts Passendes findet, nimmt seine Sachen einfach wieder mit nach Hause. Nur was am Ende übrig bleibt und nicht abgeholt wird, geht an das Sozialkaufhaus in der Bahnhofstraße. Die Organisatorinnen wollen zeigen, dass Mode nicht immer neu sein muss. Beim letzten Tausch im Frühjahr wechselten 1.200 Teile den Besitzer. Beginn ist um 14 Uhr, der Eintritt ist frei."]},{"no":"4","paragraphs":["Ab Januar ist der Eintritt in die fünf städtischen Museen an jedem ersten Sonntag im Monat kostenlos. Das hat der Stadtrat am Dienstag beschlossen – gegen den Widerstand einiger Abgeordneter, die auf die leere Stadtkasse verwiesen. Die Museen hoffen, so vor allem Familien und junge Leute zu erreichen, die bisher selten kommen. In München, wo es das Angebot schon länger gibt, stiegen die Besucherzahlen um rund 40 Prozent. Der Stadt entgehen dadurch Einnahmen von etwa 150.000 Euro im Jahr. „Das ist es uns wert“, sagt Kulturbürgermeisterin Petra Hahn. „Museen gehören allen, nicht nur denen, die sich das Ticket leisten können.“"]},{"no":"5","paragraphs":["Bäcker, Friseure, Elektriker – viele Handwerksbetriebe finden keine Auszubildenden mehr. Allein in Niedersachsen blieben im letzten Jahr 4.000 Lehrstellen unbesetzt, und die Zahl der Bewerber sinkt weiter. Die Betriebe reagieren: Die Bäckerei Hoffmann in Oldenburg zahlt ihren Lehrlingen 200 Euro mehr im Monat als üblich, und die Arbeit beginnt erst um sechs statt um vier Uhr. Ein Friseursalon in Osnabrück bietet eine Vier-Tage-Woche an, ein Elektrobetrieb bezahlt den Führerschein. „Früher kamen die Jugendlichen zu uns und haben sich beworben“, sagt Handwerkskammer-Präsident Jörg Weber. „Heute bewerben wir uns bei ihnen – in den Schulen und im Internet.“"]}],"items":[{"no":"1","answer":"h"},{"no":"2","answer":"g"},{"no":"3","answer":"e"},{"no":"4","answer":"a"},{"no":"5","answer":"c"}]},"t2":{"instruction":"Lesen Sie den Text und die Aufgaben 6–10. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 6–10 auf dem Antwortbogen.","kind":"article","title":"Ein Laden, der allen gehört","lead":"Im Dorf Lindenbach hat der letzte Supermarkt geschlossen. Jetzt betreiben die Bewohner ihren eigenen Laden – und er läuft besser als erwartet.","paragraphs":["Als vor drei Jahren der Supermarkt in Lindenbach zumachte, mussten die Bewohner zum Einkaufen zwölf Kilometer in die nächste Stadt fahren. Für die vielen älteren Menschen im Dorf, die kein Auto haben, war das ein Problem – der Bus fährt nur dreimal am Tag. „Wir haben lange gehofft, dass eine Supermarktkette kommt“, erzählt Bürgermeister Frank Ohler. „Aber für 900 Einwohner interessiert sich keine.“ Den Vorschlag, es selbst zu versuchen, brachte schließlich eine Rentnerin auf einer Bürgerversammlung ein; Ohler hielt ihn anfangs für zu riskant.","Heute befindet sich in der alten Sparkasse am Dorfplatz der „Lindenladen“. 310 Bewohner haben Anteile gekauft, mindestens 100 Euro pro Person, und sind damit die Besitzer des Geschäfts. Das Geld reichte für den Umbau und die ersten Waren. Die Gemeinde stellt das Gebäude zehn Jahre lang mietfrei zur Verfügung, mehr nicht – einen Zuschuss hat der Gemeinderat abgelehnt. „Der Laden muss sich selbst tragen“, sagt Ohler. „Und das tut er: Im ersten Jahr haben wir Verlust gemacht, seit dem zweiten einen kleinen Gewinn.“","Angestellt sind nur zwei Verkäuferinnen in Teilzeit. Alles andere machen etwa 40 Freiwillige: Sie räumen Regale ein, bestellen Waren, erledigen die Buchhaltung. Die Öffnungszeiten – montags bis samstags von 7 bis 19 Uhr, dazu der Sonntagvormittag – wären mit bezahltem Personal nicht zu finanzieren. Dass es im Laden Brot vom Bäcker aus dem Nachbardorf, Eier von einem Bauern aus Lindenbach und Käse aus der Region gibt, war den Bewohnern wichtig. Dafür liegen die Preise etwas über denen eines Discounters. „Das wissen die Leute“, sagt Verkäuferin Sabine Kurz. „Sie kaufen trotzdem hier, weil sie den Laden behalten wollen – die großen Wocheneinkäufe machen viele allerdings weiterhin in der Stadt.“","Zum Laden gehört eine Ecke mit vier Tischen, an denen es Kaffee und Kuchen gibt. Vormittags sitzen dort Rentner, nachmittags Mütter mit kleinen Kindern. „Das war anfangs gar nicht geplant“, sagt Kurz. „Aber die Leute blieben einfach an der Kasse stehen und redeten. Da haben wir Tische hingestellt.“ Für Bewohner, die nicht mehr gut laufen können, bringen Jugendliche aus dem Dorf die Einkäufe einmal pro Woche nach Hause. Geld nehmen sie dafür nicht – nur ein Stück Kuchen, und das lassen sich die meisten nicht zweimal sagen.","Inzwischen kommen Besucher aus anderen Dörfern, um sich den Lindenladen anzusehen. Ohler gibt gern Tipps, warnt aber auch: „Ohne die Freiwilligen geht es nicht. Und die muss man pflegen.“ Einmal im Jahr lädt der Laden deshalb alle Helfer zu einem Fest ein. Für die Zukunft wünscht sich Sabine Kurz vor allem eine Sache: eine Poststelle im Laden. „Die Post ist zusammen mit dem Supermarkt gegangen. Wenn wir die zurückholen, müssen die Leute für gar nichts mehr in die Stadt.“ Gespräche mit der Post gab es bereits – bisher ohne Ergebnis."],"source":"","taskInstruction":"","items":[{"no":"6","stem":"Bürgermeister Frank Ohler","options":{"a":"hat sich von Anfang an für einen eigenen Dorfladen eingesetzt.","b":"stand dem Vorschlag einer Bürgerin zunächst skeptisch gegenüber.","c":"hat eine Supermarktkette überzeugt, nach Lindenbach zu kommen."},"answer":"b"},{"no":"7","stem":"Der Lindenladen","options":{"a":"muss ohne finanzielle Zuschüsse der Gemeinde auskommen.","b":"zahlt der Gemeinde für das Gebäude eine geringe Miete.","c":"hat schon im ersten Jahr mehr eingenommen als ausgegeben."},"answer":"a"},{"no":"8","stem":"Die Kunden des Ladens","options":{"a":"erledigen dort inzwischen auch ihre großen Wocheneinkäufe.","b":"nehmen höhere Preise in Kauf, um den Laden zu erhalten.","c":"bekommen die regionalen Produkte günstiger als beim Discounter."},"answer":"b"},{"no":"9","stem":"Die Tische im Laden","options":{"a":"wurden für Jugendliche aufgestellt, die dort ihre Freizeit verbringen.","b":"gehörten von Anfang an zum Konzept, mit dem der Laden eröffnet wurde.","c":"sind eine Reaktion darauf, wie sich die Kunden im Laden verhielten."},"answer":"c"},{"no":"10","stem":"Frank Ohler","options":{"a":"hält es für nötig, sich um die ehrenamtlichen Helfer zu bemühen.","b":"rät Besuchern aus anderen Dörfern von einem eigenen Laden ab.","c":"hat mit der Post bereits eine Filiale im Laden vereinbart."},"answer":"a"}]},"t3":{"instruction":"Lesen Sie die Situationen 11–20 und die Anzeigen a–l. Finden Sie für jede Situation die passende Anzeige. Sie können jede Anzeige nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 11–20 auf dem Antwortbogen. Wenn Sie zu einer Situation keine Anzeige finden, markieren Sie ein x.","items":[{"no":"11","text":"Sie ziehen am Samstag um und brauchen einen Transporter samt Helfern.","answer":"c"},{"no":"12","text":"Obwohl sie schon 70 ist, will Ihre Nachbarin Klavier spielen lernen.","answer":"a"},{"no":"13","text":"Einen Verein, in dem Erwachsene Fußball spielen, suchen Sie schon lange.","answer":"x"},{"no":"14","text":"Ihr Handy-Display ist kaputt – heute noch soll es repariert sein.","answer":"e"},{"no":"15","text":"Weil Ihnen die Zeit fehlt, soll jemand Ihre alte Wohnung putzen.","answer":"d"},{"no":"16","text":"Können Sie vor Ihrer Hochzeit im Sommer noch als Paar tanzen lernen?","answer":"k"},{"no":"17","text":"Bis Samstag muss Ihre Hose gekürzt und der Reißverschluss ersetzt sein.","answer":"g"},{"no":"18","text":"Wer kümmert sich um Ihren Hund, während Sie zwei Wochen im Urlaub sind?","answer":"i"},{"no":"19","text":"Schlagzeug lernen – das will Ihr fünfjähriger Sohn unbedingt.","answer":"x"},{"no":"20","text":"Singen macht Ihnen Spaß, doch Erfahrung in einem Chor haben Sie nicht.","answer":"b"}],"infos":[{"letter":"a","header":"Musikschule Klangwerk","tag":"Klavier · Gitarre · Geige · Gesang · Schlagzeug","title":"","subtitle":"Musik für jedes Alter – seit 1988","facts":[],"body":["Einzelunterricht 30 oder 45 Minuten, flexible Termine – auch vormittags. Wir unterrichten Kinder ab 6 Jahren, Jugendliche und Erwachsene. Besonders beliebt: unser Kurs „Klavier ab 60“ – ohne Notenkenntnisse, in Ihrem Tempo, mit viel Geduld. Instrumente können Sie bei uns günstig mieten. Die erste Probestunde ist kostenlos, der Vertrag monatlich kündbar."],"footer":"Maximilianstr. 8 · www.klangwerk-augsburg.de · 0821 / 34 56 78","design":"tearoff","deco":{"count":4}},{"letter":"b","header":"STIMMWERK","tag":"CHOR · POP · GOSPEL · WELTMUSIK","title":"Wir suchen neue Sängerinnen und Sänger!","subtitle":"","facts":[],"body":["Bei uns singen 40 Menschen zwischen 19 und 75 Jahren – Pop, Gospel und Lieder aus aller Welt. Noch nie in einem Chor gesungen? Kein Problem: Noten lesen muss man bei uns nicht, alles wird vorgesungen und gemeinsam geübt. Kommen Sie einfach zu einer Probe und singen Sie gleich mit.","Keine Vorkenntnisse nötig"],"footer":"Probe jeden Donnerstag, 19.30–21.30 Uhr, Gemeindesaal St. Anna · Beitrag 10 € im Monat · chor@stimmwerk.de","design":"inverse"},{"letter":"c","header":"STUDIUM-ZÜGE","tag":"UMZUGSHILFE · TRANSPORTE","title":"Zwei kräftige Studenten + Transporter (3,5 t, 20 m³)","subtitle":"","facts":["45 € pro Stunde, alles inklusive: Fahrer, Tragen, Benzin, Decken und Gurte","Möbel abbauen und in der neuen Wohnung wieder aufbauen","Auch kurzfristig und am Wochenende – ohne Aufpreis","Kostenloses Angebot per Telefon oder WhatsApp – wir fragen nur nach Zimmerzahl und Etage"],"body":[],"footer":"Tel. 0176 / 22 33 44 55 · www.studi-umzuege.de","design":"barhead","deco":{"icon":"bus"}},{"letter":"d","header":"Gebäudereinigung Kaiser","tag":"ZUVERLÄSSIG SEIT 1995","title":"Wohnungsübergabe ohne Sorgen","subtitle":"","facts":[],"body":["Unsere Spezialität ist die Umzugsreinigung: Wir übergeben Ihre alte Wohnung besenrein oder gründlich geputzt – inklusive Küche, Bad, Fenster und Böden, damit Sie Ihre Kaution vollständig zurückbekommen. Außerdem Büro- und Praxisreinigung, Treppenhäuser und Fensterputzen.","Festpreis nach kostenloser Besichtigung. Termine Mo–Sa, auch kurzfristig. Auf Wunsch übergeben wir die Wohnung mit Ihnen an den Vermieter."],"footer":"Tel. 0821 / 51 51 51","design":"inst"},{"letter":"e","header":"60 MIN PHONEFIX","tag":"","title":"Display kaputt? Akku schwach? Wasserschaden?","subtitle":"Handy- und Tablet-Reparatur","facts":["Mo–Sa · 10–19 Uhr, auch an Brückentagen","Wo · Bahnhofstr. 21, im Hauptbahnhof gegenüber Gleis 1","Tel. · 0821 / 88 99 00 · www.phonefix-augsburg.de"],"body":["Wir reparieren alle Marken – Displays meist in 60 Minuten, während Sie einen Kaffee trinken. Kostenlose Diagnose, feste Preise, 12 Monate Garantie auf jede Reparatur. Datenrettung, Hüllen und Zubehör. Kein Termin nötig: einfach vorbeikommen, Nummer ziehen, warten oder später abholen."],"footer":"","design":"mono","deco":{"icon":"plug"}},{"letter":"f","header":"FAHRZEUGE","tag":"KLEINANZEIGEN","title":"","subtitle":"","facts":[],"body":["Transporter zu vermieten. 3,5 t, 20 m³, mit Ladeklappe und Spanngurten. 60 € pro Tag inkl. 100 km, jeder weitere Kilometer 0,30 €, Wochenende (Fr–Mo) 150 €. Nur Selbstfahrer – Führerschein Klasse B genügt, Mindestalter 21 Jahre. Abholung Mo–Fr 8–17 Uhr, Rückgabe bis 18 Uhr, Kaution 300 €. Autohof Lechhausen, Tel. 0821 / 61 61 61","Klavier, schwarz, gut erhalten, gestimmt, 600 € VB. Nur Selbstabholung, 2. Stock ohne Aufzug. Tel. 0151 / 44 55 66 77","Smartphone, 1 Jahr alt, 128 GB, neuwertig mit Hülle und Ladekabel, Display ohne Kratzer, 180 € VB, Tel. 0170 / 98 76 54"],"footer":"","design":"classified"},{"letter":"g","header":"NADEL & FADEN","tag":"ÄNDERUNGSSCHNEIDEREI","title":"","subtitle":"","facts":["Hosen und Röcke kürzen · ab 9 €","Reißverschluss ersetzen · ab 12 €","Kleider enger oder weiter machen · ab 18 €","Knöpfe, Löcher, Futter · ab 4 €"],"body":["Auch Leder, Brautkleider und Anzüge. Express-Service: Bringen Sie Ihr Kleidungsstück bis 12 Uhr – am nächsten Tag ist es fertig, bei kleinen Arbeiten oft schon nach zwei Stunden. Beratung inklusive, alle Arbeiten mit Anprobe."],"footer":"Mo–Fr 9–18 Uhr, Sa 9–13 Uhr · Jakoberstr. 5 · Tel. 0821 / 30 30 30","design":"inst"},{"letter":"h","header":"","tag":"","title":"Putzhilfe gesucht!","subtitle":"","facts":[],"body":["Familie mit zwei Kindern in Göggingen sucht ab sofort eine zuverlässige Putzhilfe für 3 Stunden pro Woche, Dienstag- oder Donnerstagvormittag.","Aufgaben: Böden wischen, Bad und Küche reinigen, Staub wischen, bügeln. Wir zahlen 16 € pro Stunde, angemeldet als Minijob. Erfahrung und gute Deutschkenntnisse erwünscht, Referenzen willkommen.","Bitte melden Sie sich per E-Mail mit einer kurzen Vorstellung: familie.brenner@mail.de"],"footer":"","design":"pinned"},{"letter":"i","header":"Tierpension Waldeck","tag":"","title":"","subtitle":"HUNDE · KATZEN · KLEINTIERE","facts":["24 € pro Nacht","–10 % ab 14 Nächten"],"body":["Urlaubsbetreuung ab einer Nacht bis zu mehreren Wochen: Ihr Hund wohnt bei uns in einer eigenen, beheizten Box mit Auslauf, dreimal täglich geht es hinaus auf unsere große Wiese, und wir füttern wie zu Hause. Tagesbetreuung Mo–Fr für Berufstätige. Impfpass erforderlich, Besichtigung jederzeit nach Anmeldung."],"footer":"Abhol- und Bringservice im Stadtgebiet · Tel. 0821 / 70 70 70 · www.tierpension-waldeck.de","design":"logo","deco":{"ini":"W","icon":"paw"}},{"letter":"j","header":"Hundeschule Pfote","tag":"Welpenkurs · Grundkurs · Einzeltraining","title":"","subtitle":"ERZIEHUNG MIT HERZ · SEIT 2009","facts":[],"body":["Welpenkurs (für Hunde von 8 bis 16 Wochen), Grundkurs für Junghunde und Einzeltraining bei Problemen wie Ziehen an der Leine, Bellen oder Angst. In kleinen Gruppen lernen Sie und Ihr Hund gemeinsam – Sie sind bei jeder Stunde dabei, denn Erziehung funktioniert nur mit dem Besitzer. Neue Kurse ab September, 8 Termine 120 €, Einzelstunde 45 €. Erste Stunde kostenlos und unverbindlich."],"footer":"Samstag 10 Uhr, Hundeplatz am Siebentischwald · Tel. 0821 / 38 38 38 · www.hundeschule-pfote.de","design":"serif"},{"letter":"k","header":"TANZSCHULE ROSSI","tag":"","title":"","subtitle":"seit 1979 in Augsburg · Annastr. 12","facts":["Hochzeitskurs: An vier Abenden lernen Sie Walzer, Discofox und einen einfachen Tanz für Ihren großen Tag – 89 € pro Paar, jeden Monat neuer Start","Salsa, Tango, Standard und Latein – Anfänger und Fortgeschrittene","Kinderballett ab 4 Jahren, Hip-Hop ab 8 Jahren","Seniorentanz am Dienstagnachmittag, ohne Partner möglich","Schnupperabend jeden Freitag um 20 Uhr – kostenlos und ohne Anmeldung"],"body":[],"footer":"Tel. 0821 / 45 45 45","design":"rules"},{"letter":"l","header":"FC Lechhausen 1919","tag":"FUSSBALL · JUGENDABTEILUNG","title":"Fußball für Kinder und Jugendliche","subtitle":"","facts":[],"body":["Unsere Mannschaften von der U8 bis zur U17 suchen Verstärkung – Mädchen und Jungen. Training zweimal pro Woche, Spiele am Wochenende, Beitrag 8 € im Monat, Trikot inklusive. Probetraining kostenlos, einfach vorbeikommen.","Für Erwachsene haben wir keine Mannschaft – aber wir suchen Eltern, die als Trainer oder Schiedsrichter mithelfen möchten. Den Lehrgang bezahlt der Verein."],"footer":"Info: Di + Do 17–19 Uhr am Sportplatz Lechhausen · www.fc-lechhausen.de","design":"barhead"}]},"sb1":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 21–30. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 21–30 auf dem Antwortbogen.","paragraphs":["Sehr geehrte Damen und Herren,","am 3. März habe ich in Ihrem Online-Shop einen Kinderwagen bestellt (Bestellnummer 48213). Das Paket ist zwar {{21}} einer Woche angekommen, {{22}} in beschädigtem Zustand: Ein Rad ist gebrochen, und der Stoff weist einen Riss auf. Noch am selben Tag habe ich mich telefonisch an Ihre Hotline {{23}}, doch bis heute hat sich niemand bei mir gemeldet.","Da wir unser Kind bereits im April erwarten, sind wir auf den Kinderwagen dringend {{24}}. Ich fordere Sie daher auf, mir innerhalb von zwei Wochen einen einwandfreien Ersatz zu liefern. {{25}} sehe ich mich gezwungen, vom Kauf zurückzutreten und den vollen Kaufpreis zurückzuverlangen. Den beschädigten Wagen sende ich Ihnen selbstverständlich zurück, bin jedoch nicht bereit, die Kosten dafür zu {{26}}.","Fotos der Schäden {{27}} ich dieser E-Mail an. Bitte teilen Sie mir außerdem mit, {{28}} ich mit dem Paket weiter verfahren soll.","Ich {{29}} davon aus, dass wir die Angelegenheit schnell klären können, und {{30}} mit freundlichen Grüßen","Lena Hartmann"],"items":[{"no":"21","options":{"a":"während","b":"innerhalb","c":"seit"},"answer":"b"},{"no":"22","options":{"a":"allerdings","b":"sondern","c":"obwohl"},"answer":"a"},{"no":"23","options":{"a":"gewendet","b":"gewunden","c":"gewandt"},"answer":"c"},{"no":"24","options":{"a":"abhängig","b":"angewiesen","c":"verlassen"},"answer":"b"},{"no":"25","options":{"a":"Andernfalls","b":"Deshalb","c":"Außerdem"},"answer":"a"},{"no":"26","options":{"a":"nehmen","b":"halten","c":"tragen"},"answer":"c"},{"no":"27","options":{"a":"hänge","b":"lege","c":"setze"},"answer":"a"},{"no":"28","options":{"a":"was","b":"wie","c":"ob"},"answer":"b"},{"no":"29","options":{"a":"nehme","b":"stelle","c":"gehe"},"answer":"c"},{"no":"30","options":{"a":"bleibe","b":"verbleibt","c":"verbleibe"},"answer":"c"}]},"sb2":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 31–40. Benutzen Sie die Wörter a–o. Jedes Wort passt nur einmal. Markieren Sie Ihre Lösungen für die Aufgaben 31–40 auf dem Antwortbogen.","title":"","paragraphs":["Lieber Jonas,","endlich habe ich Zeit, dir zu schreiben! Du weißt ja, dass ich {{31}} zwei Monaten in Wien wohne. Wegen {{32}} Wiener Dialekts hatte ich in den ersten Wochen große {{33}}, die Leute zu verstehen. Meine Kollegen, {{34}} Geduld ich sehr bewundere, haben mir alles erklärt; ohne sie {{35}} ich wahrscheinlich längst wieder abgereist. Am Anfang war ich völlig auf ihre Hilfe {{36}}, inzwischen verstehe ich fast alles – und darauf bin ich ein bisschen stolz.","Die Wohnung habe ich erst vor drei Wochen gefunden. Sie ist mir von einer Kollegin vermittelt {{37}}, sonst würde ich wohl immer noch im Hotel wohnen. Sie ist klein, liegt aber in unmittelbarer {{38}} der Arbeit. Ein Auto brauche ich hier nicht, {{39}} ich mir eines ohnehin nicht leisten könnte.","Wie geht es dir? Hast du dich schon für den Marathon angemeldet? Ich würde gern kommen und dich anfeuern, {{40}} so ein Lauf ist ohne Publikum nur halb so schön. Du kannst mich natürlich auch mal übers Wochenende besuchen – ich habe ein Schlafsofa.","Liebe Grüße\nSara"],"words":{"a":"ANGEWIESEN","b":"DENEN","c":"DENN","d":"DEREN","e":"DES","f":"GEWÖHNT","g":"GEWORDEN","h":"HÄTTE","i":"MÜHE","j":"NÄHE","k":"SEIT","l":"VOR","m":"WÄRE","n":"WORDEN","o":"ZUMAL"},"items":[{"no":"31","answer":"k"},{"no":"32","answer":"e"},{"no":"33","answer":"i"},{"no":"34","answer":"d"},{"no":"35","answer":"m"},{"no":"36","answer":"a"},{"no":"37","answer":"n"},{"no":"38","answer":"j"},{"no":"39","answer":"o"},{"no":"40","answer":"c"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Texte nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Die Sprecherin hat ihren Umzug aufs Land noch nie in Frage gestellt.","answer":"F"},{"no":"42","text":"Der Sprecher schließt nicht aus, später wieder auf dem Land zu leben.","answer":"R"},{"no":"43","text":"Die Sprecherin meint, dass man sich nicht zwischen Stadt und Land entscheiden muss.","answer":"R"},{"no":"44","text":"Der Sprecher zieht um, weil ihm das Leben im Dorf nicht mehr gefällt.","answer":"F"},{"no":"45","text":"Die Sprecherin empfindet die Fahrzeit zur Arbeit ausschließlich als Nachteil.","answer":"F"}]},"t2":{"instruction":"Sie hören nun ein Gespräch. Dazu sollen Sie zehn Aufgaben lösen. Sie hören das Gespräch zweimal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu eine Minute Zeit.","items":[{"no":"46","text":"Herr Berger hätte bei seiner Bank weiterarbeiten können, wenn er umgezogen wäre.","answer":"R"},{"no":"47","text":"Den Vorschlag, Busfahrer zu werden, machte ein Nachbar.","answer":"R"},{"no":"48","text":"Bevor er Busfahrer wurde, hatte er sich erfolglos in einer anderen Branche beworben.","answer":"R"},{"no":"49","text":"Herr Berger hat die Ausbildung zum Busfahrer selbst bezahlt.","answer":"F"},{"no":"50","text":"Wer die Stadtwerke vor Ablauf von drei Jahren verlässt, muss einen Teil der Ausbildungskosten zurückzahlen.","answer":"R"},{"no":"51","text":"Herr Berger hat sich inzwischen völlig an das frühe Aufstehen gewöhnt.","answer":"F"},{"no":"52","text":"Herr Berger verdient heute etwa ein Viertel mehr als bei der Bank.","answer":"F"},{"no":"53","text":"In drei Jahren musste Herr Berger nie die Polizei rufen.","answer":"F"},{"no":"54","text":"Seine Lieblingslinie fährt durch die Altstadt.","answer":"F"},{"no":"55","text":"Für die Prüfung zum Ausbilder hat sich Herr Berger bereits angemeldet.","answer":"R"}]},"t3":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören jeden Text zweimal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen für die Aufgaben 56–60 auf dem Antwortbogen. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch.","readNote":"","items":[{"no":"56","text":"Der Zug nach Nürnberg fährt heute von Gleis 9 ab.","answer":"R"},{"no":"57","text":"Nach dem Urlaub ist die Praxis am Mittwoch den ganzen Tag geöffnet.","answer":"F"},{"no":"58","text":"Wer sein Ticket zurückgeben möchte, kann das noch am Konzertabend tun.","answer":"F"},{"no":"59","text":"In der Lebensmittelabteilung kann man heute bis 20 Uhr einkaufen.","answer":"R"},{"no":"60","text":"Von Montag bis Mittwoch zahlen Tagesgäste nur die Hälfte des Eintritts.","answer":"R"}]}},"schreiben":{"intro":"","task":{"lead":"Sie haben von Ihrer Freundin Julia folgende E-Mail erhalten:","mail":["Liebe / Lieber ______,","endlich habe ich mal wieder ein freies Wochenende! Ich habe mir gedacht, ich könnte dich vom 14. bis 16. Mai besuchen – wir haben uns ja seit deinem Umzug nicht mehr gesehen, und ich bin so neugierig auf deine neue Stadt!","Hast du an dem Wochenende Zeit? Ich würde am Freitagabend ankommen und am Sonntagnachmittag zurückfahren. Ich weiß aber noch nicht, ob ich mit dem Zug oder mit dem Auto komme – was meinst du? Und sag mir bitte, was ich mitbringen soll.","Ich freue mich riesig!","Liebe Grüße\nJulia"],"instruction":"Antworten Sie auf die E-Mail. Schreiben Sie etwas zu allen vier Punkten:","points":["ob das Wochenende passt – wenn nicht, schlagen Sie einen anderen Termin vor","was Sie zusammen unternehmen können","Zug oder Auto: was Sie Julia empfehlen und warum","wo Julia bei Ihnen schlafen kann"],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss.","model":{"label":"Beispiel für eine Antwort, die alle vier Leitpunkte behandelt (ca. 170 Wörter)","text":"Betreff: Dein Besuch im Mai – ja!\n\nLiebe Julia,\n\nwie schön, dass du kommen willst! Das Wochenende vom 14. bis 16. Mai passt mir gut, ich habe frei. Nur am Sonntagvormittag muss ich zwei Stunden arbeiten, aber bis zum Mittagessen bin ich zurück.\n\nIch habe schon Ideen: Am Samstag zeige ich dir die Altstadt und den Markt, und abends könnten wir in das vietnamesische Restaurant gehen, von dem ich dir erzählt habe. Wenn das Wetter gut ist, fahren wir am Sonntag mit dem Rad an den See.\n\nKomm lieber mit dem Zug! Die Fahrt dauert nur zwei Stunden, und Parkplätze sind hier in der Innenstadt teuer und schwer zu finden. Ich hole dich am Freitagabend am Bahnhof ab – sag mir nur, wann du ankommst.\n\nSchlafen kannst du bei mir im Wohnzimmer, ich habe ein bequemes Schlafsofa. Bettwäsche und Handtücher habe ich, du musst also nur deine Sachen mitbringen – und vielleicht einen Kuchen von deiner Mutter!\n\nIch freue mich riesig auf dich!\n\nLiebe Grüße\nAnna","marks":["","","1","2","3","4","",""],"notes":"Leitpunkte\n1 Passt das Wochenende? → ja, nur Sonntagvormittag kurz arbeiten\n2 Was unternehmen? → Altstadt, Markt, Restaurant, Rad zum See\n3 Zug oder Auto? → Zug, weil Parkplätze teuer; Abholen am Bahnhof\n4 Wo schlafen? → Schlafsofa im Wohnzimmer\nAufbau Betreff · Anrede in der du-Form (Freundin, informell) · Einleitung mit Bezug auf die E-Mail · Schluss · Grußformel und Name\nBewertung\nI Inhalt: alle vier Leitpunkte, passend zur Situation. Jeder fehlende Leitpunkt kostet eine Stufe.\nII Kommunikative Gestaltung: Register (du), Aufbau, Verknüpfungen wie aber, wenn, also, vielleicht.\nIII Formale Richtigkeit: Fehler dürfen das Verständnis nicht stören.\nTypische Fehler: Leitpunkt 4 (Schlafplatz) vergessen, weil Julia nicht danach fragt · nur die Frage „Was soll ich mitbringen?“ beantworten · Sie statt du bei einer Freundin · Zug oder Auto ohne Begründung."}}},"audio":[{"src":"telc%20B1%20Modelltest%201.1.mp3","dur":275.15},{"src":"telc%20B1%20Modelltest%201.2.mp3","dur":502.91},{"src":"telc%20B1%20Modelltest%201.3.mp3","dur":417.15}],"minutes":{"hoeren":22},"pdf":"telc%20B1%20Modelltest%201.pdf","pages":{"loesung":19,"muster":20,"kommentar":24,"hoertexte":22}},"2":{"id":2,"roman":"II","lesen":{"t1":{"instruction":"Lesen Sie die Überschriften a–j und die Texte 1–5. Finden Sie für jeden Text die passende Überschrift. Sie können jede Überschrift nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 1–5 auf dem Antwortbogen.","headlines":[{"letter":"a","text":"Langsamer als das Flugzeug, aber wieder gefragt"},{"letter":"b","text":"Bibliothek: Ehrenamtliche lernen von Kindern"},{"letter":"c","text":"Grundschüler ernten, was sie später essen"},{"letter":"d","text":"Umfrage: Die meisten wollen ganz zu Hause arbeiten"},{"letter":"e","text":"Freiwillige gesucht: Zeit schenken, Lesen fördern"},{"letter":"f","text":"Nachtzug nach Kopenhagen startet im Dezember"},{"letter":"g","text":"Beschäftigte wollen beides: Büro und Homeoffice"},{"letter":"h","text":"Elternrat übernimmt das Kochen in der Schulküche"},{"letter":"i","text":"Dorfgemeinschaft macht das Zweitauto überflüssig"},{"letter":"j","text":"Feuerwehr stellt dem Dorf ihren Transporter zur Verfügung"}],"texts":[{"no":"1","paragraphs":["An der Grundschule Am Anger in Erfurt steht Gartenarbeit auf dem Stundenplan. Seit dem Frühjahr bauen die dritten und vierten Klassen hinter dem Schulgebäude Tomaten, Salat und Kartoffeln an; zweimal pro Woche wird eine Stunde lang gejätet, gegossen und geerntet. Im Herbst kochen die Kinder aus der Ernte ein gemeinsames Mittagessen – die Eltern sind dazu nur eingeladen, an den Herd dürfen sie nicht. „Viele Kinder wussten nicht, dass Kartoffeln unter der Erde wachsen“, sagt Lehrerin Anke Vogt. Die Idee stammt aus dem Elternrat, der auch die Beete gebaut und die Pflanzen gespendet hat. Drei weitere Schulen in der Stadt wollen das Projekt im nächsten Jahr übernehmen."]},{"no":"2","paragraphs":["Im Dorf Hinterberg im Allgäu gibt es seit einem Jahr zwei Elektroautos, die niemandem allein gehören – sondern den 60 Mitgliedern des Vereins „Dorfauto“. Wer eines braucht, bucht es über eine App und zahlt drei Euro pro Stunde. Geladen wird mit Strom von der Solaranlage auf dem Feuerwehrhaus; mehr hat die Feuerwehr mit dem Projekt allerdings nicht zu tun. Der Erfolg hat den Verein selbst überrascht: 15 Familien haben inzwischen ihr zweites Auto verkauft, weil sie es nicht mehr brauchen. Im nächsten Jahr soll ein drittes Fahrzeug dazukommen, diesmal ein kleiner Transporter für Umzüge und Gartenabfälle – bezahlt aus den Beiträgen der Mitglieder."]},{"no":"3","paragraphs":["Jedes fünfte Kind kann am Ende der Grundschule nicht richtig lesen. Die Stadtbibliothek Bochum will das ändern und sucht Freiwillige, die einmal pro Woche eine Stunde lang mit einem Kind lesen. Vorkenntnisse braucht man nicht, wohl aber Geduld – die Bibliothek bereitet alle Helfer an zwei Nachmittagen vor. Bisher machen 80 Erwachsene mit, die meisten von ihnen im Ruhestand. Sie selbst lernen dabei nichts Neues, sagt Bibliotheksleiter Jan Kowalski, „aber sie bekommen etwas zurück, das man nicht bezahlen kann“. 200 Kinder stehen noch auf der Warteliste. Interessierte können sich telefonisch oder direkt in der Bibliothek melden."]},{"no":"4","paragraphs":["Rund ein Drittel der Beschäftigten in Deutschland arbeitet mindestens einen Tag pro Woche von zu Hause. Das zeigt eine Umfrage des Instituts für Arbeitsforschung unter 5.000 Berufstätigen. Als größten Vorteil nennen die Befragten den gesparten Arbeitsweg, als größten Nachteil den fehlenden Kontakt zu den Kollegen. Nur acht Prozent möchten ausschließlich zu Hause arbeiten, und nur zwölf Prozent wollen ganz zurück ins Büro. Die große Mehrheit wünscht sich eine Kombination: zwei bis drei Tage im Büro, den Rest zu Hause. Die meisten Arbeitgeber haben sich darauf inzwischen eingestellt; lediglich jede zehnte Firma verlangt von ihren Mitarbeitern wieder volle Anwesenheit."]},{"no":"5","paragraphs":["Nach 25 Jahren fährt ab Dezember wieder ein Nachtzug von Berlin nach Paris. Abfahrt ist um 20.15 Uhr, Ankunft am nächsten Morgen um 10.30 Uhr. Die Fahrt dauert damit deutlich länger als ein Flug, kostet aber ab 29 Euro im Sitzwagen und ab 79 Euro im Schlafwagen. Die Bahn rechnet vor allem mit jungen Reisenden, die aus Klimagründen nicht mehr fliegen wollen – und mit Geschäftsleuten, die die Nacht lieber im Bett als im Flughafenhotel verbringen. Eine Verbindung nach Kopenhagen ist für das übernächste Jahr geplant. Für die ersten Wochen sind viele Züge bereits ausgebucht."]}],"items":[{"no":"1","answer":"c"},{"no":"2","answer":"i"},{"no":"3","answer":"e"},{"no":"4","answer":"g"},{"no":"5","answer":"a"}]},"t2":{"instruction":"Lesen Sie den Text und die Aufgaben 6–10. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 6–10 auf dem Antwortbogen.","kind":"article","title":"Vier Tage arbeiten, drei Tage frei","lead":"Der Malerbetrieb Janssen in Bremen hat ein Jahr lang die Vier-Tage-Woche getestet. Jetzt erzählen Chef und Mitarbeiter, was sich Verändert hat.","paragraphs":["Freitagmorgen, acht Uhr. In der Werkstatt des Malerbetriebs Janssen ist es still, die Autos stehen auf dem Hof. Seit einem Jahr arbeiten die 14 Angestellten nur noch von Montag bis Donnerstag – bei gleichem Lohn. „Wir haben drei Jahre lang keinen einzigen Auszubildenden gefunden“, erzählt Inhaber Peter Janssen, 58. „Junge Leute wollen heute nicht mehr 40 Stunden auf der Leiter stehen. Also musste uns etwas einfallen.“ Von einem Kollegen aus Dänemark hatte er gehört, dass es dort funktioniert; seine eigene Frau hielt die Idee zunächst für verrückt.","Das Modell ist einfach: Statt fünfmal acht Stunden arbeiten die Maler jetzt viermal neun, von sieben bis halb fünf. Die Wochenarbeitszeit ist damit von 40 auf 36 Stunden gesunken. Am Anfang hatte Janssen Angst, dass die Kunden das nicht akzeptieren würden. „Aber die meisten Aufträge dauern sowieso mehrere Tage. Ob wir am Freitag da sind oder nicht, merken die Kunden kaum.“ Eine einzige Beschwerde gab es – von einem Kunden, der ausgerechnet an einem Freitag einen Wasserschaden hatte. Seitdem gibt es für Notfälle eine Telefonnummer.","Die Zahlen nach einem Jahr überraschen selbst den Chef. Der Umsatz ist gleich geblieben, obwohl weniger gearbeitet wird. Die Zahl der Krankheitstage ist um fast ein Drittel gesunken. „Wer ausgeruht ist, arbeitet schneller und macht weniger Fehler“, glaubt Janssen. Und: Auf die letzte Stellenanzeige haben sich zwölf junge Leute gemeldet, zwei davon hat er eingestellt. Vorher waren es null Bewerbungen.","Für die Mitarbeiter hat sich der Alltag verändert. Malerin Sandra Beck, 34, bringt jetzt am Freitag ihre Tochter in die Schule und geht danach schwimmen. Ihr Kollege Ahmed Karim engagiert sich seit einem Jahr bei der Freiwilligen Feuerwehr. Nicht alle waren am Anfang begeistert: „Neun Stunden auf dem Gerüst sind lang, das merkt man in meinem Alter“, sagt der 51-jährige Vorarbeiter Klaus Berg. „Aber an den freien Freitag gewöhnt man sich schnell. Zurück will ich nicht mehr – auch wenn ich mir donnerstags manchmal einen Kollegen wünsche, der mir die letzte Stunde abnimmt.“","Ab Januar gilt die Vier-Tage-Woche bei Janssen dauerhaft. Inzwischen melden sich andere Handwerksbetriebe aus der Region, die das Modell kennenlernen wollen. Janssen erzählt ihnen gern davon, warnt aber: „Das funktioniert nur, wenn alle mitmachen. Wenn drei Leute am Freitag doch arbeiten, ist die Ruhe schnell vorbei.“ Für sich selbst hat der Chef übrigens eine Ausnahme gemacht: Er sitzt freitags im Büro und schreibt Rechnungen – allerdings nur bis mittags, und ans Telefon geht er nicht."],"source":"","taskInstruction":"","items":[{"no":"6","stem":"Peter Janssen führte die Vier-Tage-Woche ein, weil","options":{"a":"ein Kollege aus Dänemark ihn ausdrücklich darum gebeten hatte.","b":"sich niemand mehr für eine Ausbildung bei ihm interessierte.","c":"seine Frau ihn lange davon zu überzeugen versucht hatte."},"answer":"b"},{"no":"7","stem":"Für die Kunden","options":{"a":"spielt es meist keine Rolle, ob am Freitag gearbeitet wird.","b":"wurde nach mehreren Beschwerden eine Notfallnummer eingerichtet.","c":"dauern die Aufträge seit der Umstellung einen Tag länger."},"answer":"a"},{"no":"8","stem":"Nach einem Jahr zeigt sich, dass","options":{"a":"der Betrieb trotz gleicher Arbeitszeit mehr Umsatz macht.","b":"die Beschäftigten deutlich seltener krank sind als vorher.","c":"sich auf jede Stellenanzeige etwa zwölf Bewerber melden."},"answer":"b"},{"no":"9","stem":"Vorarbeiter Klaus Berg","options":{"a":"möchte trotz der langen Arbeitstage nicht zum alten Modell zurück.","b":"lässt sich donnerstags die letzte Stunde von einem Kollegen abnehmen.","c":"hatte als Einziger von Beginn an keine Zweifel an dem Modell."},"answer":"a"},{"no":"10","stem":"Peter Janssen","options":{"a":"erledigt freitags die Büroarbeit und nimmt dabei auch Anrufe an.","b":"bittet interessierte Betriebe, mit dem Modell noch zu warten.","c":"sieht die Gefahr, dass einzelne Ausnahmen das Modell gefährden."},"answer":"c"}]},"t3":{"instruction":"Lesen Sie die Situationen 11–20 und die Anzeigen a–l. Finden Sie für jede Situation die passende Anzeige. Sie können jede Anzeige nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 11–20 auf dem Antwortbogen. Wenn Sie zu einer Situation keine Anzeige finden, markieren Sie ein x.","items":[{"no":"11","text":"Ihr Sohn (6) soll schwimmen lernen, hat aber wochentags bis 16 Uhr Schule.","answer":"d"},{"no":"12","text":"Da Sie übermorgen 30 Gäste zu Hause erwarten, soll jemand für Sie kochen.","answer":"x"},{"no":"13","text":"Bis morgen brauchen Sie ein neues Foto für Ihre Bewerbung.","answer":"i"},{"no":"14","text":"Das Zeugnis Ihrer Freundin aus Brasilien muss offiziell übersetzt werden.","answer":"f"},{"no":"15","text":"In der Küche geht das Licht nicht mehr – wer kann das reparieren?","answer":"k"},{"no":"16","text":"Eine Bohrmaschine brauchen Sie nur am Samstag, kaufen wollen Sie keine.","answer":"l"},{"no":"17","text":"Zwillinge! Jetzt suchen Sie günstige gebrauchte Babysachen.","answer":"a"},{"no":"18","text":"Schwimmen haben Sie nie gelernt – mit 35 wollen Sie das ändern.","answer":"c"},{"no":"19","text":"Sie sind selbstständig und wollen Ihre Steuererklärung machen lassen.","answer":"x"},{"no":"20","text":"Wohin können Sie am Dienstagabend mit zwölf Kollegen essen gehen?","answer":"h"}],"infos":[{"letter":"a","header":"Kinderkleiderbörse","tag":"","title":"","subtitle":"Samstag, 12. April, 10–13 Uhr · Gemeindehaus St. Lamberti","facts":["Eintritt · frei","Verkäufer · Tisch 8 €, Tel. 0251 / 41 41 41","Cafeteria · Kaffee, Kuchen, Spielecke","Erlös · für den Kindergarten"],"body":["Gut erhaltene gebrauchte Kinderkleidung in den Größen 50–176, Schuhe, Spielzeug, Bücher, Kinderwagen, Babybetten und Autositze – alles zu kleinen Preisen, vieles unter 5 €. Extra-Tisch für Zwillingseltern mit doppelten Sets! Schwangere mit Mutterpass dürfen schon ab 9.30 Uhr hinein."],"footer":"Veranstalter: Elterninitiative Lamberti e. V.","design":"inst"},{"letter":"b","header":"Babyparadies","tag":"NEU IN MÜNSTER","title":"","subtitle":"ALLES FÜR BABYS UND ZWILLINGE – FABRIKNEU","facts":[],"body":["800 m² für die Kleinsten: Kinderwagen und Zwillingswagen, Babybetten, Wickelkommoden, Autositze, Kleidung in den Größen 50–104 – ausschließlic er 1.050 € zurück.","Wichtig: Nach dem Gesetz dürfen wir nur Arbeitnehmer, Rentner und Studierende beraten – keine Selbstständigen und Gewerbetreibenden."],"footer":"Beratung nach Termin, Mo–Fr 9–17 Uhr · Hammer Str. 3 · Tel. 0251 / 20 20 20","design":"inst"},{"letter":"f","header":"DIENSTLEISTUNGEN","tag":"KLEINANZEIGEN","title":"","subtitle":"","facts":[],"body":["Übersetze Briefe, E-Mails und Texte Portugiesisch–Deutsch und Deutsch–Portugiesisch, schnell und günstig, ab 15 € pro Seite. Keine Beglaubigungen. Tel. 0170 / 55 66 77 88","Übersetzungsbüro Lingua. Beglaubigte Übersetzungen von Zeugnissen, Diplomen, Urkunden und Verträgen – anerkannt von Behörden, Universitäten und Gerichten. Alle Sprachen, auch Portugiesisch. Fertig in 48 Stunden, Express in 24 Stunden gegen Aufpreis. Sie schicken uns das Dokument als Scan per E-Mail, wir liefern das Original per Post. Tel. 0251 / 60 60 60 · www.lingua-ms.de","Bügelservice, hole und bringe, 3 € pro Hemd, Tel. 0251 / 12 12 12"],"footer":"","design":"classified"},{"letter":"g","header":"","tag":"GAUMENFREUDE · PARTYSERVICE & CATERING","title":"Feiern Sie zu Hause – wir kochen!","subtitle":"","facts":[],"body":["Buffets für Geburtstage, Jubiläen und Familienfeste ab 10 Personen, warm oder kalt, auch vegetarisch und vegan. Wir liefern bis an Ihre Tür, bauen das Buffet auf und holen Geschirr und Reste am nächsten Tag wieder ab. Auf Wunsch kommt eine Servicekraft für den Abend dazu. Ab 19 € pro Person.","Bestellung mindestens drei Tage vorher – für Feiern am Wochenende bis Mittwoch"],"footer":"Tel. 0251 / 88 77 66 · www.gaumenfreude-ms.de · Mo–Sa 9–18 Uhr","design":"inverse"},{"letter":"h","header":"Zum Anker","tag":"RESTAURANT AM KANAL","title":"Feiern bei uns","subtitle":"","facts":["3-Gänge-Menü · ab 29 €","Buffet ab 15 Personen · ab 25 €","Kindermenü · 8 €"],"body":["Unser Nebenraum bietet Platz für Gruppen bis 40 Personen – ideal für Kollegen, Vereine und Familienfeste. Getränke nach Verbrauch, Menü oder Buffet nach Wahl, gern auch vegetarisch. Bei Reservierung bis drei Tage vorher ist der Raum garantiert; kleinere Gruppen finden meist auch spontan Platz."],"footer":"Di–So 12–23 Uhr, Küche bis 22 Uhr · Montag Ruhetag · Tel. 0251 / 33 22 11 · Am Kanal 5, Parkplätze am Haus","design":"inst"},{"letter":"i","header":"Fotostudio Blende","tag":"","title":"Bewerbungsfotos in 15 Minuten – ohne Termin","subtitle":"PASSFOTOS · BEWERBUNGSFOTOS · FAMILIE","facts":[],"body":["Sie kommen vorbei, wir fotografieren Sie im Studio mit professionellem Licht, und Sie wählen am Bildschirm Ihr bestes Bild aus. Ausdruck sofort, die Datei bekommen Sie per E-Mail dazu. Wir beraten Sie zu Kleidung und Ausdruck. Biometrische Passfotos für alle Ausweise, Familien- und Babyshootings nach Vereinbarung."],"footer":"Mo–Fr 9–18 Uhr, Sa 10–14 Uhr · Ludgeristr. 22 · Tel. 0251 / 45 45 45","design":"logo","deco":{"ini":"B"}},{"letter":"j","header":"FOTODRUCK SOFORT","tag":"10 MINUTEN","title":"","subtitle":"DRUCKPUNKT · COPYSHOP & DRUCKEREI AN DER UNI","facts":[],"body":["Passbilder und Bewerbungsfotos drucken wir in 10 Minuten auf echtem Fotopapier aus – matt oder glänzend, in allen Formaten. Bringen Sie Ihr Foto einfach als Datei oder auf dem Handy mit.","Außerdem: Drucken, Kopieren, Binden – auch sofort. Bewerbungsmappen mit Klarsichtdeckel, Visitenkarten, Poster bis DIN A0, Flyer und Abschlussarbeiten. Studentenrabatt 10 %, Bezahlung auch mit Karte."],"footer":"Mo–Fr 8–20 Uhr, Sa 10–16 Uhr · Schlossplatz 3 · www.druckpunkt-ms.de","design":"bignum"},{"letter":"k","header":"HAUSMEISTER-SERVICE MÜLLER","tag":"","title":"","subtitle":"Kleine Reparaturen – schnell und günstig · Meisterbetrieb, versichert","facts":["Elektrik: Lampen anschließen, Steckdosen, Schalter, Sicherungen, Klingel","Wasserhahn tropft? Tür klemmt? Rollladen defekt? Wir kommen innerhalb von 24 Stunden","Möbel aufbauen und Bilder aufhängen, dazu Notdienst rund um die Uhr","Anfahrt in Münster kostenlos, Arbeitszeit 39 € pro Stunde, Material nach Verbrauch"],"body":[],"footer":"Tel. 0251 / 90 90 90","design":"sign","deco":{"icon":"wrench"}},{"letter":"l","header":"Baumarkt Weber","tag":"HEIMWERKEN · GARTEN · LODDENHEIDE 5","title":"Werkzeug leihen statt kaufen","subtitle":"","facts":["Bohrmaschine, Schleifgerät, Stichsäge · 10 € / Tag","Fliesenschneider, Tapeziertisch · 8 € / Tag","Leiter, Anhänger · 15 € / Tag","Wochenende Sa–Mo · Preis von 1 Tag"],"body":["Ausweis und Kaution genügen, Rückgabe bis 20 Uhr. Kostenlose Beratung für Heimwerker, jeden Samstag um 11 Uhr Workshop „Regale und Schränke sicher aufbauen“."],"footer":"Mo–Sa 8–20 Uhr · Tel. 0251 / 70 70 70 · www.baumarkt-weber.de","design":"mono"}]},"sb1":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 21–30. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 21–30 auf dem Antwortbogen.","paragraphs":["Sehr geehrter Herr Lang,","seit zwei Jahren wohne ich in Ihrer Wohnung in der Parkstraße 7 und war bisher durchweg zufrieden. {{21}} gut einer Woche funktioniert jedoch die Heizung im Wohnzimmer nicht mehr. Ich habe mehrfach versucht, das Problem selbst zu beheben – leider {{22}} Erfolg. Nachts sinkt die Temperatur in der Wohnung inzwischen auf 15 Grad, {{23}} ich mir mit einem kleinen Kind große Sorgen mache.","Ich bitte Sie daher, so schnell wie möglich einen Handwerker {{24}}. Am besten erreichen Sie mich vormittags, {{25}} ich am Nachmittag arbeite. Den Termin können Sie auch direkt mit meiner Nachbarin Frau Özdemir {{26}}, die einen Schlüssel hat.","{{27}} hinaus möchte ich Sie fragen, ob die Miete für diesen Monat wegen der kalten Wohnung gemindert werden kann. Ein Bekannter hat mir gesagt, dass Mieter in {{28}} Fall das Recht dazu haben. Sollte ich bis Ende der Woche nichts von Ihnen {{29}}, wende ich mich an den Mieterverein.","Für Rückfragen {{30}} ich Ihnen unter der oben genannten Nummer gern zur Verfügung.","Mit freundlichen Grüßen\nMarco Rossi"],"items":[{"no":"21","options":{"a":"Ab","b":"Vor","c":"Seit"},"answer":"c"},{"no":"22","options":{"a":"ohne","b":"außer","c":"statt"},"answer":"a"},{"no":"23","options":{"a":"damit","b":"sodass","c":"obwohl"},"answer":"b"},{"no":"24","options":{"a":"vorbeizuschicken","b":"vorbeischicken","c":"vorbeigeschickt"},"answer":"a"},{"no":"25","options":{"a":"denn","b":"da","c":"deshalb"},"answer":"b"},{"no":"26","options":{"a":"verabreden","b":"veranstalten","c":"vereinbaren"},"answer":"c"},{"no":"27","options":{"a":"Darüber","b":"Dazu","c":"Damit"},"answer":"a"},{"no":"28","options":{"a":"einen solchen","b":"einem solchen","c":"eines solchen"},"answer":"b"},{"no":"29","options":{"a":"höre","b":"hören","c":"gehört"},"answer":"b"},{"no":"30","options":{"a":"bin","b":"bleibe","c":"stehe"},"answer":"c"}]},"sb2":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 31–40. Benutzen Sie die Wörter a–o. Jedes Wort passt nur einmal. Markieren Sie Ihre Lösungen für die Aufgaben 31–40 auf dem Antwortbogen.","title":"","paragraphs":["Liebe Marta,","stell dir vor: Ich habe eine Arbeit gefunden! {{31}} ich die Zusage bekam, habe ich vor Freude geweint. Seit dem 1. März arbeite ich als Rezeptionistin in einem Hotel am Hauptbahnhof. Am Anfang hatte ich große Angst {{32}} dem Telefonieren auf Deutsch, aber meine Chefin hat es mir geduldig {{33}}. Wenn Gäste sich beschweren, muss ich ihnen ruhig zuhören – das ist nicht immer leicht, und die Nachtschichten sind ziemlich {{34}}. Trotzdem mag ich die Arbeit: Meine Kollegen sind alle sehr nett, sogar der Chef macht manchmal Witze.","Das Beste ist: Die Prüfung, auf die wir uns im Kurs vorbereitet haben, kann ich jetzt endlich machen. Der Termin ist zwar schon zweimal verschoben {{35}}, aber jetzt steht er fest. Das Hotel übernimmt die Gebühr – allerdings nur unter der {{36}}, dass ich bestehe. Wenn nicht, muss sie von mir selbst bezahlt {{37}}. Ich übe also jeden Abend, {{38}} ich es beim ersten Versuch schaffe.","Wie geht es dir? Hast du schon eine Wohnung gefunden? Wenn nicht: Ein Kollege von mir sucht zurzeit einen Mitbewohner; {{39}} Nummer kann ich dir gern geben. Und könntest du mir einen {{40}} tun und meine Kursbücher bei Frau Berger abholen? Am Samstag habe ich frei – ruf mich doch mal an!","Liebe Grüße\nYuki"],"words":{"a":"ALS","b":"ANGESTRENGT","c":"ANSTRENGEND","d":"BEIGEBRACHT","e":"DAMIT","f":"DEREN","g":"DESSEN","h":"GEFALLEN","i":"GELERNT","j":"VON","k":"VOR","l":"VORAUSSETZUNG","m":"WENN","n":"WERDEN","o":"WORDEN"},"items":[{"no":"31","answer":"a"},{"no":"32","answer":"k"},{"no":"33","answer":"d"},{"no":"34","answer":"c"},{"no":"35","answer":"o"},{"no":"36","answer":"l"},{"no":"37","answer":"n"},{"no":"38","answer":"e"},{"no":"39","answer":"g"},{"no":"40","answer":"h"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Texte nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Der Sprecher hat sein Fitnessstudio gekündigt, sobald er merkte, dass er selten hinging.","answer":"F"},{"no":"42","text":"Die Sprecherin lässt das Rad nur stehen, wenn die Straßen glatt sind.","answer":"R"},{"no":"43","text":"Der Sprecher vermisst es, selbst zu spielen.","answer":"R"},{"no":"44","text":"Die Sprecherin schließt aus, jemals mit Sport anzufangen.","answer":"F"},{"no":"45","text":"Der Sprecher behält sein Yoga-Training gegenüber seinen Freunden lieber für sich.","answer":"R"}]},"t2":{"instruction":"Sie hören nun ein Gespräch. Dazu sollen Sie zehn Aufgaben lösen. Sie hören das Gespräch zweimal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gle
