ich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu eine Minute Zeit.","items":[{"no":"46","text":"Frau Hoffmann hat vor der Übernahme in einer anderen Buchhandlung gearbeitet.","answer":"F"},{"no":"47","text":"Frau Steinmann hätte den Laden lieber geschlossen, als ihn an eine Kette zu verkaufen.","answer":"R"},{"no":"48","text":"Frau Hoffmann hat Frau Steinmann von sich aus angeboten, den Laden zu übernehmen.","answer":"F"},{"no":"49","text":"Die Bank hat den Kredit beim ersten Antrag abgelehnt.","answer":"R"},{"no":"50","text":"Der Laden ist heute an mehr Tagen geöffnet als früher.","answer":"F"},{"no":"51","text":"Im Café arbeitet an allen Öffnungstagen Frau Hoffmanns Mutter.","answer":"F"},{"no":"52","text":"Frau Hoffmann liefert Bücher in Lüneburg an jedem Tag der Woche persönlich aus.","answer":"F"},{"no":"53","text":"Bei Frau Hoffmann kosten Bücher genauso viel wie bei den großen Anbietern.","answer":"R"},{"no":"54","text":"Umgerechnet auf die Stunde verdient Frau Hoffmann heute weniger als früher.","answer":"R"},{"no":"55","text":"Für einen größeren Veranstaltungsraum gibt es bereits konkrete Gespräche.","answer":"R"}]},"t3":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören jeden Text zweimal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen für die Aufgaben 56–60 auf dem Antwortbogen. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch.","readNote":"","items":[{"no":"56","text":"Am Sonntagabend sind alle Straßen der Innenstadt wieder frei.","answer":"F"},{"no":"57","text":"Der Elternabend findet am Mittwoch statt.","answer":"R"},{"no":"58","text":"Auch die kleinen Becher desselben Joghurts müssen zurückgegeben werden.","answer":"F"},{"no":"59","text":"Das Boarding sollte ursprünglich um 16 Uhr 20 beginnen.","answer":"R"},{"no":"60","text":"Das ganze Wochenende bleibt trocken.","answer":"F"}]}},"schreiben":{"intro":"","task":{"lead":"Sie haben von der Leiterin Ihrer Sprachschule folgende E-Mail erhalten:","mail":["Liebe Kursteilnehmerin, lieber Kursteilnehmer,","in zwei Wochen endet unser Kurs B1. Wir möchten unsere Kurse ständig verbessern und bitten Sie deshalb um Ihre Meinung: Was hat Ihnen gefallen, und was sollten wir anders machen?","Außerdem planen wir ab September einen Vorbereitungskurs für die Prüfung – vormittags von 9 bis 12 Uhr oder abends von 18 bis 21 Uhr. Bitte schreiben Sie uns bis zum 30. Juni, ob Sie daran teilnehmen möchten.","Mit freundlichen Grüßen\nSabine Krüger\nLeitung Sprachschule Kontakt"],"instruction":"Antworten Sie auf die E-Mail. Schreiben Sie etwas zu allen vier Punkten:","points":["was Ihnen im Kurs gut gefallen hat","was die Schule Ihrer Meinung nach ändern sollte","ob Sie am Vorbereitungskurs teilnehmen und welche Zeit Ihnen passt","eine Frage, die Sie zur Prüfung haben"],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss.","model":{"label":"Beispiel für eine Antwort, die alle vier Leitpunkte behandelt (ca. 170 Wörter)","text":"Betreff: Ihre E-Mail zum Kurs B1 – Meinung und Anmeldung\n\nSehr geehrte Frau Krüger,\n\nvielen Dank für Ihre E-Mail. Der Kurs hat mir insgesamt sehr gut gefallen. Besonders gut fand ich, dass wir viel gesprochen haben und dass Frau Bauer jeden Fehler geduldig erklärt hat. Auch die Gruppe war sehr nett – wir haben uns oft nach dem Kurs noch getroffen.\n\nÄndern sollten Sie meiner Meinung nach zwei Dinge: Der Raum im ersten Stock ist für 18 Personen zu klein, im Sommer war es dort sehr heiß. Außerdem hätte ich gern mehr Übungen zum Hörverstehen gemacht, das fällt vielen von uns noch schwer.\n\nAm Vorbereitungskurs möchte ich gern teilnehmen. Da ich vormittags arbeite, passt mir nur der Abendkurs von 18 bis 21 Uhr. Bitte melden Sie mich dafür an.\n\nEine Frage habe ich noch: Wann findet die nächste Prüfung statt, und bis wann muss man sich dafür anmelden? Ich möchte die Prüfung gern noch in diesem Jahr machen.\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüßen\nAna Silva","marks":["","","1","2","3","4","",""],"notes":"Leitpunkte\n1 Gut gefallen → viel gesprochen, geduldige Lehrerin, nette Gruppe\n2 Ändern → Raum zu klein/heiß, mehr Hörverstehen\n3 Teilnahme? Zeit? → ja, Abendkurs, weil vormittags Arbeit\n4 Frage zur Prüfung → Termin und Anmeldefrist\nAufbau Betreff · Anrede in der Sie-Form (Schulleitung, halbformell) · Einleitung mit Bezug auf die E-Mail · Schluss · Grußformel und Name\nBewertung\nI Inhalt: alle vier Leitpunkte, passend zur Situation. Jeder fehlende Leitpunkt kostet eine Stufe.\nII Kommunikative Gestaltung: Register (Sie), Aufbau, Verknüpfungen wie besonders, außerdem, da, deshalb.\nIII Formale Richtigkeit: Fehler dürfen das Verständnis nicht stören.\nTypische Fehler: Leitpunkt 4 (eigene Frage) vergessen, weil die Schule nicht danach fragt · nur Lob, keine Kritik (Leitpunkt 2) · Uhrzeit ohne Begründung · du statt Sie gegenüber der Schulleitung."}}},"audio":[{"src":"telc%20B1%20Modelltest%202.1.mp3","dur":246.75},{"src":"telc%20B1%20Modelltest%202.2.mp3","dur":478.15},{"src":"telc%20B1%20Modelltest%202.3.mp3","dur":418.17}],"minutes":{"hoeren":22},"pdf":"telc%20B1%20Modelltest%202.pdf","pages":{"loesung":19,"muster":20,"kommentar":24,"hoertexte":22}},"3":{"id":3,"roman":"III","lesen":{"t1":{"instruction":"Lesen Sie die Überschriften a–j und die Texte 1–5. Finden Sie für jeden Text die passende Überschrift. Sie können jede Überschrift nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 1–5 auf dem Antwortbogen.","headlines":[{"letter":"a","text":"Stadt finanziert Schulbus für zwei Kilometer"},{"letter":"b","text":"Ein süßes Hobby breitet sich in der Stadt aus"},{"letter":"c","text":"Bibliothek wandelt sich zum Aufenthaltsort"},{"letter":"d","text":"Zwanzig Stunden im Monat für ein eigenes Zimmer"},{"letter":"e","text":"Reparatur-Treff: Geräte abgeben und später abholen"},{"letter":"f","text":"Karlsruhe verkauft Honig vom Rathausdach"},{"letter":"g","text":"Gemeinsam zu Fuß statt allein im Auto der Eltern"},{"letter":"h","text":"Wer sein Gerät retten will, muss selbst mit anpacken"},{"letter":"i","text":"Bibliothek in Mainz verleiht immer weniger Medien"},{"letter":"j","text":"Studentin zahlt für 20 uadratmeter nur 20 Euro Miete"}],"texts":[{"no":"1","paragraphs":["Der Toaster ist kaputt, der Reißverschluss klemmt, das Fahrradlicht geht nicht? Wegwerfen muss man solche Dinge aber noch nicht. Im Repair-Café im Stadtteilzentrum Süd stehen jeden ersten Samstag im Monat 15 Freiwillige bereit – Elektriker, Schneiderinnen, Fahrradmechaniker, alle im Ruhestand. Bezahlt wird nichts, nur Ersatzteile kosten etwas. Eine Werkstatt, in der man sein Gerät abgibt und später abholt, ist das Café allerdings nicht: Wer nicht selbst mit anpacken will, wird wieder nach Hause geschickt. „Die Leute sollen verstehen, wie ihre Geräte funktionieren“, sagt Organisator Rolf Kern. Beim letzten Termin brachten die Besucher 60 Gegenstände mit, 45 davon funktionieren wieder. Nur bei Smartphones und Laptops müssen die Helfer meist passen."]},{"no":"2","paragraphs":["Jeden Morgen um 7.30 Uhr startet der „Laufbus“ der Grundschule Weststadt: 25 Kinder gehen gemeinsam zu Fuß zur Schule, begleitet von zwei Elternteilen, die sich wöchentlich abwechseln. Unterwegs gibt es fünf „Haltestellen“, an denen weitere Kinder zusteigen. Eingeführt hat die Schule den Laufbus, weil vor dem Schultor jeden Morgen Chaos herrschte: Zu viele Eltern brachten ihre Kinder mit dem Auto, mehrfach kam es beinahe zu Unfällen. Einen echten Schulbus hatte die Stadt abgelehnt – zu teuer für zwei Kilometer. Seit dem Start vor einem halben Jahr fahren nur noch halb so viele Autos vor, und die Kinder kommen nach Auskunft der Lehrkräfte wacher in den Unterricht."]},{"no":"3","paragraphs":["Auf dem Dach des Rathauses in Karlsruhe summt es: Seit drei Jahren stehen dort sechs Bienenvölker, gepflegt von Angestellten der Stadt, die das Imkern in einem Kurs gelernt haben. Den Honig verkauft die Stadt nicht, obwohl Läden angefragt haben; sie verschenkt ihn bei Empfängen und an Schulklassen, die das Dach besuchen. Den Bienen gehe es in der Stadt oft besser als auf dem Land, erklärt Stadtimkerin Petra Sauer: In Parks und Gärten blühe fast das ganze Jahr etwas, und Gift werde dort nicht gespritzt. Das Beispiel hat Nachahmer gefunden: 40 Karlsruher haben den Kurs inzwischen absolviert und halten selbst Bienen – auf Balkonen und in Hinterhöfen."]},{"no":"4","paragraphs":["Die Stadtbibliothek Mainz hat im vergangenen Jahr so viele Medien verliehen wie noch nie – doch immer weniger davon sind gedruckte Bücher. Fast die Hälfte aller Ausleihen entfiel auf E-Books und Hörbücher; bei den Jugendlichen liegt der Anteil sogar bei 70 Prozent. Leer ist das Gebäude deshalb keineswegs: Es kommen mehr Menschen als früher, allerdings nicht, um Bücher mitzunehmen, sondern um zu lernen, zu arbeiten oder Freunde zu treffen. Leiterin Ute Brandt spricht von einem „Ort zum Bleiben“. Die Konsequenz: Im nächsten Jahr werden zwei Drittel der Regale im Erdgeschoss abgebaut; an ihre Stelle treten Arbeitsplätze und ein Café."]},{"no":"5","paragraphs":["Studentin Lea Krämer, 22, wohnt in einem Haus mit 120 Quadratmetern und Garten – und zahlt keinen Cent Miete. Ihr Vermieter ist der 81-jährige Walter Bode, der seit dem Tod seiner Frau allein in dem Haus lebt. Statt Geld gibt Lea Zeit: Für jeden Quadratmeter ihres Zimmers hilft sie eine Stunde im Monat, also 20 Stunden – sie kauft ein, mäht den Rasen und begleitet Herrn Bode zum Arzt. Zusammengebracht hat die beiden das Projekt „Wohnen für Hilfe“ des Studentenwerks, das inzwischen 60 solcher Partnerschaften betreut. „Interessierte Studierende haben wir mehr als genug“, sagt Leiterin Miriam Koch. „Woran es fehlt, sind Ältere, die bereit sind, ein Zimmer abzugeben.“"]}],"items":[{"no":"1","answer":"h"},{"no":"2","answer":"g"},{"no":"3","answer":"b"},{"no":"4","answer":"c"},{"no":"5","answer":"d"}]},"t2":{"instruction":"Lesen Sie den Text und die Aufgaben 6–10. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 6–10 auf dem Antwortbogen.","kind":"article","title":"Ein Jahr ohne Smartphone","lead":"Tim Berger, 29, hat zwölf Monate lang auf sein Smartphone verzichtet. Ein Selbstversuch mit Überraschungen.","paragraphs":["„Irgendwann habe ich nachgezählt“, erzählt Tim Berger. „150-mal am Tag habe ich auf mein Handy geschaut.“ Der Grafiker aus Hannover merkte, dass er kein Buch mehr zu Ende las und abends schlecht einschlief. Seine Freundin hatte ihm schon länger vorgeschlagen, das Gerät wenigstens am Wochenende auszuschalten; den Anstoß für den radikalen Schritt gab aber ein Zeitungsartikel über einen Lehrer, der ein Jahr ohne Smartphone gelebt hatte. Am 1. Januar legte Tim sein Smartphone in eine Schublade und kaufte für 20 Euro ein altes Handy, mit dem man nur telefonieren und SMS schreiben kann. „Meine Freunde haben gewettet, dass ich nach zwei Wochen aufgebe.“","Die ersten Wochen waren mühsam. Fahrkarten druckte er zu Hause aus, in fremden Städten kaufte er sich einen Stadtplan aus Papier. „Verlaufen habe ich mich trotzdem nur einmal“, sagt er. Schwieriger war es mit den Freunden: Viele verabreden sich nur noch in Gruppen-Chats, und Einladungen erreichten Tim oft erst, wenn er nachfragte. Zwei Geburtstagsfeiern hat er auf diese Weise verpasst. „Ich musste wieder anrufen. Anfangs fanden das alle komisch, dann fanden es alle schön.“","Nach etwa drei Monaten kamen die ersten Veränderungen. Er las wieder – zwölf Bücher in einem Jahr, so viele wie in den fünf Jahren davor zusammen. Er schlief besser, weil kein Bildschirm mehr neben dem Bett lag. Und er lernte seine Nachbarn kennen: „Wenn man im Hausflur nicht aufs Handy schaut, redet man plötzlich mit den Leuten.“ Langeweile habe er zum ersten Mal seit Jahren wieder gespürt – und sie sei längst nicht so schlimm gewesen wie befürchtet.","Ganz ohne Internet ging es allerdings nicht. Als Grafiker muss Tim E-Mails schreiben und Dateien mit Kunden austauschen. Dafür nutzte er den Computer im Büro – und ausschließlich dort; seinen Laptop hatte er für das Jahr einem Freund geliehen. „Nach 18 Uhr war ich nicht erreichbar. Meine Kunden haben sich schneller daran gewöhnt als ich selbst.“ Einen Auftrag habe er deswegen nicht verloren, einen aber fast: Eine Agentur hatte ihn an einem Freitagabend angerufen und erst am Montag wieder erreicht. „Der Auftrag kam trotzdem – mit einer Woche Verspätung.“","Seit Januar hat Tim Berger wieder ein Smartphone. „Auf Dauer geht es nicht ohne, allein wegen der Bankgeschäfte.“ Aber er hat sich Regeln gesetzt: keine sozialen Netzwerke auf dem Handy, der Ton bleibt aus, und nachts liegt das Gerät in der Küche. Nur eine Regel hat er nach wenigen Wochen wieder aufgegeben – das Handy im Büro zu lassen, wenn er mittags essen geht. Ob er das Experiment empfiehlt? „Nicht jedem und nicht für ein ganzes Jahr. Aber zwei Wochen sollte jeder mal probieren. Man erfährt eine Menge über sich selbst.“"],"source":"","taskInstruction":"","items":[{"no":"6","stem":"Zu dem Experiment entschloss sich Tim Berger, nachdem","options":{"a":"seine Freundin ihm ein Jahr Verzicht vorgeschlagen hatte.","b":"er von einer ähnlichen Erfahrung eines anderen gelesen hatte.","c":"er mit seinen Freunden um zwei Wochen gewettet hatte."},"answer":"b"},{"no":"7","stem":"Im Kontakt mit Freunden","options":{"a":"verzichtete Tim darauf, jemanden persönlich anzurufen.","b":"wurde er von seinen Freunden aus den Chats entfernt.","c":"erfuhr er von manchen Treffen erst auf eigene Nachfrage."},"answer":"c"},{"no":"8","stem":"Nach einigen Monaten","options":{"a":"las Tim in kurzer Zeit so viel wie zuvor in mehreren Jahren.","b":"fand Tim die neu entstandene Langeweile schwer erträglich.","c":"schlief Tim schlechter, weil er abends nun länger las als früher."},"answer":"a"},{"no":"9","stem":"Für seine Arbeit","options":{"a":"ging Tim nur an einem einzigen Ort ins Internet.","b":"musste Tim einen Auftrag an eine Agentur abgeben.","c":"nutzte Tim nach 18 Uhr den Laptop eines Freundes."},"answer":"a"},{"no":"10","stem":"Seit dem Ende des Experiments","options":{"a":"benutzt Tim sein Smartphone wieder ohne jede Einschränkung.","b":"lässt Tim das Handy im Büro, wenn er mittags essen geht.","c":"rät Tim anderen zu einem kürzeren Verzicht als seinem eigenen."},"answer":"c"}]},"t3":{"instruction":"Lesen Sie die Situationen 11–20 und die Anzeigen a–l. Finden Sie für jede Situation die passende Anzeige. Sie können jede Anzeige nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 11–20 auf dem Antwortbogen. Wenn Sie zu einer Situation keine Anzeige finden, markieren Sie ein x.","items":[{"no":"11","text":"Platten und kaputte Bremsen – übermorgen brauchen Sie Ihr Rad wieder.","answer":"h"},{"no":"12","text":"Nachdem Sie die B1-Prüfung bestanden haben, wollen Sie abends weiterlernen.","answer":"x"},{"no":"13","text":"Ihre Eltern wollen eine Woche Räder leihen; die Mutter braucht ein E-Bike.","answer":"b"},{"no":"14","text":"Verschenken möchten Sie Ihr Sofa, transportieren können Sie es aber nicht.","answer":"j"},{"no":"15","text":"Für Ihre dreijährige Tochter suchen Sie zwei Wochen Ferienbetreuung.","answer":"x"},{"no":"16","text":"Wie bekommen Sie günstig Schrank und Bett nach Hause, wenn Sie kein Auto haben?","answer":"g"},{"no":"17","text":"Der Arzt hat Physiotherapie verschrieben; Zeit haben Sie erst nach 18 Uhr.","answer":"a"},{"no":"18","text":"Bevor der Rücken Probleme macht, möchten Sie in einer Gruppe etwas für ihn tun.","answer":"l"},{"no":"19","text":"Ein Festmenü kochen lernen – das wäre Ihr Geschenk zum Geburtstag Ihres Partners.","answer":"d"},{"no":"20","text":"Spanisch lernen ja – aber nur am Wochenende haben Sie Zeit.","answer":"i"}],"infos":[{"letter":"a","header":"PRAXIS FÜR PHYSIOTHERAPIE AM STADTGARTEN","tag":"Krankengymnastik · Manuelle Therapie · Massage · Rückentherapie","title":"Sie haben ein Rezept vom Arzt? Rufen Sie an – Termine auch kurzfristig und abends bis 20 Uhr.","subtitle":"","facts":[],"body":["Damit Sie nach der Arbeit kommen können, behandeln wir Montag bis Freitag bis 20 Uhr, samstags bis 13 Uhr. Einzelbehandlung in ruhigen Räumen, alle Kassen und privat. Nach jeder Behandlung bekommen Sie Übungen für zu Hause. Hausbesuche nach Absprache, Praxis barrierefrei mit Aufzug."],"footer":"Mo–Fr 7–20 Uhr, Sa 8–13 Uhr · Tel. 0761 / 12 12 12","design":"greyband"},{"letter":"b","header":"RADSTATION","tag":"","title":"","subtitle":"FAHRRADVERLEIH AM HAUPTBAHNHOF","facts":["Fahrrad · Tag 12 €, Woche 50 €","E-Bike · Tag 25 €, Woche 120 €","Kinderrad, Anhänger · Tag 8 €, Woche 30 €"],"body":["Helm, Schloss und Stadtplan inklusive, Einführung für E-Bike-Neulinge kostenlos. Je länger Sie mieten, desto günstiger wird es. Reservierung online empfohlen, besonders in den Ferien. Reparaturen führen wir nur an unseren eigenen Leihrädern durch."],"footer":"Täglich 8–20 Uhr · Bahnhofsvorplatz, Ausgang Süd · www.radstation-freiburg.de","design":"mono"},{"letter":"c","header":"MAMMA ROSA","tag":"49 € für zwei Personen inkl. Lieferung","title":"Neu: Geburtstagsmenü frei Haus","subtitle":"PIZZA · PASTA · SALATE · LIEFERSERVICE","facts":[],"body":["Unser Festmenü für zwei zum Geburtstag: Antipasti, hausgemachte Pasta nach Wahl, Dessert und eine Flasche Wein – mit Kerze und Glückwunschkarte, fertig zubereitet und heiß geliefert. Sie müssen nur den Tisch decken. Lieferung in 40 Minuten im ganzen Stadtgebiet, ab 15 € kostenlos."],"footer":"Täglich 11–23 Uhr · Tel. 0761 / 44 44 44 · Bestellung auch über unsere App","design":"badge"},{"letter":"d","header":"Kochschule Löffel","tag":"","title":"","subtitle":"Kurs „Menü für zwei“ – kochen lernen für besondere Anlässe","facts":["Samstag 16–20 Uhr · 79 € inkl. Zutaten, Rezeptheft und einem Glas Wein","Auch als Geschenkgutschein · Weitere Kurse: Italienisch, Brot backen, vegetarische Küche"],"body":["Lernen Sie an einem Nachmittag ein festliches 3-Gänge-Menü, das Sie zu Hause sicher nachkochen können – von der Vorspeise bis zum Dessert, mit Tipps zu Einkauf, Zeitplan und Tischdekoration. Für Anfänger, keine Vorkenntnisse nötig, maximal 10 Personen. Am Ende essen wir gemeinsam."],"footer":"Kaiserstr. 30 · Tel. 0761 / 23 23 23 · www.kochschule-loeffel.de","design":"hotel"},{"letter":"e","header":"KINDERBETREUUNG","tag":"KLEINANZEIGEN","title":"","subtitle":"","facts":[],"body":["Tagesmutter (mit Zertifikat) betreut Kinder von 1 bis 3 Jahren in kleiner Gruppe, Mo–Fr 7.30–15 Uhr, in einem Haus mit Garten in Herdern. Gesundes Mittagessen, viel Bewegung draußen, feste Rituale. Nur feste Plätze mit Vertrag (mindestens 6 Monate), keine Ferien- oder Notbetreuung. Zwei Plätze frei ab Januar. Tel. 0761 / 78 78 78","Babysitter gesucht für zwei Abende pro Monat, Kinder 4 und 7, Nähe Stühlinger, 12 €/Std., Tel. 0170 / 11 22 33 44","Kinderwagen, Kombi, dunkelblau, sehr gut erhalten, 120 €, Tel. 0761 / 40 40 40"],"footer":"","design":"classified"},{"letter":"f","header":"SPRACHSCHULE DIALOG","tag":"BERTOLDSTR. 8","title":"Deutsch am Abend","subtitle":"","facts":["A2 · Mo + Mi 18.30–20.30 Uhr, Start 6. Oktober, 12 Wochen · 390 €","B1 · Di + Do 18.30–20.30 Uhr, Start 7. Oktober, 12 Wochen · 390 €","B2 · nur als Intensivkurs vormittags, Mo–Fr 9–12 Uhr · 480 €"],"body":["Sie arbeiten tagsüber? Bei uns lernen Sie abends – in kleinen Gruppen mit höchstens 8 Teilnehmern, viel Sprechen, Prüfungsvorbereitung inklusive. Einstufungstest kostenlos."],"footer":"Abendkurse für B2 und C1 bieten wir zurzeit nicht an. · Tel. 0761 / 90 90 90","design":"inst"},{"letter":"g","header":"Möbelkiste","tag":"","title":"","subtitle":"SECOND HAND · INDUSTRIESTR. 4 · 400 M² AUSSTELLUNG","facts":["Betten, Schränke, Tische, Sofas, Regale ab 20 €","Lieferung in Freiburg 25 €","Lieferung mit Aufbau 45 €"],"body":["Alles geprüft, gereinigt und sofort verfügbar, jede Woche neue Ware. Lieferung meist am nächsten Tag, bis in die Wohnung. Ankauf gebrauchter Möbel nur bei Anlieferung in unser Lager, Barzahlung sofort. Studierende erhalten 10 % Rabatt."],"footer":"Mo–Sa 10–18 Uhr · Tel. 0761 / 31 31 31","design":"corp"},{"letter":"h","header":"VELO-DOKTOR","tag":"","title":"","subtitle":"FAHRRADWERKSTATT · HABSBURGERSTR. 12","facts":["Platten flicken 12 €","Bremsen einstellen / Beläge ab 15 €","Frühjahrs-Check komplett 39 €"],"body":["Reparaturen aller Art: Platten, Bremsen, Schaltung, Licht, Kette – für alle Marken, auch E-Bikes. Ersatzteile auf Lager, deshalb Express-Service: heute gebracht, morgen fertig (Platten oft sofort, 12 €). Kostenvoranschlag vorher, Festpreise. Wer wartet, bekommt einen Kaffee."],"footer":"Di–Sa 9–18 Uhr, Montag geschlossen · Tel. 0761 / 27 27 27","design":"dashed"},{"letter":"i","header":"KURSE","tag":"KLEINANZEIGEN","title":"","subtitle":"","facts":[],"body":["Deutsch B2 – Intensivkurs. Mo–Fr 9–12.30 Uhr, 8 Wochen, Start 13. Oktober, 480 € inkl. Lehrbuch, Einstufung kostenlos. Volkshochschule Freiburg, Tel. 0761 / 36 36 36","¡Hola! Spanisch für Anfänger (A1). Samstags 10–13 Uhr, 10 Wochen, 160 €. Lehrerin aus Madrid, kleine Gruppe (max. 8), viel Sprechen von der ersten Stunde an, Material inklusive. Start nach den Herbstferien, Schnupperstunde kostenlos. Tel. 0176 / 99 88 77 66","Gitarrenunterricht für Erwachsene, Di abends, 25 €/Std., Tel. 0761 / 50 50 50"],"footer":"","design":"classified"},{"letter":"j","header":"Verein Neustart","tag":"","title":"","subtitle":"Möbelspende? Wir holen ab!","facts":[],"body":["Gut erhaltene Möbel holen wir kostenlos bei Ihnen ab – Sofas, Betten, Schränke, Tische, Stühle, auch Haushaltsgeräte. Unsere Fahrer kommen mit dem Transporter zum vereinbarten Termin, tragen die Möbel hinunter, und Sie bekommen eine Spendenquittung. Die Möbel geben wir über das Sozialamt an bedürftige Familien weiter (Abgabe nur mit Berechtigungsschein). Bitte schicken Sie uns vorher ein Foto per WhatsApp."],"footer":"Tel. 0761 / 55 66 77, Mo–Fr 9–16 Uhr · www.neustart-freiburg.de","design":"logo","deco":{"ini":"N"}},{"letter":"k","header":"","tag":"Für Kinder von 6 bis 12 Jahren","title":"Sommerferien!","subtitle":"FERIENPROGRAMM DER STADT FREIBURG","facts":[],"body":["Zwei Wochen Sport, Basteln, Theater und Ausflüge in den Schwarzwald, Mo–Fr 8–16 Uhr, mit Mittagessen und Getränken. Betreuung durch ausgebildete Pädagogen, Gruppen nach Alter. 120 € pro Woche, Geschwisterkind 90 €, Ermäßigung mit Familienpass. Anmeldung bis 15. Juni online, die Plätze sind begrenzt."],"footer":"Info-Abend für Eltern: 5. Juni, 19 Uhr, Rathaus · www.freiburg.de/ferien","design":"stripes"},{"letter":"l","header":"Rückenfit","tag":"VHS GESUNDHEIT","title":"Übungen für einen starken Rücken","subtitle":"","facts":["Montag 19–20 Uhr, 10 Abende · 65 €","Teilnehmer · max. 12","Leitung · Physiotherapeutin"],"body":["Gruppe für alle, die viel sitzen und Beschwerden vorbeugen möchten: Kräftigung, Dehnung, Haltung im Alltag. Bitte bequeme Kleidung und Handtuch mitbringen, Matten sind vorhanden. Vorbeugung, kein Ersatz für eine ärztliche Behandlung – bei akuten Schmerzen bitte zuerst zum Arzt."],"footer":"Anmeldung: vhs-freiburg.de oder Tel. 0761 / 36 36 36 · Kursraum: VHS, Rotteckring 12","design":"mono"}]},"sb1":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 21–30. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 21–30 auf dem Antwortbogen.","paragraphs":["Sehr geehrte Frau Neumann,","auf der Suche {{21}} einer Ferienwohnung am Bodensee bin ich im Internet auf Ihr Angebot in Meersburg gestoßen, {{22}} mich sehr angesprochen hat. Meine Familie und ich beabsichtigen, vom 5. bis zum 19. August zwei Wochen in der Region zu verbringen. Wir sind vier Personen: mein Mann, ich und unsere beiden Kinder {{23}} Alter von 6 und 9 Jahren.","{{24}} Beschreibung nach verfügt die Wohnung über zwei Schlafzimmer. Gibt es darüber hinaus einen abschließbaren Raum, in {{25}} wir unsere Fahrräder sicher unterbringen können? Da wir unseren kleinen Hund mitnehmen möchten, wäre es außerdem hilfreich zu wissen, {{26}} Haustiere bei Ihnen gestattet sind.","Könnten Sie mir bitte mitteilen, ob die Wohnung im genannten Zeitraum noch frei ist und {{27}} sich der Preis für zwei Wochen beläuft? {{28}} sie bereits vergeben sein, kämen wir {{29}} auch eine Woche später.","Ich {{30}} Ihnen für eine baldige Rückmeldung sehr verbunden.","Mit freundlichen Grüßen\nSabine Kowalczyk"],"items":[{"no":"21","options":{"a":"für","b":"nach","c":"zu"},"answer":"b"},{"no":"22","options":{"a":"das","b":"was","c":"dem"},"answer":"a"},{"no":"23","options":{"a":"in","b":"vom","c":"im"},"answer":"c"},{"no":"24","options":{"a":"Ihre","b":"Ihrer","c":"Ihren"},"answer":"b"},{"no":"25","options":{"a":"dem","b":"den","c":"der"},"answer":"a"},{"no":"26","options":{"a":"wenn","b":"dass","c":"ob"},"answer":"c"},{"no":"27","options":{"a":"worauf","b":"wofür","c":"woran"},"answer":"a"},{"no":"28","options":{"a":"Falls","b":"Sollte","c":"Wäre"},"answer":"b"},{"no":"29","options":{"a":"jedenfalls","b":"allenfalls","c":"notfalls"},"answer":"c"},{"no":"30","options":{"a":"hätte","b":"würde","c":"wäre"},"answer":"c"}]},"sb2":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 31–40. Benutzen Sie die Wörter a–o. Jedes Wort passt nur einmal. Markieren Sie Ihre Lösungen für die Aufgaben 31–40 auf dem Antwortbogen.","title":"","paragraphs":["Hallo Daniel,","vielen Dank für deine Karte aus Portugal! Ich hoffe, du hast dich gut erholt. Bei mir war in den letzten Wochen einiges los: Ich habe meine Abschlussprüfung {{31}}, {{32}} ich in der Nacht davor fast nicht geschlafen hatte. Am Tag der Ergebnisse konnte ich vor {{33}} gar nichts essen. Jetzt bin ich vor allem erleichtert – und ein bisschen stolz.","Und noch eine Neuigkeit: Ich habe mich bei einem Krankenhaus in Bremen beworben und {{34}} gleich nach dem Gespräch {{35}}. Der Vertrag ist zunächst auf zwei Jahre {{36}}, und {{37}} die Nachtschichten muss ich mich erst noch gewöhnen. In Bremen kenne ich allerdings noch {{38}}, und ich habe noch keine {{39}}, wo ich wohnen werde – bezahlbare Zimmer gibt es in der Stadt kaum. Ein Kollege, {{40}} ich von meiner Suche erzählt habe, will sich umhören. Bis Ende August muss ich auf jeden Fall umziehen.","Du hast doch erzählt, dass du ein Praktikum in Hamburg machst. Weißt du schon, wann es losgeht? Das wäre nicht weit von Bremen – dann könnten wir uns öfter sehen. Melde dich, sobald du wieder zu Hause bist!","Liebe Grüße\nNina"],"words":{"a":"AHNUNG","b":"AN","c":"AUF","d":"AUFGEREGT","e":"AUFREGUNG","f":"BEFRISTET","g":"BESTANDEN","h":"DEM","i":"DEN","j":"EINGESTELLT","k":"NIEMANDEN","l":"OBWOHL","m":"TROTZDEM","n":"WURDE","o":"WÜRDE"},"items":[{"no":"31","answer":"g"},{"no":"32","answer":"l"},{"no":"33","answer":"e"},{"no":"34","answer":"n"},{"no":"35","answer":"j"},{"no":"36","answer":"f"},{"no":"37","answer":"b"},{"no":"38","answer":"k"},{"no":"39","answer":"a"},{"no":"40","answer":"h"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Texte nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Die Sprecherin ist bei ihren Kindern strenger als bei sich selbst.","answer":"F"},{"no":"42","text":"Der Sprecher bereut es, sein Auto verkauft zu haben.","answer":"F"},{"no":"43","text":"Die Sprecherin kocht unter der Woche kaum noch frisch.","answer":"R"},{"no":"44","text":"Der Sprecher hält Sparen grundsätzlich für überflüssig.","answer":"F"},{"no":"45","text":"Für die Sprecherin ist eine große Reise zurzeit wichtiger als eine eigene Wohnung.","answer":"R"}]},"t2":{"instruction":"Sie hören nun ein Gespräch. Dazu sollen Sie zehn Aufgaben lösen. Sie hören das Gespräch zweimal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu eine Minute Zeit.","items":[{"no":"46","text":"Das Gespräch wird im Radiostudio aufgenommen.","answer":"F"},{"no":"47","text":"Herr Feld hat seine erste Ausbildung kurz vor dem Abschluss abgebrochen.","answer":"R"},{"no":"48","text":"Sein Onkel hätte ihn nach der Ausbildung gern weiter beschäftigt.","answer":"R"},{"no":"49","text":"Herr Feld hat sich schon vor seinem Praktikum viel mit Kindern beschäftigt.","answer":"F"},{"no":"50","text":"Als Herr Feld die Ausbildung machte, wurden die Auszubildenden bereits bezahlt.","answer":"F"},{"no":"51","text":"In seiner Kita arbeitet außer ihm noch ein Mann.","answer":"R"},{"no":"52","text":"Kinder, die sich verletzt haben, wenden sich eher an die Kolleginnen als an ihn.","answer":"R"},{"no":"53","text":"Herr Feld hält sein Gehalt für angemessen, weil man davon leben kann.","answer":"F"},{"no":"54","text":"Herr Feld hat das Angebot, stellvertretender Leiter zu werden, angenommen.","answer":"F"},{"no":"55","text":"Für eine Weiterbildung zur Sprachförderung ist Herr Feld bereits angemeldet.","answer":"R"}]},"t3":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören jeden Text zweimal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen für die Aufgaben 56–60 auf dem Antwortbogen. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch.","readNote":"","items":[{"no":"56","text":"Herr Aydin kann sein Auto heute noch bis 20 Uhr abholen.","answer":"R"},{"no":"57","text":"Wer einen Sitzplatz reserviert hatte, bekommt im Intercity den gleichen Platz.","answer":"F"},{"no":"58","text":"Am Sonntag fahren die Busse vom Messeparkplatz später los als am Samstag.","answer":"R"},{"no":"59","text":"Der Film war ursprünglich für 20 Uhr 15 angekündigt.","answer":"R"},{"no":"60","text":"Das Training am Freitag findet auf jeden Fall statt.","answer":"F"}]}},"schreiben":{"intro":"","task":{"lead":"Sie haben von Ihrem Freund Pavel folgende E-Mail erhalten:","mail":["Hallo ______,","stell dir vor, ich habe gestern im Internet eine Stellenanzeige von deiner Firma gesehen – sie suchen jemanden für das Lager, ab sofort! Du weißt ja, dass ich seit drei Monaten etwas Neues suche.","Wie ist es denn bei euch: Arbeitszeiten, Kollegen, Chef? Und was meinst du, soll ich mich bewerben? Ich habe schon lange keine Bewerbung mehr geschrieben und bin ein bisschen unsicher.","Melde dich bitte bald, die Anzeige ist nur noch bis Freitag online!","Viele Grüße\nPavel"],"instruction":"Antworten Sie auf die E-Mail. Schreiben Sie etwas zu allen vier Punkten:","points":["wie die Arbeit in Ihrer Firma ist (Arbeitszeiten, Kollegen …)","ob Sie Pavel raten, sich zu bewerben, und warum","Tipps für die Bewerbung","wie Sie Pavel sonst noch helfen können"],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss.","model":{"label":"Beispiel für eine Antwort, die alle vier Leitpunkte behandelt (ca. 170 Wörter)","text":"Betreff: Stelle im Lager – bewirb dich!\n\nHallo Pavel,\n\ndas ist ja ein Zufall! Die Arbeit im Lager ist körperlich anstrengend, aber die Stimmung ist gut. Wir arbeiten in zwei Schichten, von 6 bis 14 Uhr oder von 14 bis 22 Uhr, das wechselt jede Woche. Die Kollegen sind hilfsbereit, und unser Chef, Herr Koch, ist streng, aber fair. Überstunden werden bezahlt.\n\nIch finde, du solltest dich unbedingt bewerben. Du hast in Polen schon in einer Spedition gearbeitet, und einen Gabelstaplerschein hast du auch – genau so jemanden suchen sie.\n\nFür die Bewerbung brauchst du nur einen kurzen Lebenslauf und ein Anschreiben. Schreib nicht zu lang und nenne deinen Staplerschein gleich am Anfang. Ein Foto ist nicht nötig. Schick alles als PDF an Frau Berg aus der Personalabteilung, ihre Adresse steht in der Anzeige.\n\nWenn du willst, lese ich deine Bewerbung vorher durch – schick sie mir einfach bis Donnerstag. Und ich sage Herrn Koch morgen, dass du dich bewirbst, das hilft bestimmt. Wenn du zum Gespräch eingeladen wirst, üben wir vorher zusammen.\n\nViel Glück und melde dich!\n\nLiebe Grüße\nElif","marks":["","","1","2","3","4","",""],"notes":"Leitpunkte\n1 Arbeit in der Firma → Schichten, Kollegen, Chef, Überstunden\n2 Bewerben? Warum? → ja, weil Erfahrung und Staplerschein passen\n3 Tipps → kurzer Lebenslauf, Staplerschein zuerst, PDF an Frau Berg\n4 Weitere Hilfe → Bewerbung durchlesen, mit dem Chef sprechen, Gespräch üben\nAufbau Betreff · Anrede in der du-Form (Freund, informell) · Einleitung mit Bezug auf die E-Mail · Schluss · Grußformel und Name\nBewertung\nI Inhalt: alle vier Leitpunkte, passend zur Situation. Jeder fehlende Leitpunkt kostet eine Stufe.\nII Kommunikative Gestaltung: Register (du), Aufbau, Verknüpfungen wie aber, weil, wenn, und.\nIII Formale Richtigkeit: Fehler dürfen das Verständnis nicht stören.\nTypische Fehler: Leitpunkt 4 (weitere Hilfe) vergessen, weil Pavel nicht danach fragt · „Ja, bewirb dich“ ohne Begründung · Sie statt du bei einem Freund · die Frist (Freitag) ignorieren."}}},"audio":[{"src":"telc%20B1%20Modelltest%203.1.mp3","dur":268.51},{"src":"telc%20B1%20Modelltest%203.2.mp3","dur":708.0},{"src":"telc%20B1%20Modelltest%203.3.mp3","dur":406.54}],"minutes":{"hoeren":26},"pdf":"telc%20B1%20Modelltest%203.pdf","pages":{"loesung":19,"muster":20,"kommentar":24,"hoertexte":22}},"4":{"id":4,"roman":"IV","lesen":{"t1":{"instruction":"Lesen Sie die Überschriften a–j und die Texte 1–5. Finden Sie für jeden Text die passende Überschrift. Sie können jede Überschrift nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 1–5 auf dem Antwortbogen.","headlines":[{"letter":"a","text":"Studie: Kaffee hilft nachmittags besser als Schlaf"},{"letter":"b","text":"Was übrig ist, gehört allen im Viertel"},{"letter":"c","text":"Senioren geben Gymnasiasten Nachhilfe im Café"},{"letter":"d","text":"Kurz schlafen, besser arbeiten: Erste Firmen ziehen mit"},{"letter":"e","text":"Landkreis richtet neue Buslinie ein"},{"letter":"f","text":"Zehntklässler nehmen sich Zeit für ältere Menschen"},{"letter":"g","text":"Freiwillige bringen Lebensmittel ins Dorf"},{"letter":"h","text":"Ottersheim: Ehrenamtliche Fahrer halten das Dorf mobil"},{"letter":"i","text":"Freiburger Kühlschrank: Angebot nur für Bedürftige"},{"letter":"j","text":"Ein Kollege mit Fell verändert das Klassenklima"}],"texts":[{"no":"1","paragraphs":["In der Freiburger Wiehre steht seit einem Jahr ein Kühlschrank auf der Straße. Er gehört niemandem – und allen. Wer zu viel eingekauft hat oder verreist, stellt seine Lebensmittel hinein; wer etwas braucht, nimmt es sich heraus. Bezahlt wird nichts. Zwei Bäckereien und ein Supermarkt aus dem Viertel liefern abends, was sich nicht mehr verkaufen lässt, und eine Gruppe Freiwilliger prüft täglich, ob alles noch frisch ist. „Anfangs hielten viele das für ein Angebot, das sich nur an Arme richtet“, sagt Organisatorin Hanna Brecht. „Inzwischen bedienen sich hier Studierende, Familien und Rentner ganz selbstverständlich.“ Vier weitere Kühlschränke sind in der Stadt geplant."]},{"no":"2","paragraphs":["Vor fünf Jahren strich der Landkreis die Buslinie nach Ottersheim, weil zu wenige Fahrgäste mitfuhren. Seit dem Frühjahr verfügt das Dorf trotzdem wieder über einen Bus – einen Kleinbus mit acht Sitzen, den 14 Freiwillige abwechselnd steuern, die meisten von ihnen Rentner. Der Bürgerbus verkehrt fünfmal täglich in die Kreisstadt, eine Fahrt kostet zwei Euro, und mitfahren darf jeder. Genutzt wird er vor allem von älteren Menschen, die zum Arzt oder zum Einkaufen wollen, nachmittags auch von Schülern. „Ein Ersatz für die alte Linie sind wir nicht“, räumt Fahrer Dieter Kolb, 68, ein. „Aber besser als gar nichts.“"]},{"no":"3","paragraphs":["Bruno hat viermal in der Woche Dienst – montags bis donnerstags ab 8 Uhr in der Klasse 2a der Grundschule Waldstraße in Kassel. Bruno ist ein Labrador und gehört Lehrerin Miriam Falk, die ihn seit zwei Jahren in den Unterricht mitnimmt. Erlaubt ist das nur, weil er eine Prüfung zum Schulhund bestanden hat. Die Kinder streicheln ihn in den Pausen, lesen ihm vor und sind abwechselnd für Wasser und Futter zuständig. „Seit Bruno da ist, ist die Klasse deutlich ruhiger geworden“, berichtet Falk. „Die Kinder wissen: Wird es zu laut, muss Bruno raus.“ Ein Kind mit einer Tierhaarallergie gibt es in der Klasse nicht – das wurde mit den Eltern vorab geklärt."]},{"no":"4","paragraphs":["Zwanzig Minuten Schlaf nach dem Mittagessen genügen, um am Nachmittag konzentrierter zu arbeiten. Zu diesem Ergebnis kommt eine Studie der Universität Hamburg mit 400 Büroangestellten. Wer kurz geschlafen hatte, machte anschließend weniger Fehler und fühlte sich zufriedener als Kollegen, die stattdessen Kaffee getrunken hatten. Entscheidend ist allerdings die Dauer: Wer länger als eine halbe Stunde schläft, ist danach häufig müder als zuvor. Einige Unternehmen haben bereits reagiert. Die Versicherung Nordwest in Hamburg hat einen Ruheraum mit sechs Liegen eingerichtet, der den Mitarbeitern in der Mittagspause zur Verfügung steht. Der Raum sei fast immer belegt, heißt es aus der Firma."]},{"no":"5","paragraphs":["Wie verschicke ich ein Foto? Wie funktioniert ein Videoanruf? Jeden Mittwochnachmittag beantworten Schülerinnen und Schüler des Gymnasiums Kiel- Nord solche Fragen – im Café des benachbarten Seniorentreffs. Das Projekt „Digital-Café“ besteht seit einem Jahr, 20 Jugendliche aus der zehnten Klasse beteiligen sich. Jede Seniorin und jeder Senior erhält einen festen Partner, der sich Zeit nimmt und alles so oft erklärt, wie es nötig ist. „Meine Enkel haben dafür keine Geduld“, sagt Erika Manz, 79. „Hier fragt niemand, warum ich das immer noch nicht begriffen habe.“ Die Schüler bekommen für ihr Engagement einen Vermerk im Zeugnis – und von den Senioren regelmäßig selbst gebackenen Kuchen."]}],"items":[{"no":"1","answer":"b"},{"no":"2","answer":"h"},{"no":"3","answer":"j"},{"no":"4","answer":"d"},{"no":"5","answer":"f"}]},"t2":{"instruction":"Lesen Sie den Text und die Aufgaben 6–10. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 6–10 auf dem Antwortbogen.","kind":"article","title":"Urlaub im Haus von Fremden","lead":"Familie Brandt aus Kiel fährt in den Ferien nicht ins Hotel, sondern in fremde Häuser – und lässt Fremde in ihr eigenes.","paragraphs":["Zwei Erwachsene, zwei Kinder, zwei Wochen Sommerurlaub: Als Katja Brandt vor vier Jahren die Preise für Ferienwohnungen in Portugal sah, wollte sie die Reise fast absagen. „Für eine Wohnung mit zwei Schlafzimmern hätten wir fast 3.000 Euro bezahlt“, erzählt die 42-jährige Lehrerin. Eine Kollegin hatte ihr günstige Hotels an der Algarve empfohlen, doch die waren längst ausgebucht. Dann stieß sie in einer Zeitschrift auf einen Artikel über Haustausch: Zwei Familien wohnen für eine bestimmte Zeit jeweils im Haus der anderen – ohne dass jemand Miete bezahlt. „Ich habe gedacht: Das probieren wir.“","Die Familie meldete sich bei einer Internetseite an, die Tauschpartner vermittelt. Die Mitgliedschaft kostet 60 Euro im Jahr; für den einzelnen Tausch fällt nichts mehr an. Man lädt Fotos vom eigenen Haus hoch, beschreibt die Umgebung und gibt an, wohin man reisen möchte. Bereits nach drei Wochen meldete sich eine Familie aus Lissabon, die im Sommer die Ostsee kennenlernen wollte. Nach ein paar Videoanrufen war die Sache beschlossen.","Ganz ohne Bedenken war der erste Tausch nicht. „Ich hatte Angst, dass Fremde in unseren Schränken wühlen“, gibt Katja Brandt zu. Die Familie räumte ihre wichtigen Unterlagen und den Schmuck ins Arbeitszimmer und schloss es ab; die übrigen Räume blieben, wie sie waren. Für die Gäste stellten die Brandts eine Mappe mit allem Wichtigen zusammen: wie die Waschmaschine funktioniert, wo der beste Bäcker ist, wann der Müll abgeholt wird. Eine Nachbarin erhielt einen Schlüssel – allerdings nur für Notfälle, regelmäßig nach dem Haus sehen soll sie nicht.","Auch die Katze bleibt beim Tausch zu Hause. „Die Gäste füttern sie – dafür kümmern wir uns in Lissabon um die Pflanzen auf dem Balkon“, sagt Brandt. Zu Bruch gegangen ist in drei Jahren nur ein Glas. Dafür haben die Kinder inzwischen Freunde in Portugal, und die beiden Familien schicken sich zu Weihnachten Pakete. Gespart hat die Familie rund 2.500 Euro pro Urlaub – die Flüge muss sie allerdings nach wie vor selbst bezahlen.","Nachteile gibt es dennoch. Vor jeder Reise muss das Haus gründlich geputzt werden, und man ist an feste Termine gebunden: Beide Familien müssen zur gleichen Zeit Ferien haben. „Und man muss damit leben, dass die Gäste vielleicht anders mit den Dingen umgehen als man selbst“, sagt Brandt. „Wer das nicht kann, sollte es lieber lassen.“ Die Familie aus Lissabon hat für den nächsten Sommer bereits wieder angefragt – doch die Brandts haben abgesagt. „Lissabon war wunderschön, aber wir wollen etwas Neues sehen.“ Im Moment schreiben sie mit einer Familie aus Montreal; fest zugesagt hat noch niemand."],"source":"","taskInstruction":"","items":[{"no":"6","stem":"Zum Haustausch kam Familie Brandt, weil","options":{"a":"eine Kollegin von ihren Erfahrungen damit berichtet hatte.","b":"Katja Brandt zufällig einen Bericht darüber gelesen hatte.","c":"die Hotels an der Algarve für die Reisekasse zu teuer waren."},"answer":"b"},{"no":"7","stem":"Die Kosten für den Tausch","options":{"a":"beschränken sich auf einen jährlichen Mitgliedsbeitrag.","b":"hängen davon ab, wie oft eine Familie im Jahr tauscht.","c":"betragen für jede Familie 60 Euro pro Aufenthalt."},"answer":"a"},{"no":"8","stem":"Vor der ersten Abreise","options":{"a":"brachten die Brandts Unterlagen und Schmuck zu einer Nachbarin.","b":"räumten die Brandts sämtliche Zimmer des Hauses gründlich aus.","c":"sperrten die Brandts einen Raum ab, den die Gäste nicht nutzen sollten."},"answer":"c"},{"no":"9","stem":"Während des Tauschs","options":{"a":"teilen sich beide Familien die Kosten für die Flüge.","b":"versorgt jede Familie etwas, das der anderen gehört.","c":"blieb in drei Jahren alles im Haus unbeschädigt."},"answer":"b"},{"no":"10","stem":"Für den kommenden Sommer","options":{"a":"haben die Brandts erneut mit der Familie aus Lissabon getauscht.","b":"ist bereits eine Familie aus Kanada als Partner bestätigt.","c":"haben die Brandts ein Angebot bewusst nicht angenommen."},"answer":"c"}]},"t3":{"instruction":"Lesen Sie die Situationen 11–20 und die Anzeigen a–l. Finden Sie für jede Situation die passende Anzeige. Sie können jede Anzeige nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 11–20 auf dem Antwortbogen. Wenn Sie zu einer Situation keine Anzeige finden, markieren Sie ein x.","items":[{"no":"11","text":"Sie haben keine Berufsausbildung, möchten aber am Wochenende dazuverdienen.","answer":"f"},{"no":"12","text":"Mit 35 können Sie noch nicht schwimmen. Das wollen Sie jetzt ändern.","answer":"b"},{"no":"13","text":"Am verregneten Sonntag wollen Ihre Kinder unbedingt baden gehen.","answer":"i"},{"no":"14","text":"Sie können nicht tanzen, aber auf Ihrer Hochzeit im Mai soll es klappen.","answer":"a"},{"no":"15","text":"Für neue Papiere brauchen Sie ein aktuelles Bild – Zeit haben Sie erst nach 18 Uhr.","answer":"l"},{"no":"16","text":"Beim Umzug wollen Sie Ihre Einbauküche zu Geld machen, ohne selbst zu schrauben.","answer":"e"},{"no":"17","text":"Während Sie in den großen Ferien arbeiten, soll sich Ihre Tochter (10) tagsüber viel bewegen.","answer":"c"},{"no":"18","text":"Ab Herbst arbeiten Sie dienstags bis donnerstags. Wer passt dann auf Ihren Zweijährigen auf?","answer":"j"},{"no":"19","text":"Die Waschmaschine ist kaputt und soll repariert werden.","answer":"x"},{"no":"20","text":"Obwohl Sie Mo–Fr von 8 bis 17 Uhr arbeiten, wollen Sie den Führerschein machen.","answer":"x"}],"infos":[{"letter":"a","header":"Tanzschule Rheinschwung","tag":"KÖLN-EHRENFELD","title":"Crashkurs für Brautpaare","subtitle":"","facts":[],"body":["An fünf Abenden lernen Sie Walzer und Discofox – so kommen Sie an Ihrem großen Tag sicher über das Parkett und haben auch auf der Party danach Spaß. Kurse Mo–Do 19–20.30 Uhr, Beginn jeden ersten Montag im Monat. Keine Vorkenntnisse nötig, kleine Gruppen, Getränke inklusive. Privatstunden auf Anfrage."],"footer":"Venloer Str. 210 · Tel. 0221 / 80 80 80 · 149 € pro Paar","design":"barhead"},{"letter":"b","header":"Schwimmschule Delfin","tag":"31 °C LEHRBECKEN","title":"Nie richtig schwimmen gelernt? Keine Sorge!","subtitle":"KURSE FÜR KINDER UND ERWACHSENE","facts":[],"body":["Kurs für erwachsene Nichtschwimmer: 10 Termine, immer mittwochs 19.30–20.15 Uhr, im flachen, warmen Lehrbecken. Höchstens sechs Teilnehmende, geduldige Trainerinnen – niemand muss ins tiefe Wasser, bevor er sich sicher fühlt. Kinderkurse ab 5 Jahren Mo + Fr nachmittags. Kein freies Schwimmen – bei uns gibt es nur Kurse."],"footer":"Erwachsenenkurs 160 € · im Stadionbad · Anmeldung: www.delfin-koeln.de","design":"bignum"},{"letter":"c","header":"SOMMER-SPORTCAMP","tag":"","title":"","subtitle":"SV KÖLN-SÜLZ · KINDER VON 8 BIS 12 JAHREN","facts":["4 Termine in den Sommerferien je 1 Woche","Preis pro Woche 150 €","Vereinsmitglieder / Geschwister 120 € / –20 €"],"body":["Eine Woche Fußball, Schwimmen, Klettern, Leichtathletik und Ballspiele mit unseren Trainern – jeden Tag etwas Neues. Mo–Fr 8–16 Uhr, mit warmem Mittagessen, Obst und Getränken. Sportkleidung und Badesachen mitbringen, Gruppen nach Alter."],"footer":"Anmeldung nur online, begrenzte Plätze · www.sv-suelz.de/camp","design":"stripes"},{"letter":"d","header":"Pflegedienst Lebensfreude","tag":"STELLENANGEBOT","title":"Wochenendjob in der Pflege","subtitle":"","facts":["Ihre Aufgaben · Pflegehelfer/in für Wochenenddienste: Samstag und Sonntag 7–14 Uhr, Hausbesuche bei unseren Patienten im Stadtgebiet, festes Team","Wir erwarten · abgeschlossene Ausbildung in der Pflege (mindestens einjährig), Führerschein Klasse B, Freundlichkeit und Zuverlässigkeit","Wir bieten · gute Bezahlung mit Wochenendzuschlag, Dienstwagen, Fortbildungen, unbefristeter Vertrag"],"body":[],"footer":"Bewerbung mit Lebenslauf und Zeugnissen: info@pflege-lebensfreude.de · Tel. 0221 / 66 66 66","design":"inst"},{"letter":"e","header":"WIR KAUFEN","tag":"MÖBEL-ANKAUF SCHMIDT · SEIT 1998","title":"","subtitle":"","facts":["gebrauchte Küchen – komplett, mit oder ohne Geräte","Möbel aller Art, auch ganze Wohnungen (Haushaltsauflösung)","Elektrogeräte bis 5 Jahre alt","Faire Preise, Bezahlung sofort in bar","Abbau und Abholung durch unser Team, auch kurzfristig und am Wochenende – Sie müssen nichts selbst machen","Fotos und Maße per WhatsApp schicken – Angebot innerhalb von 24 Stunden"],"body":[],"footer":"Tel. 0221 / 44 33 22 · Mo–Sa 8–19 Uhr","design":"greyband"},{"letter":"f","header":"Café Sonnenschein","tag":"14 € pro Stunde plus Trinkgeld","title":"Aushilfe (m/w/d) für Samstag und Sonntag, 8–14 Uhr","subtitle":"WIR SUCHEN VERSTÄRKUNG · SEVERINSTRASSE 41","facts":[],"body":["Kaffee kochen, Brötchen belegen, Gäste bedienen, Kasse. Keine Vorkenntnisse nötig – wir zeigen Ihnen alles, wichtig sind Freundlichkeit und Zuverlässigkeit. Minijob oder Teilzeit, Frühstück inklusive, auch für Studierende und Rentner geeignet. Beginn sofort oder nach Absprache."],"footer":"Kommen Sie einfach vorbei und fragen Sie nach Frau Bauer – täglich 8–18 Uhr.","design":"badge"},{"letter":"g","header":"","tag":"JEDEN FREITAG AB 20 UHR","title":"Tanzcafé Belvedere","subtitle":"","facts":[],"body":["Freies Tanzen für Paare und Singles: Walzer, Tango, Discofox – am ersten Freitag im Monat mit Live-Band. Kein Unterricht, keine Anmeldung: einfach vorbeikommen und lostanzen. Getränke und kleine Snacks an der Bar, Garderobe kostenlos. Auch Hochzeitsgesellschaften sind herzlich willkommen – fragen Sie nach unserem Saal für bis zu 80 Personen."],"footer":"Aachener Str. 45 · www.belvedere-koeln.de · Eintritt 8 €","design":"inverse"},{"letter":"h","header":"","tag":"ab 349 €","title":"Waschmaschinen-Center Huber","subtitle":"ELEKTRO HUBER · HAUSHALTSGERÄTE SEIT 1971","facts":[],"body":["Über 200 Geräte im Geschäft: Waschmaschinen, Trockner, Kühlschränke, Herde, Geschirrspüler – alle bekannten Marken, energiesparend und leise. Beratung durch Fachpersonal, Lieferung und Anschluss in Köln kostenlos. Ihr Altgerät nehmen wir beim Kauf eines neuen Gerätes kostenlos mit und entsorgen es fachgerecht. 0 %-Finanzierung bis 24 Monate, 5 Jahre Garantie auf Wunsch."],"footer":"Mo–Sa 9–19 Uhr · Neusser Str. 80 · www.elektro-huber.de","design":"badge"},{"letter":"i","header":"AquaLand Köln-Süd","tag":"HALLENBAD · SAUNA · FAMILIENBEREICH","title":"","subtitle":"","facts":["Eintritt · 3 Stunden","Erwachsene · 6 €","Kinder bis 14 Jahre · 3 €","Familienkarte (2 Erwachsene + 3 Kinder) · 14 €"],"body":["25-Meter-Becken, Nichtschwimmerbecken, Rutsche und ein Kinderbereich mit 32 Grad warmem Wasser – Spaß bei jedem Wetter. Cafeteria mit Blick aufs Becken, Aqua-Fitness Di + Do 18 Uhr. Schwimmkurse bieten wir leider nicht an."],"footer":"Mo–Fr 6.30–22 Uhr, Sa + So 8–20 Uhr · Brühler Str. 90","design":"inst"},{"letter":"j","header":"Tagesmutter Claudia","tag":"","title":"","subtitle":"LIEBEVOLLE BETREUUNG IN NIPPES","facts":["Für Kinder von 1 bis 3 Jahren, höchstens vier Kinder gleichzeitig","Mo–Fr 7.30–16 Uhr – Sie buchen die Tage, die Sie brauchen, auch einzelne Tage","Freie Plätze ab September","Großer Garten, gesundes Mittagessen (selbst gekocht), Vorlesen, Musik, Spielplatz","Zertifizierte Tagesmutter mit 12 Jahren Erfahrung, Zuschuss über das Jugendamt möglich"],"body":[],"footer":"Kennenlernen jederzeit nach Absprache · Tel. 0221 / 27 27 27","design":"rounded"},{"letter":"k","header":"FAHRSCHULE AMPEL","tag":"3 WOCHEN","title":"Intensivkurs: in 3 Wochen zur Prüfung","subtitle":"Führerschein Klasse B · seit 1992 · Bonner Str. 14","facts":["Theorie Di + Do 18–19.30 Uhr, Lern-App inklusive","Fahrstunden Mo–Fr zwischen 8 und 16 Uhr (abends und am Wochenende leider keine Fahrstunden)","Anmeldung Mo–Fr 17–19 Uhr im Büro"],"body":[],"footer":"Autos mit Automatik oder Schaltung · Sehtest bei uns · Tel. 0221 / 55 66 77","design":"bignum"},{"letter":"l","header":"FOTO & VIDEO","tag":"KLEINANZEIGEN","title":"","subtitle":"","facts":[],"body":["Hochzeitsfotografin Lena Kessler – natürliche Bilder und Videos von Ihrem großen Tag, kostenloses Vorgespräch, Termine auch am Wochenende, Tel. 0221 / 12 12 12","Passfotos sofort! Biometrische Fotos für Ausweis, Reisepass, Visum und Führerschein – in fünf Minuten fertig zum Mitnehmen, ohne Termin. Außerdem Bewerbungsfotos und Familienporträts im Studio. Mo–Sa 10–20 Uhr. Fotostudio Blende 8, Zülpicher Str. 30, Tel. 0221 / 66 55 44","Verkaufe Spiegelreflexkamera mit zwei Objektiven, kaum benutzt, 250 €, Tel. 0170 / 98 76 54"],"footer":"","design":"classified"}]},"sb1":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 21–30. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 21–30 auf dem Antwortbogen.","paragraphs":["Sehr geehrte Damen und Herren,","hiermit kündige ich meinen Vertrag mit der Nummer 3345 fristgerecht {{21}} 31. Dezember. In den vergangenen drei Jahren habe ich regelmäßig in Ihrem Studio trainiert und war mit dem Angebot immer zufrieden. {{22}} eines beruflichen Wechsels ziehe ich jedoch im Januar nach Hamburg, {{23}} ich Ihr Studio dann nicht mehr nutzen kann.","Laut Ihren Vertragsbedingungen kann man bei einem Umzug in eine andere Stadt vorzeitig kündigen, {{24}} man einen Nachweis vorlegt. Eine Kopie {{25}} neuen Arbeitsvertrags habe ich dieser E-Mail beigefügt. Wenn Sie weitere Unterlagen brauchen, schicke ich {{26}} Ihnen gern.","Ich bitte Sie, mir die Kündigung schriftlich zu bestätigen und den Beitrag für Januar nicht mehr {{27}} meinem Konto abzubuchen. Falls trotzdem Geld abgebucht wird, gehe ich davon aus, {{28}} Sie es sofort zurücküberweisen.","Zum Schluss möchte ich mich für die gute Betreuung bedanken; {{29}} gehört auch der freundliche Umgang an der Rezeption. Meine neue Adresse, {{30}} Sie die Bestätigung bitte senden, finden Sie unten.","Mit freundlichen Grüßen\nMarkus Lorenz\nHafenstraße 12, 20457 Hamburg"],"items":[{"no":"21","options":{"a":"bis","b":"am","c":"zum"},"answer":"c"},{"no":"22","options":{"a":"Trotz","b":"Wegen","c":"Statt"},"answer":"b"},{"no":"23","options":{"a":"sodass","b":"indem","c":"weil"},"answer":"a"},{"no":"24","options":{"a":"obwohl","b":"damit","c":"wenn"},"answer":"c"},{"no":"25","options":{"a":"meinen","b":"meines","c":"meinem"},"answer":"b"},{"no":"26","options":{"a":"ihnen","b":"es","c":"sie"},"answer":"c"},{"no":"27","options":{"a":"von","b":"aus","c":"bei"},"answer":"a"},{"no":"28","options":{"a":"ob","b":"dass","c":"wenn"},"answer":"b"},{"no":"29","options":{"a":"Dafür","b":"Darauf","c":"Dazu"},"answer":"c"},{"no":"30","options":{"a":"an die","b":"an der","c":"an das"},"answer":"a"}]},"sb2":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 31–40. Benutzen Sie die Wörter a–o. Jedes Wort passt nur einmal. Markieren Sie Ihre Lösungen für die Aufgaben 31–40 auf dem Antwortbogen.","title":"","paragraphs":["Lieber Tom,","ich brauche deine Hilfe! Nina wird am 20. Juni 30, und ich möchte eine Überraschungsparty für sie organisieren. Bisher ahnt sie überhaupt nichts – also bitte kein Wort zu ihr! Allein schaffe ich das nicht, ich bin also {{31}} deine Hilfe angewiesen.","Zwanzig Leute habe ich eingeladen, und alle haben bereits {{32}}. Ich weiß allerdings noch nicht, {{33}} meine Wohnung dafür groß genug ist. Einige wollen sich um die Musik kümmern, aber das Essen ist noch offen – Kochen zählt nicht zu meinen Stärken. Könntest du wieder deine Lasagne machen? Alle schwärmen noch vom letzten Jahr. Außerdem brauche ich jemanden, der Nina am Nachmittag {{34}} Geburtstags ablenkt. Du {{35}} nur bis 18 Uhr mit ihr im Kino sitzen. Ich möchte auf keinen Fall, {{36}} sie früher nach Hause kommt.","Du weißt ja, {{37}} gern sie tanzt – wir brauchen also eine gute Playlist. Und hast du einen {{38}}, was wir ihr schenken könnten? Gib mir bitte bis Donnerstag {{39}}. Ich bin jetzt schon ganz {{40}} auf ihr Gesicht!","Liebe Grüße\nSofia"],"words":{"a":"ABGESAGT","b":"AN","c":"AUF","d":"BESCHEID","e":"DASS","f":"IHREM","g":"IHRES","h":"MUSSTEST","i":"MÜSSTEST","j":"NEUGIERIG","k":"OB","l":"STOLZ","m":"VORSCHLAG","n":"WIE","o":"ZUGESAGT"},"items":[{"no":"31","answer":"c"},{"no":"32","answer":"o"},{"no":"33","answer":"k"},{"no":"34","answer":"g"},{"no":"35","answer":"i"},{"no":"36","answer":"e"},{"no":"37","answer":"n"},{"no":"38","answer":"m"},{"no":"39","answer":"d"},{"no":"40","answer":"j"}]}},"hoeren":{"t1":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Texte nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.","items":[{"no":"41","text":"Die Sprecherin kauft ausnahmslos alles im Internet.","answer":"F"},{"no":"42","text":"Der Sprecher gibt zu, dass er sich nicht immer an seinen eigenen Rat hält.","answer":"R"},{"no":"43","text":"Für die Sprecherin ist das Gespräch beim Einkaufen ebenso wichtig wie der Einkauf selbst.","answer":"R"},{"no":"44","text":"Der Sprecher ist bereit, im Geschäft etwas mehr zu bezahlen als im Internet.","answer":"R"},{"no":"45","text":"Die Sprecherin stört es nicht, dass jede Woche viele Pakete kommen.","answer":"F"}]},"t2":{"instruction":"Sie hören nun ein Gespräch. Dazu sollen Sie zehn Aufgaben lösen. Sie hören das Gespräch zweimal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch auf dem Antwortbogen.","readNote":"Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu eine Minute Zeit.","items":[{"no":"46","text":"In der Schule durfte Frau Voss im Chor nicht hörbar mitsingen.","answer":"R"},{"no":"47","text":"Frau Voss hatte sich den Gesangsunterricht zum Geburtstag gewünscht.","answer":"F"},{"no":"48","text":"Zur ersten Probe kamen weniger als zehn Personen.","answer":"R"},{"no":"49","text":"Frau Voss leitet die Proben des Chors selbst.","answer":"F"},{"no":"50","text":"Ein Teil der Mitgliedsbeiträge geht an den Chorleiter.","answer":"R"},{"no":"51","text":"Wer mehrere Proben hintereinander unentschuldigt verpasst, darf beim nächsten Konzert nicht mitsingen.","answer":"R"},{"no":"52","text":"Der Chor singt ab und zu auch klassische Musik.","answer":"F"},{"no":"53","text":"Die meisten Mitglieder singen heute deutlich besser als früher.","answer":"R"},{"no":"54","text":"Ein Sänger hat den Chor nach dem ersten Konzert verlassen.","answer":"F"},{"no":"55","text":"Wer mitsingen möchte, kann schon in der nächsten Woche zur Probe kommen.","answer":"F"}]},"t3":{"instruction":"Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören jeden Text zweimal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen für die Aufgaben 56–60 auf dem Antwortbogen. Markieren Sie PLUS (+) gleich richtig und MINUS (–) gleich falsch.","readNote":"","items":[{"no":"56","text":"In Richtung Frankfurt gibt es zurzeit keine Behinderungen mehr.","answer":"R"},{"no":"57","text":"Ein gefundener Kinderrucksack kann im Erdgeschoss abgeholt werden.","answer":"R"},{"no":"58","text":"Der Kurs Spanisch A2 beginnt eine Woche später als geplant.","answer":"F"},{"no":"59","text":"Der ICE nach Hamburg fährt heute etwa eine Viertelstunde später ab als geplant.","answer":"F"},{"no":"60","text":"Wer heute nicht ins Kino kommen kann, bekommt an der Kasse sein Geld zurück.","answer":"F"}]}},"schreiben":{"intro":"","task":{"lead":"Sie haben von der Hausverwaltung Ihres Wohnhauses folgende E-Mail erhalten:","mail":["Sehr geehrte Frau / Sehr geehrter Herr ______,","in den letzten Wochen haben sich mehrere Bewohner des Hauses Lindenstraße 12 bei uns beschwert: Aus Ihrer Wohnung sei es mehrmals nach 22 Uhr sehr laut gewesen – Musik, Stimmen und Türenschlagen im Treppenhaus.","Wir möchten Sie an die Hausordnung erinnern: Von 22 bis 7 Uhr gilt Nachtruhe. Bitte nehmen Sie bis zum 15. des Monats zu der Beschwerde Stellung.","Mit freundlichen Grüßen\nSabine Hartmann\nHausverwaltung Nord GmbH"],"instruction":"Antworten Sie auf die E-Mail. Schreiben Sie etwas zu allen vier Punkten:","points":["warum es in den letzten Wochen laut war","wie Sie das Problem in Zukunft vermeiden wollen","ein Vorschlag, wie Sie mit den Nachbarn ins Gespräch kommen können","eine Frage zur Hausordnung"],"closing":"Überlegen Sie sich vor dem Schreiben eine passende Reihenfolge der Punkte, einen passenden Betreff, eine passende Anrede, Einleitung und einen passenden Schluss.","model":{"label":"Beispiel für eine Antwort, die alle vier Leitpunkte behandelt (ca. 180 Wörter)","text":"Betreff: Ihre E-Mail zur Lärmbeschwerde – Lindenstraße 12\n\nSehr geehrte Frau Hartmann,\n\nvielen Dank für Ihre E-Mail. Es tut mir sehr leid, dass sich die Nachbarn gestört gefühlt haben.\n\nEs gab einen besonderen Grund: Im Mai hatten mein Bruder und ich Geburtstag, und an zwei Wochenenden war Besuch aus Spanien bei uns. Die Gäste sind erst spät gegangen, und im Treppenhaus war es dabei wohl lauter, als ich gedacht habe.\n\nDas wird nicht wieder vorkommen. Größere Feiern mache ich in Zukunft nur noch am Wochenende und informiere die Nachbarn vorher. Ab 22 Uhr stelle ich die Musik leise, und meine Gäste bitte ich, im Treppenhaus leise zu sein.\n\nAußerdem möchte ich mich bei den Nachbarn persönlich entschuldigen. Ich würde sie gern am nächsten Samstagnachmittag zu Kaffee und Kuchen in den Hof einladen. Wenn Sie einverstanden sind, hänge ich dafür einen Zettel an die Haustür.\n\nEine Frage habe ich noch: Gibt es laut Hausordnung auch am Nachmittag eine Ruhezeit, zum Beispiel zwischen 13 und 15 Uhr? Das möchte ich wissen, damit ich mich in Zukunft richtig verhalte.\n\nVielen Dank für Ihr Verständnis.\n\nMit freundlichen Grüßen\nElena Rossi","marks":["","","","1","2","3","4","",""],"notes":"Leitpunkte\n1 Warum laut? → Geburtstage, Besuch aus Spanien, Treppenhaus\n2 In Zukunft? → nur am Wochenende feiern, Nachbarn informieren, ab 22 Uhr leise\n3 Gespräch mit Nachbarn → Einladung zu Kaffee und Kuchen im Hof\n4 Frage zur Hausordnung → Ruhezeit am Nachmittag?\nAufbau Betreff · Anrede in der Sie-Form (Hausverwaltung, halbformell) · Einleitung mit Entschuldigung · Schluss · Grußformel und Name\nBewertung\nI Inhalt: alle vier Leitpunkte, passend zur Situation. Jeder fehlende Leitpunkt kostet eine Stufe.\nII Kommunikative Gestaltung: Register (Sie), Aufbau, Verknüpfungen wie dabei, in Zukunft, außerdem, damit.\nIII Formale Richtigkeit: Fehler dürfen das Verständnis nicht stören.\nTypische Fehler: sich nur rechtfertigen statt sich zu entschuldigen · Leitpunkt 3 (Gespräch mit den Nachbarn) vergessen · keine Frage stellen (Leitpunkt 4) · du statt Sie gegenüber der Hausverwaltung."}}},"audio":[{"src":"telc%20B1%20Modelltest%204.1.mp3","dur":352.57},{"src":"telc%20B1%20Modelltest%204.2.mp3","dur":736.21},{"src":"telc%20B1%20Modelltest%204.3.mp3","dur":648.88}],"minutes":{"hoeren":31},"pdf":"telc%20B1%20Modelltest%204.pdf","pages":{"loesung":19,"muster":20,"kommentar":24,"hoertexte":22}},"5":{"id":5,"roman":"V","lesen":{"t1":{"instruction":"Lesen Sie die Überschriften a–j und die Texte 1–5. Finden Sie für jeden Text die passende Überschrift. Sie können jede Überschrift nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 1–5 auf dem Antwortbogen.","headlines":[{"letter":"a","text":"Lastenräder gibt es nur noch gegen Gebühr"},{"letter":"b","text":"Jugendliche lesen mehr, als ihre Eltern glauben"},{"letter":"c","text":"Kita: Übernachten die ganze Woche erlaubt"},{"letter":"d","text":"Göttingen verbietet den Pappbecher"},{"letter":"e","text":"Ein Becher, der immer wieder zurückkommt"},{"letter":"f","text":"Erfurt: Betreuung, wenn andere Kitas längst geschlossen haben"},{"letter":"g","text":"Stadt schenkt Familien ein Lastenrad"},{"letter":"h","text":"Mit 72 Jahren zurück in den Beruf"},{"letter":"i","text":"Was mit 15 nicht möglich war, holt sie jetzt nach"},{"letter":"j","text":"Bonn: Schwere Einkäufe ohne Auto – die Stadt hilft"}],"texts":[{"no":"1","paragraphs":["Rund 15.000 Kaffeebecher landen in Göttingen täglich im Müll. Seit Oktober gibt es deshalb den „Göttinger Becher“: Wer seinen Kaffee zum Mitnehmen bestellt, erhält ihn auf Wunsch in einem stabilen Mehrwegbecher und zahlt dafür zwei Euro Pfand. Zurückgeben kann man den Becher in allen 60 beteiligten Cafés und Bäckereien – unabhängig davon, wo man ihn bekommen hat. Der Kaffee selbst kostet nicht mehr als vorher. Nach drei Monaten sind bereits 25.000 Becher im Umlauf. „Die meisten Kunden finden das gut“, berichtet Bäckerin Ute Krause. „Nur morgens um sieben, wenn es schnell gehen muss, verlangen manche noch den alten Pappbecher.“"]},{"no":"2","paragraphs":["Jugendliche lesen keine Bücher mehr? Eine Befragung der Universität Leipzig unter 3.000 Schülerinnen und Schülern zwischen 12 und 17 Jahren ergibt ein anderes Bild: Zwei Drittel greifen mindestens einmal pro Woche zu einem Buch, ein Viertel sogar täglich. Besonders gefragt sind Fantasy-Romane und Comics, daneben auch Sachbücher über Tiere und Technik. Aufschlussreich ist, wie die Jugendlichen an ihre Bücher kommen: Die Hälfte leiht sie in der Stadtbibliothek aus, viele tauschen mit Freunden, und nur jeder Fünfte kauft sich regelmäßig selbst eins. Die Eltern schätzen ihre Kinder dabei häufig falsch ein: 60 Prozent von ihnen sind überzeugt, dass ihr Kind kaum noch liest."]},{"no":"3","paragraphs":["Mit 15 musste Ingrid Sommer die Schule verlassen und in einer Fabrik arbeiten, weil ihre Familie auf das Geld angewiesen war. Heute, mit 72, sitzt sie wieder im Klassenzimmer: Seit zwei Jahren besucht sie das Abendgymnasium in Dortmund, dreimal pro Woche von 17 bis 21 Uhr. Ihre Mitschüler sind zwischen 19 und 45 Jahre alt. „Am Anfang haben sie mich für die Lehrerin gehalten“, erzählt sie lachend. Mathematik bereitet ihr Mühe, in Geschichte dagegen ist sie die Beste ihres Jahrgangs. Im kommenden Frühjahr legt sie die Abiturprüfung ab. Anschließend möchte sie Geschichte studieren – „nicht für einen Beruf, sondern weil es mich einfach interessiert“."]},{"no":"4","paragraphs":["Ein Wocheneinkauf für vier Personen, ein Kinderbett oder zwei Kisten Wasser: Für solche Transporte ist in Bonn kein eigenes Auto mehr nötig. Die Stadt hat zwölf elektrische Lastenräder angeschafft, die sich kostenlos für bis zu drei Tage ausleihen lassen. Die Räder stehen an Bibliotheken und Bürgerämtern, reserviert wird über das Internet. Erforderlich sind lediglich ein Ausweis und eine kurze Einweisung. Die Nachfrage ist so groß, dass die Räder an Wochenenden oft schon Wochen vorher ausgebucht sind. Im nächsten Jahr sollen deshalb 20 weitere hinzukommen. Wer sich ein eigenes Lastenrad zulegt, erhält von der Stadt außerdem einen Zuschuss von 500 Euro."]},{"no":"5","paragraphs":["Krankenschwestern, Busfahrer, Bäcker – zahlreiche Eltern arbeiten zu Zeiten, in denen Kitas geschlossen sind. In Erfurt gibt es seit September eine Lösung: Die Kita „Nachtfalter“ ist von Montagmorgen bis Samstagabend durchgehend geöffnet. 30 Kinder zwischen einem und sechs Jahren werden hier auch abends und nachts betreut. Sie essen gemeinsam, werden anschließend ins Bett gebracht und morgens von den Eltern abgeholt. Nutzen dürfen das Angebot ausschließlich Eltern im Schichtdienst, und kein Kind darf mehr als zwei Nächte pro Woche in der Kita verbringen. Die Warteliste ist bereits lang – das Jugendamt plant daher eine zweite Einrichtung."]}],"items":[{"no":"1","answer":"e"},{"no":"2","answer":"b"},{"no":"3","answer":"i"},{"no":"4","answer":"j"},{"no":"5","answer":"f"}]},"t2":{"instruction":"Lesen Sie den Text und die Aufgaben 6–10. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 6–10 auf dem Antwortbogen.","kind":"article","title":"Eine Woche Bauernhof statt Klassenzimmer","lead":"Auf dem Schulbauernhof Hohenfelde in Schleswig-Holstein lernen Stadtkinder, woher ihr Essen kommt.","paragraphs":["Es ist sechs Uhr morgens, und die Klasse 4b aus Hamburg steht im Kuhstall. Melken, Ställe ausmisten, Hühner füttern – so sieht ihr Stundenplan in dieser Woche aus. Der Schulbauernhof Hohenfelde nimmt seit zwölf Jahren Schulklassen auf. Anfangs kamen die Klassen lediglich für einen Tag; seit fünf Jahren bleiben sie von Montag bis Freitag. Untergebracht sind die 25 Kinder in einfachen Zimmern im ehemaligen Stall, die Lehrkräfte im Nebenhaus.","„Viele Kinder haben noch nie eine Kuh angefasst“, sagt Bäuerin Marion Lenz, die den Hof gemeinsam mit ihrem Mann bewirtschaftet. „Am ersten Tag weigern sie sich, in den Stall zu gehen, weil es stinkt. Am Freitag wollen sie nicht mehr nach Hause.“ Neben der Arbeit mit den Tieren stehen Brot backen, Käse herstellen und Gemüse ernten auf dem Programm. Gekocht wird gemeinsam – mit dem, was der Hof hergibt. Fleisch gibt es lediglich einmal in der Woche, am Donnerstag. Auf einen Fernseher wird verzichtet, und die Handys bleiben die ganze Woche im Schrank im Lehrerzimmer verschlossen. Wer zu Hause anrufen möchte, darf das abends mit dem Telefon des Hofes.","Lehrerin Sabine Roth war vor drei Jahren bereits einmal hier, damals mit einer anderen Klasse. „Kinder, die im Unterricht nie den Mund aufmachen, sind hier plötzlich die Chefs im Hühnerstall“, berichtet sie. „Und der stärkste Junge der Klasse hatte Angst vor den Gänsen.“ Gestritten wird weniger als in der Schule – nicht, weil die Kinder hier braver wären, sondern weil alle erschöpft sind: Um neun Uhr abends schlafen die meisten.","Die Woche kostet 190 Euro pro Kind. Darin sind Fahrt, Verpflegung und Übernachtung enthalten – nicht jedoch die Gummistiefel, für die die Eltern selbst sorgen müssen. „Die sind wichtiger als alles andere“, betont Roth. Wer die 190 Euro nicht aufbringen kann, erhält Hilfe vom Förderverein der Schule; in diesem Jahr war das bei fünf Kindern der Fall.","Am Freitagmittag holt der Bus die Klasse ab. Zum Abschied bekommt jedes Kind ein Glas Marmelade, das es selbst eingekocht hat. Lena, neun Jahre, weiß schon, was sie zu Hause erzählen wird: „Dass Milch warm ist, wenn sie aus der Kuh kommt. Das hat mir vorher keiner gesagt.“ Für das kommende Jahr ist der Hof bereits ausgebucht. Marion Lenz überlegt deshalb, ein zweites Schlafhaus zu errichten – dann könnten zwei Klassen gleichzeitig kommen. Ihr Mann ist skeptisch: Mehr Kinder bedeuten mehr Arbeit, und Personal ist auf dem Land schwer zu finden."],"source":"","taskInstruction":"","items":[{"no":"6","stem":"Der Aufenthalt der Schulklassen","options":{"a":"dauert heute länger als in den Anfangsjahren des Angebots.","b":"wird seit zwölf Jahren jeweils von Montag bis Freitag angeboten.","c":"findet für Kinder und Lehrkräfte im selben Gebäude statt."},"answer":"a"},{"no":"7","stem":"Beim Essen auf dem Hof gilt:","options":{"a":"Die Kinder bekommen die ganze Woche kein Fleisch zu essen.","b":"Die Bäuerin kocht jeden Tag allein für die ganze Gruppe.","c":"Verwendet wird vor allem, was auf dem Hof produziert wird."},"answer":"c"},{"no":"8","stem":"Lehrerin Sabine Roth beobachtet, dass","options":{"a":"sich die Kinder auf dem Hof besser benehmen als in der Schule.","b":"sich manche Kinder auf dem Hof ganz anders verhalten als sonst.","c":"die stärksten Kinder sich am wenigsten vor den Tieren fürchten."},"answer":"b"},{"no":"9","stem":"Die Eltern","options":{"a":"müssen die Fahrt zum Hof getrennt vom Beitrag bezahlen.","b":"erhalten die Gummistiefel vom Förderverein der Schule.","c":"können bei Bedarf Unterstützung für den Beitrag erhalten."},"answer":"c"},{"no":"10","stem":"Für das kommende Jahr","options":{"a":"kann der Hof keine weiteren Klassen mehr aufnehmen.","b":"ist der Bau eines zweiten Schlafhauses fest geplant.","c":"sucht das Ehepaar Lenz bereits zusätzliches Personal."},"answer":"a"}]},"t3":{"instruction":"Lesen Sie die Situationen 11–20 und die Anzeigen a–l. Finden Sie für jede Situation die passende Anzeige. Sie können jede Anzeige nur einmal benutzen. Markieren Sie Ihre Lösungen für die Aufgaben 11–20 auf dem Antwortbogen. Wenn Sie zu einer Situation keine Anzeige finden, markieren Sie ein x.","items":[{"no":"11","text":"Ihre Tochter (8. Klasse) hat im Zeugnis eine Fünf in Mathe.","answer":"h"},{"no":"12","text":"Sonntagabend: Die Wohnungstür ist zu, und der Schlüssel liegt drinnen.","answer":"a"},{"no":"13","text":"Einen zweiten Wohnungsschlüssel können Sie nur am Wochenende machen lassen.","answer":"x"},{"no":"14","text":"Ihr Auto muss zum TÜV, und beim Anhalten quietscht es.","answer":"b"},{"no":"15","text":"Von Freitag bis Sonntag brauchen Sie ein Auto, haben aber keine Kreditkarte.","answer":"i"},{"no":"16","text":"Seit Sie kein Fleisch mehr essen, fällt Ihnen in der Küche nichts Neues mehr ein.","answer":"e"},{"no":"17","text":"Am Sonntagvormittag möchten Sie mit Ihren Kleinkindern fleischlos essen gehen.","answer":"f"},{"no":"18","text":"Ihre Wände brauchen neue Farbe, aber Sie wollen das nicht selbst machen.","answer":"l"},{"no":"19","text":"Ihr Notebook bleibt beim Einschalten schwarz – übermorgen brauchen Sie es dringend.","answer":"k"},{"no":"20","text":"Kochen lernen in den Ferien – das wünscht sich Ihre neunjährige Tochter.","answer":"x"}],"infos":[{"letter":"a","header":"24h Schlüsselnotdienst Blitz","tag":"TAG UND NACHT · AUCH SONNTAGS UND FEIERTAGS","title":"Ausgesperrt? Schlüssel abgebrochen?","subtitle":"","facts":[],"body":["Wir sind in 30 Minuten bei Ihnen und öffnen Ihre Tür ohne Schaden. Faire Festpreise, die wir Ihnen schon am Telefon nennen – kein Nachtzuschlag, kein Wochenendzuschlag. Außerdem: Schlösser wechseln, Einbruchschutz, Tresore. Meisterbetrieb aus Leipzig, kein Callcenter, Ausweis wird gezeigt."],"footer":"Tel. 0341 / 24 24 24 · www.schluessel-blitz.de · Zahlung bar oder mit Karte","design":"inverse"},{"letter":"b","header":"Kfz-Meisterbetrieb Rädle","tag":"TÜV + AU · Di + Do","title":"","subtitle":"Reparaturen aller Marken · Prager Str. 130","facts":[],"body":["Bremsen, Reifen, Auspuff, Ölwechsel, Klimaanlage. TÜV und AU jeden Dienstag und Donnerstag direkt bei uns – kostenloser Check vorher, damit Ihr Auto die Prüfung sicher besteht. Bremsen prüfen wir sofort und kostenlos, Reparatur meist am selben Tag. Leihwagen für Werkstattkunden 15 € pro Tag (nur mit Kreditkarte), Hol- und Bringservice im Stadtgebiet. Kostenvoranschlag immer vorab."],"footer":"Mo–Fr 7.30–18 Uhr, Sa 8–12 Uhr · Tel. 0341 / 22 11 00","design":"barhead","deco":{"icon":"wrench"}},{"letter":"c","header":"Nachhilfe Mathe & Deutsch","tag":"","title":"","subtitle":"Lehramtsstudentin, 4. Semester, mit Erfahrung","facts":["18 € pro Stunde","erste Stunde gratis"],"body":["Ich gebe Nachhilfe für Grundschule bis Klasse 7 in Mathematik und Deutsch – geduldig, mit vielen Übungen und Spielen. Auch Vorbereitung auf den Übertritt und Hausaufgabenhilfe. Bei Ihnen zu Hause (Zentrum, Süd, Connewitz), nachmittags und am Wochenende. Für höhere Klassen kann ich leider keine Nachhilfe anbieten."],"footer":"Tel. 0176 / 22 33 44 55 (auch WhatsApp) · Referenzen von Eltern auf Wunsch","design":"serif"},{"letter":"d","header":"Computer-Service Kaufmann","tag":"","title":"","subtitle":"Reparatur · Aufrüstung · Beratung","facts":[],"body":["Desktop-Computer aller Marken: Netzteil, Festplatte, Grafikkarte, Lüfter, Windows neu installieren. Abholung und Rückgabe bei Ihnen zu Hause, kostenlos in Leipzig. Reparatur in der Regel 10 bis 14 Tage, Festpreis nach Kostenvoranschlag. Auch Zusammenbau von Gaming-PCs nach Ihren Wünschen.","Laptops und Tablets reparieren wir nicht."],"footer":"www.pc-kaufmann.de · Tel. 0341 / 80 80 80 · Mo–Fr 9–17 Uhr","design":"mono","deco":{"icon":"plug"}},{"letter":"e","header":"Kochschule Pfanne","tag":"","title":"","subtitle":"KOCHEN MIT SPASS · KARL-LIEBKNECHT-STR. 45","facts":["Vegetarisch","Italienisch","Brot backen","Asiatisch","Kinderkurs ab 12"],"body":["Vegetarisch kochen – abwechslungsreich durch die Woche: 4 Abende, 120 €. Sie lernen 16 Gerichte aus Italien, Indien, dem Orient und der Region, dazu Tipps zu Einkauf, Vorrat und Gewürzen. Kinderkurs in den Ferien ab 12 Jahren. Alle Kurse Mi + Fr 18–21 Uhr, maximal 12 Personen, Schürze und Rezepte inklusive, gemeinsames Essen am Ende."],"footer":"Tel. 0341 / 60 60 60 · www.kochschule-pfanne.de · Gutscheine erhältlich","design":"rounded"},{"letter":"f","header":"GASTRONOMIE","tag":"KLEINANZEIGEN","title":"","subtitle":"","facts":[],"body":["Grünkern – vegetarisches Restaurant. Vegetarisch und vegan, alles hausgemacht. Mittagstisch ab 8,50 €, abends 3-Gänge-Menü 24 €, sonntags Familienbrunch 10–14 Uhr. Familienfreundlich: Kinderteller, Hochstühle, Wickeltisch und Spielecke mit Büchern. Di–So 12–22 Uhr, Montag Ruhetag. Reservierung empfohlen: 0341 / 66 77 88, Karl-Heine-Str. 12","Eisdiele Venezia: 24 Sorten, auch vegan, täglich 11–21 Uhr, Markt 3","Koch/Köchin für Bistro gesucht, Teilzeit, Mo–Fr mittags, Tel. 0341 / 70 70 70"],"footer":"","design":"classified"},{"letter":"g","header":"Baumarkt Hammer","tag":"","title":"Streichen leicht gemacht – kostenloser Kurs jeden Samstag, 10 Uhr","subtitle":"FARBEN · TAPETEN · WERKZEUG · TORGAUER STR. 200","facts":[],"body":["In 90 Minuten zeigen wir Ihnen: Wände vorbereiten, abkleben, streichen ohne Streifen – danach schaffen Sie es selbst. Ihre Wunschfarbe mischen wir in 10 Minuten, jede Menge ab 1 Liter. Leihgeräte: Leitern, Bohrmaschinen, Tapeziertisch ab 5 € pro Tag. Lieferung großer Mengen nach Hause."],"footer":"Mo–Sa 8–20 Uhr · www.baumarkt-hammer.de · Anmeldung zum Kurs an der Information","design":"corp"},{"letter":"h","header":"LERNWERK","tag":"NACHHILFE · PRÜFUNGSVORBEREITUNG","title":"","subtitle":"","facts":["Mathematik","Physik · Chemie","Deutsch · Englisch"],"body":["Klasse 5 bis 13 und Abitur, für alle Schularten. Einzelunterricht oder Kleingruppe (max. 4 Schüler), erfahrene Lehrkräfte, regelmäßige Rückmeldung an die Eltern. Auch Ferienkurse vor Klassenarbeiten. 90 Minuten ab 24 €, Probestunde kostenlos, monatlich kündbar."],"footer":"Mo–Fr 14–19 Uhr, Sa 9–13 Uhr · Gottschedstr. 9 · Tel. 0341 / 33 44 55 · www.lernwerk-leipzig.de","design":"greyband"},{"letter":"i","header":"CITYCAR","tag":"AUTOVERMIETUNG · BAHNHOFSVORPLATZ 4","title":"","subtitle":"","facts":["Kleinwagen · ab 29 € / Tag","Wochenendtarif Fr 16 Uhr – Mo 9 Uhr, 800 km inkl. · 99 €","Kombi, Transporter, Kleinbus · ab 49 € / Tag"],"body":["Unkompliziert mieten","Zahlung mit EC-Karte oder bar, Kaution 200 €. Führerschein mindestens 1 Jahr. Vollkasko, Kindersitze und Navi kostenlos. Reservierung bis Freitag 12 Uhr."],"footer":"Mo–Sa 7–20 Uhr · Tel. 0341 / 12 34 56 · www.citycar-leipzig.de","design":"inst"},{"letter":"j","header":"Schlüssel & Schuh","tag":"Schlüssel nachmachen in 5 Minuten","title":"","subtitle":"Service Meier · Hauptbahnhof, Untergeschoss (neben der Bäckerei)","facts":[],"body":["Haus-, Wohnungs- und Briefkastenschlüssel, auch Sicherheitsschlüssel mit Karte. Autoschlüssel mit Funk programmieren wir vor Ort. Schuhreparatur: Absätze, Sohlen, Reißverschlüsse, Schuhe färben und pflegen. Gravuren für Namensschilder, Klingelschilder und Geschenke."],"footer":"Mo–Fr 9–18 Uhr · Samstag und Sonntag geschlossen · Tel. 0341 / 14 14 14","design":"hotel"},{"letter":"k","header":"COMPUTER","tag":"KLEINANZEIGEN","title":"","subtitle":"","facts":[],"body":["Verkaufe Drucker, 2 Jahre alt, mit neuen Patronen, 40 €, Tel. 0341 / 51 51 51","PC-Doktor Leipzig. Reparatur von Laptops, PCs und Tablets aller Marken: startet nicht, Display, Tastatur, Akku, Virenentfernung, Datenrettung. Express-Service: fertig in 24 Stunden, Standard 3 Tage. Kostenlose Diagnose und Festpreis vorab, Leihgerät für die Zwischenzeit. Mo–Sa 10–19 Uhr, Petersstr. 20, Tel. 0341 / 99 88 77","Computerkurs für Senioren, VHS, 6 Vormittage, 60 €, Tel. 0341 / 36 36 36"],"footer":"","design":"classified"},{"letter":"l","header":"Malerbetrieb Farbenfroh","tag":"MEISTERBETRIEB · 5 JAHRE GARANTIE","title":"Wir machen Ihre Wohnung schön – Sie geben uns nur den Schlüssel.","subtitle":"","facts":["Wände und Decken streichen · ab 6 €/m²","Tapezieren · ab 9 €/m²","Komplette Renovierung · Festpreis"],"body":["Wir decken Möbel und Böden ab, streichen sauber und räumen alles wieder auf, meist innerhalb von zwei Tagen. Kostenlose Besichtigung und Farbberatung, Termine auch am Wochenende, Festpreis vorab."],"footer":"Tel. 0172 / 55 66 77 88 · www.farbenfroh-leipzig.de","design":"inst"}]},"sb1":{"instruction":"Lesen Sie den Text und schließen Sie die Lücken 21–30. Welche Lösung (a, b oder c) ist jeweils richtig? Markieren Sie Ihre Lösungen für die Aufgaben 21–30 auf dem Antwortbogen.","paragraphs":["Sehr geehrte Damen und Herren,","im März habe ich in Ihrem Hotel ein Doppelzimmer {{21}} 3. bis 7. August reserviert (Reservierungsnummer 7781). Leider hat meine Frau in dieser Woche einen beruflichen Termin, {{22}} sich nicht verschieben lässt, {{23}} wir erst am 5. August anreisen können. Wäre es möglich, die Reservierung {{24}} zwei Nächte zu verkürzen, ohne dass dafür zusätzliche Kosten entstehen?","Außerdem wol
